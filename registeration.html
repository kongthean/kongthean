<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>Attendance Face Scan</title>
<!-- Face Attendance - employee scan page (v1, ships with system.html v6.98).
     Employees open this page on their phone; it goes straight to a face scan with no buttons. It
     identifies the employee by face (matching against the face templates the admin enrolled in
     system.html), looks up that employee's shift for the day, decides from the time whether the scan
     is a check-in / half-day leave request / full-day leave request / check-out (same rules engine as
     system.html), and saves the scan with photo, location and time. It uses the SAME Firebase
     project as system.html and never touches employee, leave or Master Sheet data. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root { --bg1:#0f172a; --bg2:#1e3a8a; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --accent:#2563eb; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; }
body { font-family:'Khmer OS','Noto Sans Khmer','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:linear-gradient(160deg,var(--bg1),var(--bg2)); color:#fff; display:flex; justify-content:center; overflow:hidden; }
.app { width:100%; max-width:560px; height:100vh; height:100dvh; padding:max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:stretch; gap:6px; }
.top { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; flex:0 0 auto; }
.title { font-size:15px; font-weight:700; line-height:1.25; }
.langs { display:flex; gap:4px; flex:0 0 auto; }
.langs button { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:14px; padding:7px 11px; font-size:13px; cursor:pointer; min-height:34px; }
.langs button.on { background:#fff; color:var(--bg2); font-weight:700; }
.clockrow { flex:0 0 auto; text-align:center; line-height:1.1; }
.clock { font-size:36px; font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums; }
.dateline { font-size:13px; color:#cbd5e1; margin-top:2px; }
/* the camera takes all the remaining height of the phone screen */
.cam { position:relative; flex:1 1 auto; min-height:260px; width:100%; border-radius:18px; overflow:hidden; background:#000; border:4px solid rgba(255,255,255,.4); box-shadow:0 8px 30px rgba(0,0,0,.45); }
.cam.found { border-color:#22c55e; }
.cam video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
/* the box that follows the face: red while a face is seen but not recognised, green once it is recognised */

/* Where paid work ends for the LAST check-out at minute m (any minute is a valid check-out):
   - in the break: the break start (the morning counts, e.g. 07:00-11:00 = 4h);
   - before the shift end: rounded DOWN to the previous half hour, so the missing time is counted in
     blocks of 30 minutes (M shift ends 16:00: 15:42 = 30 min leave, 15:10 = 1 hour leave);
   - at/after the shift end: as scanned - overtime counts whole hours after the shift end. */
function faEffEnd(def, m, allow) {
    if (faInBreak(def, m)) return def.breakStart;
    if (m < def.end) {
        var mm = m + (allow > 0 ? allow : 0);   /* special early check-out allowance (pregnant / disabled employees) */
        if (mm >= def.end) return def.end;
        var eb = def.earlyBlock || def.lateBlock; return def.end - Math.ceil((def.end - mm) / eb) * eb;
    }
    return m;
}
/* v7.102: a check-out after the check-out window (shift end + window) but before the first overtime block
   (shift end + overtime block, e.g. 16:16 to 16:29) is recorded and shown as a success, but it is NOT counted. */
function faDeadOut(def, m) { var ob = def.otBlock || 60; return m > def.end + def.win && m < def.end + ob; }
function faOtFor(def, effEnd) { var b = def.otBlock || 60; return effEnd > def.end ? Math.floor((effEnd - def.end) / b) * b / 60 : 0; }

/* What does a scan at minute m (on the shift's own time axis) mean for this shift, given the day's
   state so far? Returns { ok:true, kind:'in'|'out', ... } or { ok:false, code, params }. */
function faClassify(def, m, state) {
    if (m < def.openMin) return { ok: false, code: 'tooEarly', params: { at: faMinToHM(def.openMin) } };
    if (m > def.closeMin) return { ok: false, code: 'closed', params: {} };
    var evs = faStateEvents(state).filter(function (e) { return !(e.k === 'out' && faDeadOut(def, e.m)); });   /* an uncounted scan never changes what the next scan means */
    var last = evs[evs.length - 1];
    if (!last) {
        if (m >= def.end) return { ok: false, code: 'closed', params: {} };
        return { ok: true, kind: 'in', first: true, lateMinutes: faLateMissed(def, m), otHours: 0, leaveHours: 0, inBreak: faInBreak(def, m) };
    }
    if (last.k === 'in') return { ok: true, kind: 'out', first: false, lateMinutes: 0, otHours: faOtFor(def, faEffEnd(def, m)), leaveHours: 0, inBreak: faInBreak(def, m), counted: !faDeadOut(def, m) };
    /* v7.101: a check-out AT or AFTER the shift end means the employee has finished and gone home. Any later scan
       is refused and NOT counted (overtime = do not scan at the shift end, scan once when the overtime is finished). */
    if (last.m >= def.end) return { ok: false, code: 'alreadyCheckedOut', params: { at: last.t || faMinToHM(last.m) } };
    return { ok: true, kind: 'in', first: false, lateMinutes: 0, otHours: 0, leaveHours: 0, inBreak: faInBreak(def, m) };
}

var FA_BURST_MS = 90000;   /* repeated scans of the same face within this time are one "burst" */
var FA_FIRST_IN_WINDOW_MS = 30 * 60000;   /* after the day's FIRST check-in, a scan less than 30 min later is a repeat (hours count in 30-min blocks) */
function faBurstActive(state, nowMs, m, def) {
    var b = state && state.burst;
    if (!(b && isFinite(parseFloat(b.last)) && nowMs - b.last >= 0)) return false;
    var evs = faStateEvents(state);
    /* the burst only counts while the scan it belongs to still exists (a deleted scan must not block later scans) */
    var anchor = b.evKey ? evs.filter(function (e) { return e.key === b.evKey; })[0] : null;
    if (b.evKey && !anchor) return false;
    if (nowMs - b.last <= (def && def.burstMs ? def.burstMs : FA_BURST_MS)) return 'burst';
    /* the day's only event is a first IN made by a scan: a 2nd scan within 30 min of it is a repeat, not a check-out */
    if (anchor && evs.length === 1 && anchor.k === 'in' && isFinite(parseFloat(b.first)) && nowMs - b.first >= 0 && nowMs - b.first < (def && def.firstInMs ? def.firstInMs : FA_FIRST_IN_WINDOW_MS) &&
        def && isFinite(m) && m < def.end - (def.earlyBlock || 30)) return 'first';
    return false;
}

/* Applies one scan to the day's state (also used inside the database transaction so two phones can
   never both be recorded). A burst of repeated scans keeps only the first one for the calculation;
   the 2nd and the very last scan of the burst are saved for the record (kind 'repeat').
   Returns { ok:false, code, params } | { ok:true, repeat:true, n, recKey, newState, first } |
           { ok:true, repeat:false, cls, newState }. */
function faApplyScan(def, m, time, state, nowMs, key) {
    var cur = state ? JSON.parse(JSON.stringify(state)) : {};
    var via = faBurstActive(cur, nowMs, m, def);
    if (via) {
        var n = (parseInt(cur.burst.n, 10) || 1) + 1;
        var lastKey = cur.burst.lastKey || '';
        var recKey = n === 2 ? key : (lastKey || key);
        cur.burst = { first: cur.burst.first, last: nowMs, n: n, lastKey: n === 2 ? '' : recKey, evKey: cur.burst.evKey || '' };
        var evs = faStateEvents(cur);
        return { ok: true, repeat: true, via: via, n: n, recKey: recKey, newState: cur, last: evs[evs.length - 1] || null };
    }
    var cls = faClassify(def, m, cur);
    if (!cls.ok) return cls;
    if (!cur.ev) {
        /* an old-style day: carry its slots over as events so the sequence stays correct */
        cur.ev = {};
        faStateEvents(cur).forEach(function (e) { cur.ev[e.key] = { k: e.k, m: e.m, t: e.t }; });
        delete cur.checkin; delete cur.checkout; delete cur.leave;
    }
    cur.ev[key] = { k: cls.kind, m: m, t: time };
    cur.burst = { first: nowMs, last: nowMs, n: 1, lastKey: '', evKey: key };
    return { ok: true, repeat: false, cls: cls, newState: cur };
}

/* v7.11: the saved check-in / check-out RECORDS of the employee for the shift date (the rows the admin sees in
   Live Scans) are the truth for the day's sequence. A leftover entry in the state node whose record no longer
   exists (a "ghost", e.g. a scan removed another way) is ignored, so it can never turn the next scan into
   the wrong type. The burst timer stays in the state. recs: [{ _key, kind, scanMin, time }] or null when the
   records could not be read (then the state node alone is used, as before).
   Days recorded before v7.01 (kinds checkin / checkout / halfday / fullday) keep the old rule: state + records. */
function faStateWithRecords(state, recs) {
    var cur = state ? JSON.parse(JSON.stringify(state)) : {};
    var legacyKinds = { checkin: 1, checkout: 1, halfday: 1, fullday: 1 };
    var hasLegacy = !!(recs && recs.some(function (r) { return r && legacyKinds[r.kind]; }));
    if (!recs || hasLegacy) {
        if (!cur.ev) {
            var old = faStateEvents(cur);
            cur.ev = {};
            old.forEach(function (e) { cur.ev[e.key] = { k: e.k, m: e.m, t: e.t }; });
            delete cur.checkin; delete cur.checkout; delete cur.leave;
        }
    } else {
        cur.ev = {};
        delete cur.checkin; delete cur.checkout; delete cur.leave;
    }
    (recs || []).forEach(function (r) {
        if (!r || !r._key || (r.kind !== 'in' && r.kind !== 'out') || cur.ev[r._key]) return;
        var m = parseFloat(r.scanMin);
        if (!isFinite(m)) m = faHM(r.time);
        if (isFinite(m)) cur.ev[r._key] = { k: r.kind, m: m, t: r.time || '' };
    });
    return cur;
}

/* The events of a day must alternate IN, OUT, IN, OUT ... starting with IN (checked after sorting by time). */
function faEventsValid(evs) {
    var sorted = evs.slice().sort(function (a, b) { return (a.m - b.m) || (a.k === 'in' ? -1 : 1); });
    for (var i = 0; i < sorted.length; i++) {
        if (sorted[i].k !== (i % 2 === 0 ? 'in' : 'out')) return false;
    }
    return true;
}
/* Admin "Manual entry": adds one IN or OUT at any time (no window rules), keeping the day valid.
   Returns { ok:false, code:'order' } or { ok:true, cls:{kind,lateMinutes,otHours,first}, newState }. */
function faApplyManual(def, kind, m, time, state, key) {
    var cur = state ? JSON.parse(JSON.stringify(state)) : {};
    var evs = faStateEvents(cur);
    var next = evs.concat([{ key: key, k: kind, m: m, t: time }]);
    if (!faEventsValid(next)) return { ok: false, code: 'order', params: {} };
    if (!cur.ev) {
        cur.ev = {};
        evs.forEach(function (e) { cur.ev[e.key] = { k: e.k, m: e.m, t: e.t }; });
        delete cur.checkin; delete cur.checkout; delete cur.leave;
    }
    cur.ev[key] = { k: kind, m: m, t: time };
    var first = evs.length === 0 || m < evs[0].m;
    var cls = { ok: true, kind: kind, first: first,
        lateMinutes: (kind === 'in' && first) ? faLateMissed(def, m) : 0,
        otHours: kind === 'out' ? faOtFor(def, faEffEnd(def, m)) : 0, leaveHours: 0, inBreak: faInBreak(def, m) };
    return { ok: true, cls: cls, newState: cur };
}

function faLocal(epochMs, tz) {
    var d = new Date(epochMs + tz * 60000);
    return { dateStr: d.getUTCFullYear() + '-' + faPad(d.getUTCMonth() + 1) + '-' + faPad(d.getUTCDate()), minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
}
function faAddDays(dateStr, n) {
    var p = dateStr.split('-');
    var d = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10) + n));
    return d.getUTCFullYear() + '-' + faPad(d.getUTCMonth() + 1) + '-' + faPad(d.getUTCDate());
}

/* The whole decision for one scan. epochMs = the (server-corrected) moment of the scan.
   getInfo(dateStr) must return { code: 'M'|'F'|'G'|'H'|'' , state: {...}|null } for that SHIFT date.
   A scan is checked against both today's shift and yesterday's (a night shift that started
   yesterday is still running until early this morning). */
function faResolveScan(epochMs, getInfo, settings) {
    var loc = faLocal(epochMs, settings.tzOffsetMinutes);
    var today = loc.dateStr, yest = faAddDays(today, -1);
    var cands = [{ date: yest, m: loc.minutes + 1440 }, { date: today, m: loc.minutes }];
    var rejects = [];
    for (var i = 0; i < cands.length; i++) {
        var c = cands[i];
        var info = getInfo(c.date) || {};
        var code = info.code || '';
        var def = (code && code !== 'H') ? faBuildShift(code, settings) : null;
        if (!def) {
            rejects.push({ date: c.date, ok: false, code: code === 'H' ? 'dayOff' : 'noShift', params: {}, rank: code === 'H' ? 1.5 : 0 });
            continue;
        }
        if (faBurstActive(info.state, epochMs, c.m, def)) {
            var evs = faStateEvents(info.state);
            var lastEv = evs[evs.length - 1] || null;
            return { ok: true, repeat: true, shiftDate: c.date, shiftCode: code, def: def, scanMin: c.m, time: faMinToHM(loc.minutes), localDate: today,
                     last: lastEv, lastTime: lastEv ? lastEv.t : '' };
        }
        var cls = faClassify(def, c.m, info.state);
        if (!cls.ok) {
            rejects.push({ date: c.date, ok: false, code: cls.code, params: cls.params, rank: (c.m >= def.openMin && c.m <= def.closeMin) ? 2 : 1 });
            continue;
        }
        return { ok: true, repeat: false, shiftDate: c.date, shiftCode: code, def: def, cls: cls, scanMin: c.m, time: faMinToHM(loc.minutes), localDate: today };
    }
    var best = rejects[0];
    for (var j = 1; j < rejects.length; j++) { if (rejects[j].rank >= best.rank) best = rejects[j]; }
    return { ok: false, code: best.code, params: best.params, shiftDate: best.date, localDate: today, time: faMinToHM(loc.minutes) };
}

function faOverlap(a1, a2, b1, b2) { var lo = Math.max(a1, b1), hi = Math.min(a2, b2); return hi > lo ? hi - lo : 0; }

/* Daily figures for one employee on one shift date, from that day's scan records
   (each record: { kind, time, scanMin, lateMinutes }). Paid work = from the first check-in (late
   rules) to the last check-out inside the shift's paid time, break excluded, time out between an
   OUT and a later IN counted as work (company business). Leave = the rest of the paid day.
   Overtime = whole hours after the shift end up to the last check-out. */
function faSummarizeDay(def, recs, settings, allowMin) {
    var evs = (recs || []).filter(function (r) { return r && (r.kind === 'in' || r.kind === 'out'); }).map(function (r) {
        var m = parseFloat(r.scanMin);
        if (!isFinite(m)) m = faHM(r.time);
        return { k: r.kind, m: m, t: r.time || '', late: parseFloat(r.lateMinutes) };
    }).sort(function (a, b) { return (a.m - b.m) || (a.k === 'in' ? -1 : 1); });
    if (!evs.length) return faSummarizeLegacy(def, recs, settings);
    var allEvs = evs, dead = evs.filter(function (e) { return e.k === 'out' && faDeadOut(def, e.m); });
    if (dead.length) { evs = evs.filter(function (e) { return dead.indexOf(e) < 0; }); if (!evs.length) evs = allEvs; }
    var first = evs[0], last = evs[evs.length - 1];
    var lastOut = null, k;
    for (k = evs.length - 1; k >= 0; k--) { if (evs[k].k === 'out') { lastOut = evs[k]; break; } }
    var res = { checkIn: first.k === 'in' ? first.t : '', checkOut: lastOut ? lastOut.t : '', workMin: null, nightMin: 0, leaveHours: 0, otHours: 0, lateMinutes: 0, remarks: [], scans: allEvs.length };
    /* every scan time of the day in order: 06:45 / 11:00 / 11:55 / 16:02 (repeat scans are never saved) */
    res.times = []; allEvs.forEach(function (e) { if (e.t) res.times.push(e.t); });
    res.timesText = res.times.join(' / ');
    res.timesCompact = res.times.map(function (x) { return x.replace(':', ''); }).join(',');   /* like the old report: 0657,1000,1158,1900 */
    if (first.k !== 'in') { res.remarks.push('missingCheckIn'); return res; }
    res.lateMinutes = faLateMissed(def, first.m);   /* always from the first check-in time, so records saved before v7.07 are shown correctly too */
    if (evs.filter(function (e) { return e.k === 'in'; }).length > 1) res.remarks.push('outings');
    if (last.k === 'in' && dead.length) {
        /* the only check-out was an uncounted one: shown in the record, but the day counts 0 working hours and a full day of leave */
        res.checkOut = dead[dead.length - 1].t; res.workMin = 0; res.leaveHours = def.fullHours; res.otHours = 0;
        res.remarks.push('notCounted'); if (res.lateMinutes > 0) res.remarks.push('late');
        return res;
    }
    if (last.k === 'in') { res.remarks.push('missingCheckOut'); if (res.lateMinutes > 0) res.remarks.push('late'); return res; }
    var effS = faEffStart(def, first.m), effE = faEffEnd(def, last.m, allowMin);
    var paidEnd = Math.min(effE, def.end);
    var parts = [];
    if (paidEnd > effS) {
        if (effS < def.breakStart) parts.push([effS, Math.min(paidEnd, def.breakStart)]);
        if (paidEnd > def.breakEnd) parts.push([Math.max(effS, def.breakEnd), paidEnd]);
    }
    var nS = faHM(settings.nightStart), nE = faHM(settings.nightEnd);
    if (nE <= nS) nE += 1440;
    var work = 0, night = 0;
    parts.forEach(function (p) {
        if (p[1] <= p[0]) return;
        work += p[1] - p[0];
        for (var q = -1; q <= 2; q++) night += faOverlap(p[0], p[1], nS + 1440 * q, nE + 1440 * q);
    });
    var full = def.fullHours * 60;
    work = Math.min(work, full);
    res.workMin = work;
    res.nightMin = night;
    res.otHours = faOtFor(def, effE);
    res.leaveHours = Math.round(Math.max(0, full - work) / 60 * 100) / 100;
    if (res.lateMinutes > 0) res.remarks.push('late');
    if (res.leaveHours > 0) res.remarks.push(res.leaveHours >= def.fullHours ? 'fullDayLeave' : (res.leaveHours === def.halfHours ? 'halfDayLeave' : 'partLeave'));
    return res;
}

/* Daily figures for one employee on one shift date, from that day's scan records
   (each record: { kind, time, lateMinutes, otHours, leaveHours }). Working time is the shift's
   own paid time (start..end minus the break) reduced by lateness; OT is reported separately. */
function faSummarizeLegacy(def, recs, settings) {
    var by = {};
    (recs || []).forEach(function (r) { if (!by[r.kind] || (r.time || '') < (by[r.kind].time || '')) by[r.kind] = r; });
    var ci = by.checkin, co = by.checkout, hd = by.halfday, fd = by.fullday;
    var lv = hd || fd;
    var res = { checkIn: ci ? ci.time : '', checkOut: co ? co.time : '', workMin: null, nightMin: 0, leaveHours: 0, otHours: 0, lateMinutes: 0, remarks: [] };
    if (!ci && !co && !hd && !fd) { res.remarks.push('noScan'); return res; }
    res.lateMinutes = ci ? (parseFloat(ci.lateMinutes) || 0) : 0;
    res.otHours = co ? (parseFloat(co.otHours) || 0) : 0;
    if (lv) {
        res.leaveHours = parseFloat(lv.leaveHours);
        if (!isFinite(res.leaveHours)) res.leaveHours = fd ? def.fullHours : def.halfHours;
        res.remarks.push(res.leaveHours >= def.fullHours ? 'fullDayLeave' : (res.leaveHours === def.halfHours ? 'halfDayLeave' : 'partLeave'));
        if (res.leaveHours >= def.fullHours) { res.workMin = 0; return res; }
    }
    if (!ci) { res.remarks.push('missingCheckIn'); return res; }
    var effS = def.start + res.lateMinutes, effE;
    if (lv) effE = def.breakStart;
    else if (co) effE = def.end;
    else { res.remarks.push('missingCheckOut'); return res; }
    var parts = [];
    if (effE > effS) {
        var b1 = def.breakStart, b2 = def.breakEnd;
        if (effS < b1) parts.push([effS, Math.min(effE, b1)]);
        if (effE > b2) parts.push([Math.max(effS, b2), effE]);
    }
    var nS = faHM(settings.nightStart), nE = faHM(settings.nightEnd);
    if (nE <= nS) nE += 1440;
    var work = 0, night = 0;
    parts.forEach(function (p) {
        if (p[1] <= p[0]) return;
        work += p[1] - p[0];
        for (var k = -1; k <= 2; k++) night += faOverlap(p[0], p[1], nS + 1440 * k, nE + 1440 * k);
    });
    res.workMin = work;
    res.nightMin = night;
    if (res.lateMinutes > 0) res.remarks.push('late');
    return res;
}
/* FA-RULES-END */

function loadScriptOnce(url) {
  return new Promise(function (resolve, reject) {
    const s = document.createElement('script');
    s.src = url; s.onload = resolve; s.onerror = function () { reject(new Error('load failed: ' + url)); };
    document.head.appendChild(s);
  });
}
async function loadFaceEngine() {
  if (typeof faceapi === 'undefined') {
    let ok = false;
    for (let i = 0; i < FACE_ENGINE_SCRIPTS.length && !ok; i++) {
      try { await loadScriptOnce(FACE_ENGINE_SCRIPTS[i]); ok = (typeof faceapi !== 'undefined'); } catch (e) { console.warn(e.message); }
    }
    if (!ok) throw new Error('face engine script unavailable');
  }
  let loaded = false;
  for (let i = 0; i < FACE_ENGINE_MODELS.length && !loaded; i++) {
    try {
      const base = FACE_ENGINE_MODELS[i].replace(/\/$/, '');
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(base),
        faceapi.nets.faceLandmark68Net.loadFromUri(base),
        faceapi.nets.faceRecognitionNet.loadFromUri(base)
      ]);
      loaded = true;
    } catch (e) { console.warn('model load failed', e); }
  }
  if (!loaded) throw new Error('face models unavailable');
}

function toArr(v) { return Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.keys(v).sort(function (a, b) { return a - b; }).map(function (k) { return v[k]; }) : []); }

  const snap = await db.ref('faceTemplates').once('value');
  const data = snap.val() || {};
  templates = Object.keys(data).map(function (id) {
    const d = data[id] || {};
    return { id: id, name: d.name || id, descs: toArr(d.descriptors).map(function (a) { return Float32Array.from(toArr(a)); }).filter(function (a) { return a.length === 128; }) };
  }).filter(function (t) { return t.descs.length; });
}
async function loadSettings() {

}
function dist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); }

  let best = { id: null, name: '', dist: 9 }, second = 9;
  templates.forEach(function (t) {
    let d = 9;
    t.descs.forEach(function (x) { const dd = dist(desc, x); if (dd < d) d = dd; });
    if (d < best.dist) { second = best.dist; best = { id: t.id, name: t.name, dist: d }; } else if (d < second) second = d;

    navigator.geolocation.getCurrentPosition(function (p) {

      reverseGeocode(position);
      resolve(position);
    }, function () { locError = true; resolve(null); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
  });
}
let geocodePromise = Promise.resolve();
function reverseGeocode(p) {
  address = '';
  geocodePromise = (async function () {
    try {
      const ctl = new AbortController(); const to = setTimeout(function () { ctl.abort(); }, 6000);
      const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=en&lat=' + p.lat + '&lon=' + p.lng, { signal: ctl.signal });
      clearTimeout(to);
      const j = await r.json();
      address = (j && j.display_name) || '';
    } catch (e) { address = ''; }
  })();
}

/* draws the box that follows the face (the video is mirrored and shown with object-fit: cover) */
function drawFaceBox(box, ok, name) {
  const fb = $('faceBox');
  if (!box || !video.videoWidth) { fb.hidden = true; return; }
  const cam = $('cam');
  const cw = cam.clientWidth, ch = cam.clientHeight, vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * sc) / 2, oy = (ch - vh * sc) / 2;
  const w = box.width * sc, h = box.height * sc;
  const left = cw - (ox + (box.x + box.width) * sc);
  const top = oy + box.y * sc;
  fb.style.left = left + 'px'; fb.style.top = top + 'px'; fb.style.width = w + 'px'; fb.style.height = h + 'px';
  fb.classList.toggle('ok', !!ok);
  $('faceName').textContent = ok ? (name || '') : '';

}

function scheduleTick() { setTimeout(tick, 250); }
async function tick() {

  let det = null;
  try {
    det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 })).withFaceLandmarks().withFaceDescriptor();
  } catch (e) { console.warn('detect error', e); }
  if (mode !== 'scanning') return;
  if (!det) { streak = 0; lastId = null; unknownStreak = 0; $('cam').classList.remove('found'); hideFaceBox(); setStatus('lookingForFace'); return scheduleTick(); }
  const box = det.detection && det.detection.box;
  if (box && video.videoWidth && box.width < video.videoWidth * 0.2) { streak = 0; drawFaceBox(box, false); $('cam').classList.remove('found'); setStatus('moveCloser'); return scheduleTick(); }
  const m = bestMatch(det.descriptor);
  if (!m.ok) {
    streak = 0; lastId = null; unknownStreak++;
    drawFaceBox(box, false);
    $('cam').classList.remove('found');
    if (unknownStreak >= 4) setStatus('notRecognized', null, true);
    return scheduleTick();
  }
  unknownStreak = 0;
  drawFaceBox(box, true, m.name);
  $('cam').classList.add('found');
  if (m.id === lastId) streak++; else { lastId = m.id; streak = 1; }
  if (streak >= 2) { await processScan(m); return; }
  scheduleTick();
}

function capturePhoto() {
  const c = document.createElement('canvas');

  c.getContext('2d').drawImage(video, 0, 0, w, h);

}

    Object.keys(v).forEach(function (k) { if (v[k] && v[k].empId === empId) code = String(v[k].type || '').toUpperCase(); });
  } catch (e) { throw e; }
  const st = await db.ref('faceScanState/' + dateStr + '/' + empId).once('value');
  /* the saved scan records of this employee for that shift date (what the admin sees in Live Scans) also count */
  let recs = null;   /* null = records could not be read, then the day state alone is used */
  try {
    const rs = await db.ref('faceScans/' + dateStr).once('value');
    const rv = rs.val() || {};
    recs = [];
    Object.keys(rv).forEach(function (k) { const r = rv[k]; if (r && r.empId === empId) recs.push({ _key: k, kind: r.kind, scanMin: r.scanMin, time: r.time }); });
  } catch (e) { console.warn('records not read, using the day state only', e); }
  recsByDate[dateStr] = recs;
  return { code: code, state: faStateWithRecords(st.val() || null, recs) };
}

async function processScan(m) {
  mode = 'processing';
  setStatus('processing');
  try {
    const photo = capturePhoto();
    /* employee card: a frozen or closed card, or a new card whose code was not entered yet, blocks face attendance */
    let gate = null;
    try { gate = (await db.ref('cardGate/' + m.id).once('value')).val(); } catch (e) {}
    if (gate) {
      const gc = gate.state === 'frozen' ? 'cardFrozen' : (gate.state === 'closed' ? 'cardClosed' : (gate.ok ? '' : 'cardNoCode'));
      if (gc) return showResult({ type: 'reject', code: gc, params: {}, name: m.name, id: m.id, photo: photo, time: '' });
    }
    await offsetReady;
    const when = nowMs();
    const loc = faLocal(when, settings.tzOffsetMinutes);
    const infos = {};
    infos[faAddDays(loc.dateStr, -1)] = await readInfoFor(m.id, faAddDays(loc.dateStr, -1));
    infos[loc.dateStr] = await readInfoFor(m.id, loc.dateStr);
    const res = faResolveScan(when, function (d) { return infos[d]; }, settings);
    if (!res.ok) { return showResult({ type: 'reject', code: res.code, params: res.params, name: m.name, id: m.id, photo: photo, time: res.time }); }

    if (!position) { await requestLocation(); }
    if (!position) { mode = 'result'; setStatus('locDenied', null, true); $('cam').classList.remove('found'); setAgain('retry'); return; }
    await Promise.race([geocodePromise, new Promise(function (r) { setTimeout(r, 3000); })]);

    /* The day's scans are a sequence: the first is IN, then OUT, IN, OUT ... The decision is made
       again inside a database transaction on the day's state, so two quick scans (or two phones)
       can never both be recorded. A burst of repeated scans keeps only the first one for the
       calculation; the 2nd and the last scan of the burst are saved for the record. */
    const newRef = db.ref('faceScans/' + res.shiftDate).push();
    const key = newRef.key;
    const stateRef = db.ref('faceScanState/' + res.shiftDate + '/' + m.id);
    let applied = null;
    const claim = await stateRef.transaction(function (cur) {
      applied = faApplyScan(res.def, res.scanMin, res.time, faStateWithRecords(cur, recsByDate[res.shiftDate]), when, key);
      if (!applied.ok) return;
      return applied.newState;
    });
    if (!claim.committed || !applied || !applied.ok) {
      const a = applied || { code: 'saveFailed', params: {} };
      return showResult({ type: 'reject', code: a.code || 'saveFailed', params: a.params || {}, name: m.name, id: m.id, photo: photo, time: res.time });
    }
    const base = {
      empId: m.id, empName: m.name, shiftDate: res.shiftDate, shiftCode: res.shiftCode,
      time: res.time, scanMin: res.scanMin, localDate: res.localDate, ts: when, serverTs: firebase.database.ServerValue.TIMESTAMP,
      clockSource: serverOffsetKnown ? 'server' : 'device',
      lat: position.lat, lng: position.lng, accuracy: position.accuracy, address: address || '',
      matchDistance: Math.round(m.dist * 1000) / 1000, device: (navigator.userAgent || '').slice(0, 140)
    };
    if (applied.repeat) {
      /* same face scanned again: nothing is saved - only the first scan of the moment counts */
      const lastEv = applied.last;
      if (applied.via === 'first') {
        /* a scan 1-30 min after the first check-in: not a check-out - say clearly that nothing new was saved */
        return showResult({ type: 'reject', code: 'repeat', params: { at: lastEv && lastEv.t ? lastEv.t : res.time }, name: m.name, id: m.id, photo: photo, time: res.time });
      }
      return showResult({ type: 'ok', kind: lastEv ? lastEv.k : 'in', name: m.name, id: m.id, photo: photo, time: lastEv && lastEv.t ? lastEv.t : res.time, address: address, lat: position.lat, lng: position.lng });
    }
    const cls = applied.cls;
    const rec = Object.assign({}, base, { kind: cls.kind, first: !!cls.first, inBreak: !!cls.inBreak, lateMinutes: cls.lateMinutes || 0, otHours: cls.otHours || 0, leaveHours: 0, source: 'scan' });
    try {
      await newRef.set(rec);
      await Promise.all([
        db.ref('faceScanPhotos/' + res.shiftDate + '/' + key).set(photo),
        db.ref('faceScanPhotoDates/' + res.shiftDate).set(true)
      ]);
    } catch (e) {
      console.error('save failed, releasing the scan', e);
      try { await stateRef.child('ev/' + key).remove(); await stateRef.child('burst').remove(); } catch (e2) {}
      return showResult({ type: 'reject', code: 'saveFailed', params: {}, name: m.name, id: m.id, photo: photo, time: res.time });
    }
    showResult({ type: 'ok', kind: cls.kind, first: !!cls.first, inBreak: !!cls.inBreak, late: rec.lateMinutes, ot: rec.otHours, name: m.name, id: m.id, photo: photo, time: res.time, address: address, lat: position.lat, lng: position.lng });
  } catch (e) {
    console.error('scan failed', e);
    showResult({ type: 'reject', code: 'saveFailed', params: {}, name: m.name, id: m.id, photo: null, time: '' });
  }
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function showResult(r) {
  mode = 'result'; lastResult = r;
  setStatus(null);
  $('cam').classList.remove('found');
  hideFaceBox();
  renderResult(r);
  setAgain('scan');
  $('againBtn').hidden = true;   /* the pop-up has its own close / OK buttons */
}
function renderResult(r) {
  const el = $('result');
  el.hidden = false;
  let html = '';
  if (r.type === 'ok') {
    el.className = 'result ok';
    const label = r.kind === 'out' ? tr('kind_checkout') : tr('kind_checkin');
    const extra = '';
    html = '<div class="big">&#10003;</div><div class="who">' + escapeHtml(r.name) + ' (' + escapeHtml(r.id) + ')</div>' +
      '<div class="kind">' + escapeHtml(label) + '</div>' +
      '<div class="line">' + escapeHtml(tr('recorded')) + ' &middot; ' + escapeHtml(tr('at')) + ' ' + escapeHtml(r.time) + (extra ? '<br>' + escapeHtml(extra) : '') + '</div>' +
      (r.photo ? '<img alt="" src="' + r.photo + '">' : '') +
      '<div class="small">' + escapeHtml(tr('where')) + ': ' + escapeHtml(r.address || (r.lat.toFixed(5) + ', ' + r.lng.toFixed(5))) + '</div>';
  } else {
    const soft = (r.code === 'cardNoCode' || r.code === 'dayOff' || r.code === 'restTime' || r.code === 'noWindow' || r.code === 'tooEarly' || r.code === 'repeat' || r.code.indexOf('already') === 0);
    el.className = 'result ' + (soft ? 'warn' : 'bad');
    html = '<div class="big">' + (soft ? '!' : '&#10007;') + '</div><div class="who">' + escapeHtml(r.name) + ' (' + escapeHtml(r.id) + ')</div>' +
      '<div class="line">' + escapeHtml(r.code === 'saveFailed' ? tr('saveFailed') : tr('r_' + r.code, r.params)) + '</div>';
  }
  el.innerHTML = '<div class="card"><button class="xbtn" data-close="1" aria-label="' + escapeHtml(tr('close')) + '">&times;</button>' + html +
    '<button class="okbtn" data-close="1">' + escapeHtml(tr('close')) + '</button></div>';
}

/* ---------------- start-up ---------------- */
(async function init() {
  applyLang();
  try {
    setStatus('loadingEngine');
    await loadFaceEngine();
  } catch (e) { console.error(e); setStatus('engineFailed', null, true); return; }
  try {
    setStatus('loadingFaces');
    await Promise.all([loadSettings(), loadTemplates()]);
  } catch (e) { console.error(e); setStatus('engineFailed', null, true); return; }
  if (!templates.length) { setStatus('noTemplates', null, true); return; }
  try {
    setStatus('startingCamera');
    await startCamera();
  } catch (e) { console.error(e); setStatus(e && e.message === 'nocam' ? 'noCamera' : 'camDenied', null, true); return; }
  setStatus('waitingLocation');
  await requestLocation();
  if (!position) { setStatus('locDenied', null, true); setAgain('retry'); return; }
  mode = 'scanning';
  setStatus('lookingForFace');
  scheduleTick();
})();
