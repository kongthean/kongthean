<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thean · Cambodia Traveler</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script>
/* Clean addresses (kongthean.com/donate): send the visitor to the website, which then shows /donate again. */
(function(){
  var p=location.pathname.replace(/^\/+/,'').replace(/\/+$/,'');
  var last=p.split('/').pop()||'';
  if(p&&last.indexOf('.')<0){
    location.replace('/?go='+p.split('/').map(encodeURIComponent).join('/')+(location.hash||''));
  }else{
    document.addEventListener('DOMContentLoaded',function(){document.getElementById('nf').hidden=false});
  }
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f2ea;color:#13241b;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:16px}a{color:#163023;font-weight:600}</style>
</head>
<body>
<div id="nf" hidden>
<p>This page was not found. · រកមិនឃើញទំព័រនេះទេ។</p>
<p><a href="/">Go to the home page · ទៅទំព័រដើម</a></p>
</div>
</body>
</html>
