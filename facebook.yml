name: Facebook to website
# Every hour: copies the Page's follower count, post count and newest posts to the website.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install helper
        run: pip install --quiet google-auth requests
      - name: Copy Facebook numbers and posts
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse, urllib.error
          from datetime import datetime
          TOKEN = os.environ.get('FB_PAGE_TOKEN', '').strip()
          KEY = os.environ.get('FIREBASE_KEY', '').strip()
          DB = os.environ.get('DB_URL', 'https://thean-12952-default-rtdb.asia-southeast1.firebasedatabase.app').rstrip('/')
          G = os.environ.get('GRAPH_URL', 'https://graph.facebook.com/')
          NOW = int(time.time() * 1000)

          def call(url, data=None, method='GET'):
              req = urllib.request.Request(url, method=method, data=None if data is None else json.dumps(data).encode(),
                                           headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', 'replace')
                  try:
                      msg = json.loads(body).get('error', body)
                      msg = msg.get('message', str(msg)) if isinstance(msg, dict) else str(msg)
                  except Exception:
                      msg = body[:300]
                  raise RuntimeError(msg)

          def fb(path, **p):
              p['access_token'] = TOKEN
              return call(G + path + '?' + urllib.parse.urlencode(p))

          def db_auth():
              if KEY.startswith('{'):
                  from google.oauth2 import service_account
                  import google.auth.transport.requests
                  c = service_account.Credentials.from_service_account_info(json.loads(KEY), scopes=[
                      'https://www.googleapis.com/auth/firebase.database', 'https://www.googleapis.com/auth/userinfo.email'])
                  c.refresh(google.auth.transport.requests.Request())
                  return 'access_token=' + c.token
              return 'auth=' + urllib.parse.quote(KEY)

          def db(method, data):
              return call(DB + '/settings/public/fb.json?' + db_auth(), data, method)

          def when(s):
              try:
                  return int(datetime.strptime(s, '%Y-%m-%dT%H:%M:%S%z').timestamp() * 1000)
              except Exception:
                  return NOW

          def main():
              if not TOKEN or not KEY:
                  raise RuntimeError('A secret is missing in GitHub: FB_PAGE_TOKEN and FIREBASE_KEY are both needed.')
              page = fb('me', fields='id,name,followers_count,fan_count,link')
              if page.get('followers_count') is None and page.get('fan_count') is None:
                  raise RuntimeError('This key belongs to a person, not to the Page. Copy the Page key (step 3 of the guide).')
              first = fb('me/posts', fields='message,story,created_time,full_picture,permalink_url,status_type,attachments{media_type}', limit=25)
              items = []
              for p in first.get('data', []):
                  text = (p.get('message') or p.get('story') or '').strip()
                  img = p.get('full_picture') or ''
                  if not text and not img:
                      continue
                  mt = [a.get('media_type', '') for a in (p.get('attachments') or {}).get('data', [])]
                  items.append({'id': p.get('id', ''), 'text': text[:600], 'img': img, 'link': p.get('permalink_url') or '',
                                'video': 'video' in mt or p.get('status_type') == 'added_video', 't': when(p.get('created_time', ''))})
                  if len(items) >= 12:
                      break
              count, nxt, pages = 0, G + 'me/posts?' + urllib.parse.urlencode({'fields': 'id', 'limit': 100, 'access_token': TOKEN}), 0
              while nxt and pages < 200:
                  r = call(nxt)
                  count += len(r.get('data', []))
                  nxt = (r.get('paging') or {}).get('next')
                  pages += 1
              out = {'at': NOW, 'name': page.get('name', ''), 'link': page.get('link', ''),
                     'followers': page.get('followers_count', page.get('fan_count', 0)), 'likes': page.get('fan_count', 0),
                     'posts': count, 'items': items}
              db('PUT', out)
              print('Updated: %s followers, %s posts, %s latest posts' % (out['followers'], count, len(items)))

          try:
              main()
          except Exception as e:
              msg = str(e)[:400]
              print('Problem:', msg)
              try:
                  if KEY:
                      db('PATCH', {'err': msg, 'errAt': NOW})
              except Exception as e2:
                  print('Could not save the problem to the website either:', str(e2)[:300])
              raise SystemExit(1)
          PY
