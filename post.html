<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#102d4d">
<title>Thean · Post to Facebook</title>
<link rel="icon" type="image/png" sizes="48x48" href="/icons/post-favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/icons/post-favicon-96.png">
<link rel="apple-touch-icon" href="/icons/post-apple-touch-icon.png">
<link rel="manifest" href="/icons/post.webmanifest">
<meta name="apple-mobile-web-app-title" content="Thean Post">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f1;--surface:#fff;--ink:#1d2328;--muted:#68737c;--line:#dfe3e6;--char:#1f2428;--char-ink:#fff;--soft:#e7eaec;--ok:#1f7a4d;--okbg:#e5f3ec;--bad:#a8341f;--badbg:#fbeae6;--accent:#2f5f7a;--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121518;--surface:#1b1f23;--ink:#eef1f3;--muted:#9aa5ae;--line:#2c3237;--char:#eef1f3;--char-ink:#121518;--soft:#262c31;--ok:#5fd09a;--okbg:#14291f;--bad:#ff9a85;--badbg:#2e1a16;--accent:#8cc3e3}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Kantumruy Pro",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body.km{font-family:"Kantumruy Pro",Inter,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:1.05rem;letter-spacing:.06em}
.brand small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kst{display:inline-flex;align-items:center;gap:7px;max-width:42vw;border:0;border-radius:999px;padding:7px 12px 7px 10px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink)}
.kst i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.kst span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kst.ok{background:var(--okbg);color:var(--ok)}.kst.ok i{background:var(--ok)}
.kst.bad{background:var(--badbg);color:var(--bad)}.kst.bad i{background:var(--bad)}
.kst.chk i{animation:kp 1s infinite alternate}@keyframes kp{to{opacity:.25}}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--ink);font:inherit;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--char);color:var(--char-ink)}
.ib{border:0;background:var(--soft);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ib svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:1.02rem}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:.86rem;line-height:1.45}
label.f{display:block;font-size:.84rem;color:var(--muted);font-weight:500;margin:10px 0 6px}
input[type=text],input[type=password],input[type=url],input[type=datetime-local],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:170px;resize:vertical;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;font-size:.94rem;cursor:pointer;background:var(--char);color:var(--char-ink);text-decoration:none}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 13px;font-size:.84rem}
.btn.wide{width:100%;padding:15px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.msg{border-radius:12px;padding:11px 13px;font-size:.9rem;line-height:1.45;margin-top:12px}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.info{background:var(--soft);color:var(--ink)}
.owner{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.owner img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--soft)}
.owner b{display:block}
.owner small{color:var(--muted)}
.vid{width:100%;max-height:70vh;border-radius:14px;background:#000;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft);border:0;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s}
.ph .n{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--char);color:var(--char-ink);font-size:.75rem;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
.ph.off img{opacity:.28}
.ph.off .n{background:rgba(255,255,255,.85);color:#1d2328}
.sh4{margin:18px 0 4px;font-size:1rem}
.dests{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dest{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer}
.dest i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-block;flex:none}
.dest.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.dest.on i{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 2.5px var(--okbg)}
.dest.off{opacity:.45}
.dest small{font-weight:500;opacity:.8}
.res{display:grid;gap:6px;margin-top:4px}
.res div{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem}
.res b{font-weight:600}.res .ok{color:var(--ok)}.res .bad{color:var(--bad)}.res .wait{color:var(--muted)}

.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.tg:first-of-type{border-top:0}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:14px;transition:background .15s;cursor:pointer}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:after{transform:translateX(18px)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;font-size:.9rem;padding:9px;border-radius:999px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cnt{color:var(--muted);font-size:.84rem}
.hist a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.9rem}
.hist a:first-child{border-top:0}
.hist a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist a small{color:var(--muted);flex:none}
.note{font-size:.82rem;color:var(--muted);line-height:1.5;margin-top:10px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet h3{margin:0;font-size:1.1rem}
ol.steps{padding-left:20px;margin:8px 0 0;font-size:.88rem;line-height:1.6}
ol.steps li{margin-bottom:8px}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.85em;word-break:break-all}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><b>THEAN</b><small data-t="appSub"></small></div>
  <button class="kst" id="kst" data-open-settings><i></i><span id="kstT"></span></button>
  <div class="lang" role="group" aria-label="Language"><button data-lang="km">ខ្មែរ</button><button data-lang="en">EN</button></div>
  <button class="ib" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main>
  <div class="msg info" id="needSetup" hidden><span data-t="needSetup"></span> <button class="link" data-open-settings data-t="openSettings"></button></div>

  <section class="card">
    <h2 data-t="step1"></h2>
    <p class="sub" data-t="step1Sub"></p>
    <div class="row">
      <input type="url" id="link" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://vt.tiktok.com/...">
      <button class="btn soft" id="paste" data-t="paste"></button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="get" style="flex:1" data-t="get"></button>
    </div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="link" id="pickFiles" data-t="orFiles"></button>
      <input type="file" id="files" accept="video/*,image/*" multiple hidden>
    </div>
    <div id="m1"></div>
  </section>

  <section class="card" id="capCard" hidden>
    <h2 data-t="step2"></h2>
    <textarea id="cap" aria-label="Caption" data-tph="capPh"></textarea>
    <div class="row" style="margin-top:8px;justify-content:space-between"><button class="btn soft sm" id="copyCap" data-t="copyCap"></button><button class="link" data-open-settings data-t="capOpts"></button></div>
    <p class="note" id="destSum" style="margin-top:10px"></p>
    <p class="note" id="schedNote" hidden data-t="schedOnlyFb"></p>
    <div class="seg" style="margin-top:12px"><button data-when="now" class="on" data-t="now"></button><button data-when="later" data-t="later"></button></div>
    <div id="laterBox" hidden>
      <label class="f" for="at" data-t="whenLabel"></label>
      <input type="datetime-local" id="at">
      <p class="note" data-t="whenNote"></p>
    </div>
    <button class="btn wide" id="post" data-t="postBtn"></button>
    <div class="bar" id="bar" hidden><i></i></div>
    <div id="m3"></div>
  </section>

  <section class="card" id="mediaCard" hidden>
    <div class="owner" id="owner"></div>
    <div id="media"></div>
    <div class="row" id="photoTools" style="margin-top:10px;justify-content:space-between" hidden>
      <span class="cnt" id="selCount"></span>
      <span class="row"><button class="btn soft sm" id="selAll" data-t="selAll"></button><button class="btn soft sm" id="selNone" data-t="selNone"></button></span>
    </div>
  </section>

  <section class="card" id="histCard" hidden>
    <h2 data-t="history"></h2>
    <div class="hist" id="hist"></div>
  </section>

  <p class="note" data-t="rights"></p>
</main>

<div class="modal" id="settings" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="hd"><h3 id="setTitle" data-t="settings"></h3><button class="ib" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <h4 class="sh4" style="margin-top:6px" data-t="postTo"></h4>
    <div class="dests" id="dests" style="margin-top:6px"></div>
    <p class="sub" style="color:var(--muted);font-size:.86rem;margin-top:16px" data-t="setSub"></p>
    <label class="f" for="tok" data-t="tokLabel"></label>
    <div class="row"><input type="password" id="tok" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="EAA..."><button class="btn soft sm" id="tokShow" data-t="show"></button></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="tokCheck" data-t="checkSave"></button><button class="btn soft sm" id="tokForget" data-t="forget"></button></div>
    <div id="m4"></div>
    <h4 class="sh4">Instagram</h4>
    <p class="note" style="margin-top:0" data-t="igSub"></p>
    <div class="row"><button class="btn sm" id="igCheck" data-t="igConnect"></button><button class="btn soft sm" id="igForget" data-t="forget"></button></div>
    <div id="m5"></div>
    <h4 class="sh4">Telegram</h4>
    <p class="note" style="margin-top:0" data-t="tgSub"></p>
    <label class="f" for="tgTok" data-t="tgTokLabel"></label>
    <div class="row"><input type="password" id="tgTok" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="123456789:AA..."><button class="btn soft sm" id="tgShow" data-t="show"></button></div>
    <label class="f" for="tgChat" data-t="tgChatLabel"></label>
    <input type="text" id="tgChat" autocapitalize="off" spellcheck="false" placeholder="@tg_thean">
    <div class="row" style="margin-top:10px"><button class="btn sm" id="tgCheck" data-t="checkSave"></button><button class="btn soft sm" id="tgForget" data-t="forget"></button></div>
    <div id="m6"></div>
    <h4 class="sh4" data-t="capSet"></h4>
    <p class="note" style="margin-top:0" data-t="capSetSub"></p>
    <div class="tg"><span data-t="keepText"></span><label class="sw"><input type="checkbox" id="oText" checked><span></span></label></div>
    <div class="tg"><span data-t="keepTags"></span><label class="sw"><input type="checkbox" id="oTags" checked><span></span></label></div>
    <div class="tg"><span data-t="credit"></span><label class="sw"><input type="checkbox" id="oCredit" checked><span></span></label></div>
    <div class="tg"><span data-t="myTags"></span><label class="sw"><input type="checkbox" id="oMine"><span></span></label></div>
    <label class="f" for="mine" data-t="myTagsLabel"></label>
    <input type="text" id="mine" placeholder="#Thean #Cambodia #KhmerTravel">
    <label class="f" for="creditTpl" data-t="creditLabel"></label>
    <input type="text" id="creditTpl">
    <p class="note" data-t="creditNote"></p>
    <details>
      <summary data-t="cldTitle"></summary>
      <p class="note" data-t="cldNote"></p>
      <label class="f" for="cld">Cloud name</label><input type="text" id="cld" autocapitalize="off" spellcheck="false">
      <label class="f" for="pre">Upload preset (unsigned)</label><input type="text" id="pre" autocapitalize="off" spellcheck="false">
    </details>
    <details>
      <summary data-t="guideTitle"></summary>
      <ol class="steps" id="guide"></ol>
    </details>
    <details>
      <summary data-t="tgGuideTitle"></summary>
      <ol class="steps" id="tgGuide"></ol>
    </details>
    <div class="row" style="margin-top:16px"><button class="btn wide" data-close data-t="done"></button></div>
  </div>
</div>

    if(typeof o!=='object')return;Object.keys(o).forEach(function(k){if(depth===0&&k==='title')return;walk(o[k],k,depth+1)})})(d,'',0);

function fbDel(id){return function(){return gcall(id,{method:'delete'})}}
function fbPost(cap,sched,it,r){var pub=sched?{published:'false',scheduled_publish_time:String(sched)}:{};
  function vid(j){undoAdd(r,fbDel(j.id));return {url:'https://www.facebook.com/'+j.id,video:true}}
  if(ST.kind==='video')return Promise.resolve().then(function(){cx(r);return gcall(C.pageId+'/videos',Object.assign({file_url:ST.video,description:cap},pub))}).catch(function(e){if(e&&e.cancel)throw e;return pubUrl(it[0]).then(function(u){cx(r);return gcall(C.pageId+'/videos',Object.assign({file_url:u,description:cap},pub))})}).then(vid);
  if(ST.kind==='fvideo')return Promise.resolve().then(function(){cx(r);return gcall(C.pageId+'/videos',Object.assign({source:ST.files[0],description:cap},pub),'https://graph-video.facebook.com/')}).then(vid);
  var ids=[];return it.reduce(function(p,x){return p.then(function(){cx(r);return fbPhoto(x,sched).then(function(id){ids.push(id)})})},Promise.resolve())
    .then(function(){cx(r);var params=Object.assign({message:cap},pub);ids.forEach(function(id,i){params['attached_media['+i+']']=JSON.stringify({media_fbid:id})});return gcall(C.pageId+'/feed',params)})
    .then(function(j){undoAdd(r,fbDel(j.id));return {url:'https://www.facebook.com/'+j.id}})}
function fbPhoto(x,sched){var base={published:'false'};if(sched)base.temporary='true';
  if(x.file)return gcall(C.pageId+'/photos',Object.assign({source:x.file},base)).then(function(j){return j.id});
  return gcall(C.pageId+'/photos',Object.assign({url:x.url},base)).catch(function(){return pubUrl(x).then(function(u){return gcall(C.pageId+'/photos',Object.assign({url:u},base))})}).then(function(j){return j.id})}

/* ---------- Facebook Story ---------- */
function fbStory(it,r){
  if(it[0].type==='video'){var v=it[0];
    return Promise.resolve().then(function(){cx(r);return gcall(C.pageId+'/video_stories',{upload_phase:'start'})}).then(function(st){
      var h={Authorization:'OAuth '+C.token},body=null;
      var up=v.file?Promise.resolve(null):pubUrl(v).then(function(u){h.file_url=u});
      return up.then(function(){cx(r);if(v.file){h.offset='0';h.file_size=String(v.file.size);body=v.file}
        return fetch(st.upload_url,{method:'POST',headers:h,body:body}).catch(function(){throw new Error(t('fbsVidNet'))}).then(function(x){return x.json().catch(function(){return {}})}).then(function(j){if(j&&j.error)throw new Error(j.error.message||'upload failed')})})
      .then(function(){cx(r);return gcall(C.pageId+'/video_stories',{upload_phase:'finish',video_id:st.video_id})}).then(function(j){if(j&&j.post_id)undoAdd(r,fbDel(j.post_id))})}).then(function(){return {url:'https://www.facebook.com/'+C.pageId}})}
  return it.slice(0,10).reduce(function(p,x){return p.then(function(){cx(r);return fbPhoto(x,null).then(function(id){cx(r);return gcall(C.pageId+'/photo_stories',{photo_id:id})}).then(function(j){if(j&&j.post_id)undoAdd(r,fbDel(j.post_id))})})},Promise.resolve()).then(function(){return {url:'https://www.facebook.com/'+C.pageId}})}

/* ---------- Instagram ---------- */
function igWait(id,onMsg,r){var tries=0;return (function loop(){cx(r);return gget(id+'?fields=status_code,status').then(function(j){cx(r);
  if(j.status_code==='FINISHED')return;if(j.status_code==='ERROR'||j.status_code==='EXPIRED')throw new Error(t('igFileBad')+' ('+(j.status||j.status_code)+')');
  if(++tries>90)throw new Error(t('igSlow'));if(onMsg&&tries===2)onMsg();return wait(4000).then(loop)})})()}
function igMake(params,onMsg,r){cx(r);return gcall(C.igId+'/media',params).then(function(j){return igWait(j.id,onMsg,r).then(function(){return j.id})})}
function igPublish(id,r){cx(r);return gcall(C.igId+'/media_publish',{creation_id:id}).then(function(j){return gget(j.id+'?fields=permalink').then(function(x){return x.permalink||''}).catch(function(){return ''})})}
function igCap(cap){var tags=0;cap=cap.replace(/#[^\s#]+/g,function(m){tags++;return tags>30?'':m});return cap.slice(0,2200)}
function igPost(cap,it,onMsg,r){cap=igCap(cap);var list=it.slice(0,10);
  if(list.length===1){var x=list[0];return pubUrl(x,true).then(function(u){return igMake(x.type==='video'?{media_type:'REELS',video_url:u,caption:cap,share_to_feed:'true'}:{image_url:u,caption:cap},onMsg,r)}).then(function(id){return igPublish(id,r)}).then(function(u){return {url:u}})}
  var kids=[];return list.reduce(function(p,x){return p.then(function(){return pubUrl(x,true).then(function(u){return igMake(x.type==='video'?{media_type:'VIDEO',video_url:u,is_carousel_item:'true'}:{image_url:u,is_carousel_item:'true'},onMsg,r)}).then(function(id){kids.push(id)})})},Promise.resolve())
    .then(function(){return igMake({media_type:'CAROUSEL',children:kids.join(','),caption:cap},null,r)}).then(function(id){return igPublish(id,r)}).then(function(u){return {url:u}})}
function igStory(it,onMsg,r){return it.slice(0,10).reduce(function(p,x){return p.then(function(){return pubUrl(x,true).then(function(u){return igMake(x.type==='video'?{media_type:'STORIES',video_url:u}:{media_type:'STORIES',image_url:u},onMsg,r)}).then(function(id){return igPublish(id,r)})})},Promise.resolve())
  .then(function(){return {url:C.igUser?'https://www.instagram.com/stories/'+C.igUser+'/':''}})}
/* video length (seconds), 0 if unknown */
function vidLen(x){return new Promise(function(res){var v=document.createElement('video'),u=x.file?URL.createObjectURL(x.file):(x.cld||x.url),done=false;
  function end(d){if(done)return;done=true;try{if(x.file)URL.revokeObjectURL(u)}catch(e){}v.removeAttribute('src');res(isFinite(d)?d:0)}
  v.preload='metadata';v.muted=true;v.onloadedmetadata=function(){end(v.duration)};v.onerror=function(){end(0)};setTimeout(function(){end(0)},10000);v.src=u})}

/* ---------- Telegram ---------- */
function tgCall(m,fd){var tok=String(C.tgToken||'').replace(/[^0-9A-Za-z:_-]/g,'');var url='https://api.telegram.org/bot'+tok+'/'+m,opt={method:'GET'};
  if(fd){var plain=true;fd.forEach(function(v){if(typeof v!=='string')plain=false});
    if(plain){var q=new URLSearchParams();fd.forEach(function(v,k){q.append(k,v)});opt={method:'POST',body:q}}else opt={method:'POST',body:fd}}
  return fetch(url,opt).catch(function(){throw new Error(t('tgNet'))}).then(function(r){return r.text().then(function(x){var j=null;try{j=JSON.parse(x)}catch(e){}
    if(!j){if(r.status===401||r.status===404)throw new Error(t('tgKeyBad'));throw new Error(t('tgNet')+' ('+r.status+')')}
    if(!j.ok){var d=String(j.description||'');if(j.error_code===401||j.error_code===404)throw new Error(t('tgKeyBad'));if(/chat not found/i.test(d))throw new Error(t('tgChatBad'));throw new Error(d||'Telegram error')}return j.result})})}
function tgLink(msg){var c=String(C.tgChat||'');return c.charAt(0)==='@'&&msg&&msg.message_id?'https://t.me/'+c.slice(1)+'/'+msg.message_id:''}
function tgPost(cap,it,r){var long=cap.length>1024,capOne=long?'':cap,first=null;
  function sent(m){[].concat(m).forEach(function(x){if(x&&x.message_id)undoAdd(r,function(){var f=new FormData();f.append('chat_id',C.tgChat);f.append('message_id',String(x.message_id));return tgCall('deleteMessage',f)})});return m}
  function fd(o){var f=new FormData();f.append('chat_id',C.tgChat);Object.keys(o).forEach(function(k){if(o[k]!=null&&o[k]!=='')f.append(k,o[k])});return f}
  var job;
  if(it.length===1){var x=it[0],m=x.type==='video'?'sendVideo':'sendPhoto',key=x.type==='video'?'video':'photo';
    job=(x.file?Promise.resolve(x.file):pubUrl(x).catch(function(){return x.url})).then(function(src){var o={caption:capOne};o[key]=src;if(x.type==='video')o.supports_streaming='true';
      cx(r);return tgCall(m,fd(o)).catch(function(e){if(!x.file&&x.url&&src!==x.url){cx(r);o[key]=x.url;return tgCall(m,fd(o))}throw e})}).then(function(m){first=sent(m)})}
  else{var chunks=[];for(var i=0;i<it.length;i+=10)chunks.push(it.slice(i,i+10));
    job=chunks.reduce(function(p,ch,ci){return p.then(function(){var f=new FormData();f.append('chat_id',C.tgChat);
      return Promise.all(ch.map(function(x,k){return x.file?Promise.resolve('attach://f'+k):pubUrl(x).catch(function(){return x.url})})).then(function(srcs){
        var media=ch.map(function(x,k){var o={type:x.type==='video'?'video':'photo',media:srcs[k]};if(x.file)f.append('f'+k,x.file);if(ci===0&&k===0&&capOne)o.caption=capOne;return o});
        f.append('media',JSON.stringify(media));cx(r);return tgCall('sendMediaGroup',f)}).then(function(m){sent(m);if(!first)first=m[0]})})},Promise.resolve())}
  return job.then(function(){if(long){cx(r);return tgCall('sendMessage',fd({text:cap.slice(0,4096)})).then(sent)}}).then(function(){return {url:tgLink(first)}})}

/* ---------- post everywhere ---------- */
var CUR=null;
function drawRes(R){CUR=R;$('m3').innerHTML='<div class="msg info"><div class="res">'+R.map(function(r){var cls=r.st==='done'?'ok':r.st==='fail'?'bad':'wait',
  txt=r.st==='done'?t('stDone')+(r.note?' · '+r.note:''):r.st==='fail'?t('stFail')+(r.err?': '+r.err:''):r.st==='skip'?t('stSkip')+(r.err?': '+r.err:''):r.st==='cancel'?t('stCancel'):r.st==='stopping'?t('stStopping'):r.st==='work'?(r.note||t('stWork')):t('stWait');
  var act=r.url?'<a class="btn sm soft" target="_blank" rel="noopener" href="'+esc(r.url)+'">'+esc(t('open'))+'</a>':(r.st==='work'||r.st==='wait')?'<button type="button" class="btn sm soft" data-cancel="'+esc(r.k)+'">'+esc(t('cancel'))+'</button>':'';
  return '<div><span><b>'+esc(t(r.label))+'</b> · <span class="'+cls+'">'+esc(txt)+'</span></span>'+act+'</div>'}).join('')+'</div></div>'}
$('m3').addEventListener('click',function(e){var b=e.target.closest('[data-cancel]');if(!b||!CUR)return;var k=b.getAttribute('data-cancel');
  CUR.forEach(function(r){if(r.k===k&&(r.st==='work'||r.st==='wait')){r.x=true;r.st='stopping'}});drawRes(CUR)});
$('post').onclick=function(){
  var cap=$('cap').value,sched=null;
  if(WHEN==='later'){var d=new Date($('at').value),s=Math.floor(d.getTime()/1000),now=Date.now()/1000;if(!$('at').value||isNaN(s)||s<now+15*60||s>now+30*86400){msg('m3','bad',esc(t('badTime')));return}sched=s}
  var sel=DESTS.filter(function(x){return C.dest[x[0]]&&destReady(x[0])});
  if(!sel.length){msg('m3','bad',esc(t('noDest')));return}
  var it=mediaList();
  if(ST.kind==='photos'||ST.kind==='fphotos'){if(!it.length){msg('m3','bad',esc(t('noSel')));return}}
  else if(ST.kind!=='video'&&ST.kind!=='fvideo'){msg('m3','bad',esc(t('noMedia')));return}
  var btn=$('post');btn.disabled=true;btn.textContent=t('posting');prog(0.05);
  var R=sel.map(function(x){return {k:x[0],label:x[1],st:'wait'}});drawRes(R);
  var runs={fb:function(r){return fbPost(cap,sched,it,r)},fbs:function(r){return fbStory(it,r)},ig:function(r){return igPost(cap,it,function(){if(r.st==='work'){r.note=t('igProc');drawRes(R)}},r)},igs:function(r){return igStory(it,function(){if(r.st==='work'){r.note=t('igProc');drawRes(R)}},r)},tg:function(r){return tgPost(cap,it,r)}};
  var fbUrl='',fin=0;
  function undo(r){var u=(r.undo||[]).slice();r.undo=[];return u.reduce(function(p,f){return p.then(f)},Promise.resolve()).then(function(){r.st='cancel'},function(){r.st='done';r.note=t('tooLate')})}
  function pre(r){if(r.k!=='fbs'&&r.k!=='igs')return Promise.resolve();var v=it.filter(function(x){return x.type==='video'})[0];if(!v)return Promise.resolve();
    return vidLen(v).then(function(d){if(d>60.5){var e=new Error(t('storyLong',{s:Math.round(d)}));e.skip=true;throw e}if(d&&d<3){var e2=new Error(t('storyShort'));e2.skip=true;throw e2}})}
  Promise.all(R.map(function(r){
    if(sched&&r.k!=='fb'){r.st='skip';r.err=t('schedSkip');fin++;drawRes(R);return}
    r.st='work';drawRes(R);
    return pre(r).then(function(){cx(r);return runs[r.k](r)}).then(function(o){if(r.x)return undo(r);r.st='done';r.url=o&&o.url||'';r.note='';if(r.k==='fb')fbUrl=r.url})
      .catch(function(e){if(r.x||e&&e.cancel)return undo(r);r.st=e&&e.skip?'skip':'fail';r.err=String(e&&e.message||e).slice(0,200)})
      .then(function(){fin++;prog(fin/R.length);drawRes(R)})}))
  .then(function(){var ok=R.filter(function(r){return r.st==='done'});
    if(ok.length){var u=fbUrl||ok[0].url||'';C.hist.unshift({u:u,c:(cap.split('\n')[0]||ST.user||'').slice(0,80),at:Date.now(),s:sched||0,d:ok.map(function(r){return r.k})});C.hist=C.hist.slice(0,15);save();drawHist()}
    btn.disabled=false;btn.textContent=t('postBtn');setTimeout(function(){prog(null)},800)})};

function drawHist(){var h=C.hist||[];$('histCard').hidden=!h.length;
  $('hist').innerHTML=h.map(function(x){var d=new Date(x.s?x.s*1000:x.at);return '<a target="_blank" rel="noopener" href="'+esc(x.u||'#')+'"><span>'+esc(x.c||'Post')+(x.d&&x.d.length>1?' · '+x.d.length+' places':'')+'</span><small>'+esc((x.s?t('later')+' · ':'')+d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))+'</small></a>'}).join('')}

/* ---------- settings ---------- */
function openSettings(){$('tgTok').value=C.tgToken||'';$('tgChat').value=C.tgChat||'@tg_thean';msg('m5',C.igId?'ok':'',C.igId?esc(t('igOk',{u:C.igUser||''})):'');msg('m6',C.tgToken?'ok':'',C.tgToken?esc(t('tgOk',{c:C.tgTitle||C.tgChat||''})):'');$('tok').value=C.token||'';$('mine').value=C.mine||'';$('creditTpl').value=C.creditTpl||'';$('cld').value=C.cld||'';$('pre').value=C.pre||'';
  keyMsg();$('settings').hidden=false}
function closeSettings(){C.mine=$('mine').value.trim();C.creditTpl=$('creditTpl').value.trim()||'Credit: @{user}';C.cld=$('cld').value.trim();C.pre=$('pre').value.trim();save();$('settings').hidden=true;if(!$('capCard').hidden)buildCaption()}
$('gear').onclick=openSettings;
document.addEventListener('click',function(e){if(e.target.closest('[data-open-settings]'))openSettings()});
$('settings').addEventListener('click',function(e){if(e.target===$('settings')||e.target.closest('[data-close]'))closeSettings()});
$('tokShow').onclick=function(){var p=$('tok').type==='password';$('tok').type=p?'text':'password';this.textContent=t(p?'hide':'show')};
$('tokCheck').onclick=function(){var raw=$('tok').value.replace(/\s+/g,''),mk=raw.match(/EAA[A-Za-z0-9]+/),v=mk?mk[0]:raw.replace(/^.*access_token"?:?/,'').replace(/["',{}]/g,'');$('tok').value=v;if(!v){msg('m4','bad',esc(t('tokEmpty')));return}
  var old=C.token;C.token=v;
  gget('me?fields=id,name,category').then(function(j){if(!j.category){throw {person:true,fb:true}}C.pageId=j.id;C.pageName=j.name;save();KS='ok';KTRY=0;msg('m4','ok',esc(t('tokOk',{p:j.name})));applyLang()})
  .catch(function(e){if(e&&e.fb){C.token=old;msg('m4','bad',e.person?esc(t('tokPerson')):esc(t('tokBad',{e:e.message||''})))}else{C.token=old;msg('m4','info',esc(t('kOffNote')))}})};
$('igCheck').onclick=function(){if(!C.token||!C.pageId){msg('m5','bad',esc(t('tokEmpty')));return}
  gget(C.pageId+'?fields=instagram_business_account{id,username}').then(function(j){var a=j.instagram_business_account;if(!a){msg('m5','bad',esc(t('igNone')));return}
    C.igId=a.id;C.igUser=a.username||'';C.dest.ig=true;save();msg('m5','ok',esc(t('igOk',{u:C.igUser})));drawDests()}).catch(function(e){msg('m5','bad',esc(t('tokBad',{e:e&&e.message||''})))})};
$('igForget').onclick=function(){delete C.igId;delete C.igUser;C.dest.ig=false;C.dest.igs=false;save();msg('m5','ok',esc(t('removed')));drawDests()};
$('tgShow').onclick=function(){var p=$('tgTok').type==='password';$('tgTok').type=p?'text':'password';this.textContent=t(p?'hide':'show')};
$('tgCheck').onclick=function(){var tok=$('tgTok').value.replace(/[^0-9A-Za-z:_-]/g,''),ch=$('tgChat').value.trim()||'@tg_thean';if(/^[A-Za-z0-9_]{5,}$/.test(ch))ch='@'+ch;ch=ch.replace(/^https?:\/\/t\.me\//,'@');
  if(!tok){msg('m6','bad',esc(t('tokEmpty')));return}var old=[C.tgToken,C.tgChat];C.tgToken=tok;C.tgChat=ch;var f=new FormData();f.append('chat_id',ch);
  tgCall('getMe',null).then(function(me){var g=new FormData();g.append('chat_id',ch);g.append('user_id',me.id);return tgCall('getChat',f).then(function(c){return tgCall('getChatMember',g).then(function(m){return {c:c,m:m}})})})
  .then(function(o){var name=o.c.title||ch;if(o.m.status!=='administrator'&&o.m.status!=='creator'){msg('m6','bad',esc(t('tgNotAdmin',{c:name})));C.tgToken=old[0];C.tgChat=old[1];return}
    C.tgTitle=name;C.dest.tg=true;save();$('tgChat').value=ch;msg('m6','ok',esc(t('tgOk',{c:name})));drawDests()})
  .catch(function(e){C.tgToken=old[0];C.tgChat=old[1];msg('m6','bad',esc(t('tgBad',{e:e&&e.message||''})))})};
$('tgForget').onclick=function(){delete C.tgToken;delete C.tgChat;delete C.tgTitle;C.dest.tg=false;save();$('tgTok').value='';msg('m6','ok',esc(t('removed')));drawDests()};
$('tokForget').onclick=function(){delete C.token;delete C.pageId;delete C.pageName;save();KS='none';$('tok').value='';msg('m4','ok',esc(t('removed')));applyLang()};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('settings').hidden)closeSettings()});

/* share target: ?url=... or #link */
try{var q=new URLSearchParams(location.search).get('url')||new URLSearchParams(location.search).get('text')||'';var mm=q.match(/https?:\/\/\S+/);if(mm)$('link').value=mm[0]}catch(e){}
applyLang();checkKey();
})();
