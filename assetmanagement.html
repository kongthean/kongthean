<style>
:root { --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --navy:#0b1d3a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --green:#16a34a; --grey:#64748b; --soft:#f8fafc; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#111b2e; --ink:#e5edf8; --mute:#94a3b8; --line:#22314a; --soft:#0e1727; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Noto Sans SC",Arial,sans-serif; font-size:15px; }
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
.wrap { width:100%; }
.hrft { margin-top:auto; }
.hidden { display:none !important; }
button, input { font-family:inherit; font-size:16px; }
/* ---------- header ---------- */
.top { position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; }

/* stay signed in for 30 days on this phone; a different login (for example the main website in the same browser) shows the login again */
var authInit = false, loginBusy = false;
firebase.auth().onAuthStateChanged(async function (u) {
  if (!u) { try { await firebase.auth().signInAnonymously(); } catch (e) {} if (!authInit) { authInit = true; showLogin(); } return; }
  if (loginBusy || pending) return;      /* a sign-in or the 2nd-code step is in progress: do not reset it */
  if (u.isAnonymous) { if (!authInit || me) { authInit = true; showLogin(); } return; }
  if (authInit && me) return;      /* already running */
  authInit = true;
  try {
    var st = await saReadRetry('staff/' + u.uid), tr = null;
    try { tr = JSON.parse(localStorage.getItem('tdTrust') || 'null'); } catch (e) {}
    if (st && st.key && tr && tr.key === st.key && Date.now() - tr.at < 30 * 86400000) { startApp(st.key, st.name || '', st.role); return; }
  } catch (e) {}
  await backToAnon(); showLogin();
});
