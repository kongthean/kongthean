<style>
:root{--bg:#f4f1ea;--surface:#fff;--ink:#17211b;--muted:#68706a;--line:#e3ddd0;--soft:#ece8df;--green:#163023;--green2:#1f4a35;--gold:#f3b11c;--red:#b3362f;--ok:#1d7a3d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:'Kantumruy Pro',system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}button{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.g{background:var(--green);color:var(--gold)}.btn.y{background:var(--gold);color:var(--green)}.btn.o{background:transparent;border:1.5px solid currentColor}.btn.s{background:var(--soft);color:var(--ink)}.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,textarea,select{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfaf7;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid rgba(243,177,28,.6);outline-offset:1px}
label.f{display:grid;gap:5px;font-size:13.5px;font-weight:600;color:#3a4540}label.f small{font-weight:500;color:var(--muted);font-size:12px}
.note{font-size:13px;color:var(--muted)}
.lang{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:3px;font-size:12.5px;font-weight:700}.lang button{border:0;background:none;padding:5px 11px;border-radius:99px;cursor:pointer;color:inherit}.lang button.on{background:var(--gold);color:var(--green)}
.top{background:var(--green);color:#fff;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:1;min-width:0}.brand img{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:#0f2219;object-fit:cover}
.brand b{font-family:Koulen,sans-serif;font-weight:400;font-size:20px;letter-spacing:.08em;display:block;line-height:1.05}.brand small{display:block;color:#cdbb86;font-size:11.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer}
/* landing */
.hero{background:radial-gradient(ellipse at 70% 0%,#2a5a40 0%,var(--green) 55%,#0f2219 100%);color:#fff;padding:48px 20px 56px}
.hero .in{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.kick{color:var(--gold);font-weight:700;letter-spacing:.16em;font-size:12.5px;text-transform:uppercase}
.hero h1{font-family:Koulen,'Kantumruy Pro',sans-serif;font-weight:400;font-size:46px;line-height:1.15;margin:10px 0 14px;letter-spacing:.02em}
.hero p{color:#dfe8e2;font-size:17px;max-width:560px}.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero .pic{background:#fff;border-radius:16px;padding:10px;box-shadow:0 24px 60px rgba(0,0,0,.35);transform:rotate(-1.5deg)}.hero .pic img{width:100%;display:block;border-radius:8px}
.sec{max-width:1120px;margin:0 auto;padding:52px 20px}.sec h2{font-family:Koulen,'Kantumruy Pro',sans-serif;font-weight:400;font-size:32px;letter-spacing:.02em;line-height:1.2;margin:6px 0 20px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stp{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}.stp i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--gold);display:grid;place-items:center;font-weight:700;margin-bottom:10px}.stp b{display:block;margin-bottom:4px}.stp p{color:var(--muted);font-size:14px}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.ft{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:12px}.ft .ic{width:42px;height:42px;border-radius:12px;background:#fff6dc;color:#9a6a00;display:grid;place-items:center;flex:none}.ft b{display:block}.ft p{color:var(--muted);font-size:14px}
.contact{background:var(--green);color:#fff;border-radius:24px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}.contact h2{color:#fff;margin:4px 0 6px}.contact p{color:#dfe8e2}.cbtns{display:flex;gap:10px;flex-wrap:wrap}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px 40px}.foot a{color:var(--muted)}
@media(max-width:900px){.hero .in{grid-template-columns:1fr}.hero h1{font-size:36px}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.feats{grid-template-columns:1fr}.contact{grid-template-columns:1fr}}
@media(max-width:520px){.hero{padding:32px 16px 40px}.hero h1{font-size:30px}.sec{padding:36px 16px}.steps{grid-template-columns:1fr}}
/* auth */
.authw{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:24px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;width:min(440px,100%);display:grid;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.card h2{font-size:22px;line-height:1.3}.err{color:var(--red);font-size:13.5px;min-height:1px}.ok{color:var(--ok)}
.pwrow{position:relative}.pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;font-size:12px;font-weight:700}
.idpill{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}.idpill code{font-family:ui-monospace,Menlo,monospace}
/* editor */
.ed{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;padding:20px;max-width:1440px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;align-content:start}
.step{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--gold);display:grid;place-items:center;font-size:13px;flex:none}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.tpls button{border:2px solid var(--line);border-radius:12px;padding:4px;background:#fff;cursor:pointer;text-align:center;font-size:12px;font-weight:600}.tpls button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(243,177,28,.25)}.tpls img{width:100%;display:block;border-radius:8px;aspect-ratio:841/595;object-fit:cover;margin-bottom:4px}
textarea.menu{min-height:230px;line-height:1.8;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.biz{border:1px dashed var(--line);border-radius:14px;padding:10px 12px}details.biz summary{cursor:pointer;font-weight:700;font-size:14px}details.biz[open] summary{margin-bottom:10px}details.biz .in{display:grid;gap:10px}
.warn{background:#fff4dd;color:#8a5a00;border-radius:12px;padding:10px 12px;font-size:13.5px}
.prev{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;align-content:start;position:sticky;top:84px}
.prevbar{display:flex;align-items:center;gap:10px}.prevbar b{flex:1;font-size:15px}
.sheet{background:#d9d6cf;border-radius:12px;padding:14px}.sheet canvas{width:100%;height:auto;display:block;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.dl{display:flex;gap:10px;flex-wrap:wrap}.saved{font-size:12.5px;color:var(--muted)}
@media(max-width:960px){.ed{grid-template-columns:1fr;padding:14px}.prev{position:static;order:-1}}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(380px,100%);height:100%;overflow:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));display:grid;gap:6px;align-content:start}
.drawer .who{background:var(--soft);border-radius:16px;padding:14px;margin-bottom:8px}.drawer .who b{display:block;font-size:16px}.drawer .who small{display:block;color:var(--muted)}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 10px;border-radius:12px;cursor:pointer;text-align:left;font-size:15px;font-weight:600;text-decoration:none}.mi:hover{background:var(--soft)}.mi.red{color:var(--red)}
.mo{position:fixed;inset:0;background:rgba(10,20,15,.55);z-index:60;display:grid;place-items:center;padding:16px}
.mo .box{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:20px;display:grid;gap:12px}
.mo .hd{display:flex;align-items:center;gap:10px}.mo .hd h3{flex:1;font-size:18px}.mo .x{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;cursor:pointer}
.legal h4{margin-top:10px}.legal p{margin:4px 0}.legal li{margin-left:20px}
.end{max-width:520px;text-align:center}.end .ic{width:64px;height:64px;border-radius:50%;background:#fde4e1;color:var(--red);display:grid;place-items:center;margin:0 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hide{display:none!important}
.top .btn.sm{padding:8px 12px}@media(max-width:480px){.top .brand small{display:none}.top .brand b{font-size:16px;white-space:nowrap;letter-spacing:.04em}.lang button{padding:5px 8px}}
.hm{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:16px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}.hcard h3{font-size:17px;margin-bottom:12px}
.hwel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px;align-items:center;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:0}
.hwel small{color:#cdbb86}.hwel h2{font-size:26px;line-height:1.3;margin:2px 0 10px}.hmeta{display:flex;gap:8px;flex-wrap:wrap}.hwel .idpill{background:rgba(255,255,255,.12);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700}.pill.ok{background:#e3f3e8;color:#1d7a3d}.pill svg{width:14px;height:14px}
.hper{background:rgba(255,255,255,.08);border-radius:16px;padding:14px}.hpt{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#dfe8e2;flex-wrap:wrap}.hpt b{color:#fff}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.18);margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.hbig{width:100%;display:flex;align-items:center;gap:16px;border:0;cursor:pointer;background:var(--gold);color:var(--green);border-radius:20px;padding:20px;text-align:left;box-shadow:0 10px 24px rgba(243,177,28,.25)}
.hbig .ic{width:52px;height:52px;border-radius:16px;background:var(--green);color:var(--gold);display:grid;place-items:center;flex:none}.hbig .ic svg{width:26px;height:26px}.hbig b{display:block;font-size:19px}.hbig small{font-size:14px;opacity:.85}
.hdes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.hdes button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:6px;cursor:pointer;text-align:center;font-size:13px}.hdes button:hover{border-color:var(--gold)}.hdes img{width:100%;aspect-ratio:841/595;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.h2c{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hrec{list-style:none;display:grid;gap:8px}.hrec li{display:flex;align-items:center;gap:10px}.hrec .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}.hrec span:nth-child(2){flex:1;min-width:0}.hrec b{display:block;font-size:14px}.hrec small{color:var(--muted);font-size:12.5px}.hrec li{min-width:0}.hrec em{flex:none;margin-right:2px;font-style:normal;font-size:11.5px;font-weight:700;background:var(--soft);border-radius:8px;padding:3px 8px}
.hq{list-style:none;display:grid;gap:10px}.hq li{display:flex;gap:10px;align-items:flex-start}.hq i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--green);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}.hq b{display:block;font-size:14px}.hq small{color:var(--muted);font-size:13px}
.edtop{max-width:1440px;margin:0 auto;padding:14px 20px 0}
@media(max-width:760px){.hm{padding:14px}.hwel{grid-template-columns:1fr}.h2c{grid-template-columns:1fr}.edtop{padding:12px 14px 0}}
</style>

   intro:'សួស្តី! សូមស្វាគមន៍មកកាន់ Thean Card Studio។ ខ្ញុំអាចជួយអ្នកអំពី៖\n• របៀបដែលសេវាកម្មដំណើរការ\n• តម្លៃ និងគម្រោង\n• ម៉ូដ និងគំរូរបស់អ្នក\n• ការចូល និងគណនីរបស់អ្នក\n• ការទាញយក និងបោះពុម្ព\n\nសូមជ្រើសប្រធានបទខាងក្រោម ឬជជែកជាមួយក្រុមការងារ។',

 caps:{en:'I can help you with:\n• How the service works\n• Prices and plans\n• Designs and your template\n• Login and your account\n• Downloading and printing\n\nJust type your question, or tap «Talk to Live Agent» to chat with our team.',km:'ខ្ញុំអាចជួយអ្នកអំពី៖\n• របៀបដែលសេវាកម្មដំណើរការ\n• តម្លៃ និងគម្រោង\n• ម៉ូដ និងគំរូរបស់អ្នក\n• ការចូល និងគណនីរបស់អ្នក\n• ការទាញយក និងបោះពុម្ព\n\nសូមវាយសំណួររបស់អ្នក ឬចុច «ជជែកជាមួយភ្នាក់ងារ» ដើម្បីជជែកជាមួយក្រុមការងារ។'},

      if(items.length>ideal){step=Math.max(sl.minstep,room/(items.length-1));size=sl.size*step/sl.step;if(items.length>max){warn.many=items.length;step=room/(items.length-1);size=sl.size*step/sl.step}}
      ctx.fillStyle=sl.color;ctx.textAlign='left';items.forEach((it,i)=>{const y=(sl.y+i*step)*s;const num=(sl.num==='km'?KN(i+1):String(i+1))+'.';ctx.font=FS(size*s,font);ctx.fillText(num,(ox+sl.x)*s,y);const sz=fit(it,font,size,sl.maxw-sl.gap);ctx.fillText(it,(ox+sl.x+sl.gap*size/sl.size)*s,y)});return}
    if(sl.t==='date')txt=fmtDate(txt,sl.format);txt=String(txt).replace(/\n/g,' ');if(!txt)return;
    const size=fit(txt,font,sl.size,sl.maxw);ctx.textAlign=sl.align||'left';const x=(ox+sl.x)*s,y=sl.y*s;
    if(sl.color==='rainbow'){const C=sl.colors||['#e8262b','#1e9b45','#1d6fd1'];const chars=[...txt];const clusters=[];chars.forEach(ch=>{if(clusters.length&&/[឴-៓៝‌‍]/.test(ch))clusters[clusters.length-1]+=ch;else clusters.push(ch)});
      const total=ctx.measureText(txt).width;let cx=sl.align==='center'?x-total/2:sl.align==='right'?x-total:x;ctx.textAlign='left';let ci=0,acc='';
      clusters.forEach(cl=>{const before=ctx.measureText(acc).width;acc+=cl;ctx.fillStyle=cl.trim()?C[ci++%C.length]:'#000';if(cl.trim()){ctx.save();ctx.beginPath();const a=ctx.measureText(acc).width;ctx.rect(cx+before,y-size*s*1.6,a-before+1,size*s*2.4);ctx.clip();ctx.fillText(txt,cx,y);ctx.restore()}})}
    else{ctx.fillStyle=sl.color;ctx.fillText(txt,x,y)}})});
  return warn}

async function preview(){const cv=$('[data-cv]');if(!cv||!TPL)return;const s=cv.width/TPL.sheet.w;cv.height=Math.round(TPL.sheet.h*s);const bg=await loadBg(TPL);await loadFonts(TPL);const w=drawSheet(cv.getContext('2d'),TPL,vals(),s,bg);

function saveBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
/* a one-page PDF with the full-size JPEG, page size = the template sheet (no outside library) */
async function makePdf(canvas,wpt,hpt){const jb=new Uint8Array(await (await new Promise(r=>canvas.toBlob(r,'image/jpeg',.96))).arrayBuffer());const enc=new TextEncoder();const parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};const obj=(n,body)=>{offs[n]=len;add(n+' 0 obj\n');body();add('\nendobj\n')};
  const W=wpt.toFixed(2),H=hpt.toFixed(2),cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));obj(2,()=>add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3,()=>add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>'));
  obj(4,()=>{add('<< /Type /XObject /Subtype /Image /Width '+canvas.width+' /Height '+canvas.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jb.length+' >>\nstream\n');add(jb);add('\nendstream')});
  obj(5,()=>add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
  const x=len;add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'})}
async function download(kind,btn){const old=btn.innerHTML;btn.disabled=true;btn.textContent=t('making');
  try{const c=await renderFull();
    if(kind==='png'){const b=await new Promise(r=>c.toBlob(r,'image/png'));saveBlob(b,fname('png'))}
    else if(kind==='jpg'){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));saveBlob(b,fname('jpg'))}
    else if(kind==='pdf'){saveBlob(await makePdf(c,TPL.sheet.w,TPL.sheet.h),fname('pdf'))}
    else{const u=c.toDataURL('image/jpeg',.96);const w=window.open('','_blank');if(w){const mm=TPL.sheet.mm;w.document.write('<!doctype html><title>Print</title><style>@page{size:'+mm[0]+'mm '+mm[1]+'mm;margin:0}html,body{margin:0}img{width:'+mm[0]+'mm;height:'+mm[1]+'mm;display:block}</style><img src="'+u+'" onload="setTimeout(function(){print()},300)">');w.document.close()}}
    toast(t('done'));if(LOGS)LOGS['l'+Date.now()]={at:Date.now(),tpl:TPL.id,type:kind};fb().then(F=>F.push('cards/log/'+ID,{at:F.now(),tpl:TPL.id,type:kind})).catch(()=>{})}
  catch(e){toast(String(e&&e.message||e))}finally{btn.disabled=false;btn.innerHTML=old}}

async function start(){
