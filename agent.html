<style>
/* Agent console — same misty stone palette as the website */
:root{
  --bg:#e8eae9;--bg2:#dfe3e2;--surface:#fff;--ink:#1c2021;--muted:#5f6767;--line:#cfd4d3;

  --wait:#c98a22;--wait-soft:#f6ead4;--ok:#2f9e5f;--ok-soft:#dcefe3;--danger:#b3362f;--shadow:0 10px 30px rgba(28,32,33,.12);
  --display:'Koulen','Kantumruy Pro',Impact,sans-serif;--body:'Kantumruy Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131616;--bg2:#181c1c;--surface:#1d2222;--ink:#e7ebea;--muted:#9ba4a3;--line:#2d3434;--stone:#5d6766;--stone-d:#46504f;--char:#e7ebea;--char-ink:#151818;--accent:#93b4be;--accent-soft:#223033;
  --wait:#e7b25a;--wait-soft:#3a2e1c;--ok:#6fd39a;--ok-soft:#1d3326;--danger:#ef7a70;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131616;--bg2:#181c1c;--surface:#1d2222;--ink:#e7ebea;--muted:#9ba4a3;--line:#2d3434;--stone:#5d6766;--stone-d:#46504f;--char:#e7ebea;--char-ink:#151818;--accent:#93b4be;--accent-soft:#223033;
  --wait:#e7b25a;--wait-soft:#3a2e1c;--ok:#6fd39a;--ok-soft:#1d3326;--danger:#ef7a70;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.emb{font-family:var(--display);font-weight:400;letter-spacing:.06em;line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--char);color:var(--char-ink);text-decoration:none}
.btn.soft{background:var(--bg2);color:var(--ink)}.btn.sm{padding:6px 13px;font-size:.85rem}.btn.ok{background:var(--ok);color:#fff}.btn.del{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.logo{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-family:var(--display);font-size:1.2rem;flex:none;overflow:hidden}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 0%,var(--surface),var(--bg))}
.lcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:var(--shadow);display:grid;gap:14px}
.lcard h1{margin:0;font-size:2rem}
.lcard p{margin:0;color:var(--muted)}
label.f{display:grid;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted)}
label.f input,label.f textarea{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--bg);font-weight:400;color:var(--ink);width:100%}
.err{background:#f7dedb;color:#8a2a22;border-radius:10px;padding:9px 12px;font-size:.88rem}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}
.note code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:.85rem;overflow-wrap:anywhere}
.note ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}

/* app */
.app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--char);color:var(--char-ink)}
.top .ttl{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.top .ttl b{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.1em;line-height:1}
.top .ttl small{display:block;opacity:.7;font-size:.75rem}
.top .ttl .logo{background:rgba(255,255,255,.15)}
.tb{text-decoration:none;position:relative;border:0;background:rgba(255,255,255,.1);color:inherit;height:38px;min-width:38px;padding:0 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.82rem;font-weight:600}
.tb svg{font-size:1.15rem}
.tb.on{background:var(--ok);color:#fff}
.tb.away{background:rgba(255,255,255,.1)}
.tb .bd{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:#d6453a;color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 4px}
@media(max-width:640px){.tb .tl{display:none}}
.main{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0;overflow:hidden}
@media(max-width:820px){.main{grid-template-columns:1fr}.main.sel .side{display:none}.main:not(.sel) .conv{display:none}}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:transparent;padding:7px 12px;border-radius:99px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center}
.tabs button.on{background:var(--char);color:var(--char-ink)}
.tabs .c{background:var(--bg2);color:var(--ink);border-radius:99px;padding:0 7px;font-size:.75rem}
.tabs button.on .c{background:rgba(255,255,255,.2);color:inherit}
.tabs .c.hot{background:var(--wait);color:#fff}
.search{padding:8px 10px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);border-radius:99px;padding:8px 14px;background:var(--bg)}
.list{flex:1;overflow-y:auto}
.item{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:12px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer;align-items:center}
.item:hover{background:var(--bg)}
.item.on{background:var(--accent-soft)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(155deg,var(--stone),var(--stone-d));position:relative}
.av .st{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface)}
.item .nm{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.item .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .lm{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .rt{display:grid;justify-items:end;gap:4px;font-size:.74rem;color:var(--muted)}
.ub{background:#d6453a;color:#fff;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:.72rem;font-weight:700;padding:0 6px}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.waiting{background:var(--wait-soft);color:var(--wait)}.pill.assigned{background:var(--ok-soft);color:var(--ok)}.pill.bot{background:var(--accent-soft);color:var(--accent)}.pill.closed{background:var(--bg2);color:var(--muted)}
.emptyl{padding:40px 20px;text-align:center;color:var(--muted)}
.conv{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch .who{flex:1;min-width:140px}
.ch .who b{display:block;line-height:1.25}
.ch .who small{color:var(--muted);font-size:.8rem}
.back{border:0;background:var(--bg2);width:36px;height:36px;border-radius:50%;display:none;place-items:center;cursor:pointer;font-size:1.1rem}
@media(max-width:820px){.back{display:grid}}
.info{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:.8rem}
.info span{background:var(--bg);border-radius:99px;padding:3px 10px;display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
.info button{border:0;background:var(--bg2);border-radius:99px;padding:3px 10px;font-size:.8rem;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:min(78%,560px);padding:9px 13px;border-radius:16px;white-space:pre-line;overflow-wrap:anywhere;font-size:.93rem}
.m.vis{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.bot{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.m.agent{align-self:flex-end;background:var(--char);color:var(--char-ink);border-bottom-right-radius:4px}
.m .by{display:block;font-size:.7rem;font-weight:700;opacity:.65;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.m time{display:block;font-size:.66rem;opacity:.55;margin-top:2px;text-align:right}
.m .ftag{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.75rem;opacity:.8}
.m .mimgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.m .mimgs img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.m.freply{border-color:var(--accent)}
.info .tk{font-weight:600;color:var(--ink)}.info .tk.done{color:var(--ok)}.info .tk.rep{color:var(--danger)}
.sys{align-self:center;font-size:.78rem;color:var(--muted);background:var(--bg2);border-radius:12px;padding:5px 12px;text-align:center;max-width:90%}
.typing{align-self:flex-start;font-size:.8rem;color:var(--muted);font-style:italic}
.acceptbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;background:var(--wait-soft);color:var(--ink);border-top:1px solid var(--line)}
.qr{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.qrb{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:.74rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.2}
.qrb .ic{width:34px;height:34px;border-radius:11px;background:linear-gradient(155deg,var(--stone),var(--stone-d));color:#fff;display:grid;place-items:center;font-size:1.05rem}
.qrb:hover{border-color:var(--stone)}
.aib{display:flex;align-items:center;gap:6px;border:1px dashed var(--stone);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer;margin:0 12px 6px auto}
.endopt{display:grid;gap:8px}.endopt button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);font-size:.9rem;line-height:1.4}
.endopt button:hover{border-color:var(--stone)}.endopt small{display:block;color:var(--muted);font-size:.74rem;margin-top:4px}
.agrow{display:flex;gap:10px;align-items:center;width:100%}
.qrhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.8rem;color:var(--muted);font-weight:600}
.qlang{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px;margin-left:auto;margin-right:8px}
.qrhead .qlang button{color:var(--muted);padding:3px 10px;border-radius:99px;font-size:.76rem}
.qrhead .qlang button.on{background:var(--char);color:var(--char-ink)}
.qrhead button{border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;font-size:.8rem}
.comp{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);align-items:flex-end}
.comp textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:18px;padding:10px 14px;background:var(--bg);max-height:140px;min-height:44px;line-height:1.4}
.ib{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;font-size:1.2rem;flex:none;background:var(--bg2);color:var(--ink)}
.ib.pri{background:var(--char);color:var(--char-ink)}
.ib.on{background:var(--accent);color:#fff}
.blank{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.blank .big{font-size:3rem;opacity:.4}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,12,12,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:20px;width:100%;max-width:620px;max-height:92vh;overflow:auto}
.sheet .hd{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .hd h3{margin:0;flex:1}
.sheet .bd{padding:18px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.qe{display:grid;grid-template-columns:100px 1fr;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px}
.qe textarea{min-height:60px}
.qe select{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--char);color:var(--char-ink);padding:10px 18px;border-radius:99px;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.toggle small{display:block;color:var(--muted);font-size:.8rem}
.toggle input{width:22px;height:22px}
</style>

A.onAuthStateChanged(auth,async u=>{

});
function cleanup(){[chatUnsub,msgUnsub,meUnsub,connUnsub].forEach(f=>f&&f());chatUnsub=msgUnsub=meUnsub=connUnsub=null;if(beat)clearInterval(beat);chats=[];firstSnap=true;sel=null;msgs=[]}

function start(){
  drawShell();
  setOnline(agent.online!==false,true);
  beat=setInterval(()=>{if(agent&&agent.online)DB.update('agents/'+me.uid,{lastSeen:TS}).catch(()=>{})},60000);
  connUnsub=DB.onConnected(c=>{if(c&&wantOnline){DB.onDisconnect('agents/'+me.uid,{online:false,lastSeen:TS});DB.update('agents/'+me.uid,{online:true,lastSeen:TS}).catch(()=>{})}});
  meUnsub=DB.on('agents/'+me.uid,v=>{if(v){agent=v;drawTop()}});
  DB.get('settings/public').then(v=>{if(v&&v.waitMin)waitMin=+v.waitMin||10;if(v&&v.autoMin)autoMin=+v.autoMin||30}).catch(()=>{});
  setInterval(expireWaiting,30000);
  DB.get('settings/quick').then(v=>{if(v&&Array.isArray(v.items)&&v.items.length){quick=v.items;
      if(!v.formsMerged){const has=new Set(quick.map(x=>x.act).filter(Boolean));const add=FORM_QUICK.filter(x=>!has.has(x.act));quick=add.concat(quick);DB.update('settings/quick',{items:quick,formsMerged:true,updatedAt:TS}).catch(()=>{})}
      if(!v.goodbyeMerged){const have=new Set(quick.map(x=>x.en));const add=(Array.isArray(v.closing)&&v.closing.length?v.closing:CLOSE_DEF).filter(x=>x.en&&!have.has(x.en)).map((x,i)=>({icon:['check','chat','heart','clock'][i%4],label:['Goodbye','Will contact','Pleasure','No reply'][i]||'Goodbye',send:true,en:x.en,km:x.km||''}));
        quick=quick.concat(add);DB.set('settings/quick',{items:quick,goodbyeMerged:true,updatedAt:TS}).catch(()=>{})}}
      drawConv()}).catch(()=>{});
  chatUnsub=DB.onRecent('chats','updatedAt',200,list=>{
    list.forEach(d=>{
      const id=d.id,prev=seen[id];
      if(!firstSnap){
        if(d.status==='assigned'&&d.agentUid===me.uid&&prev&&prev.agentUid!==me.uid&&d.transferFrom){alertNew('Chat transferred to you',vName(d)+' · from '+d.transferFrom,id)}
        else if(d.reportOpen&&prev&&!prev.reportOpen){alertNew('New content report',vName(d)+' sent a content report',id)}
        else if(d.status==='waiting'&&(!prev||prev.status!=='waiting')){alertNew('New live chat request',vName(d)+' wants to talk to an agent',id)}
        else if(d.lastFrom==='visitor'&&(d.status==='assigned'||d.status==='waiting')&&(!prev||prev.lastMsg!==d.lastMsg)&&!(sel===id&&!document.hidden))alertNew(''+vName(d),d.lastMsg,id);
      }
      seen[id]={status:d.status,lastMsg:d.lastMsg,agentUid:d.agentUid||null,reportOpen:!!d.reportOpen};
    });
    chats=list;
    expireWaiting();
    firstSnap=false;drawList();drawTop();updateTitle();if(sel)drawConvHead();
  },err=>toast('Could not load chats: '+(err.code||err.message)));
  window.addEventListener('beforeunload',()=>{DB.update('agents/'+me.uid,{online:false}).catch(()=>{})});
}
const expiring=new Set();
async function expireWaiting(){
  const now=Date.now();
  for(const c of chats){
    if(c.status==='assigned'&&c.updatedAt&&now-ms(c.updatedAt)>=autoMin*60000&&!expiring.has(c.id)){
      expiring.add(c.id);
      try{const r=await DB.tx('chats/'+c.id+'/status',cur=>cur===null?null:(cur==='assigned'?'closed':undefined));
        if(r.committed&&r.val==='closed'){const lg=c.lang==='km'?'km':'en';await DB.push('messages/'+c.id,{from:'bot',text:AUTO_END[lg].split('{min}').join(lg==='km'?String(autoMin).replace(/\d/g,d=>'០១២៣៤៥៦៧៨៩'[d]):autoMin),auto:true,ts:TS});await DB.update('chats/'+c.id,{closedAt:TS,updatedAt:TS,lastMsg:'Closed automatically after '+autoMin+' min without messages',lastFrom:'system',unreadAgent:0})}}catch(e){}
      expiring.delete(c.id);continue}
    if(c.status!=='waiting'||!c.requestedAt||now-ms(c.requestedAt)<waitMin*60000||expiring.has(c.id))continue;
    expiring.add(c.id);
    try{const r=await DB.tx('chats/'+c.id+'/status',cur=>cur===null?null:(cur==='waiting'?'bot':undefined));
      if(r.committed&&r.val==='bot'){const lg=c.lang==='km'?'km':'en';await DB.push('messages/'+c.id,{from:'bot',text:BUSY[lg],btns:[{l:BTN[lg].live,a:'live'}],ts:TS});await DB.update('chats/'+c.id,{lastMsg:'No agent opened the chat in time',lastFrom:'bot',updatedAt:TS})}}catch(e){}
    expiring.delete(c.id);
  }
}
function setOnline(v,quiet){wantOnline=v;DB.update('agents/'+me.uid,{online:v,lastSeen:TS,email:me.email||''}).then(()=>{if(!quiet)toast(v?'You are available. Visitors can reach you.':'You are away. Visitors are told you will reply later.')}).catch(e=>toast('Could not change status: '+(e.code||e.message)))}

  drawTop();drawList();drawConv();

function counts(){const c={waiting:0,mine:0,open:0,unread:0,reports:0};chats.forEach(x=>{if(x.reportOpen)c.reports++;if(x.status==='waiting')c.waiting++;if(x.status==='assigned'&&x.agentUid===me.uid)c.mine++;if(x.status==='waiting'||x.status==='assigned')c.open++;c.unread+=x.status!=='closed'&&x.status!=='bot'?(x.unreadAgent||0):0});return c}

const TABS=[['open','Open'],['waiting','Waiting'],['mine','Mine'],['reports','Reports'],['bot','Bot only'],['closed','Closed']];
function filtered(){return chats.filter(c=>{
  if(tab==='open'&&!(c.status==='waiting'||c.status==='assigned'||c.reportOpen))return false;
  if(tab==='waiting'&&c.status!=='waiting')return false;
  if(tab==='mine'&&!(c.status==='assigned'&&c.agentUid===me.uid))return false;
  if(tab==='bot'&&c.status!=='bot')return false;
  if(tab==='reports'&&!c.reportOpen)return false;
  if(tab==='closed'&&c.status!=='closed')return false;
  if(search){const sd=search.replace(/\D/g,'');if(!(((c.name||'')+' '+(c.lastMsg||'')+' '+(c.contact||'')+' '+((c.customer&&c.customer.email)||'')).toLowerCase().includes(search)||(sd.length>=6&&(String(c.ticket||'').includes(sd.slice(0,16))||String(c.followTicket||'').includes(sd.slice(0,16))))))return false}return true})}
let tFound=[],tLook='';
async function ticketLookup(){const sd=search.replace(/\D/g,'').slice(0,16);if(sd.length!==16||tLook===sd)return;tLook=sd;
  if(chats.some(c=>c.ticket===sd))return;
  try{const tk=await DB.get('tickets/'+sd);if(tk){const ids=[tk.chatId,tk.curChat].filter(Boolean);let n=0;for(const id of ids){if(chats.some(c=>c.id===id)){n++;continue}const ch=await DB.get('chats/'+id);if(ch){chats.push(Object.assign({id},ch));n++}}if(n){tab='all';drawList();toast('Ticket '+fmtTicket(tk.cur||sd)+' · '+(tk.status==='closed'?'solved':'open'));return}}}catch(e){}
  try{const r=await DB.findEq('chats','ticket',sd);if(r.length){r.forEach(x=>{if(!chats.some(c=>c.id===x.id))chats.push(x)});tab='all';drawList();toast('Found the chat for ticket '+fmtTicket(sd))}else toast('No chat found with ticket '+fmtTicket(sd))}catch(e){toast('Could not search tickets: '+(e.code||e.message))}}
function vName(c){return c.name||('Visitor '+c.id.slice(0,4).toUpperCase())}
function ago(ts){if(!ts)return 'now';const s=(Date.now()-ms(ts))/1000;if(s<60)return 'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}
const SCOL={waiting:'var(--wait)',assigned:'var(--ok)',bot:'#7fb3d5',closed:'var(--line)'};
function drawList(){
  const tb=root.querySelector('#tabs'),l=root.querySelector('#list');if(!tb)return;
  const all={open:0,waiting:0,mine:0,bot:0,closed:0,reports:0};chats.forEach(c=>{if(c.reportOpen)all.reports++;if(c.status==='waiting'||c.status==='assigned'||c.reportOpen)all.open++;if(all[c.status]!=null&&c.status!=='assigned')all[c.status]++;if(c.status==='assigned'&&c.agentUid===me.uid)all.mine++});
  tb.innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'<span class="c'+((t[0]==='waiting'&&all.waiting)||(t[0]==='reports'&&all.reports)?' hot':'')+'">'+all[t[0]]+'</span></button>').join('');
  tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;drawList()});
  const f=filtered();
  l.innerHTML=f.length?f.map(c=>'<button class="item'+(sel===c.id?' on':'')+'" data-id="'+c.id+'"><span class="av">'+esc(vName(c)[0])+'<span class="st" style="background:'+(SCOL[c.status]||'var(--line)')+'"></span></span><span style="min-width:0"><span class="nm"><span>'+esc(vName(c))+'</span><span class="pill '+esc(c.status)+'">'+esc(c.status==='assigned'?'live':c.status)+'</span></span><span class="lm">'+(c.lastFrom==='agent'?'You: ':c.lastFrom==='bot'?'Bot: ':'')+esc(c.lastMsg||'…')+'</span></span><span class="rt">'+ago(c.updatedAt)+(c.unreadAgent&&c.status!=='bot'?'<span class="ub">'+c.unreadAgent+'</span>':'')+'</span></button>').join('')
   :'<div class="emptyl">'+(tab==='open'?'No open chats right now.<br>When a visitor taps “Talk to a live agent”, it appears here with a sound.':'Nothing here.')+'</div>';
  l.querySelectorAll('.item').forEach(b=>b.onclick=()=>openChat(b.dataset.id));
}
function openChat(id){

  msgUnsub=DB.onMsgs('messages/'+id,list=>{msgs=list;drawMsgs()});

function drawConvHead(){
  const c=cur(),h=root.querySelector('#chh');if(!c||!h)return;

function leaveText(lg,c){const nm=(c&&c.agentName)||(agent&&agent.name)||'Agent';const mineA=!c||c.agentUid===me.uid;const t=(mineA&&agent&&agent['leave'+(lg==='km'?'Km':'En')])||LEAVE_DEF[lg];return t.split('{name}').join(nm)}

async function accept(id){

    const d=await DB.get('chats/'+id);if(!d)return;

/* ---------- notifications ---------- */
let ac=null;
function beep(){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach((t,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i?1320:990;g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.3);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.32)})}catch(e){}}
document.addEventListener('click',()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}},{once:true});
function alertNew(title,body,id){
  beep();try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
  toast(title+': '+String(body||'').slice(0,70),()=>openChat(id));
  if('Notification' in window&&Notification.permission==='granted'&&(document.hidden||sel!==id)){try{const n=new Notification(title,{body:String(body||''),tag:id,renotify:true});n.onclick=()=>{window.focus();openChat(id);n.close()}}catch(e){}}
}
async function askNotify(){
  if(!('Notification' in window)){toast('This browser cannot show alerts. On iPhone, add this page to your Home Screen first.');return}
  if(Notification.permission==='granted'){toast('Alerts are on. Keep this page open to receive them.');beep();return}
  const p=await Notification.requestPermission();toast(p==='granted'?'Alerts are on':'Alerts were blocked. Allow notifications in your browser settings.');
}
function updateTitle(){const c=counts(),n=c.unread+c.waiting;document.title=(n?'('+n+') ':'')+'Thean · Agent Inbox'}

/* ---------- settings & quick replies ---------- */
function modal(title,inner){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h3>'+esc(title)+'</h3><button class="ib" data-close aria-label="Close">'+I('close')+'</button></div><div class="bd">'+inner+'</div></div>';m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))m.remove()});document.body.appendChild(m);return m}
function settings(){
  const a=agent||{};
  const m=modal('Settings','<label class="f">Your name shown to customers<input id="nm" value="'+esc(a.name||'')+'"></label>'+
   '<label class="f">Message customers see when you open a chat (English)<input id="je" value="'+esc(a.joinEn||JOIN_DEF.en)+'"></label>'+
   '<label class="f">Same message in Khmer<input id="jk" value="'+esc(a.joinKm||JOIN_DEF.km)+'"></label>'+
   '<label class="f">Message customers see when you end a chat (English)<input id="le" value="'+esc(a.leaveEn||LEAVE_DEF.en)+'"></label>'+
   '<label class="f">Same message in Khmer<input id="lk" value="'+esc(a.leaveKm||LEAVE_DEF.km)+'"></label>'+
   '<div class="note" id="pv"></div>'+
   '<label class="toggle"><span><b>Sound alerts</b><small>Play a chime for new chats and messages on this device.</small></span><input type="checkbox" id="so"'+(soundOn?' checked':'')+'></label>'+
   (isOwner()?'<label class="f">Minutes to wait for an agent before telling the customer all agents are busy (whole team)<input id="wm" type="number" min="1" max="120" value="'+waitMin+'"></label><label class="f">Close a live chat automatically after this many minutes without new messages (whole team)<input id="am" type="number" min="5" max="240" value="'+autoMin+'"></label>':'')+
   '<div class="note">Alerts work while this page is open (a browser tab or the Home Screen app). Tip: on your phone, use <b>Share → Add to Home Screen</b> so the inbox opens like an app.</div>'+
   '<div class="row"><button class="btn soft" data-close type="button">Cancel</button><button class="btn" id="sv" type="button">Save</button></div>');
  const pv=()=>{const n=m.querySelector('#nm').value.trim()||'Agent';m.querySelector('#pv').innerHTML='<b>Preview:</b> '+esc((m.querySelector('#je').value||JOIN_DEF.en).split('{name}').join(n))+' … '+esc((m.querySelector('#le').value||LEAVE_DEF.en).split('{name}').join(n))+'<br><small>Write <code>{name}</code> where your name should appear.</small>'};
  m.addEventListener('input',pv);pv();
  m.querySelector('#sv').onclick=async()=>{soundOn=m.querySelector('#so').checked;setPref('sound',soundOn);
    const up={name:(m.querySelector('#nm').value.trim()||'Agent').slice(0,40),joinEn:m.querySelector('#je').value.trim().slice(0,200)||JOIN_DEF.en,joinKm:m.querySelector('#jk').value.trim().slice(0,200)||JOIN_DEF.km,leaveEn:m.querySelector('#le').value.trim().slice(0,200)||LEAVE_DEF.en,leaveKm:m.querySelector('#lk').value.trim().slice(0,200)||LEAVE_DEF.km};
    try{await DB.update('agents/'+me.uid,up);
      const wm=m.querySelector('#wm');if(wm){const v=Math.max(1,Math.min(120,parseInt(wm.value,10)||10));await DB.update('settings/public',{waitMin:v});waitMin=v}
      const am=m.querySelector('#am');if(am){const v2=Math.max(5,Math.min(240,parseInt(am.value,10)||30));await DB.update('settings/public',{autoMin:v2});autoMin=v2}
      m.remove();toast('Saved');drawTop()}catch(e){toast('Not saved: '+(e.code||e.message))}};
}
async function team(){
  const m=modal('Team','<div id="tl">Loading…</div>');
  async function draw(){
    let ag={},inv={};try{ag=await DB.get('agents')||{}}catch(e){}try{if(isOwner())inv=await DB.get('invites')||{}}catch(e){}
    const rows=Object.keys(ag).map(uid=>{const a=ag[uid]||{};return '<div class="toggle"><span style="display:flex;gap:10px;align-items:center;min-width:0"><span class="av" style="width:36px;height:36px">'+esc((a.name||'?')[0])+'<span class="st" style="background:'+(a.online?'var(--ok)':'var(--line)')+'"></span></span><span style="min-width:0"><b>'+esc(a.name||'Agent')+(uid===me.uid?' (you)':'')+'</b><small>'+esc(a.email||'')+' · '+((a.role==='owner'||!a.role)?'Owner':'Agent')+' · '+(a.online?'online':'away')+'</small></span></span>'+(isOwner()&&uid!==me.uid?((a.role==='owner'||!a.role)?'<button class="btn sm soft" data-own="'+esc(uid)+'" data-to="agent" type="button">Make agent</button>':'<button class="btn sm soft" data-own="'+esc(uid)+'" data-to="owner" type="button">Make owner</button>'):'')+(isOwner()&&uid!==me.uid?'<button class="btn sm del" data-rm="'+esc(uid)+'" type="button">Remove</button>':'')+'</div>'}).join('');
    const invs=Object.keys(inv).map(k=>'<div class="toggle"><span><b>'+esc(inv[k].email||k)+'</b><small>Invited · waiting for them to create an account</small></span><button class="btn sm soft" data-ri="'+esc(k)+'" type="button">Cancel</button></div>').join('');
    m.querySelector('#tl').innerHTML='<div style="display:grid;gap:8px">'+rows+'</div>'+
      (isOwner()?'<h4 style="margin:18px 0 8px">Invite a team member</h4><div class="note">Type their email, then tell them to open <b>kongthean.com/agent</b>, tap <b>New team member? Create account</b> and use that same email.</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input id="ie" type="email" placeholder="name@example.com" style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)"><input id="in" placeholder="Name (optional)" style="flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)"><button class="btn" id="ia" type="button">Invite</button></div>'+(invs?'<div style="display:grid;gap:8px;margin-top:12px">'+invs+'</div>':'')
       :'<div class="note" style="margin-top:12px">Only the owner can invite or remove team members.</div>');
    m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Tap again';return}try{await DB.remove('agents/'+b.dataset.rm);toast('Removed from the team');draw()}catch(e){toast('Not removed: '+(e.code||e.message))}});
    m.querySelectorAll('[data-own]').forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Tap again to confirm';return}
      try{await DB.update('agents/'+b.dataset.own,{role:b.dataset.to});toast(b.dataset.to==='owner'?'Now an owner: can invite and remove team members and change settings':'Now an agent');draw()}catch(e){toast('Not changed: '+(e.code||e.message))}});
    m.querySelectorAll('[data-ri]').forEach(b=>b.onclick=async()=>{try{await DB.remove('invites/'+b.dataset.ri);draw()}catch(e){toast('Not cancelled: '+(e.code||e.message))}});
    const ia=m.querySelector('#ia');if(ia)ia.onclick=async()=>{const em=m.querySelector('#ie').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Type a valid email');return}
      try{await DB.set('invites/'+ekey(em),{email:em,name:m.querySelector('#in').value.trim().slice(0,40),by:me.uid,at:TS});toast('Invited '+em);draw()}catch(e){toast('Not invited: '+(e.code||e.message))}};
  }
  draw();
}
function editQuick(){
  let L=JSON.parse(JSON.stringify(quick));
  const m=modal('Quick replies','<div id="ql" style="display:grid;gap:10px"></div><button class="btn soft" type="button" id="qa">'+I('plus')+' Add reply</button><div class="row"><button class="btn soft" type="button" id="qd">Reset to default</button><button class="btn soft" data-close type="button">Cancel</button><button class="btn" id="qs" type="button">Save for all agents</button></div>');
  function draw(){m.querySelector('#ql').innerHTML=L.map((x,i)=>'<div class="qe"><div style="display:grid;gap:6px;align-content:start"><span class="qrb" style="pointer-events:none"><span class="ic">'+I(x.icon)+'</span></span><select data-i="'+i+'" data-k="icon">'+QICONS.map(o=>'<option'+(o===x.icon?' selected':'')+'>'+o+'</option>').join('')+'</select></div><div style="display:grid;gap:6px"><label class="f">Button label<input data-i="'+i+'" data-k="label" value="'+esc(x.label)+'"></label><label class="f">English<textarea data-i="'+i+'" data-k="en">'+esc(x.en)+'</textarea></label><label class="f">Khmer<textarea data-i="'+i+'" data-k="km">'+esc(x.km)+'</textarea></label><label style="display:flex;gap:8px;align-items:center;font-size:.85rem"><input type="checkbox" data-i="'+i+'" data-k="send"'+(x.send?' checked':'')+'> Send instantly (untick to put it in the box to finish typing)</label><div class="row"><button class="btn sm soft" type="button" data-mv="'+i+'" data-d="-1">↑</button><button class="btn sm soft" type="button" data-mv="'+i+'" data-d="1">↓</button><button class="btn sm del" type="button" data-rm="'+i+'">Remove</button></div></div></div>').join('')}
  draw();
  m.addEventListener('input',e=>{const t=e.target;if(t.dataset.k){L[+t.dataset.i][t.dataset.k]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.k==='icon')draw()}});
  m.addEventListener('change',e=>{const t=e.target;if(t.dataset.k){L[+t.dataset.i][t.dataset.k]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.k==='icon')draw()}});
  m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.rm!=null){L.splice(+b.dataset.rm,1);draw()}
    if(b.dataset.mv!=null){const i=+b.dataset.mv,j=i+(+b.dataset.d);if(j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];draw()}}
    if(b.id==='qa'){L.push({icon:'chat',label:'New reply',send:true,en:'',km:''});draw()}
    if(b.id==='qd'){L=JSON.parse(JSON.stringify(DEFAULT_QUICK));draw()}
    if(b.id==='qs'){DB.set('settings/quick',{items:L.filter(x=>x.en||x.km),goodbyeMerged:true,formsMerged:true,updatedAt:TS}).then(()=>{quick=L.filter(x=>x.en||x.km);m.remove();drawQuick();toast('Quick replies saved')}).catch(e=>toast('Not saved: '+(e.code||e.message)))}});
}

/* ---------- misc ---------- */
function toast(t,onClick){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;if(onClick)d.onclick=()=>{onClick();d.remove()};document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}
function copy(v){try{navigator.clipboard.writeText(v).then(()=>toast('Copied'),()=>toast(v))}catch(e){toast(v)}}
</script>
</body>
