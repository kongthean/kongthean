<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thean · Cambodia Traveler</title>
<meta name="description" content="Thean – a Cambodian travel team sharing scenic routes, temples, travel spots and peaceful places across Cambodia.">
<meta property="og:title" content="Thean · Cambodia Traveler">
<meta property="og:description" content="Scenic routes, temples, travel spots and peaceful places across Cambodia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
<style id="css">
/* Thean — misty stone palette taken from the Facebook cover: fog greys, river blue-grey, embossed white lettering */
:root{
  --bg:#e8eae9; --bg2:#dfe3e2; --surface:#ffffff; --ink:#1c2021; --muted:#5f6767; --line:#cfd4d3;
  --stone:#6f7877; --stone-d:#4c5555; --char:#262b2c; --char-ink:#f6f7f7;
  --accent:#4a6b75; --accent-soft:#dbe5e7; --mist1:#d7dbda; --mist2:#b3bab9; --mist3:#8a9392;
  --ok:#2f9e5f; --danger:#b3362f; --shadow:0 10px 30px rgba(28,32,33,.12);
  --display:'Koulen','Kantumruy Pro',Impact,sans-serif;
  --body:'Kantumruy Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131616; --bg2:#181c1c; --surface:#1d2222; --ink:#e7ebea; --muted:#9ba4a3; --line:#2d3434;
  --stone:#5d6766; --stone-d:#46504f; --char:#e7ebea; --char-ink:#151818;
  --accent:#93b4be; --accent-soft:#223033; --mist1:#2a3131; --mist2:#38403f; --mist3:#4d5756;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131616; --bg2:#181c1c; --surface:#1d2222; --ink:#e7ebea; --muted:#9ba4a3; --line:#2d3434;
  --stone:#5d6766; --stone-d:#46504f; --char:#e7ebea; --char-ink:#151818;
  --accent:#93b4be; --accent-soft:#223033; --mist1:#2a3131; --mist2:#38403f; --mist3:#4d5756;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.emb{font-family:var(--display);font-weight:400;letter-spacing:.04em;line-height:1.1}

/* ===== Header ===== */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--mist1);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line);flex:none}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.12em;line-height:1}
.brand small{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:6px;text-decoration:none;font-size:.9rem;font-weight:500;padding:8px 11px;border-radius:999px;color:var(--muted)}
.nav a:hover{color:var(--ink);background:var(--bg)}
.nav a.on{color:var(--ink);background:var(--bg2)}
@media(max-width:900px){.nav{display:none}}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.nav+.tools{margin-left:0}
@media(max-width:900px){.nav+.tools{margin-left:auto}}
.lang{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;padding:3px 11px;border-radius:999px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--char);color:var(--char-ink)}
.ib{border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;cursor:pointer}

/* ===== Drawer (all pages as icons) ===== */
.drawer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 0 40px}
.drawer .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}

/* ===== Hero ===== */
.hero{position:relative;height:clamp(380px,72vh,640px);overflow:hidden;background:var(--mist3);touch-action:pan-y}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease,transform 7s ease;transform:scale(1.06)}
.slide.on{opacity:1;transform:scale(1)}
.slide .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) grayscale(.35) brightness(.7)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.fit img{object-fit:contain}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,24,25,.15) 0%,rgba(20,24,25,0) 30%,rgba(20,24,25,.72) 100%);pointer-events:none}
.hcap{position:absolute;left:0;right:0;bottom:64px;z-index:3;color:#fff}
.hcap .kick{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.hcap h1{margin:0;font-size:clamp(2rem,6.4vw,4.2rem);max-width:15em;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 24px rgba(0,0,0,.45)}
.hcap .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.dots{position:absolute;left:0;right:0;bottom:24px;z-index:4;display:flex;justify-content:center;gap:8px}
.dots button{width:8px;height:8px;border:0;border-radius:99px;background:rgba(255,255,255,.45);padding:0;cursor:pointer;transition:width .3s}
.dots button.on{width:28px;background:#fff}
.arw{position:absolute;top:50%;z-index:4;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(20,24,25,.25);color:#fff;font-size:1.2rem;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.arw.l{left:14px}.arw.r{right:14px}
@media(max-width:600px){.arw{display:none}}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;background:var(--char);color:var(--char-ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.light{background:#fff;color:#1c2021}
.btn.soft{background:var(--bg2);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn.del{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

/* ===== Notice ===== */
.notice{background:var(--char);color:var(--char-ink);font-size:.9rem}
.notice .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.notice span{flex:1;min-width:14rem}
.notice a{font-weight:600;text-underline-offset:3px}

/* ===== Sections ===== */
section{padding-block:56px 8px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.kick{font-size:.76rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h2{margin:2px 0 0;font-size:clamp(1.8rem,4.4vw,2.6rem);text-wrap:balance}
.lead{color:var(--muted);max-width:40rem;margin:6px 0 0}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--accent)}

/* ===== HD photos / online library ===== */
.slide .sart,.slide .sart svg{position:absolute;inset:0;width:100%;height:100%}
.ev .evimg{width:100%;max-width:560px;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin:8px 0 6px;display:block}
.pcredit{font-size:.74rem;color:var(--muted);margin-top:8px}.pcredit a{color:inherit}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:56vh;overflow:auto;min-width:0}
@media(max-width:520px){.ogrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
[data-osr] input{min-width:0}
.ogrid button{position:relative;display:block;width:100%;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--bg2);aspect-ratio:4/3;cursor:pointer;min-width:0}
.ogrid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ogrid small{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:.66rem;padding:10px 6px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ogrid i{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-style:normal;font-size:.7rem;padding:2px 6px;border-radius:6px}
.autobox{padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--card,#fff)),var(--card,#fff));border:1px solid var(--line);margin:0 0 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.autobox b{display:block}.autobox>div{flex:1 1 220px}
/* ===== Icon tiles ===== */
.notice .nl{display:flex;gap:14px;flex:none;min-width:0}
.tslide{position:relative}
.tiles.row{display:flex;grid-template-columns:none;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:8px 2px 12px;scroll-behavior:smooth}
.tiles.row::-webkit-scrollbar{display:none}
.tiles.row .tile{flex:0 0 calc((100% - 12px)/3.3);scroll-snap-align:start}
@media(min-width:700px){.tiles.row .tile{flex-basis:132px}}
.tbar{height:3px;border-radius:3px;background:color-mix(in srgb,var(--ink) 12%,transparent);margin:4px auto 0;max-width:140px;position:relative;overflow:hidden}
.tbar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:var(--ink);transition:left .25s,width .25s}
.tarw{position:absolute;top:38px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card,#fff);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.18);display:none;place-items:center;cursor:pointer;z-index:2}
.tarw.l{left:-8px}.tarw.r{right:-8px}
@media(hover:hover) and (min-width:700px){.tarw{display:grid}}
.sbar{margin:26px 0 0;padding:16px;border-radius:20px;background:var(--bg2);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sbar>b{font-size:.95rem;flex:1 1 160px}
.sbar .sic{display:flex;gap:10px;flex-wrap:wrap}
.sbar a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.3rem;text-decoration:none;box-shadow:0 4px 10px rgba(0,0,0,.15);transition:transform .15s}
.sbar a:active,.sbar a:hover{transform:translateY(-2px) scale(1.05)}
.ic.b-facebook,footer .soc a.facebook{background:#1877F2!important;color:#fff!important;border:0!important}
.ic.b-messenger,footer .soc a.messenger{background:linear-gradient(45deg,#0a7cff,#a033ff,#ff5c87)!important;color:#fff!important;border:0!important}
.ic.b-telegram,footer .soc a.telegram{background:#27A7E7!important;color:#fff!important;border:0!important}
.ic.b-tiktok,footer .soc a.tiktok{background:#111!important;color:#fff!important;border:0!important}
.ic.b-youtube,footer .soc a.youtube{background:#FF0000!important;color:#fff!important;border:0!important}
.ic.b-instagram,footer .soc a.instagram{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)!important;color:#fff!important;border:0!important}
.drawer .sbar{margin-top:30px}
.sbar a.facebook{background:#1877F2}.sbar a.messenger{background:linear-gradient(45deg,#0a7cff,#a033ff,#ff5c87)}
.sbar a.telegram{background:#27A7E7}.sbar a.tiktok{background:#111}.sbar a.youtube{background:#FF0000}
.sbar a.instagram{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.sbar a.tiktok svg{filter:drop-shadow(1.5px 1px 0 #ff0050) drop-shadow(-1px -1px 0 #00f2ea)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:22px 12px}
@media(max-width:420px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;color:var(--ink);text-align:center;min-width:0}
.tile .ic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:2rem;color:#fff;
  background:linear-gradient(155deg,var(--stone) 0%,var(--stone-d) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 14px rgba(40,46,47,.22);transition:transform .2s,box-shadow .2s}
.tile .ic svg{filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.tile:hover .ic{transform:translateY(-4px) rotate(-2deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 22px rgba(40,46,47,.28)}
.tile b{font-size:.88rem;font-weight:600;line-height:1.25}
.tile small{font-size:.74rem;color:var(--muted);line-height:1.3;margin-top:-6px}

/* ===== Stats ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:48px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);padding:18px 16px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}

/* ===== Cards ===== */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,300px);gap:16px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.grid.g6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:760px){.grid.g6{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.g6 .tx p{display:none}.grid.g6 .tx h3{font-size:.95rem}.grid.g6 .badge{font-size:.66rem}}
.navback{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--bg2);color:var(--ink);text-decoration:none;font-size:1.15rem;flex:none;margin-right:4px}
.navback:hover{background:var(--stone);color:#fff}
.tools .navback{display:none}
@media(max-width:900px){.tools .navback{display:grid}}
@media(max-width:480px){.top .wrap{gap:8px}.tools{gap:6px}.tools .navback{width:34px;height:34px;margin-right:0}.top .wrap:has(.tools .navback) .brand small{display:none}}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:0 1px 0 var(--line);border:1px solid var(--line);transition:transform .2s,box-shadow .2s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .ph{aspect-ratio:4/3;max-width:100%;overflow:hidden;position:relative;background:var(--mist1)}
.card .ph>img,.card .ph>svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:hover .ph>img{transform:scale(1.05)}
.badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:#1c2021;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:99px;display:flex;align-items:center;gap:5px}
.card .tx{padding:14px 16px 16px;display:grid;gap:4px}
.card h3{margin:0;font-size:1.12rem;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}
.edbtn{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:var(--char);color:var(--char-ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}

/* ===== Seasons ===== */
.season{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;overflow-x:auto}
.months{display:grid;grid-template-columns:repeat(12,minmax(44px,1fr));gap:4px;min-width:560px}
.mo{border-radius:10px;padding:10px 4px;text-align:center;font-size:.78rem;font-weight:600}
.mo small{display:block;font-weight:400;font-size:.68rem;opacity:.8}
.mo.cool{background:var(--accent-soft);color:var(--accent)}
.mo.hot{background:#f1e2cf;color:#8a5a1c}
.mo.wet{background:#d9e6dc;color:#2f6a45}
:root[data-theme="dark"] .mo.hot{background:#3a2e20;color:#e6bf86}
:root[data-theme="dark"] .mo.wet{background:#1f3326;color:#8fd0a5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mo.hot{background:#3a2e20;color:#e6bf86}:root:not([data-theme="light"]) .mo.wet{background:#1f3326;color:#8fd0a5}}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:.86rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* ===== Feature (video / banner) ===== */
.feature{position:relative;display:grid;grid-template-columns:1.3fr 1fr;background:var(--char);color:var(--char-ink);border-radius:22px;overflow:hidden;text-decoration:none}
@media(max-width:760px){.feature{grid-template-columns:1fr}}
.feature .ph{position:relative;min-height:260px;background:var(--stone-d)}
.feature .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.92);color:#1c2021;display:grid;place-items:center;font-size:1.9rem;box-shadow:0 0 0 10px rgba(255,255,255,.18);transition:transform .2s}
a:hover .play{transform:translate(-50%,-50%) scale(1.08)}
.feature .tx{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.feature .tx p{margin:0;opacity:.82;white-space:pre-line}
.feature .kick{color:inherit;opacity:.7}

/* ===== Tribute ===== */
.tribute{border-left:3px solid var(--stone);padding:4px 0 4px 20px;display:grid;gap:12px;max-width:48rem}
.tribute p{margin:0;white-space:pre-line}
.tribute .km{font-size:1.1rem;line-height:1.95}
.tribute .en{color:var(--muted)}

/* ===== Map chips ===== */
.mapwrap{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;align-items:start}
@media(max-width:760px){.mapwrap{grid-template-columns:1fr}}
.mapimg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:relative}
.mapimg img{display:block;width:100%;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-size:.85rem}
.chip:hover{border-color:var(--stone)}
.chip svg{color:var(--accent)}
.chip.on{background:var(--char);color:var(--char-ink);border-color:var(--char)}

/* ===== CTA band ===== */
.band{margin-top:56px;background:linear-gradient(135deg,var(--stone-d),var(--stone));color:#fff;border-radius:22px;padding:34px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.band h3{margin:0;font-size:clamp(1.5rem,3.6vw,2.2rem)}
.band p{margin:4px 0 0;opacity:.85}

/* ===== Page banner ===== */
.pbanner{position:relative;min-height:300px;display:flex;align-items:flex-end;overflow:hidden;color:#fff;background:var(--stone-d)}
.pbanner>img,.pbanner>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,24,25,.1),rgba(20,24,25,.72))}
.pbanner .wrap{position:relative;z-index:2;width:100%;padding-block:30px}
.crumb{display:flex;gap:6px;align-items:center;font-size:.84rem;opacity:.85;margin-bottom:10px}

.pbanner .pic{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:1.7rem;margin-bottom:12px;border:1px solid rgba(255,255,255,.3)}
.intro{font-size:1.08rem;max-width:44rem;margin:0;white-space:pre-line}
.subnav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.subnav a{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-size:.86rem;font-weight:500}

/* ===== Detail ===== */
.detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;align-items:start}

.facts{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:sticky;top:84px}
.fact{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact .fi{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.1rem}
.fact b{display:block;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.tipbox{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:flex;gap:12px;margin:8px 0 18px}
.tipbox svg{font-size:1.4rem;color:var(--accent);margin-top:3px}

/* ===== Timeline ===== */
.tl{display:grid;gap:0;position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line)}
.ev{position:relative;padding:0 0 26px}
.ev::before{content:"";position:absolute;left:-25px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--stone)}
.ev .when{font-size:.8rem;font-weight:600;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.ev h3{margin:2px 0 4px;font-size:1.15rem}
.ev p{margin:0;color:var(--muted);white-space:pre-line}

/* ===== Accordion ===== */
.acc{display:grid;gap:10px}
.acc details{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.acc summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px;font-weight:600}
.acc summary::-webkit-details-marker{display:none}
.acc summary .n{width:34px;height:34px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-size:1.05rem;flex:none}
.acc summary::after{content:"+";margin-left:auto;font-size:1.3rem;color:var(--muted);transition:transform .2s}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc .body{padding:0 18px 18px 64px;color:var(--muted);white-space:pre-line}
.acc .edbtn{top:10px;right:46px;width:32px;height:32px}

/* ===== Lists / posts ===== */
.posts{display:grid;gap:16px}
.post{display:grid;grid-template-columns:200px 1fr;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:30px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* ===== Contact / forms ===== */

.ccard{display:flex;gap:12px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);cursor:pointer;text-align:left;width:100%;min-width:0}

.ccard b{display:block;line-height:1.3}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;max-width:640px}

/* ===== Chat ===== */
.chatbtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;height:58px;padding:0 20px 0 16px;border-radius:99px;border:0;background:var(--char);color:var(--char-ink);display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.3)}

.tc-badge{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:#d6453a;color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
@media(max-width:520px){.tc-fab .lbl{display:none}.tc-fab{width:58px;padding:0;justify-content:center}.tc-fab .live{position:absolute;top:6px;right:6px;border:2px solid var(--char)}}
.tc-peek{position:absolute;right:0;bottom:70px;width:min(300px,calc(100vw - 36px));background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;animation:up .25s ease;font-size:.92rem}
.tc-peek b{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.tc-panel{position:absolute;right:0;bottom:72px;width:min(380px,calc(100vw - 36px));height:min(600px,calc(100dvh - 120px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.32);display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease}
@media(max-width:520px){.tc-panel{position:fixed;inset:auto 0 0 0;width:100%;height:calc(100dvh - 60px);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.tc-head{background:linear-gradient(135deg,var(--stone-d),var(--stone));color:#fff;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;flex:none}
.tc-head .logo{width:42px;height:42px;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.tc-head .who{flex:1;min-width:0}
.tc-head b{display:block;line-height:1.25}
.tc-head small{display:flex;align-items:center;gap:6px;opacity:.9;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-dot{width:8px;height:8px;border-radius:50%;background:#3ccf76;flex:none}
.tc-dot.wait{background:#f0b44c;animation:ping 1.4s infinite}
.tc-dot.bot{background:#9fd3ff}
.tc-x{border:0;background:rgba(255,255,255,.16);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;cursor:pointer;flex:none}
.tc-live{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 12px 0;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--stone);background:var(--bg);color:var(--ink);font-weight:600;font-size:.88rem;cursor:pointer;flex:none}
.tc-live svg{font-size:1.15rem}
.tc-live:hover{border-style:solid}
.tc-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.tc-m{max-width:84%;padding:9px 13px;border-radius:16px;font-size:.92rem;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.tc-m.in{align-self:flex-start;background:var(--bg2);border-bottom-left-radius:4px}
.tc-m.out{align-self:flex-end;background:var(--char);color:var(--char-ink);border-bottom-right-radius:4px}
.tc-m .by{display:block;font-size:.72rem;font-weight:600;opacity:.65;margin-bottom:2px}
.tc-m .lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tc-m .lk a{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--accent)}
.tc-m time{display:block;font-size:.66rem;opacity:.5;margin-top:3px;text-align:right}
.tc-sys{align-self:center;text-align:center;font-size:.78rem;color:var(--muted);background:var(--bg);border-radius:14px;padding:6px 12px;max-width:92%}
@media(max-width:520px){#tc.is-open .tc-fab{display:none}}
.tc-typing{align-self:flex-start;background:var(--bg2);border-radius:16px;padding:12px 14px;display:flex;gap:4px}
.tc-typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tcb 1s infinite}
.tc-typing i:nth-child(2){animation-delay:.15s}.tc-typing i:nth-child(3){animation-delay:.3s}
@keyframes tcb{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.tc-form{align-self:stretch;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.tc-form b{font-size:.9rem}
.tc-form input{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);color:var(--ink);width:100%}
.tc-chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;flex:none;scrollbar-width:none}
.tc-chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.tc-chips button:hover{border-color:var(--stone)}
.tc-foot{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);flex:none;align-items:flex-end}
.tc-foot textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:18px;padding:10px 14px;background:var(--bg);color:var(--ink);max-height:110px;min-height:42px;line-height:1.4;font:inherit;font-size:.95rem}
.tc-send{width:42px;height:42px;border-radius:50%;border:0;background:var(--char);color:var(--char-ink);display:grid;place-items:center;font-size:1.15rem;cursor:pointer;flex:none}
.tc-send:disabled{opacity:.4}
.tc-alt{display:grid;gap:6px;margin-top:8px}
.tc-btns{display:grid;gap:6px;margin-top:10px}
.tc-btns button{border:0;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.88rem;cursor:pointer;box-shadow:0 1px 0 var(--line);font-family:inherit}
.tc-btns button:hover{background:var(--bg)}
.tc-btns button.old{opacity:.7}
.tc-btns button:disabled{opacity:.5}
.tc-alt a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

ou want to join the next one.", "km": "ការធ្វើដំណើរកាន់តែមានន័យ នៅពេលវាផ្ដល់អ្វីមួយត្រឡប់ទៅវិញ។ នៅទីនេះ យើងចែករំលែកដំណើរសហគមន៍ ការសម្អាតបរិស្ថាន និងការទៅលេងសាលារៀន និងវត្តអារាមក្នុងតំបន់។ សូមផ្ញើសារមកយើង ប្រសិនបើអ្នកចង់ចូលរួមលើកក្រោយ។"}, "img": "", "q": "Cambodian pagoda"}, {"id": "donate", "icon": "donate", "kind": "donate", "art": "river", "label": {"en": "Donation", "km": "ការបរិច្ចាគ"}, "hint": {"en": "Support the work", "km": "គាំទ្រការងារ"}, "intro": {"en": "Your support helps our team keep travelling, filming and helping the communities we meet along the way.", "km": "ការគាំទ្ររបស់អ្នក ជួយឱ្យក្រុមយើងបន្តធ្វើដំណើរ ថតវីដេអូ និងជួយសហគមន៍ដែលយើងបានជួបតាមផ្លូវ។"}, "img": "", "q": "Cambodian monks"}, {"id": "news", "icon": "bell", "kind": "posts", "list": "news", "art": "river", "label": {"en": "Notification", "km": "ដំណឹង"}, "hint": {"en": "News & updates", "km": "ព័ត៌មានថ្មីៗ"}, "intro": {"en": "New trips, new videos and announcements.", "km": "ដំណើរថ្មី វីដេអូថ្មី និងសេចក្ដីជូនដំណឹង។"}, "img": "", "q": "Phnom Penh night"}, {"id": "contact", "icon": "mail", "kind": "contact", "art": "river", "label": {"en": "Contact", "km": "ទំនាក់ទំនង"}, "hint": {"en": "Reach us", "km": "ទាក់ទងយើង"}, "intro": {"en": "For collaborations, hotel or tour features, or just a travel question, our team reads every message.", "km": "សម្រាប់ការសហការ ការផ្សព្វផ្សាយសណ្ឋាគារ ឬដំណើរកម្សាន្ត ឬសំណួរអំពីការធ្វើដំណើរ ក្រុមយើងអានរាល់សារទាំងអស់។"}, "img": "", "q": "Phnom Penh riverside"}, {"id": "feedback", "icon": "thumb", "kind": "feedback", "art": "hills", "label": {"en": "Feedback", "km": "មតិយោបល់"}, "hint": {"en": "Tell us what you think", "km": "ប្រាប់យើងពីគំនិតអ្នក"}, "intro": {"en": "Tell us what you liked, what you want to see next, or a place we should visit. Your ideas shape the next trip.", "km": "ប្រាប់យើងពីអ្វីដែលអ្នកចូលចិត្ត អ្វីដែលអ្នកចង់ឃើញបន្ទាប់ ឬកន្លែងដែលយើងគួរទៅ។ គំនិតរបស់អ្នក នឹងកំណត់ដំណើរលើកក្រោយ។"}, "img": "", "q": "Cambodia rice field"}, {"id": "about", "icon": "user", "kind": "about", "art": "hills", "label": {"en": "About us", "km": "អំពីយើង"}, "hint": {"en": "Who we are", "km": "យើងជានរណា"}, "intro": {"en": "Cambodia traveler and digital creator.", "km": "អ្នកដំណើរកម្ពុជា និងអ្នកបង្កើតមាតិកាឌីជីថល។"}, "img": "", "q": "Cambodia sugar palm sunset"}], "places": [{"id": "khmer-origins", "cat": "temple", "title": {"en": "How Cambodia Was Born", "km": "កំណើតនៃប្រទេសកម្ពុជា"}, "region": {"en": "Cambodia", "km": "កម្ពុជា"}, "sum": {"en": "From the legend of Preah Thong and Neang Neak to the founding of the Khmer Empire in 802.", "km": "ពីរឿងព្រេងព្រះថោង នាងនាគ រហូតដល់ការបង្កើតអាណាចក្រខ្មែរ នៅឆ្នាំ ៨០២។"}, "body": {"en": "Khmer legend says the nation began when Preah Thong, a prince from across the sea, married Neang Neak, daughter of the Naga king. The Naga drank the waters that covered the land and gave it to the couple as a wedding gift: the kingdom of Kambuja.\n\nHistory tells a similar story. From the 1st century, the trading kingdom of Funan grew rich along the Mekong. In the 6th and 7th centuries, the kingdom of Chenla built the brick temples of Sambor Prei Kuk. Then in 802, King Jayavarman II declared independence and was crowned universal monarch on the sacred mountain of Phnom Kulen. That ceremony is seen as the birth of the Khmer Empire, which ruled from Angkor for more than 600 years.", "km": "រឿងព្រេងខ្មែរនិទានថា ជាតិខ្មែរកើតឡើង នៅពេលព្រះថោង ជាព្រះរាជបុត្រមកពីត្រើយសមុទ្រ បានរៀបអភិសេកជាមួយនាងនាគ ជាបុត្រីស្ដេចនាគ។ ស្ដេចនាគបានស្រូបទឹកដែលលិចដីទាំងអស់ ហើយប្រគល់ដីនោះជាជំនូនអាពាហ៍ពិពាហ៍៖ គឺនគរកម្ពុជា។\n\nប្រវត្តិសាស្ត្រក៏និទានស្រដៀងគ្នា។ ចាប់ពីសតវត្សទី១ នគរហ្វូណនដែលរកស៊ីពាណិជ្ជកម្ម បានរីកចម្រើននៅតាមទន្លេមេគង្គ។ នៅសតវត្សទី៦ និងទី៧ នគរចេនឡាបានសាងប្រាសាទឥដ្ឋនៅសំបូរព្រៃគុក។ បន្ទាប់មក នៅឆ្នាំ ៨០២ ព្រះបាទជ័យវរ្ម័នទី២ បានប្រកាសឯករាជ្យ និងឡើងគ្រងរាជ្យជាចក្រពត្តិ នៅលើភ្នំគូលែនដ៏ពិសិដ្ឋ។ ពិធីនោះ ត្រូវបានចាត់ទុកថាជាកំណើតនៃអាណាចក្រខ្មែរ ដែលគ្រងរាជ្យពីអង្គរ អស់រយៈពេលជាង ៦០០ ឆ្នាំ។"}, "best": {"en": "Any time; Phnom Kulen is greenest in the rainy season", "km": "គ្រប់ពេល។ ភ្នំគូលែនខៀវស្រងាត់បំផុតនៅរដូវវស្សា"}, "getting": {"en": "Follow the story at the National Museum (Phnom Penh), Sambor Prei Kuk (Kampong Thom) and Phnom Kulen (Siem Reap).", "km": "តាមដានរឿងនេះ នៅសារមន្ទីរជាតិ (ភ្នំពេញ) សំបូរព្រៃគុក (កំពង់ធំ) និងភ្នំគូលែន (សៀមរាប)។"}, "tip": {"en": "At a Khmer wedding, the groom holds the bride's scarf as they walk: it recalls Preah Thong holding Neang Neak's tail as she led him to the Naga kingdom.", "km": "នៅក្នុងពិធីរៀបការខ្មែរ កូនកំលោះកាន់ស្បៃកូនក្រមុំ ពេលដើរ៖ វារំលឹកដល់ព្រះថោងតោងកន្ទុយនាងនាគ ពេលនាងនាំព្រះអង្គចូលទៅនគរនាគ។"}, "art": "temple", "built": {"en": "Legend & history · 1st–9th century", "km": "រឿងព្រេង និងប្រវត្តិ · សតវត្សទី១–៩"}, "img": "", "featured": false, "mapq": "Phnom Kulen National Park", "link": "", "q": "Sambor Prei Kuk", "story": true}, {"id": "building-angkor-wat", "cat": "temple", "title": {"en": "How Angkor Wat Was Built", "km": "របៀបកសាងប្រាសាទអង្គរវត្ត"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "Millions of sandstone blocks, carried by canal and fitted without mortar, in about 30 years.", "km": "ថ្មភក់រាប់លានដុំ ដឹកតាមប្រឡាយ ហើយតម្រៀបដោយគ្មានបាយអ ក្នុងរយៈពេលប្រហែល ៣០ ឆ្នាំ។"}, "body": {"en": "King Suryavarman II began Angkor Wat in the early 12th century, and it took around three decades to complete. The sandstone was cut at quarries near Phnom Kulen, about 40 km away, and floated on rafts along a network of canals. Inside, a core of laterite supports the carved sandstone skin.\n\nThe blocks were fitted together without mortar, and you can still see small holes in many stones, used for pegs when lifting them into place. Thousands of workers, artisans and elephants shaped a temple that is a model of the universe: the central tower is Mount Meru, home of the gods, and the moat is the cosmic ocean.", "km": "ព្រះបាទសូរ្យវរ្ម័នទី២ បានចាប់ផ្ដើមកសាងប្រាសាទអង្គរវត្ត នៅដើមសតវត្សទី១២ ហើយចំណាយពេលប្រហែលបីទសវត្ស ទើបរួចរាល់។ ថ្មភក់ត្រូវបានកាប់នៅកន្លែងយកថ្ម ក្បែរភ្នំគូលែន ចម្ងាយប្រហែល ៤០ គីឡូម៉ែត្រ ហើយបណ្ដែតលើក្បូនតាមបណ្ដាញប្រឡាយ។ នៅខាងក្នុង ស្នូលថ្មបាយក្រៀមទ្រទ្រង់ថ្មភក់ដែលឆ្លាក់នៅខាងក្រៅ។\n\nដុំថ្មត្រូវបានតម្រៀបចូលគ្នាដោយគ្មានបាយអ ហើយអ្នកនៅតែអាចឃើញរន្ធតូចៗលើថ្មជាច្រើន ដែលប្រើសម្រាប់ដោតឈើ ពេលលើកវាដាក់។ កម្មករ សិប្បករ និងដំរីរាប់ពាន់ បានកសាងប្រាសាទ ដែលជាគំរូនៃសកលលោក៖ ប្រាង្គកណ្ដាលគឺភ្នំព្រះសុមេរុ ជាលំនៅនៃទេវតា ហើយគូទឹកគឺមហាសមុទ្រ។"}, "best": {"en": "Sunrise, November to February", "km": "ពេលថ្ងៃរះ ខែវិច្ឆិកា ដល់ខែកុម្ភៈ"}, "getting": {"en": "About 6 km north of Siem Reap town. An Angkor Pass is required.", "km": "ប្រហែល ៦ គីឡូម៉ែត្រ ខាងជើងក្រុងសៀមរាប។ ត្រូវមានសំបុត្រអង្គរ។"}, "tip": {"en": "Look for the small round holes in the stones of the outer walls: they show how the blocks were lifted.", "km": "រកមើលរន្ធមូលតូចៗ លើថ្មនៃជញ្ជាំងខាងក្រៅ៖ វាបង្ហាញពីរបៀបលើកដុំថ្ម។"}, "art": "temple", "built": {"en": "Early 12th century · Suryavarman II", "km": "ដើមសតវត្សទី១២ · ព្រះបាទសូរ្យវរ្ម័នទី២"}, "img": "", "featured": false, "mapq": "Angkor Wat", "link": "", "q": "Angkor Wat aerial", "story": true}, {"id": "angkor-wat", "cat": "temple", "title": {"en": "Angkor Wat", "km": "ប្រាសាទអង្គរវត្ត"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "The soul and identity of the Khmer nation, and the largest religious monument in the world.", "km": "ព្រលឹង និងអត្តសញ្ញាណនៃជាតិខ្មែរ និងជាវិមានសាសនាធំជាងគេបំផុតលើពិភពលោក។"}, "body": {"en": "Built in the early 12th century under King Suryavarman II, Angkor Wat was first dedicated to Vishnu and later became a Buddhist temple. Its five lotus-bud towers appear on Cambodia's flag.\n\nWalk the outer gallery to see the bas-reliefs, including the Churning of the Ocean of Milk, then climb to the upper level for views across the moat.", "km": "ប្រាសាទអង្គរវត្ត ត្រូវបានកសាងឡើងនៅដើមសតវត្សទី១២ ក្នុងរជ្ជកាលព្រះបាទសូរ្យវរ្ម័នទី២។ ដំបូងឡើយ ប្រាសាទនេះឧទ្ទិសដល់ព្រះវិស្ណុ ហើយក្រោយមកក្លាយជាប្រាសាទព្រះពុទ្ធសាសនា។ ប្រាង្គទាំងប្រាំរាងផ្កាឈូករបស់វា មាននៅលើទង់ជាតិកម្ពុជា។\n\nដើរតាមថែវខាងក្រៅ ដើម្បីមើលចម្លាក់លៀន រួមទាំងរឿងកូរសមុទ្រទឹកដោះ បន្ទាប់មកឡើងទៅជាន់ខាងលើ ដើម្បីមើលទេសភាពជុំវិញ។"}, "best": {"en": "Sunrise, November to February", "km": "ពេលថ្ងៃរះ ខែវិច្ឆិកា ដល់ខែកុម្ភៈ"}, "getting": {"en": "About 6 km north of Siem Reap town by tuk-tuk or bicycle. An Angkor Pass is required.", "km": "ប្រហែល ៦ គីឡូម៉ែត្រ ខាងជើងក្រុងសៀមរាប ដោយរ៉ឺម៉ក ឬកង់។ ត្រូវមានសំបុត្រអង្គរ។"}, "tip": {"en": "After sunrise, most people go for breakfast. Stay inside, the galleries are almost empty until about 8 am.", "km": "ក្រោយថ្ងៃរះ មនុស្សភាគច្រើនទៅញ៉ាំអាហារពេលព្រឹក។ ចូរនៅខាងក្នុង ព្រោះថែវស្ទើរតែគ្មានមនុស្សរហូតដល់ម៉ោង ៨ ព្រឹក។"}, "art": "temple", "built": {"en": "Early 12th century · Suryavarman II", "km": "ដើមសតវត្សទី១២ · ព្រះបាទសូរ្យវរ្ម័នទី២"}, "img": "", "featured": true, "mapq": "Angkor Wat, Cambodia", "link": "", "q": "Angkor Wat"}, {"id": "bayon", "cat": "temple", "title": {"en": "Bayon Temple", "km": "ប្រាសាទបាយ័ន"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "A smile that has endured for a thousand years. Over 200 calm stone faces look out from its towers.", "km": "ស្នាមញញឹមដែលគង់វង្សអស់រាប់ពាន់ឆ្នាំ។ មុខថ្មដ៏ស្ងប់ស្ងាត់ជាង ២០០ សម្លឹងចេញពីប្រាង្គរបស់វា។"}, "body": {"en": "The Bayon stands at the exact centre of Angkor Thom, the royal city built by King Jayavarman VII in the late 12th century. Its towers carry giant faces that many believe show the king himself as a compassionate bodhisattva.\n\nThe outer walls are carved with scenes of daily Khmer life: markets, fishing, cock fights and naval battles on the Tonle Sap.", "km": "ប្រាសាទបាយ័ន ស្ថិតនៅចំកណ្ដាលអង្គរធំ ដែលជារាជធានីកសាងដោយព្រះបាទជ័យវរ្ម័នទី៧ នៅចុងសតវត្សទី១២។ ប្រាង្គរបស់វាមានមុខធំៗ ដែលមនុស្សជាច្រើនជឿថា ជាព្រះរូបរបស់ព្រះមហាក្សត្រផ្ទាល់ ក្នុងនាមជាព្រះពោធិសត្វដ៏មេត្តា។\n\nជញ្ជាំងខាងក្រៅ មានចម្លាក់ពីជីវភាពប្រចាំថ្ងៃរបស់ខ្មែរ៖ ផ្សារ ការនេសាទ ការជល់មាន់ និងសង្គ្រាមទ័ពជើងទឹកនៅទន្លេសាប។"}, "best": {"en": "Early morning or late afternoon for soft light on the faces", "km": "ពេលព្រឹកព្រលឹម ឬរសៀល ដើម្បីពន្លឺទន់លើមុខថ្ម"}, "getting": {"en": "In the centre of Angkor Thom, about 1.5 km north of Angkor Wat. Enter through the South Gate.", "km": "នៅចំកណ្ដាលអង្គរធំ ប្រហែល ១,៥ គីឡូម៉ែត្រ ខាងជើងអង្គរវត្ត។ ចូលតាមទ្វារខាងត្បូង។"}, "tip": {"en": "Stop at the South Gate bridge first: the rows of gods and demons holding the naga are worth the photo.", "km": "ឈប់នៅស្ពានទ្វារខាងត្បូងជាមុនសិន៖ ជួរទេវតា និងអសុរកាន់នាគ សមនឹងថតរូប។"}, "art": "temple", "built": {"en": "Late 12th century · Jayavarman VII", "km": "ចុងសតវត្សទី១២ · ព្រះបាទជ័យវរ្ម័នទី៧"}, "img": "", "featured": true, "mapq": "Bayon Temple, Cambodia", "link": "", "q": "Bayon faces"}, {"id": "ta-prohm", "cat": "temple", "title": {"en": "Ta Prohm Temple", "km": "ប្រាសាទតាព្រហ្ម"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "One of the most captivating temples at Angkor, where giant tree roots and stone grow together.", "km": "ប្រាសាទដ៏គួរឱ្យចាប់អារម្មណ៍បំផុតមួយនៅអង្គរ ដែលឫសឈើយក្ស និងថ្មរួមរស់ជាមួយគ្នា។"}, "body": {"en": "Ta Prohm was founded in 1186 by Jayavarman VII as a Buddhist monastery dedicated to his mother. Unlike most of Angkor, it was left largely as it was found, with silk-cotton and strangler fig trees growing through the walls.\n\nThe result is one of the most photographed places in Cambodia, a reminder of how nature slowly takes back what people build.", "km": "ប្រាសាទតាព្រហ្ម ត្រូវបានកសាងឡើងនៅឆ្នាំ ១១៨៦ ដោយព្រះបាទជ័យវរ្ម័នទី៧ ជាវត្តព្រះពុទ្ធសាសនា ឧទ្ទិសដល់ព្រះមាតារបស់ព្រះអង្គ។ ខុសពីប្រាសាទភាគច្រើននៅអង្គរ វាត្រូវបានទុកស្ទើរតែដូចពេលរកឃើញ ដោយមានដើមសំពង់ និងដើមជ្រៃដុះកាត់ជញ្ជាំង។\n\nលទ្ធផលគឺជាកន្លែងមួយដែលគេថតរូបច្រើនបំផុតនៅកម្ពុជា ជាការរំលឹកថាធម្មជាតិបន្តិចម្ដងៗ យកមកវិញនូវអ្វីដែលមនុស្សបានសាងសង់។"}, "best": {"en": "Opening time (7:30 am) before the tour groups", "km": "ម៉ោងបើក (៧:៣០ ព្រឹក) មុនក្រុមទេសចរ"}, "getting": {"en": "About 1 km east of Angkor Thom on the Small Circuit.", "km": "ប្រហែល ១ គីឡូម៉ែត្រ ខាងកើតអង្គរធំ តាមផ្លូវរង្វង់តូច។"}, "tip": {"en": "Enter from the east (back) gate and walk west. You meet the famous trees with fewer people around.", "km": "ចូលតាមទ្វារខាងកើត (ខាងក្រោយ) ហើយដើរទៅខាងលិច។ អ្នកនឹងឃើញដើមឈើល្បីៗ ដោយមានមនុស្សតិច។"}, "art": "temple", "built": {"en": "1186 · Jayavarman VII", "km": "ឆ្នាំ ១១៨៦ · ព្រះបាទជ័យវរ្ម័នទី៧"}, "img": "", "featured": true, "mapq": "Ta Prohm Temple, Cambodia", "link": "", "q": "Ta Prohm tree"}, {"id": "banteay-srei", "cat": "temple", "title": {"en": "Banteay Srei Temple", "km": "ប្រាសាទបន្ទាយស្រី"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "Known as the Jewel of Khmer Art for the fine detail of its pink sandstone carvings.", "km": "ល្បីថាជាត្បូងនៃសិល្បៈខ្មែរ ដោយសារចម្លាក់ដ៏ល្អិតល្អន់លើថ្មភក់ពណ៌ផ្កាឈូក។"}, "body": {"en": "Consecrated in 967, Banteay Srei was built not by a king but by the Brahmin scholar Yajnavaraha. It is small, but every surface is carved: lintels with scenes from the Ramayana, delicate devatas and floral patterns that still look sharp after a thousand years.\n\nThe red sandstone glows in late afternoon sun.", "km": "ប្រាសាទបន្ទាយស្រី ត្រូវបានសម្ពោធនៅឆ្នាំ ៩៦៧ មិនមែនដោយព្រះមហាក្សត្រទេ គឺដោយព្រាហ្មណ៍អ្នកប្រាជ្ញឈ្មោះ យជ្ញវរាហៈ។ វាតូច ប៉ុន្តែគ្រប់ផ្ទៃត្រូវបានឆ្លាក់៖ ផ្ដែរមានរឿងរាមកេរ្តិ៍ ទេវតាដ៏ស្រស់ស្អាត និងក្បាច់ផ្កា ដែលនៅតែច្បាស់ ក្រោយរាប់ពាន់ឆ្នាំ។\n\nថ្មភក់ក្រហមភ្លឺចែងចាំង នៅពេលថ្ងៃរសៀល។"}, "best": {"en": "Late afternoon, or right at opening time", "km": "ពេលរសៀល ឬម៉ោងបើកដំបូង"}, "getting": {"en": "About 35 km northeast of Siem Reap, around 45 minutes by car or tuk-tuk. Included in the Angkor Pass.", "km": "ប្រហែល ៣៥ គីឡូម៉ែត្រ ឦសានក្រុងសៀមរាប ប្រហែល ៤៥ នាទី ដោយរថយន្ត ឬរ៉ឺម៉ក។ រួមក្នុងសំបុត្រអង្គរ។"}, "tip": {"en": "Combine it with Phnom Kulen or the Landmine Museum on the same road.", "km": "ផ្សំជាមួយភ្នំគូលែន ឬសារមន្ទីរមីន នៅលើផ្លូវតែមួយ។"}, "art": "temple", "built": {"en": "967 · Yajnavaraha", "km": "ឆ្នាំ ៩៦៧ · យជ្ញវរាហៈ"}, "img": "", "featured": true, "mapq": "Banteay Srei Temple, Cambodia", "link": "", "q": "Banteay Srei"}, {"id": "preah-vihear", "cat": "temple", "title": {"en": "Preah Vihear Temple", "km": "ប្រាសាទព្រះវិហារ"}, "region": {"en": "Preah Vihear", "km": "ព្រះវិហារ"}, "sum": {"en": "A temple on a cliff edge of the Dangrek Mountains, with views across the northern plains.", "km": "ប្រាសាទនៅលើមាត់ច្រាំងភ្នំដងរែក ដែលអាចមើលឃើញវាលទំនាបភាគខាងជើង។"}, "body": {"en": "Built mainly in the 11th and 12th centuries and dedicated to Shiva, Preah Vihear climbs the mountain in a series of gopuras for about 800 metres. It became a UNESCO World Heritage Site in 2008.\n\nThe last terrace ends at a cliff more than 500 metres above the plain. On a clear morning you can see for many kilometres.", "km": "ប្រាសាទព្រះវិហារ ត្រូវបានកសាងភាគច្រើននៅសតវត្សទី១១ និងទី១២ ឧទ្ទិសដល់ព្រះឥសូរ។ វាឡើងតាមភ្នំ តាមរយៈគោបុរៈជាបន្តបន្ទាប់ ប្រវែងប្រហែល ៨០០ ម៉ែត្រ។ វាបានក្លាយជាបេតិកភណ្ឌពិភពលោក UNESCO នៅឆ្នាំ ២០០៨។\n\nរាបចុងក្រោយ បញ្ចប់នៅមាត់ច្រាំងថ្មខ្ពស់ជាង ៥០០ ម៉ែត្រពីវាលទំនាប។ នៅព្រឹកមេឃស្រឡះ អ្នកអាចមើលឃើញឆ្ងាយរាប់គីឡូម៉ែត្រ។"}, "best": {"en": "Early morning, dry season", "km": "ពេលព្រឹកព្រលឹម រដូវប្រាំង"}, "getting": {"en": "A long day trip from Siem Reap, or stay overnight in Sra Em town at the foot of the mountain. Local 4x4 rides go up the steep road.", "km": "ដំណើរមួយថ្ងៃពេញពីសៀមរាប ឬស្នាក់នៅមួយយប់នៅក្រុងស្រអែម ជើងភ្នំ។ រថយន្ត 4x4 ក្នុងស្រុកដឹកឡើងផ្លូវចោត។"}, "tip": {"en": "Bring a jacket for the early morning wind at the top.", "km": "យកអាវរងារទៅផង សម្រាប់ខ្យល់ពេលព្រឹកនៅលើកំពូល។"}, "art": "temple", "built": {"en": "11th–12th century", "km": "សតវត្សទី១១–១២"}, "img": "", "featured": false, "mapq": "Preah Vihear Temple, Cambodia", "link": "", "q": "Prasat Preah Vihear"}, {"id": "koh-ker", "cat": "temple", "title": {"en": "Koh Ker", "km": "កោះកេរ្តិ៍"}, "region": {"en": "Preah Vihear", "km": "ព្រះវិហារ"}, "sum": {"en": "A jungle capital with a seven-tiered pyramid, far from the crowds.", "km": "រាជធានីក្នុងព្រៃ ដែលមានប្រាសាទរាងពីរ៉ាមីតប្រាំពីរថ្នាក់ ឆ្ងាយពីហ្វូងមនុស្ស។"}, "body": {"en": "For a short time in the 10th century, King Jayavarman IV ruled the empire from Koh Ker instead of Angkor. The site's main temple, Prasat Thom, is a 36-metre stepped pyramid unlike anything else in Cambodia.\n\nKoh Ker was added to the UNESCO World Heritage List in 2023.", "km": "ក្នុងរយៈពេលខ្លីមួយនៅសតវត្សទី១០ ព្រះបាទជ័យវរ្ម័នទី៤ បានគ្រប់គ្រងអាណាចក្រពីកោះកេរ្តិ៍ ជំនួសអង្គរ។ ប្រាសាទធំ ជាពីរ៉ាមីតមានថ្នាក់កម្ពស់ ៣៦ ម៉ែត្រ ដែលមិនដូចប្រាសាទណាផ្សេងទៀតនៅកម្ពុជាទេ។\n\nកោះកេរ្តិ៍ ត្រូវបានចុះក្នុងបញ្ជីបេតិកភណ្ឌពិភពលោក UNESCO នៅឆ្នាំ ២០២៣។"}, "best": {"en": "Dry season, morning", "km": "រដូវប្រាំង ពេលព្រឹក"}, "getting": {"en": "About 2.5 hours by car from Siem Reap. Often combined with Beng Mealea on the way.", "km": "ប្រហែល ២ ម៉ោងកន្លះ ដោយរថយន្តពីសៀមរាប។ ជារឿយៗផ្សំជាមួយប្រាសាទបឹងមាលា តាមផ្លូវ។"}, "tip": {"en": "Stay on marked paths; this area was cleared of landmines but the forest edges are not for wandering.", "km": "ដើរតែលើផ្លូវដែលមានសញ្ញា។ តំបន់នេះត្រូវបានបោសសម្អាតមីនហើយ ប៉ុន្តែគែមព្រៃមិនមែនសម្រាប់ដើរលេងទេ។"}, "art": "temple", "built": {"en": "10th century · Jayavarman IV", "km": "សតវត្សទី១០ · ព្រះបាទជ័យវរ្ម័នទី៤"}, "img": "", "featured": false, "mapq": "Koh Ker, Cambodia", "link": "", "q": "Prasat Thom Koh Ker"}, {"id": "sambor-prei-kuk", "cat": "temple", "title": {"en": "Sambor Prei Kuk", "km": "សំបូរព្រៃគុក"}, "region": {"en": "Kampong Thom", "km": "កំពង់ធំ"}, "sum": {"en": "Brick towers in the forest, older than Angkor itself.", "km": "ប្រាង្គឥដ្ឋក្នុងព្រៃ ដែលចាស់ជាងអង្គរទៅទៀត។"}, "body": {"en": "Sambor Prei Kuk was Ishanapura, capital of the Chenla kingdom in the 7th century, centuries before Angkor. More than a hundred brick temples stand under the trees, some wrapped in roots, some carved with flying palaces.\n\nIt became a UNESCO World Heritage Site in 2017. Local families run homestays and bicycle rentals near the entrance.", "km": "សំបូរព្រៃគុក គឺជាឦសានបុរៈ រាជធានីនៃអាណាចក្រចេនឡា នៅសតវត្សទី៧ រាប់រយឆ្នាំមុនអង្គរ។ ប្រាសាទឥដ្ឋជាងមួយរយ ឈរនៅក្រោមដើមឈើ ខ្លះត្រូវឫសឈើរុំព័ទ្ធ ខ្លះមានចម្លាក់វិមានហោះ។\n\nវាបានក្លាយជាបេតិកភណ្ឌពិភពលោក UNESCO នៅឆ្នាំ ២០១៧។ គ្រួសារក្នុងតំបន់ ផ្ដល់សេវាស្នាក់នៅតាមផ្ទះ និងជួលកង់ នៅជិតច្រកចូល។"}, "best": {"en": "Morning, any season", "km": "ពេលព្រឹក គ្រប់រដូវ"}, "getting": {"en": "About 30 km north of Kampong Thom town, an easy stop between Phnom Penh and Siem Reap.", "km": "ប្រហែល ៣០ គីឡូម៉ែត្រ ខាងជើងក្រុងកំពង់ធំ ជាកន្លែងឈប់ងាយស្រួល រវាងភ្នំពេញ និងសៀមរាប។"}, "tip": {"en": "Rent a bicycle at the entrance. The three temple groups are spread out in the shade.", "km": "ជួលកង់នៅច្រកចូល។ ក្រុមប្រាសាទទាំងបី នៅរាយប៉ាយក្នុងម្លប់ឈើ។"}, "art": "temple", "built": {"en": "7th century · Chenla kingdom", "km": "សតវត្សទី៧ · អាណាចក្រចេនឡា"}, "img": "", "featured": false, "mapq": "Sambor Prei Kuk, Cambodia", "link": "", "q": "Sambor Prei Kuk"}, {"id": "kampot", "cat": "destination", "title": {"en": "Kampot & Bokor", "km": "កំពត និងបូកគោ"}, "region": {"en": "Kampot", "km": "កំពត"}, "sum": {"en": "A slow riverside town, pepper farms and a cool mountain plateau above the clouds.", "km": "ក្រុងមាត់ទន្លេដ៏ស្ងប់ស្ងាត់ ចម្ការម្រេច និងខ្ពង់រាបភ្នំត្រជាក់លើពពក។"}, "body": {"en": "Kampot is where our team goes to slow down. Old shophouses line the Praek Tuek Chhu river, and sunset boat trips drift past fishing boats heading out.\n\nKampot pepper is grown on family farms outside town and carries protected geographical status. Up the road, Bokor Mountain in Preah Monivong National Park rises above 1,000 metres, with an old French hill station, waterfalls and cool air.", "km": "កំពត គឺជាកន្លែងដែលក្រុមយើងទៅដើម្បីសម្រាក។ ផ្ទះល្វែងចាស់ៗ តម្រៀបតាមមាត់ទន្លេព្រែកទឹកឈូ ហើយទូកពេលថ្ងៃលិច ធ្វើដំណើរកាត់ទូកនេសាទដែលចេញទៅសមុទ្រ។\n\nម្រេចកំពត ដាំនៅចម្ការគ្រួសារក្រៅក្រុង ហើយមានស្ថានភាពភូមិសាស្ត្រការពារ។ ឡើងទៅលើ ភ្នំបូកគោក្នុងឧទ្យានជាតិព្រះមុនីវង្ស ខ្ពស់ជាង ១០០០ ម៉ែត្រ មានអគារចាស់សម័យបារាំង ទឹកធ្លាក់ និងខ្យល់ត្រជាក់។"}, "best": {"en": "November to April; pepper harvest is roughly February to May", "km": "ខែវិច្ឆិកា ដល់ខែមេសា។ ការប្រមូលផលម្រេច ប្រហែលខែកុម្ភៈ ដល់ឧសភា"}, "getting": {"en": "About 3 hours by road from Phnom Penh. Rent a scooter or tuk-tuk for Bokor and the farms.", "km": "ប្រហែល ៣ ម៉ោង តាមផ្លូវគោកពីភ្នំពេញ។ ជួលម៉ូតូ ឬរ៉ឺម៉ក ដើម្បីទៅបូកគោ និងចម្ការ។"}, "tip": {"en": "Go up Bokor early: by midday clouds often roll in and hide the view.", "km": "ឡើងបូកគោឱ្យបានព្រឹក៖ ដល់ថ្ងៃត្រង់ ពពកច្រើនតែមកបាំងទេសភាព។"}, "art": "river", "built": {"en": "", "km": ""}, "img": "", "featured": true, "mapq": "Kampot, Cambodia", "link": "", "q": "Kampot river"}, {"id": "kep", "cat": "destination", "title": {"en": "Kep", "km": "កែប"}, "region": {"en": "Kep", "km": "កែប"}, "sum": {"en": "Fresh crab by the sea, quiet forest trails and a short boat ride to Rabbit Island.", "km": "ក្ដាមស្រស់មាត់សមុទ្រ ផ្លូវដើរក្នុងព្រៃស្ងប់ស្ងាត់ និងការជិះទូកខ្លីទៅកោះទន្សាយ។"}, "body": {"en": "Kep was a seaside escape in the 1960s, and you can still see modernist villas in the trees. Today people come for the crab market, where crabs are pulled from bamboo traps in the sea and cooked with fresh Kampot green pepper.\n\nKep National Park has an easy walking loop with sea views, and boats leave for Koh Tonsay (Rabbit Island) in the morning.", "km": "កែប ធ្លាប់ជាកន្លែងកម្សាន្តមាត់សមុទ្រនៅទសវត្សរ៍ ១៩៦០ ហើយអ្នកនៅតែអាចឃើញវីឡាបែបទំនើបក្នុងចំណោមដើមឈើ។ សព្វថ្ងៃ មនុស្សមកផ្សារក្ដាម ដែលក្ដាមត្រូវបានដកចេញពីលបឫស្សីក្នុងសមុទ្រ ហើយឆាជាមួយម្រេចខ្ចីកំពត។\n\nឧទ្យានជាតិកែប មានផ្លូវដើរងាយស្រួល មើលឃើញសមុទ្រ ហើយទូកចេញទៅកោះទន្សាយនៅពេលព្រឹក។"}, "best": {"en": "November to May", "km": "ខែវិច្ឆិកា ដល់ខែឧសភា"}, "getting": {"en": "About 30 minutes from Kampot, or 3.5 hours from Phnom Penh.", "km": "ប្រហែល ៣០ នាទីពីកំពត ឬ ៣ ម៉ោងកន្លះពីភ្នំពេញ។"}, "tip": {"en": "Order crab with green pepper at the market stalls and eat at sunset over the water.", "km": "កុម្ម៉ង់ក្ដាមឆាម្រេចខ្ចី នៅតូបផ្សារ ហើយញ៉ាំពេលថ្ងៃលិចលើទឹក។"}, "art": "sea", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Kep, Cambodia", "link": "", "q": "Kep Cambodia"}, {"id": "koh-rong", "cat": "destination", "title": {"en": "Koh Rong & Koh Rong Samloem", "km": "កោះរ៉ុង និងកោះរ៉ុងសន្លឹម"}, "region": {"en": "Preah Sihanouk", "km": "ព្រះសីហនុ"}, "sum": {"en": "White sand, clear water and glowing plankton at night.", "km": "ខ្សាច់ស ទឹកថ្លា និងផ្លង់តុងភ្លឺនៅពេលយប់។"}, "body": {"en": "Cambodia's best-known islands sit off the coast of Sihanouk Province. Koh Rong has long beaches and jungle trails; its smaller sister, Koh Rong Samloem, is quieter, with Saracen Bay and Lazy Beach.\n\nOn dark nights, swim off the beach and watch the bioluminescent plankton light up around your hands.", "km": "កោះល្បីៗបំផុតរបស់កម្ពុជា ស្ថិតនៅក្បែរឆ្នេរខេត្តព្រះសីហនុ។ កោះរ៉ុង មានឆ្នេរវែងៗ និងផ្លូវដើរក្នុងព្រៃ។ កោះរ៉ុងសន្លឹមដែលតូចជាង ស្ងប់ស្ងាត់ជាង មានឆ្នេរសារ៉ាសេន និងឆ្នេរឡាស៊ី។\n\nនៅយប់ងងឹត ហែលទឹកពីឆ្នេរ ហើយមើលផ្លង់តុងភ្លឺ នៅជុំវិញដៃរបស់អ្នក។"}, "best": {"en": "November to April, calm seas", "km": "ខែវិច្ឆិកា ដល់ខែមេសា សមុទ្រស្ងប់"}, "getting": {"en": "Speed ferry from Sihanoukville, around 45 to 60 minutes.", "km": "ទូកល្បឿនលឿនពីក្រុងព្រះសីហនុ ប្រហែល ៤៥ ទៅ ៦០ នាទី។"}, "tip": {"en": "Bring cash. ATMs on the islands are few and not always working.", "km": "យកលុយសុទ្ធទៅផង។ ម៉ាស៊ីន ATM នៅលើកោះមានតិច ហើយមិនតែងតែដំណើរការទេ។"}, "art": "sea", "built": {"en": "", "km": ""}, "img": "", "featured": true, "mapq": "Koh Rong & Koh Rong Samloem, Cambodia", "link": "", "q": "Koh Rong beach"}, {"id": "mondulkiri", "cat": "destination", "title": {"en": "Mondulkiri", "km": "មណ្ឌលគិរី"}, "region": {"en": "Mondulkiri", "km": "មណ្ឌលគិរី"}, "sum": {"en": "Rolling green hills, waterfalls and cool air in the eastern highlands.", "km": "ភ្នំពណ៌បៃតងរលកៗ ទឹកធ្លាក់ និងខ្យល់ត្រជាក់ នៅតំបន់ខ្ពង់រាបភាគខាងកើត។"}, "body": {"en": "Mondulkiri feels like a different country: grassy hills, pine trees and morning fog. It is home to the Bunong people, whose villages and coffee farms surround the provincial town of Sen Monorom.\n\nBou Sra waterfall is one of the biggest in Cambodia, and the Sea Forest viewpoint looks over waves of green hills to the horizon.", "km": "មណ្ឌលគិរី មានអារម្មណ៍ដូចជាប្រទេសផ្សេង៖ ភ្នំស្មៅ ដើមស្រល់ និងអ័ព្ទពេលព្រឹក។ វាជាលំនៅរបស់ជនជាតិព្នង ដែលភូមិ និងចម្ការកាហ្វេរបស់ពួកគេ នៅជុំវិញក្រុងសែនមនោរម្យ។\n\nទឹកធ្លាក់ប៊ូស្រា ជាទឹកធ្លាក់ធំជាងគេមួយនៅកម្ពុជា ហើយកន្លែងមើលទេសភាពសមុទ្រព្រៃឈើ មើលឃើញភ្នំពណ៌បៃតងរលកៗ ដល់ជើងមេឃ។"}, "best": {"en": "November to March for clear, cool days", "km": "ខែវិច្ឆិកា ដល់ខែមីនា សម្រាប់ថ្ងៃត្រជាក់ មេឃស្រឡះ"}, "getting": {"en": "About 5 to 6 hours by road from Phnom Penh.", "km": "ប្រហែល ៥ ទៅ ៦ ម៉ោង តាមផ្លូវគោកពីភ្នំពេញ។"}, "tip": {"en": "Pack a warm layer. Nights in Sen Monorom can be surprisingly cold.", "km": "យកអាវកក់ក្ដៅទៅផង។ យប់នៅសែនមនោរម្យ អាចត្រជាក់ខ្លាំង។"}, "art": "hills", "built": {"en": "", "km": ""}, "img": "", "featured": true, "mapq": "Mondulkiri, Cambodia", "link": "", "q": "Mondulkiri"}, {"id": "ratanakiri", "cat": "destination", "title": {"en": "Yeak Laom Lake", "km": "បឹងយក្សឡោម"}, "region": {"en": "Ratanakiri", "km": "រតនគិរី"}, "sum": {"en": "A perfectly round crater lake with clear blue water, surrounded by forest.", "km": "បឹងរណ្ដៅភ្នំភ្លើងរាងមូល មានទឹកពណ៌ខៀវថ្លា ហ៊ុំព័ទ្ធដោយព្រៃ។"}, "body": {"en": "Ratanakiri is the land of red earth roads, waterfalls and highland communities. Its jewel is Yeak Laom, a volcanic crater lake near Banlung town, managed by the local Tampuan community.\n\nWooden piers let you swim in the calm, deep water, and a walking trail circles the whole lake.", "km": "រតនគិរី ជាដែនដីនៃផ្លូវដីក្រហម ទឹកធ្លាក់ និងសហគមន៍តំបន់ខ្ពង់រាប។ ត្បូងរបស់វាគឺបឹងយក្សឡោម ជាបឹងរណ្ដៅភ្នំភ្លើងក្បែរក្រុងបានលុង ដែលគ្រប់គ្រងដោយសហគមន៍ជនជាតិទំពួន។\n\nផែឈើអនុញ្ញាតឱ្យអ្នកហែលទឹកក្នុងទឹកជ្រៅស្ងប់ ហើយមានផ្លូវដើរជុំវិញបឹងទាំងមូល។"}, "best": {"en": "November to April", "km": "ខែវិច្ឆិកា ដល់ខែមេសា"}, "getting": {"en": "A long drive from Phnom Penh to Banlung, then about 5 km to the lake.", "km": "ធ្វើដំណើរយូរពីភ្នំពេញទៅក្រុងបានលុង បន្ទាប់មកប្រហែល ៥ គីឡូម៉ែត្រទៅបឹង។"}, "tip": {"en": "Go early morning when mist lies on the water and the lake is all yours.", "km": "ទៅពេលព្រឹកព្រលឹម ពេលអ័ព្ទនៅលើទឹក ហើយបឹងគឺជារបស់អ្នកតែម្នាក់។"}, "art": "river", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Yeak Laom Lake, Ratanakiri", "link": "", "q": "Yeak Laom lake"}, {"id": "kratie", "cat": "destination", "title": {"en": "Kratié Dolphins", "km": "ផ្សោតក្រចេះ"}, "region": {"en": "Kratié", "km": "ក្រចេះ"}, "sum": {"en": "See the rare Irrawaddy dolphins in the Mekong at Kampi.", "km": "មើលផ្សោតទឹកសាបដ៏កម្រ នៅទន្លេមេគង្គ ត្រង់កំពី។"}, "body": {"en": "A small population of Irrawaddy dolphins lives in deep pools of the Mekong north of Kratié town. At Kampi, local boatmen paddle or motor gently out so you can watch them surface and breathe.\n\nKratié town itself has a beautiful riverside sunset, and Koh Trong island across the water is perfect for a slow bicycle ride.", "km": "ផ្សោតទឹកសាបមួយចំនួនតូច រស់នៅក្នុងអន្លង់ជ្រៅនៃទន្លេមេគង្គ ខាងជើងក្រុងក្រចេះ។ នៅកំពី អ្នកបើកទូកក្នុងតំបន់ ចែវ ឬបើកទូកយឺតៗ ដើម្បីឱ្យអ្នកមើលពួកវាងើបដកដង្ហើម។\n\nក្រុងក្រចេះ មានទេសភាពថ្ងៃលិចមាត់ទន្លេដ៏ស្អាត ហើយកោះទ្រង់ នៅម្ខាងទន្លេ ល្អឥតខ្ចោះសម្រាប់ជិះកង់លេង។"}, "best": {"en": "Dry season (December to May), early morning or late afternoon", "km": "រដូវប្រាំង (ខែធ្នូ ដល់ខែឧសភា) ពេលព្រឹក ឬរសៀល"}, "getting": {"en": "Kampi is about 15 km north of Kratié town by tuk-tuk.", "km": "កំពី ស្ថិតនៅប្រហែល ១៥ គីឡូម៉ែត្រ ខាងជើងក្រុងក្រចេះ ដោយរ៉ឺម៉ក។"}, "tip": {"en": "Keep voices low on the boat. The dolphins come closer when it is quiet.", "km": "និយាយតិចៗនៅលើទូក។ ផ្សោតនឹងមកជិត នៅពេលស្ងាត់។"}, "art": "river", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Kampi dolphin pool, Kratie", "link": "", "q": "Irrawaddy dolphin Kratie"}, {"id": "battambang", "cat": "destination", "title": {"en": "Battambang", "km": "បាត់ដំបង"}, "region": {"en": "Battambang", "km": "បាត់ដំបង"}, "sum": {"en": "Colonial streets, the bamboo train, art schools and a bat cave at sunset.", "km": "ផ្លូវសម័យអាណានិគម រថភ្លើងឫស្សី សាលាសិល្បៈ និងរូងប្រចៀវពេលថ្ងៃលិច។"}, "body": {"en": "Battambang is Cambodia's relaxed second city, known for its well-kept French-era shophouses, young artists and rice fields all around.\n\nAt Phnom Sampeau, millions of bats stream out of a cave at dusk in a long ribbon across the sky. Nearby, the bamboo train (norry) still gives short rides along a track through the fields.", "km": "បាត់ដំបង ជាក្រុងធំទីពីរដ៏ស្ងប់ស្ងាត់របស់កម្ពុជា ល្បីដោយផ្ទះល្វែងសម័យបារាំងដែលថែរក្សាបានល្អ សិល្បករវ័យក្មេង និងវាលស្រែជុំវិញ។\n\nនៅភ្នំសំពៅ ប្រចៀវរាប់លានក្បាល ហោះចេញពីរូងភ្នំនៅពេលល្ងាច ជាខ្សែវែងឆ្លងកាត់មេឃ។ នៅក្បែរនោះ រថភ្លើងឫស្សី (ណូរី) នៅតែដឹកភ្ញៀវ ជិះខ្លីៗតាមផ្លូវកាត់វាលស្រែ។"}, "best": {"en": "November to February", "km": "ខែវិច្ឆិកា ដល់ខែកុម្ភៈ"}, "getting": {"en": "About 5 hours by bus from Phnom Penh, or 3 hours from Siem Reap.", "km": "ប្រហែល ៥ ម៉ោងដោយឡានក្រុងពីភ្នំពេញ ឬ ៣ ម៉ោងពីសៀមរាប។"}, "tip": {"en": "Be at the foot of Phnom Sampeau by 5:30 pm for the bats.", "km": "ត្រូវនៅជើងភ្នំសំពៅ មុនម៉ោង ៥:៣០ ល្ងាច ដើម្បីមើលប្រចៀវ។"}, "art": "hills", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Battambang, Cambodia", "link": "", "q": "Battambang"}, {"id": "phnom-kulen", "cat": "destination", "title": {"en": "Phnom Kulen", "km": "ភ្នំគូលែន"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "The sacred mountain where the Khmer Empire was born, with a riverbed carved with lingas.", "km": "ភ្នំពិសិដ្ឋ ដែលអាណាចក្រខ្មែរបានកកើត មានបាតទន្លេឆ្លាក់លិង្គ។"}, "body": {"en": "In 802, Jayavarman II declared himself universal monarch on Phnom Kulen, the moment usually taken as the start of the Khmer Empire. Today it is a national park and a place of pilgrimage for Cambodians.\n\nNear the top, the river runs over a bed carved with hundreds of lingas, known as the River of a Thousand Lingas, before tumbling down the Kulen waterfall, where families picnic and swim.", "km": "នៅឆ្នាំ ៨០២ ព្រះបាទជ័យវរ្ម័នទី២ បានប្រកាសខ្លួនជាចក្រពត្តិ នៅលើភ្នំគូលែន ដែលជាពេលវេលាគេចាត់ទុកថាជាការចាប់ផ្ដើមនៃអាណាចក្រខ្មែរ។ សព្វថ្ងៃ វាជាឧទ្យានជាតិ និងជាទីសក្ការបូជារបស់ប្រជាជនខ្មែរ។\n\nនៅទន្លេលិង្គមួយពាន់ ទឹកហូរកាត់លើថ្មពិសិដ្ឋ មុននឹងធ្លាក់ចុះតាមទឹកធ្លាក់គូលែន ដែលគ្រួសារនានាមកញ៉ាំអាហារ និងហែលទឹក។"}, "best": {"en": "Late rainy season (August to November) for the fullest waterfall", "km": "ចុងរដូវវស្សា (ខែសីហា ដល់ខែវិច្ឆិកា) សម្រាប់ទឹកធ្លាក់ពេញបំផុត"}, "getting": {"en": "About 50 km northeast of Siem Reap, around 1.5 hours. Separate entry ticket, not part of the Angkor Pass.", "km": "ប្រហែល ៥០ គីឡូម៉ែត្រ ឦសានក្រុងសៀមរាប ប្រហែល ១ ម៉ោងកន្លះ។ មានសំបុត្រចូលដាច់ដោយឡែក មិនរួមក្នុងសំបុត្រអង្គរទេ។"}, "tip": {"en": "Visit the reclining Buddha at Preah Ang Thom first, then cool off at the waterfall.", "km": "ទៅថ្វាយបង្គំព្រះពុទ្ធរូបផ្ទំ នៅព្រះអង្គធំជាមុនសិន បន្ទាប់មកទៅលេងទឹកធ្លាក់។"}, "art": "hills", "built": {"en": "", "km": ""}, "img": "", "featured": true, "mapq": "Phnom Kulen, Cambodia", "link": "", "q": "Phnom Kulen waterfall"}, {"id": "tonle-sap", "cat": "destination", "title": {"en": "Tonle Sap Floating Villages", "km": "ភូមិបណ្ដែតទឹកទន្លេសាប"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "Life on the water at Southeast Asia’s largest freshwater lake.", "km": "ជីវិតលើទឹក នៅបឹងទឹកសាបធំជាងគេនៅអាស៊ីអាគ្នេយ៍។"}, "body": {"en": "Every rainy season the Mekong pushes water backwards up the Tonle Sap river, and the lake swells to several times its dry-season size. Whole villages live with this rhythm: houses on tall stilts, floating schools, and fishing boats instead of motorbikes.\n\nKampong Phluk and Kampong Khleang are two villages where you can see this way of life by boat.", "km": "រៀងរាល់រដូវវស្សា ទន្លេមេគង្គរុញទឹកហូរច្រាសតាមទន្លេសាប ហើយបឹងរីកធំជាងទំហំរដូវប្រាំងច្រើនដង។ ភូមិទាំងមូលរស់នៅតាមចង្វាក់នេះ៖ ផ្ទះលើសសរខ្ពស់ៗ សាលារៀនបណ្ដែតទឹក និងទូកនេសាទជំនួសម៉ូតូ។\n\nកំពង់ភ្លុក និងកំពង់ឃ្លាំង ជាភូមិពីរដែលអ្នកអាចមើលរបៀបរស់នៅនេះ ដោយជិះទូក។"}, "best": {"en": "August to December, when water is high", "km": "ខែសីហា ដល់ខែធ្នូ ពេលទឹកឡើងខ្ពស់"}, "getting": {"en": "Kampong Phluk is about 1 hour by road from Siem Reap, then by boat.", "km": "កំពង់ភ្លុក ប្រហែល ១ ម៉ោងតាមផ្លូវគោកពីសៀមរាប បន្ទាប់មកជិះទូក។"}, "tip": {"en": "Book with a community-run boat service so your fee goes to the village.", "km": "កក់ជាមួយសេវាទូកដែលគ្រប់គ្រងដោយសហគមន៍ ដើម្បីឱ្យថ្លៃរបស់អ្នកទៅដល់ភូមិ។"}, "art": "river", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Kampong Phluk, Siem Reap", "link": "", "q": "Tonle Sap floating village"}, {"id": "apsara", "cat": "culture", "title": {"en": "Apsara Dance", "km": "របាំអប្សរា"}, "region": {"en": "Phnom Penh · Siem Reap", "km": "ភ្នំពេញ · សៀមរាប"}, "sum": {"en": "The celestial dancers of the temple walls, brought to life on stage.", "km": "ទេពអប្សរនៃជញ្ជាំងប្រាសាទ ត្រូវបាននាំមកឱ្យមានជីវិតលើឆាក។"}, "body": {"en": "The Royal Ballet of Cambodia is recognised by UNESCO as Intangible Cultural Heritage. Every hand gesture has meaning, from a flower opening to fruit ripening, and costumes are sewn onto the dancers before each show.\n\nDancers train from childhood to bend their fingers back in the graceful curves you see carved at Angkor.", "km": "របាំព្រះរាជទ្រព្យកម្ពុជា ត្រូវបាន UNESCO ទទួលស្គាល់ជាបេតិកភណ្ឌវប្បធម៌អរូបី។ កាយវិការដៃនីមួយៗមានអត្ថន័យ ចាប់ពីផ្កាកំពុងរីក រហូតដល់ផ្លែឈើទុំ ហើយសម្លៀកបំពាក់ត្រូវដេរភ្ជាប់លើខ្លួនអ្នករបាំ មុនការសម្ដែងនីមួយៗ។\n\nអ្នករបាំហ្វឹកហាត់តាំងពីកុមារភាព ដើម្បីបត់ម្រាមដៃថយក្រោយ ជាក្បាច់ដ៏ស្រស់ស្អាត ដូចដែលអ្នកឃើញឆ្លាក់នៅអង្គរ។"}, "best": {"en": "Evening performances, all year", "km": "ការសម្ដែងពេលល្ងាច ពេញមួយឆ្នាំ"}, "getting": {"en": "Regular shows run in Siem Reap and at cultural venues in Phnom Penh.", "km": "មានការសម្ដែងទៀងទាត់ នៅសៀមរាប និងទីតាំងវប្បធម៌នានានៅភ្នំពេញ។"}, "tip": {"en": "Watch the hands, not just the costumes. Each gesture tells part of the story.", "km": "មើលដៃ មិនមែនតែសម្លៀកបំពាក់ទេ។ កាយវិការនីមួយៗ និទានផ្នែកមួយនៃរឿង។"}, "art": "culture", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Apsara dance show Siem Reap", "link": "", "q": "Apsara dance"}, {"id": "sbek-thom", "cat": "culture", "title": {"en": "Sbek Thom Shadow Theatre", "km": "ល្ខោនស្បែកធំ"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "Giant leather puppets that tell the Reamker by firelight.", "km": "រូបស្បែកយក្សៗ និទានរឿងរាមកេរ្តិ៍ ក្រោមពន្លឺភ្លើង។"}, "body": {"en": "Sbek Thom uses large panels of cowhide, carved by hand and held up by dancers in front of a fire-lit screen while an orchestra and narrators tell the Reamker, the Khmer Ramayana.\n\nIt is also inscribed by UNESCO as Intangible Cultural Heritage, and a few troupes keep the tradition alive today.", "km": "ល្ខោនស្បែកធំ ប្រើបន្ទះស្បែកគោធំៗ ដែលឆ្លាក់ដោយដៃ ហើយលើកដោយអ្នករបាំ នៅមុខវាំងននដែលមានពន្លឺភ្លើង ខណៈពិណពាទ្យ និងអ្នកនិទាន រៀបរាប់រឿងរាមកេរ្តិ៍។\n\nវាក៏ត្រូវបាន UNESCO ចុះបញ្ជីជាបេតិកភណ្ឌវប្បធម៌អរូបីដែរ ហើយមានក្រុមមួយចំនួនតូច ដែលបន្តរក្សាប្រពៃណីនេះសព្វថ្ងៃ។"}, "best": {"en": "Evening shows, check schedules", "km": "ការសម្ដែងពេលល្ងាច សូមពិនិត្យកាលវិភាគ"}, "getting": {"en": "Performances are held occasionally in Siem Reap and Phnom Penh.", "km": "ការសម្ដែងប្រារព្ធឡើងម្ដងម្កាល នៅសៀមរាប និងភ្នំពេញ។"}, "tip": {"en": "Ask your guesthouse; shows are not daily and sell out during festivals.", "km": "សួរផ្ទះសំណាក់របស់អ្នក។ ការសម្ដែងមិនមែនរៀងរាល់ថ្ងៃទេ ហើយសំបុត្រអស់លឿនពេលបុណ្យ។"}, "art": "culture", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Sbek Thom Siem Reap", "link": "", "q": "Sbek Thom"}, {"id": "silk", "cat": "culture", "title": {"en": "Khmer Silk Weaving", "km": "ការត្បាញសូត្រខ្មែរ"}, "region": {"en": "Takeo · Kandal", "km": "តាកែវ · កណ្ដាល"}, "sum": {"en": "Hand-woven silk, from mulberry leaves to finished sampot.", "km": "សូត្រត្បាញដោយដៃ ចាប់ពីស្លឹកមន រហូតដល់សំពត់ស្រេច។"}, "body": {"en": "Khmer silk is famous for hol, a technique where threads are tie-dyed before weaving so patterns appear as the fabric grows. A single traditional sampot can take weeks on a wooden loom.\n\nKoh Dach, an island just outside Phnom Penh, and villages in Takeo are good places to watch weavers at work under their stilt houses.", "km": "សូត្រខ្មែរ ល្បីដោយសំពត់ហូល ជាបច្ចេកទេសចងជ្រលក់ពណ palm Cambodia rice field"}, {"id": "wedding", "cat": "culture", "title": {"en": "Khmer Wedding", "km": "អាពាហ៍ពិពាហ៍ខ្មែរ"}, "region": {"en": "Everywhere", "km": "គ្រប់ទីកន្លែង"}, "sum": {"en": "Colourful costumes, music and ceremonies that last a day or more.", "km": "សម្លៀកបំពាក់ចម្រុះពណ៌ ភ្លេង និងពិធីដែលមានរយៈពេលមួយថ្ងៃ ឬច្រើនជាងនេះ។"}, "body": {"en": "A traditional Khmer wedding has many steps: the groom's procession with gifts, hair-cutting to bless the couple, monks' blessings and the tying of red threads on the wrists. The couple changes outfits many times during the day.", "km": "អាពាហ៍ពិពាហ៍ខ្មែរប្រពៃណី មានពិធីជាច្រើន៖ ហែជំនូន ពិធីកាត់សក់ ការសូត្រមន្តរបស់ព្រះសង្ឃ និងចងដៃដោយអំបោះក្រហម។ គូស្វាមីភរិយាប្ដូរសម្លៀកបំពាក់ច្រើនដងក្នុងមួយថ្ងៃ។"}, "best": {"en": "Wedding season: November to April", "km": "រដូវរៀបការ៖ ខែវិច្ឆិកា ដល់ខែមេសា"}, "getting": {"en": "You will see wedding tents on streets across the country.", "km": "អ្នកនឹងឃើញរោងការតាមផ្លូវទូទាំងប្រទេស។"}, "tip": {"en": "If you are invited, bring cash in an envelope; it is the custom.", "km": "បើអ្នកត្រូវបានអញ្ជើញ យកលុយដាក់ក្នុងស្រោមសំបុត្រ។ វាជាទំនៀមទម្លាប់។"}, "art": "culture", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Khmer Wedding, Cambodia", "link": "", "q": "Khmer wedding Cambodia"}], "festivals": [{"id": "f1", "when": {"en": "Mid-April", "km": "ពាក់កណ្ដាលខែមេសា"}, "title": {"en": "Khmer New Year (Choul Chnam Thmey)", "km": "ពិធីបុណ្យចូលឆ្នាំថ្មី"}, "text": {"en": "Three days of family visits, pagoda offerings, water splashing and traditional games like bos angkunh and chol chhoung. Cities empty out as everyone heads home to their province.", "km": "បីថ្ងៃនៃការជួបជុំគ្រួសារ ការធ្វើបុណ្យនៅវត្ត ការបាញ់ទឹក និងល្បែងប្រជាប្រិយ ដូចជាបោះអង្គុញ និងចោលឈូង។ ទីក្រុងនានាស្ងាត់ ព្រោះមនុស្សគ្រប់គ្នាត្រឡប់ទៅស្រុកកំណើត។"}, "q": "Khmer New Year Angkor"}, {"id": "f2", "when": {"en": "May", "km": "ខែឧសភា"}, "title": {"en": "Visak Bochea & Royal Ploughing Ceremony", "km": "ពិធីបុណ្យវិសាខបូជា និងព្រះរាជពិធីច្រត់ព្រះនង្គ័ល"}, "text": {"en": "Visak Bochea marks the Buddha's birth, enlightenment and passing, with candle-lit processions at pagodas. Around the same month, the Royal Ploughing Ceremony predicts the coming rice harvest from what the royal oxen choose to eat.", "km": "វិសាខបូជា រំលឹកដល់ការប្រសូត ការត្រាស់ដឹង និងការបរិនិព្វានរបស់ព្រះពុទ្ធ ដោយមានការដង្ហែទៀននៅវត្ត។ ក្នុងខែជាមួយគ្នា ព្រះរាជពិធីច្រត់ព្រះនង្គ័ល ទស្សន៍ទាយផលស្រូវ តាមអ្វីដែលគោឧសភរាជជ្រើសរើសបរិភោគ។"}, "q": "Royal Ploughing Ceremony Cambodia"}, {"id": "f3", "when": {"en": "September – October", "km": "ខែកញ្ញា – តុលា"}, "title": {"en": "Pchum Ben", "km": "ពិធីបុណ្យភ្ជុំបិណ្ឌ"}, "text": {"en": "Fifteen days when Cambodians honour their ancestors. Before dawn, families bring rice balls and food to the pagodas so the spirits of the dead are fed. The final days are a national holiday.", "km": "ដប់ប្រាំថ្ងៃ ដែលប្រជាជនខ្មែរឧទ្ទិសដល់ដូនតា។ មុនថ្ងៃរះ គ្រួសារនាំបាយបិណ្ឌ និងម្ហូបទៅវត្ត ដើម្បីឧទ្ទិសដល់វិញ្ញាណក្ខន្ធអ្នកស្លាប់។ ថ្ងៃចុងក្រោយ ជាថ្ងៃឈប់សម្រាកជាតិ។"}, "q": "Pchum Ben pagoda"}, {"id": "f4", "when": {"en": "November full moon", "km": "ពេញបូណ៌មីខែកត្ដិក"}, "title": {"en": "Water Festival (Bon Om Touk)", "km": "ពិធីបុណ្យអុំទូក"}, "text": {"en": "Long boats with dozens of paddlers race on the Tonle Sap river in front of the Royal Palace in Phnom Penh, celebrating the river changing direction. Nights bring illuminated floats and the salute to the moon, Sampeah Preah Khae, with ambok (flattened rice).", "km": "ទូកងដែលមានអ្នកចែវរាប់សិបនាក់ ប្រណាំងគ្នានៅលើទន្លេសាប មុខព្រះបរមរាជវាំងនៅភ្នំពេញ ដើម្បីអបអរការប្ដូរទិសដៅហូររបស់ទន្លេ។ ពេលយប់មានបណ្ដែតប្រទីប និងពិធីសំពះព្រះខែ អកអំបុក។"}, "q": "Bon Om Touk boat race"}, {"id": "f5", "when": {"en": "February full moon", "km": "ពេញបូណ៌មីខែមាឃ"}, "title": {"en": "Meak Bochea", "km": "ពិធីបុណ្យមាឃបូជា"}, "q": "Meak Bochea", "text": {"en": "Buddhists gather at pagodas in the evening and walk three times around the vihara with candles, incense and lotus flowers, remembering the Buddha's teaching to 1,250 monks.", "km": "ពុទ្ធបរិស័ទជួបជុំគ្នានៅវត្តពេលល្ងាច ហើយដើរវង់ព្រះវិហារបីជុំ ជាមួយទៀន ធូប និងផ្កាឈូក ដើម្បីរំលឹកដល់ការសម្ដែងធម៌របស់ព្រះពុទ្ធ ដល់ព្រះសង្ឃ ១២៥០ អង្គ។"}}, {"id": "f6", "when": {"en": "October – November", "km": "ខែតុលា – វិច្ឆិកា"}, "title": {"en": "Kathen Ceremony", "km": "ពិធីបុណ្យកឋិនទាន"}, "q": "Kathina ceremony Cambodia", "text": {"en": "After the rainy-season retreat, villages march to the pagoda with music and dancing to offer new robes and gifts to the monks. Each pagoda can receive Kathen only once a year.", "km": "ក្រោយការចូលព្រះវស្សា ភូមិនានាហែក្បួនទៅវត្ត ជាមួយភ្លេង និងរបាំ ដើម្បីប្រគេនស្បង់ចីវរថ្មី និងទេយ្យវត្ថុដល់ព្រះសង្ឃ។ វត្តនីមួយៗ អាចទទួលកឋិនបានតែម្ដងក្នុងមួយឆ្នាំ។"}}, {"id": "f7", "when": {"en": "9 November", "km": "ថ្ងៃទី ៩ ខែវិច្ឆិកា"}, "title": {"en": "Independence Day", "km": "ទិវាបុណ្យឯករាជ្យជាតិ"}, "q": "Independence Monument Phnom Penh", "text": {"en": "Cambodia celebrates independence from France (1953) with a ceremony at the Independence Monument in Phnom Penh, a lotus-shaped tower lit up at night.", "km": "កម្ពុជាប្រារព្ធទិវាឯករាជ្យពីបារាំង (ឆ្នាំ ១៩៥៣) ដោយមានពិធីនៅវិមានឯករាជ្យក្នុងភ្នំពេញ ដែលជាប្រាង្គរាងផ្កាឈូក បំភ្លឺភ្លើងពេលយប់។"}}], "tips": [{"id": "t1", "icon": "sun", "title": {"en": "Best time to visit", "km": "ពេលល្អបំផុតក្នុងការទស្សនា"}, "text": {"en": "November to February is cool and dry, the most comfortable time for temples and travel. March to May is very hot. June to October is the green season, with short heavy rain most afternoons, fewer visitors and lush rice fields.", "km": "ខែវិច្ឆិកា ដល់ខែកុម្ភៈ ត្រជាក់ និងស្ងួត ជាពេលស្រួលបំផុតសម្រាប់ទស្សនាប្រាសាទ និងធ្វើដំណើរ។ ខែមីនា ដល់ខែឧសភា ក្ដៅខ្លាំង។ ខែមិថុនា ដល់ខែតុលា ជារដូវបៃតង មានភ្លៀងខ្លាំងខ្លីៗស្ទើររាល់រសៀល ភ្ញៀវតិច ហើយវាលស្រែខៀវស្រងាត់។"}}, {"id": "t2", "icon": "globe", "title": {"en": "Visa", "km": "ទិដ្ឋាការ"}, "text": {"en": "Many nationalities can get a tourist e-visa online before travelling, and visas on arrival are available at the main airports and border crossings. Rules and fees change, so always check the official government e-visa website before you go, and use only official sites.", "km": "ពលរដ្ឋជាច្រើនប្រទេស អាចស្នើសុំទិដ្ឋាការទេសចរណ៍អេឡិចត្រូនិកតាមអនឡាញ មុនពេលធ្វើដំណើរ ហើយក៏អាចទទួលទិដ្ឋាការនៅពេលមកដល់ នៅព្រលានយន្តហោះ និងច្រកព្រំដែនធំៗ។ ច្បាប់ និងថ្លៃសេវាអាចផ្លាស់ប្ដូរ ដូច្នេះត្រូវពិនិត្យគេហទំព័រផ្លូវការរបស់រដ្ឋាភិបាលជានិច្ច។"}}, {"id": "t3", "icon": "donate", "title": {"en": "Money", "km": "លុយកាក់"}, "text": {"en": "Cambodia uses two currencies side by side: US dollars and Khmer riel. Prices are often in dollars, and small change comes back in riel. Carry clean, untorn dollar notes, as damaged ones are often refused. ATMs are easy to find in towns; KHQR payments work at many shops.", "km": "កម្ពុជាប្រើរូបិយប័ណ្ណពីរ៖ ដុល្លារអាមេរិក និងប្រាក់រៀល។ តម្លៃច្រើនតែជាដុល្លារ ហើយលុយអាប់ជាប្រាក់រៀល។ យកក្រដាសប្រាក់ដុល្លារស្អាតមិនរហែក ព្រោះក្រដាសខូចច្រើនតែមិនទទួល។ ម៉ាស៊ីន ATM មានច្រើននៅតាមក្រុង ហើយការទូទាត់ KHQR អាចប្រើនៅហាងជាច្រើន។"}}, {"id": "t4", "icon": "temple", "title": {"en": "Temple manners", "km": "សុជីវធម៌នៅប្រាសាទ"}, "text": {"en": "Cover your shoulders and knees at Angkor and in pagodas; you may be refused entry to the upper level of Angkor Wat without it. Take off shoes before entering a pagoda hall, don't point your feet at Buddha images, and women should not touch monks or hand things to them directly.", "km": "គ្របស្មា និងជង្គង់ នៅអង្គរ និងនៅវត្ត។ បើមិនដូច្នោះ អ្នកអាចត្រូវបានហាមមិនឱ្យឡើងជាន់ខាងលើនៃអង្គរវត្ត។ ដោះស្បែកជើងមុនចូលព្រះវិហារ កុំចង្អុលជើងទៅព្រះពុទ្ធរូប ហើយស្ត្រីមិនគួរប៉ះព្រះសង្ឃ ឬហុចរបស់ទៅលោកដោយផ្ទាល់ទេ។"}}, {"id": "t5", "icon": "calendar", "title": {"en": "Angkor Pass", "km": "សំបុត្រអង្គរ"}, "text": {"en": "You need an Angkor Pass for Angkor Wat and the main temples. Passes come as 1-day, 3-day and 7-day tickets with your photo printed on them. Buy only at the official ticket centre in Siem Reap or the official online site, and keep it with you: it is checked at every temple.", "km": "អ្នកត្រូវមានសំបុត្រអង្គរ ដើម្បីចូលអង្គរវត្ត និងប្រាសាទសំខាន់ៗ។ មានសំបុត្រ ១ ថ្ងៃ ៣ ថ្ងៃ និង ៧ ថ្ងៃ ដែលបោះពុម្ពរូបថតរបស់អ្នក។ ទិញតែនៅមជ្ឈមណ្ឌលលក់សំបុត្រផ្លូវការនៅសៀមរាប ឬគេហទំព័រផ្លូវការប៉ុណ្ណោះ ហើយរក្សាវាជាមួយខ្លួន ព្រោះគេពិនិត្យនៅគ្រប់ប្រាសាទ។"}}, {"id": "t6", "icon": "car", "title": {"en": "Getting around", "km": "ការធ្វើដំណើរ"}, "text": {"en": "In towns, use tuk-tuks or ride-hailing apps such as PassApp and Grab so the price is fixed before you go. Between cities, comfortable buses and minivans run daily; for remote provinces, hiring a car with a driver is easiest.", "km": "នៅក្នុងក្រុង ប្រើរ៉ឺម៉ក ឬកម្មវិធីហៅរថយន្ត ដូចជា PassApp និង Grab ដើម្បីដឹងតម្លៃមុនចេញដំណើរ។ រវាងខេត្ត មានឡានក្រុង និងឡានតូចស្រួលជិះជារៀងរាល់ថ្ងៃ។ សម្រាប់ខេត្តដាច់ស្រយាល ការជួលរថយន្តជាមួយអ្នកបើកបរ ងាយស្រួលជាងគេ។"}}, {"id": "t7", "icon": "info", "title": {"en": "Staying safe & healthy", "km": "សុវត្ថិភាព និងសុខភាព"}, "text": {"en": "Drink bottled or filtered water, use mosquito repellent, especially at dusk, and wear a hat in the midday sun. In remote countryside near old battlefields, stay on paths that are clearly used; unexploded landmines still exist in some rural areas.", "km": "ផឹកទឹកដប ឬទឹកចម្រោះ ប្រើថ្នាំការពារមូស ជាពិសេសពេលល្ងាច ហើយពាក់មួកពេលថ្ងៃត្រង់។ នៅតំបន់ជនបទដាច់ស្រយាល ក្បែរអតីតសមរភូមិ ដើរតែលើផ្លូវដែលគេប្រើច្បាស់លាស់ ព្រោះនៅមានមីនមិនទាន់ផ្ទុះនៅតំបន់ជនបទមួយចំនួន។"}}, {"id": "t8", "icon": "chat", "title": {"en": "Khmer words that open doors", "km": "ពាក្យខ្មែរដែលបើកទ្វារ"}, "text": {"en": "Hello: sues-dey (សួស្ដី)\nThank you: or-kun (អរគុណ)\nHow much?: thlai ponmaan? (ថ្លៃប៉ុន្មាន?)\nDelicious: chnganh (ឆ្ងាញ់)\nGoodbye: lea suen hai (លាសិនហើយ)\n\nA smile and a sampeah (palms together, a small bow) go a long way.", "km": "ជាមួយភ្ញៀវបរទេស អ្នកអាចបង្រៀនពាក្យទាំងនេះ៖\nសួស្ដី — Hello\nអរគុណ — Thank you\nថ្លៃប៉ុន្មាន? — How much?\nឆ្ងាញ់ — Delicious\nលាសិនហើយ — Goodbye\n\nស្នាមញញឹម និងការសំពះ ជួយបានច្រើន។"}}], "stays": [{"id": "s1", "art": "temple", "img": "", "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "title": {"en": "Siem Reap: Old Market, riverside or Wat Bo", "km": "សៀមរាប៖ ផ្សារចាស់ មាត់ស្ទឹង ឬវត្តបូព៌"}, "text": {"en": "Stay near the Old Market and Pub Street if you want restaurants and nightlife at your door. The riverside and the Wat Bo area across the river are calmer, with garden boutique hotels, and still a short tuk-tuk ride to everything. Most hotels can arrange your temple tuk-tuk for the day.", "km": "ស្នាក់នៅក្បែរផ្សារចាស់ និងផ្លូវ Pub Street ប្រសិនបើអ្នកចង់បានភោជនីយដ្ឋាន និងជីវិតពេលយប់នៅជិតខ្លួន។ មាត់ស្ទឹង និងតំបន់វត្តបូព៌ ស្ងប់ស្ងាត់ជាង មានសណ្ឋាគារតូចៗមានសួនច្បារ ហើយនៅតែជិះរ៉ឺម៉កខ្លីៗទៅគ្រប់កន្លែង។ សណ្ឋាគារភាគច្រើនអាចរៀបចំរ៉ឺម៉កទៅប្រាសាទពេញមួយថ្ងៃ។"}, "q": "Siem Reap river"}, {"id": "s2", "art": "river", "img": "", "region": {"en": "Phnom Penh", "km": "ភ្នំពេញ"}, "title": {"en": "Phnom Penh: Riverside or BKK1", "km": "ភ្នំពេញ៖ មាត់ទន្លេ ឬបឹងកេងកង១"}, "text": {"en": "The riverside near the Royal Palace and National Museum is perfect for a first visit: you can walk to the sights and watch the sunset over the river. BKK1 is leafy and quieter, full of cafés and good restaurants.", "km": "មាត់ទន្លេក្បែរព្រះបរមរាជវាំង និងសារមន្ទីរជាតិ ល្អឥតខ្ចោះសម្រាប់ការមកលើកដំបូង៖ អ្នកអាចដើរទៅកន្លែងទេសចរណ៍ និងមើលថ្ងៃលិចលើទន្លេ។ បឹងកេងកង១ មានដើមឈើច្រើន ស្ងប់ស្ងាត់ជាង ពោរពេញដោយហាងកាហ្វេ និងភោជនីយដ្ឋានល្អៗ។"}, "q": "Phnom Penh skyline"}, {"id": "s3", "art": "river", "img": "", "region": {"en": "Kampot", "km": "កំពត"}, "title": {"en": "Kampot: on the river", "km": "កំពត៖ មាត់ទន្លេ"}, "text": {"en": "Skip the town centre and pick a bungalow on the river a few kilometres upstream. You wake up to the water, kayak before breakfast and still reach town in ten minutes.", "km": "កុំស្នាក់កណ្ដាលក្រុង ជ្រើសរើសបឹងហ្គាឡូមាត់ទន្លេ ពីរបីគីឡូម៉ែត្រខាងលើ។ អ្នកភ្ញាក់ឡើងឃើញទឹក ជិះកាយ៉ាក់មុនអាហារពេលព្រឹក ហើយនៅតែទៅដល់ក្រុងក្នុងរយៈពេលដប់នាទី។"}, "q": "Kampot river"}, {"id": "s4", "art": "sea", "img": "", "region": {"en": "Kep", "km": "កែប"}, "titl var tPause=0,tTimer=null;
function tStep(row){return row.querySelector('.tile')?row.querySelector('.tile').getBoundingClientRect().width+6:120}
function tMove(row,d){var max=row.scrollWidth-row.clientWidth;if(max<=4)return;var x=row.scrollLeft+d*tStep(row);if(d>0&&row.scrollLeft>=max-4)x=0;else if(d<0&&row.scrollLeft<=4)x=max;row.scrollTo({left:x,behavior:'smooth'})}
function tBar(row){var b=row.parentNode.querySelector('.tbar i');if(!b)return;var w=row.scrollWidth,c=row.clientWidth;if(w<=c+4){b.parentNode.style.visibility='hidden';return}b.parentNode.style.visibility='';b.style.width=(c/w*100)+'%';b.style.left=(row.scrollLeft/w*100)+'%'}
function initTiles(){
  clearInterval(tTimer);
  var rows=app.querySelectorAll('.tiles.row');if(!rows.length)return;
  rows.forEach(function(row){tBar(row);row.addEventListener('scroll',function(){tBar(row)},{passive:true});
    ['touchstart','pointerdown','wheel'].forEach(function(ev){row.addEventListener(ev,function(){tPause=Date.now()+8000},{passive:true})})});
  if(editing||admin||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  tTimer=setInterval(function(){if(Date.now()<tPause||document.hidden)return;app.querySelectorAll('.tiles.row').forEach(function(row){var r=row.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)tMove(row,1)})},3000);
}
