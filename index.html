ើយវាជាម្ហូបធម្មតាមួយនៅក្នុងពិធីជប់លៀងមង្គលការនៅតាមខេត្ត។"}, "tip": {"en": "If you prefer your beef more cooked, ask for it 'cooked a little more'; most kitchens will gladly sear it first.", "km": "ប្រសិនបើអ្នកចូលចិត្តសាច់ឆ្អិនជាងនេះ សូមប្រាប់ឱ្យធ្វើឱ្យឆ្អិនបន្តិចទៀត។ ផ្ទះបាយភាគច្រើនរីករាយនឹងអាំង ឬស្រុះសាច់មុន។"}, "dish": {"en": "beef salad", "km": "ភ្លាសាច់គោ"}}, {"title": {"en": "Lap Khmer (Lime-Marinated Beef Salad)", "km": "ឡាបខ្មែរ"}, "text": {"en": "Lime-marinated beef with lemongrass, herbs and chilli.", "km": "សាច់គោប្រឡាក់ទឹកក្រូចឆ្មា ជាមួយស្លឹកគ្រៃ ជីរ និងម្ទេស។"}, "id": "lap-khmer", "body": {"en": "Lap Khmer is a zesty beef salad where finely sliced beef is marinated in lime juice and mixed with lemongrass, garlic, chilli and a generous handful of herbs and crunchy vegetables. It is a lively, refreshing dish that shows the Khmer love of sour, salty and herbal flavours. Cambodians enjoy it at weekend gatherings, parties and as a shared dish with friends in the evening.", "km": "ឡាបខ្មែរ គឺជាញាំសាច់គោរសជាតិស្រស់ ដែលគេយកសាច់គោហាន់ស្ដើងៗ ប្រឡាក់ជាមួយទឹកក្រូចឆ្មា ហើយច្របល់ជាមួយស្លឹកគ្រៃ ខ្ទឹមស ម្ទេស និងជីរ ព្រមទាំងបន្លែស្រួយៗជាច្រើន។ វាជាម្ហូបស្រស់ស្រាយ ដែលបង្ហាញពីការចូលចិត្តរសជាតិជូរ ប្រៃ និងក្លិនជីររបស់ខ្មែរ។ ប្រជាជនខ្មែរចូលចិត្តញ៉ាំវានៅពេលជួបជុំចុងសប្ដាហ៍ ពិធីជប់លៀង និងជាម្ហូបញ៉ាំរួមគ្នាជាមួយមិត្តភក្តិពេលល្ងាច។"}, "how": {"en": "Ingredients:\n- 300 g lean beef, sliced paper-thin\n- Juice of 4 limes\n- 2 stalks lemongrass and 3 kaffir lime leaves, finely sliced\n- 3 cloves garlic and 3 shallots, sliced\n- 2 tbsp fish sauce and 1 tsp sugar\n- 1 tbsp roasted rice powder (optional)\n- Bean sprouts, cucumber and long beans\n- Mint, holy basil, sawtooth coriander, red chilli and roasted peanuts\n\nSteps:\n1. Toss the beef in the lime juice and leave for 10 to 15 minutes, then drain.\n2. Mix the fish sauce and sugar with a little fresh lime juice.\n3. Add the lemongrass, kaffir lime leaves, garlic and shallots to the beef.\n4. Pour over the dressing and mix well.\n5. Fold in the herbs and roasted rice powder.\n6. Serve on a plate with the fresh vegetables, chilli and crushed peanuts.", "km": "គ្រឿងផ្សំ៖\n- សាច់គោសុទ្ធ ៣០០ ក្រាម ហាន់ស្ដើងបំផុត\n- ទឹកក្រូចឆ្មា ៤ ផ្លែ\n- ស្លឹកគ្រៃ ២ ដើម និងស្លឹកក្រូចសើច ៣ សន្លឹក ហាន់ល្អិត\n- ខ្ទឹមស ៣ កំពឹស និងខ្ទឹមក្រហម ៣ មើម ហាន់\n- ទឹកត្រី ២ ស្លាបព្រាបាយ និងស្ករស ១ ស្លាបព្រាកាហ្វេ\n- អង្ករលីងបុក ១ ស្លាបព្រាបាយ (តាមចិត្ត)\n- សណ្ដែកបណ្ដុះ ត្រសក់ និងសណ្ដែកកួរ\n- ជីរអង្កាម ជីរនាងវង ជីរបន្លា ម្ទេសក្រហម និងសណ្ដែកដីលីង\n\nរបៀបធ្វើ៖\n១. ច្របល់សាច់គោក្នុងទឹកក្រូចឆ្មា ហើយទុក ១០ ទៅ ១៥ នាទី រួចច្រោះទឹកចេញ។\n២. លាយទឹកត្រី និងស្ករ ជាមួយទឹកក្រូចឆ្មាស្រស់បន្តិច។\n៣. ដាក់ស្លឹកគ្រៃ ស្លឹកក្រូចសើច ខ្ទឹមស និងខ្ទឹមក្រហម ចូលក្នុងសាច់គោ។\n៤. ចាក់ទឹកជ្រលក់ពីលើ ហើយច្របល់ឱ្យសព្វ។\n៥. ដាក់ជីរ និងអង្ករលីងបុក ហើយច្របល់ថ្នមៗ។\n៦. ដាក់ក្នុងចានជាមួយបន្លែស្រស់ ម្ទេស និងសណ្ដែកដីបុក។"}, "where": {"en": "Lap Khmer is a staple at Khmer beer gardens, barbecue restaurants and evening food stalls in Phnom Penh, Siem Reap and most provincial towns.", "km": "ឡាបខ្មែរ គឺជាម្ហូបដែលតែងមាននៅតាមហាងស្រាបៀរខ្មែរ ហាងអាំងសាច់ និងតូបម្ហូបពេលល្ងាច នៅភ្នំពេញ សៀមរាប និងទីរួមខេត្តភាគច្រើន។"}, "tip": {"en": "It can be quite spicy, so ask for 'not too hot' when you order, and share it with the table alongside rice or cold drinks.", "km": "ម្ហូបនេះអាចហឹរខ្លាំង ដូច្នេះពេលកុម្ម៉ង់ សូមប្រាប់ថា កុំហឹរពេក ហើយញ៉ាំរួមគ្នាជាមួយបាយ ឬភេសជ្ជៈត្រជាក់។"}, "dish": {"en": "lap", "km": "ឡាប"}}, {"title": {"en": "Prahok Ktis", "km": "ប្រហុកខ្ទិះ"}, "text": {"en": "Prahok simmered with coconut milk, minced pork and kroeung, eaten with fresh vegetables.", "km": "ប្រហុកខ្ទិះជាមួយខ្ទិះដូង សាច់ជ្រូកចិញ្ច្រាំ និងគ្រឿង ញ៉ាំជាមួយបន្លែស្រស់។"}, "id": "prahok-ktis", "body": {"en": "Prahok ktis is a rich, creamy dip of prahok (fermented fish paste) simmered with coconut milk, minced pork and kroeung, often with pea eggplants for a little bitterness. Prahok has been the backbone of Khmer cooking for centuries, made each year when fish are plentiful, and prahok ktis is one of the gentlest ways to enjoy it. Families eat it with rice and a big plate of fresh and blanched vegetables for everyday meals.", "km": "ប្រហុកខ្ទិះ គឺជាម្ហូបជ្រលក់ខាប់ និងមានជាតិខ្លាញ់ ធ្វើពីប្រហុកដាំជាមួយខ្ទិះដូង សាច់ជ្រូកចិញ្ច្រាំ និងគ្រឿង ហើយច្រើនដាក់ត្រប់ពុកដើម្បីឱ្យមានរសជាតិល្វីងបន្តិច។ ប្រហុកជាគ្រឹះនៃការធ្វើម្ហូបខ្មែរតាំងពីរាប់សតវត្សមកហើយ ដោយគេធ្វើវារៀងរាល់ឆ្នាំនៅពេលមានត្រីច្រើន ហើយប្រហុកខ្ទិះគឺជាវិធីមួយដែលងាយញ៉ាំបំផុត។ គ្រួសារខ្មែរញ៉ាំវាជាមួយបាយ និងបន្លែស្រស់ ឬបន្លែស្ងោរមួយចានធំ ក្នុងអាហារប្រចាំថ្ងៃ។"}, "how": {"en": "Ingredients:\n- 2 tbsp prahok (fish paste, bones removed)\n- 200 g minced pork\n- 2 tbsp red or yellow kroeung (lemongrass, galangal, garlic, shallot, dried chilli)\n- 400 ml coconut milk\n- A handful of pea eggplants\n- 1 tsp palm sugar\n- 3 kaffir lime leaves and 2 fresh chillies\n- Cucumber, long beans, cabbage and eggplant to serve\n\nSteps:\n1. Simmer the thick part of the coconut milk until it begins to release its oil.\n2. Add the kroeung and fry until fragrant.\n3. Add the minced pork and prahok and stir until the pork is cooked.\n4. Pour in the rest of the coconut milk, add the pea eggplants and simmer until thick.\n5. Season with palm sugar and add the torn kaffir lime leaves and chilli.\n6. Serve warm with fresh and blanched vegetables and steamed rice.", "km": "គ្រឿងផ្សំ៖\n- ប្រហុក ២ ស្លាបព្រាបាយ (យកឆ្អឹងចេញ)\n- សាច់ជ្រូកចិញ្ច្រាំ ២០០ ក្រាម\n- គ្រឿងក្រហម ឬគ្រឿងលឿង ២ ស្លាបព្រាបាយ (ស្លឹកគ្រៃ រំដេង ខ្ទឹមស ខ្ទឹមក្រហម ម្ទេសក្រៀម)\n- ខ្ទិះដូង ៤០០ មីលីលីត្រ\n- ត្រប់ពុកមួយក្ដាប់\n- ស្ករត្នោត ១ ស្លាបព្រាកាហ្វេ\n- ស្លឹកក្រូចសើច ៣ សន្លឹក និងម្ទេសស្រស់ ២ គ្រាប់\n- ត្រសក់ សណ្ដែកកួរ ស្ពៃក្ដោប និងត្រប់ សម្រាប់ញ៉ាំជាមួយ\n\nរបៀបធ្វើ៖\n១. ដាំខ្ទិះដូងខាប់ រហូតដល់ចាប់ផ្ដើមចេញប្រេង។\n២. ដាក់គ្រឿង ហើយឆារហូតដល់ឈ្ងុយ។\n៣. ដាក់សាច់ជ្រូកចិញ្ច្រាំ និងប្រហុក ហើយឆារហូតដល់សាច់ឆ្អិន។\n៤. ចាក់ខ្ទិះដូងដែលនៅសល់ ដាក់ត្រប់ពុក ហើយដាំរហូតដល់ខាប់។\n៥. ប្រសស្ករត្នោត ហើយដាក់ស្លឹកក្រូចសើចហែក និងម្ទេស។\n៦. ញ៉ាំក្ដៅឧណ្ហៗជាមួយបន្លែស្រស់ បន្លែស្ងោរ និងបាយ។"}, "where": {"en": "Prahok ktis is found at traditional Khmer restaurants and home-style eateries across the country, and it is especially good in the provinces around the Tonle Sap, such as Siem Reap, Kampong Chhnang and Battambang, where prahok is made.", "km": "ប្រហុកខ្ទិះមានលក់នៅភោជនីយដ្ឋានខ្មែរប្រពៃណី និងហាងបាយបែបគ្រួសារទូទាំងប្រទេស ហើយវាឆ្ងាញ់ជាពិសេសនៅតាមខេត្តជុំវិញបឹងទន្លេសាប ដូចជា សៀមរាប កំពង់ឆ្នាំង និងបាត់ដំបង ដែលជាកន្លែងធ្វើប្រហុក។"}, "tip": {"en": "If you are new to prahok, this is the best dish to start with: the coconut milk softens its strong flavour.", "km": "ប្រសិនបើអ្នកទើបតែសាកញ៉ាំប្រហុកលើកដំបូង នេះជាម្ហូបល្អបំផុតដើម្បីចាប់ផ្ដើម ព្រោះខ្ទិះដូងធ្វើឱ្យរសជាតិខ្លាំងរបស់ប្រហុកស្រាលជាង។"}, "dish": {"en": "prahok", "km": "ប្រហុក"}}, {"title": {"en": "Teuk Kroeung", "km": "ទឹកគ្រឿង"}, "text": {"en": "A dipping sauce of prahok, lime, garlic and herbs for vegetables and grilled fish.", "km": "ទឹកជ្រលក់ធ្វើពីប្រហុក ក្រូចឆ្មា ខ្ទឹមស និងជីរ សម្រាប់បន្លែ និងត្រីអាំង។"}, "id": "teuk-kroeung", "body": {"en": "Teuk kroeung is a thick, savoury dipping sauce made from prahok or fish, lime juice, garlic, lemongrass, chilli and herbs. It is one of the oldest and simplest parts of a Khmer meal, served in a small bowl in the middle of the table for everyone to share. Cambodians eat it every day with fresh vegetables, grilled fish and rice, especially in the countryside.", "km": "ទឹកគ្រឿង គឺជាទឹកជ្រលក់ខាប់ មានរសជាតិឆ្ងាញ់ ធ្វើពីប្រហុក ឬត្រី ទឹកក្រូចឆ្មា ខ្ទឹមស ស្លឹកគ្រៃ ម្ទេស និងជីរ។ វាជាផ្នែកមួយចាស់ និងសាមញ្ញបំផុតនៃអាហារខ្មែរ ដែលគេដាក់ក្នុងចានតូចមួយនៅកណ្ដាលតុ សម្រាប់ទាំងអស់គ្នាញ៉ាំរួមគ្នា។ ប្រជាជនខ្មែរញ៉ាំវារៀងរាល់ថ្ងៃជាមួយបន្លែស្រស់ ត្រីអាំង និងបាយ ជាពិសេសនៅតាមជនបទ។"}, "how": {"en": "Ingredients:\n- 1 small grilled fish (snakehead or mackerel), flesh picked\n- 1 tbsp prahok, wrapped in banana leaf and grilled\n- 1 stalk lemongrass, finely sliced\n- 3 cloves garlic\n- 2 to 3 fresh chillies\n- Juice of 2 limes and 1 tsp palm sugar\n- 2 tbsp roasted peanuts and a few sliced pea eggplants\n- Cucumber, long beans and cabbage to serve\n\nSteps:\n1. Pound the lemongrass, garlic and chilli in a mortar.\n2. Add the grilled prahok and fish flesh and pound to a rough paste.\n3. Loosen with lime juice and a little warm water.\n4. Season with palm sugar until salty, sour and slightly sweet.\n5. Stir in the crushed peanuts and pea eggplants.\n6. Serve in a small bowl with fresh vegetables, grilled fish and rice.", "km": "គ្រឿងផ្សំ៖\n- ត្រីអាំងតូច ១ ក្បាល (ត្រីរ៉ស់ ឬត្រីកាម៉ុង) រាវយកសាច់\n- ប្រហុក ១ ស្លាបព្រាបាយ ខ្ចប់ស្លឹកចេក ហើយអាំង\n- ស្លឹកគ្រៃ ១ ដើម ហាន់ល្អិត\n- ខ្ទឹមស ៣ កំពឹស\n- ម្ទេសស្រស់ ២ ទៅ ៣ គ្រាប់\n- ទឹកក្រូចឆ្មា ២ ផ្លែ និងស្ករត្នោត ១ ស្លាបព្រាកាហ្វេ\n- សណ្ដែកដីលីង ២ ស្លាបព្រាបាយ និងត្រប់ពុកហាន់បន្តិច\n- ត្រសក់ សណ្ដែកកួរ និងស្ពៃក្ដោប សម្រាប់ញ៉ាំជាមួយ\n\nរបៀបធ្វើ៖\n១. បុកស្លឹកគ្រៃ ខ្ទឹមស និងម្ទេស ក្នុងត្បាល់។\n២. ដាក់ប្រហុកអាំង និងសាច់ត្រី ហើយបុកឱ្យល្អិតល្មម។\n៣. បន្ថែមទឹកក្រូចឆ្មា និងទឹកក្ដៅឧណ្ហៗបន្តិច ឱ្យរាវល្មម។\n៤. ប្រសស្ករត្នោត ឱ្យមានរសជាតិប្រៃ ជូរ និងផ្អែមបន្តិច។\n៥. ដាក់សណ្ដែកដីបុក និងត្រប់ពុក ហើយកូរឱ្យសព្វ។\n៦. ដាក់ក្នុងចានតូច ហើយញ៉ាំជាមួយបន្លែស្រស់ ត្រីអាំង និងបាយ។"}, "where": {"en": "Teuk kroeung is served at countryside eateries, Khmer family restaurants and riverside and lakeside rest huts, often as part of a grilled fish set. Restaurants in Siem Reap and around the Tonle Sap make some of the best versions.", "km": "ទឹកគ្រឿងមានលក់នៅតាមហាងបាយជនបទ ភោជនីយដ្ឋានខ្មែរបែបគ្រួសារ និងខ្ទមសម្រាកតាមមាត់ទន្លេ និងមាត់បឹង ជាញឹកញាប់ជាផ្នែកមួយនៃឈុតត្រីអាំង។ ភោជនីយដ្ឋាននៅសៀមរាប និងជុំវិញបឹងទន្លេសាប ធ្វើទឹកគ្រឿងបានឆ្ងាញ់ជាងគេ។"}, "tip": {"en": "Use it as a dip, not a soup: take a little on a piece of cucumber or long bean and eat it with a mouthful of rice.", "km": "សូមញ៉ាំវាជាទឹកជ្រលក់ មិនមែនជាសម្លទេ៖ យកបន្តិចដាក់លើត្រសក់ ឬសណ្ដែកកួរ ហើយញ៉ាំជាមួយបាយមួយម៉ាត់។"}, "dish": {"en": "teuk kroeung", "km": "ទឹកគ្រឿង"}}], "foodStreet": [{"title": {"en": "Bai Sach Chrouk (Pork and Rice)", "km": "បាយសាច់ជ្រូក"}, "text": {"en": "Sweet grilled pork on broken rice with pickles, the classic breakfast.", "km": "សាច់ជ្រូកអាំងផ្អែម លើបាយ ជាមួយជ្រក់ ជាអាហារពេលព្រឹកដ៏ល្បី។"}, "id": "bai-sach-chrouk", "body": {"en": "Bai sach chrouk is thinly sliced pork marinated in garlic, palm sugar and coconut milk, grilled slowly over charcoal and served on broken rice with pickled vegetables and a small bowl of clear broth. It is the classic Cambodian breakfast, and the smell of pork grilling on street corners is one of the first signs of morning in any town. Most Cambodians eat it between dawn and about nine o'clock before work or school.", "km": "បាយសាច់ជ្រូក គឺជាសាច់ជ្រូកហាន់ស្ដើងៗ ប្រឡាក់ជាមួយខ្ទឹមស ស្ករត្នោត និងខ្ទិះដូង អាំងយឺតៗលើភ្លើងធ្យូង ហើយដាក់លើបាយ ជាមួយជ្រក់បន្លែ និងស៊ុបថ្លាមួយចានតូច។ វាជាអាហារពេលព្រឹកបែបខ្មែរដ៏ល្បី ហើយក្លិនសាច់ជ្រូកអាំងនៅតាមកែងផ្លូវ គឺជាសញ្ញាដំបូងនៃពេលព្រឹកនៅគ្រប់ទីក្រុង។ ប្រជាជនខ្មែរភាគច្រើនញ៉ាំវាចាប់ពីព្រលឹមរហូតដល់ប្រហែលម៉ោង ៩ មុនពេលទៅធ្វើការ ឬទៅសាលា។"}, "how": {"en": "Ingredients:\n- 500 g pork shoulder or neck, sliced thin\n- 4 cloves garlic, minced\n- 2 tbsp palm sugar\n- 2 tbsp fish sauce and 1 tbsp light soy sauce\n- 100 ml coconut milk\n- Steamed broken rice\n- Pickled cucumber, carrot and daikon\n- A fried egg and spring onions (optional)\n\nSteps:\n1. Mix the garlic, palm sugar, fish sauce, soy sauce and coconut milk into a marinade.\n2. Marinate the pork for at least 2 hours, or overnight for the best flavour.\n3. Grill the pork slowly over hot charcoal, turning often, until caramelised at the edges.\n4. Slice the pork into strips.\n5. Serve over broken rice with the pickles, a fried egg if you like, and a small bowl of clear broth with spring onions.", "km": "គ្រឿងផ្សំ៖\n- សាច់ជ្រូកស្មា ឬសាច់ក ៥០០ ក្រាម ហាន់ស្ដើងៗ\n- ខ្ទឹមស ៤ កំពឹស ចិញ្ច្រាំ\n- ស្ករត្នោត ២ ស្លាបព្រាបាយ\n- ទឹកត្រី ២ ស្លាបព្រាបាយ និងទឹកស៊ីអ៊ីវ ១ ស្លាបព្រាបាយ\n- ខ្ទិះដូង ១០០ មីលីលីត្រ\n- បាយអង្ករបែក\n- ជ្រក់ត្រសក់ ការ៉ុត និងឆៃថាវ\n- ស៊ុតចៀន និងស្លឹកខ្ទឹម (តាមចិត្ត)\n\nរបៀបធ្វើ៖\n១. លាយខ្ទឹមស ស្ករត្នោត ទឹកត្រី ទឹកស៊ីអ៊ីវ និងខ្ទិះដូង ធ្វើជាគ្រឿងប្រឡាក់។\n២. ប្រឡាក់សាច់ជ្រូកយ៉ាងហោចណាស់ ២ ម៉ោង ឬទុកមួយយប់ ដើម្បីឱ្យឆ្ងាញ់បំផុត។\n៣. អាំងសាច់ជ្រូកយឺតៗលើភ្លើងធ្យូង ដោយត្រឡប់ញឹកញាប់ រហូតដល់គែមសាច់ឡើងពណ៌ក្រហមស្ករ។\n៤. ហាន់សាច់ជ្រូកជាបន្ទះ។\n៥. ដាក់លើបាយ ជាមួយជ្រក់ ស៊ុតចៀនតាមចិត្ត និងស៊ុបថ្លាមួយចានតូចដាក់ស្លឹកខ្ទឹម។"}, "where": {"en": "Bai sach chrouk is sold from early morning at street-side stalls, markets and small shops in every town and city in Cambodia; just follow the smoke from the charcoal grills.", "km": "បាយសាច់ជ្រូកមានលក់តាំងពីព្រលឹម នៅតាមតូបចិញ្ចើមផ្លូវ ផ្សារ និងហាងតូចៗ នៅគ្រប់ទីក្រុង និងទីប្រជុំជនក្នុងប្រទេសកម្ពុជា។ គ្រាន់តែដើរតាមផ្សែងចង្ក្រានអាំងធ្យូង ក៏រកឃើញហើយ។"}, "tip": {"en": "Go before 9 am for the freshest pork, and ask for an extra fried egg on top for a heartier breakfast.", "km": "សូមទៅមុនម៉ោង ៩ ព្រឹក ដើម្បីបានសាច់អាំងថ្មីៗ ហើយអាចសុំស៊ុតចៀនបន្ថែមពីលើ សម្រាប់អាហារពេលព្រឹកឆ្អែតជាងមុន។"}, "dish": {"en": "pork rice", "km": "បាយសាច់ជ្រូក"}}, {"title": {"en": "Lok Lak (Beef Lok Lak)", "km": "ឡុកឡាក់"}, "text": {"en": "Stir-fried beef cubes with a lime and black pepper dip, served with egg and rice.", "km": "សាច់គោឆាជាដុំ ជាមួយទឹកជ្រលក់ក្រូចឆ្មា និងម្រេច បម្រើជាមួយស៊ុត និងបាយ។"}, "id": "lok-lak", "body": {"en": "Lok lak is tender cubes of beef stir-fried in a savoury, slightly sweet sauce and served over lettuce, tomato, cucumber and onion, with rice, often a fried egg, and a dipping sauce of lime juice, salt and black pepper. The pepper dip is the heart of the dish, and in Cambodia it is often made with famous Kampot pepper. It is a popular lunch and dinner dish, loved by Cambodians and visitors alike.", "km": "ឡុកឡាក់ គឺជាសាច់គោទន់កាត់ជាដុំៗ ឆាក្នុងទឹកជ្រលក់ប្រៃផ្អែមបន្តិច ហើយដាក់លើសាឡាត់ ប៉េងប៉ោះ ត្រសក់ និងខ្ទឹមបារាំង ញ៉ាំជាមួយបាយ ជាញឹកញាប់មានស៊ុតចៀន និងទឹកជ្រលក់ធ្វើពីទឹកក្រូចឆ្មា អំបិល និងម្រេច។ ទឹកជ្រលក់ម្រេចគឺជាបេះដូងនៃម្ហូបនេះ ហើយនៅកម្ពុជា គេច្រើនប្រើម្រេចកំពតដ៏ល្បីល្បាញ។ វាជាម្ហូបពេញនិយមសម្រាប់អាហារថ្ងៃត្រង់ និងពេលល្ងាច ដែលទាំងប្រជាជនខ្មែរ និងភ្ញៀវទេសចរចូលចិត្ត។"}, "how": {"en": "Ingredients:\n- 400 g beef sirloin, cut into 2 cm cubes\n- 3 cloves garlic, minced\n- 1 tbsp oyster sauce, 1 tbsp light soy sauce and 1 tbsp fish sauce\n- 1 tsp sugar and 1 tbsp tomato ketchup (optional)\n- Lettuce, tomato, cucumber and red onion\n- 2 eggs\n- Dip: juice of 2 limes, 1 tsp salt and 1 tsp ground Kampot black pepper\n\nSteps:\n1. Marinate the beef with garlic, oyster sauce, soy sauce, fish sauce and sugar for 30 minutes.\n2. Arrange the lettuce, tomato, cucumber and onion on a plate.\n3. Stir-fry the beef in a very hot pan for 2 to 3 minutes so it stays juicy, adding the ketchup at the end if you like.\n4. Spoon the beef over the vegetables.\n5. Fry the eggs and place them on top or beside the rice.\n6. Mix the lime juice, salt and pepper in a small bowl and serve as the dip.", "km": "គ្រឿងផ្សំ៖\n- សាច់គោស្នាក់ ៤០០ ក្រាម កាត់ជាដុំ ២ សង់ទីម៉ែត្រ\n- ខ្ទឹមស ៣ កំពឹស ចិញ្ច្រាំ\n- ប្រេងខ្យង ១ ស្លាបព្រាបាយ ទឹកស៊ីអ៊ីវ ១ ស្លាបព្រាបាយ និងទឹកត្រី ១ ស្លាបព្រាបាយ\n- ស្ករ ១ ស្លាបព្រាកាហ្វេ និងទឹកប៉េងប៉ោះ ១ ស្លាបព្រាបាយ (តាមចិត្ត)\n- សាឡាត់ ប៉េងប៉ោះ ត្រសក់ និងខ្ទឹមបារាំងក្រហម\n- ស៊ុត ២ គ្រាប់\n- ទឹកជ្រលក់៖ ទឹកក្រូចឆ្មា ២ ផ្លែ អំបិល ១ ស្លាបព្រាកាហ្វេ និងម្រេចខ្មៅកំពតបុក ១ ស្លាបព្រាកាហ្វេ\n\nរបៀបធ្វើ៖\n១. ប្រឡាក់សាច់គោជាមួយខ្ទឹមស ប្រេងខ្យង ទឹកស៊ីអ៊ីវ ទឹកត្រី និងស្ករ រយៈពេល ៣០ នាទី។\n២. រៀបសាឡាត់ ប៉េងប៉ោះ ត្រសក់ និងខ្ទឹមបារាំងលើចាន។\n៣. ឆាសាច់គោក្នុងខ្ទះក្ដៅខ្លាំង ២ ទៅ ៣ នាទី ដើម្បីឱ្យសាច់នៅទន់ និងមានទឹក ហើយដាក់ទឹកប៉េងប៉ោះនៅចុងក្រោយតាមចិត្ត។\n៤. ដួសសាច់គោដាក់ពីលើបន្លែ។\n៥. ចៀនស៊ុត ហើយដាក់ពីលើ ឬនៅក្បែរបាយ។\n៦. លាយទឹកក្រូចឆ្មា អំបិល និងម្រេច ក្នុងចានតូច ធ្វើជាទឹកជ្រលក់។"}, "where": {"en": "Lok lak is on the menu at almost every Khmer restaurant and many market food stalls in Phnom Penh, Siem Reap, Battambang and Kampot. In Kampot and Kep, try it with freshly ground local pepper.", "km": "ឡុកឡាក់មាននៅក្នុងបញ្ជីម្ហូបរបស់ភោជនីយដ្ឋានខ្មែរស្ទើរតែទាំងអស់ និងតូបម្ហូបក្នុងផ្សារជាច្រើន នៅភ្នំពេញ សៀមរាប បាត់ដំបង និងកំពត។ នៅកំពត និងកែប សូមសាកញ៉ាំវាជាមួយម្រេចក្នុងស្រុកដែលទើបបុកថ្មីៗ។"}, "tip": {"en": "Dip each piece of beef into the lime and pepper sauce before eating; it is what makes lok lak special.", "km": "សូមជ្រលក់សាច់គោម្ដងមួយដុំៗ ក្នុងទឹកក្រូចឆ្មាម្រេច មុនពេលញ៉ាំ ព្រោះនោះហើយជាអ្វីដែលធ្វើឱ្យឡុកឡាក់ពិសេស។"}, "dish": {"en": "lok lak", "km": "ឡុកឡាក់"}}, {"title": {"en": "Kuy Teav (Phnom Penh Noodle Soup)", "km": "គុយទាវភ្នំពេញ"}, "text": {"en": "Rice noodles in a clear pork broth with herbs and lime, a morning favourite.", "km": "គុយទាវក្នុងទឹកស៊ុបសាច់ជ្រូកថ្លា ជាមួយជីរ និងក្រូចឆ្មា ពេញនិយមពេលព្រឹក។"}, "id": "kuy-teav", "body": {"en": "Kuy teav is a bowl of rice noodles in a clear, delicate broth simmered from pork bones and dried seafood, topped with sliced pork, meatballs, offal or seafood, fried garlic and fresh herbs. The Phnom Penh style, with its rich mix of toppings, is the best known, and the dish is a symbol of the capital's busy mornings. Cambodians eat it mainly for breakfast, seasoning each bowl at the table with lime, chilli and sauces.", "km": "គុយទាវ គឺជាគុយទាវក្នុងទឹកស៊ុបថ្លាឆ្ងាញ់ ដែលដាំពីឆ្អឹងជ្រូក និងគ្រឿងសមុទ្រស្ងួត ដាក់សាច់ជ្រូកហាន់ ប្រហិត គ្រឿងក្នុង ឬគ្រឿងសមុទ្រ ខ្ទឹមសចៀន និងជីរស្រស់ពីលើ។ គុយទាវភ្នំពេញ ដែលមានគ្រឿងដាក់ពីលើច្រើនមុខ គឺល្បីជាងគេ ហើយវាជានិមិត្តរូបនៃពេលព្រឹកដ៏មមាញឹករបស់រាជធានី។ ប្រជាជនខ្មែរញ៉ាំវាភាគច្រើនពេលព្រឹក ហើយបន្ថែមរសជាតិនៅលើតុដោយក្រូចឆ្មា ម្ទេស និងទឹកជ្រលក់ផ្សេងៗ។"}, "how": {"en": "Ingredients:\n- 1 kg pork bones and 1 small piece of daikon\n- 2 tbsp dried shrimp and 1 dried squid (optional)\n- 400 g dried rice noodles (kuy teav)\n- 200 g pork loin, boiled and sliced, and a few pork meatballs\n- Fish sauce, a little rock sugar and salt\n- Bean sprouts, spring onions and fried garlic\n- Lime wedges, sliced chilli and pepper\n\nSteps:\n1. Blanch the pork bones, rinse, then simmer with daikon, dried shrimp and dried squid for 2 to 3 hours, skimming often.\n2. Season the broth with fish sauce, rock sugar and salt; it should be clear and light.\n3. Soak the noodles in water, then dip them briefly in boiling water to soften.\n4. Place the noodles in a bowl with bean sprouts, sliced pork and meatballs.\n5. Ladle over the hot broth.\n6. Top with spring onions and fried garlic, and serve with lime, chilli and pepper.", "km": "គ្រឿងផ្សំ៖\n- ឆ្អឹងជ្រូក ១ គីឡូក្រាម និងឆៃថាវមួយដុំតូច\n- បង្គាក្រៀម ២ ស្លាបព្រាបាយ និងមឹកក្រៀម ១ (តាមចិត្ត)\n- គុយទាវស្ងួត ៤០០ ក្រាម\n- សាច់ជ្រូកសុទ្ធ ២០០ ក្រាម ស្ងោរហើយហាន់ និងប្រហិតសាច់ជ្រូកខ្លះ\n- ទឹកត្រី ស្ករគ្រាប់បន្តិច និងអំបិល\n- សណ្ដែកបណ្ដុះ ស្លឹកខ្ទឹម និងខ្ទឹមសចៀន\n- ក្រូចឆ្មា ម្ទេសហាន់ និងម្រេច\n\nរបៀបធ្វើ៖\n១. ស្រុះឆ្អឹងជ្រូក លាងឱ្យស្អាត រួចដាំជាមួយឆៃថាវ បង្គាក្រៀម និងមឹកក្រៀម ២ ទៅ ៣ ម៉ោង ដោយស្កូបពពុះចេញញឹកញាប់។\n២. ប្រសទឹកស៊ុបជាមួយទឹកត្រី ស្ករគ្រាប់ និងអំបិល។ ទឹកស៊ុបគួរតែថ្លា និងស្រាល។\n៣. ត្រាំគុយទាវក្នុងទឹក រួចស្រុះក្នុងទឹកពុះបន្តិចឱ្យទន់។\n៤. ដាក់គុយទាវក្នុងចាន ជាមួយសណ្ដែកបណ្ដុះ សាច់ជ្រូកហាន់ និងប្រហិត។\n៥. ចាក់ទឹកស៊ុបក្ដៅៗពីលើ។\n៦. រោយស្លឹកខ្ទឹម និងខ្ទឹមសចៀនពីលើ ហើយញ៉ាំជាមួយក្រូចឆ្មា ម្ទេស និងម្រេច។"}, "where": {"en": "Kuy teav shops open at dawn in every market and on busy streets across Phnom Penh and the provinces; the capital's markets are famous for their noodle stalls, many run by the same families for decades.", "km": "ហាងគុយទាវបើកតាំងពីព្រលឹម នៅគ្រប់ផ្សារ និងតាមផ្លូវមមាញឹកទូទាំងភ្នំពេញ និងតាមខេត្ត។ ផ្សារនានាក្នុងរាជធានីល្បីខាងតូបគុយទាវ ដែលភាគច្រើនគ្រួសារតែមួយបានលក់រាប់សិបឆ្នាំមកហើយ។"}, "tip": {"en": "Taste the broth first, then add lime, chilli and pepper to your liking; you can also ask for the soup on the side to keep the noodles firm.", "km": "សូមភ្លក់ទឹកស៊ុបមុនសិន រួចបន្ថែមក្រូចឆ្មា ម្ទេស និងម្រេចតាមចិត្ត។ អ្នកក៏អាចសុំទឹកស៊ុបដាក់ដាច់ដោយឡែក ដើម្បីឱ្យគុយទាវនៅរឹងល្អ។"}, "dish": {"en": "kuy teav", "km": "គុយទាវ"}}, {"title": {"en": "Lort Cha (Stir-Fried Short Noodles)", "km": "លតឆា"}, "text": {"en": "Short rice noodles stir-fried with bean sprouts, chives, egg and sweet soy sauce.", "km": "លតឆាជាមួយសណ្ដែកបណ្ដុះ គូឆាយ ស៊ុត និងទឹកស៊ីអ៊ីវផ្អែម។"}, "id": "lort-cha", "body": {"en": "Lort cha is short, chewy rice noodles, rounded at both ends, stir-fried in a hot wok with bean sprouts, garlic chives and beef or pork, seasoned with sweet and savoury soy sauce and topped with a fried egg. It is one of Cambodia's most popular street snacks and a cheap, filling meal at any time of day. Cambodians love it for an afternoon snack or a quick lunch at the market.", "km": "លតឆា គឺជាលតខ្លីៗ ស្វិតៗ ធ្វើពីម្សៅអង្ករ មានចុងទាំងសងខាងមូល ឆាក្នុងខ្ទះក្ដៅជាមួយសណ្ដែកបណ្ដុះ គូឆាយ និងសាច់គោ ឬសាច់ជ្រូក ប្រសទឹកស៊ីអ៊ីវផ្អែម និងប្រៃ ហើយដាក់ស៊ុតចៀនពីលើ។ វាជាអាហារសម្រន់តាមផ្លូវមួយដែលពេញនិយមបំផុតនៅកម្ពុជា ហើយជាអាហារថោក និងឆ្អែតនៅគ្រប់ពេលវេលា។ ប្រជាជនខ្មែរចូលចិត្តញ៉ាំវាជាអាហារសម្រន់ពេលរសៀល ឬអាហារថ្ងៃត្រង់រហ័សនៅផ្សារ។"}, "how": {"en": "Ingredients:\n- 400 g fresh lort (short rice noodles)\n- 100 g beef or pork, thinly sliced\n- 2 cups bean sprouts\n- A handful of garlic chives, cut into short lengths\n- 3 cloves garlic, minced\n- 2 tbsp sweet soy sauce, 1 tbsp light soy sauce and 1 tbsp fish sauce\n- 2 eggs\n- Pickled green papaya and sweet chilli sauce to serve\n\nSteps:\n1. Heat oil in a wok and fry the garlic until golden.\n2. Add the meat and stir-fry until just cooked.\n3. Add the noodles and the sauces and toss over high heat for 2 to 3 minutes.\n4. Add the bean sprouts and chives and toss briefly so they stay crisp.\n5. Fry the eggs separately, sunny side up.\n6. Serve the noodles topped with an egg, with pickles and chilli sauce on the side.", "km": "គ្រឿងផ្សំ៖\n- លតស្រស់ ៤០០ ក្រាម\n- សាច់គោ ឬសាច់ជ្រូក ១០០ ក្រាម ហាន់ស្ដើងៗ\n- សណ្ដែកបណ្ដុះ ២ កែវ\n- គូឆាយមួយក្ដាប់ កាត់ខ្លីៗ\n- ខ្ទឹមស ៣ កំពឹស ចិញ្ច្រាំ\n- ទឹកស៊ីអ៊ីវផ្អែម ២ ស្លាបព្រាបាយ ទឹកស៊ីអ៊ីវ ១ ស្លាបព្រាបាយ និងទឹកត្រី ១ ស្លាបព្រាបាយ\n- ស៊ុត ២ គ្រាប់\n- ជ្រក់ល្ហុង និងទឹកម្ទេសផ្អែម សម្រាប់ញ៉ាំជាមួយ\n\nរបៀបធ្វើ៖\n១. ដាក់ប្រេងក្នុងខ្ទះឱ្យក្ដៅ ហើយចៀនខ្ទឹមសរហូតដល់លឿង។\n២. ដាក់សាច់ ហើយឆារហូតដល់ទើបតែឆ្អិន។\n៣. ដាក់លត និងទឹកជ្រលក់ទាំងអស់ ហើយឆាលើភ្លើងខ្លាំង ២ ទៅ ៣ នាទី។\n៤. ដាក់សណ្ដែកបណ្ដុះ និងគូឆាយ ហើយឆាបន្តិចឱ្យនៅស្រួយ។\n៥. ចៀនស៊ុតដោយឡែក ទុកឱ្យនៅពងក្រហម។\n៦. ដាក់ស៊ុតពីលើលតឆា ហើយញ៉ាំជាមួយជ្រក់ និងទឹកម្ទេស។"}, "where": {"en": "Lort cha is cooked to order on hot griddles and woks at market food halls, school gates and night markets across Phnom Penh, Siem Reap and Battambang.", "km": "លតឆាត្រូវបានឆាតាមការកុម្ម៉ង់ លើខ្ទះក្ដៅៗ នៅតាមកន្លែងលក់ម្ហូបក្នុងផ្សារ មុខសាលារៀន និងផ្សាររាត្រី នៅភ្នំពេញ សៀមរាប និងបាត់ដំបង។"}, "tip": {"en": "Add a spoonful of the sweet chilli sauce and pickled papaya from the table; they cut through the richness perfectly.", "km": "សូមបន្ថែមទឹកម្ទេសផ្អែម និងជ្រក់ល្ហុងពីលើតុមួយស្លាបព្រា ព្រោះវាធ្វើឱ្យរសជាតិមិនធុញ និងស្រស់ល្អ។"}, "dish": {"en": "lort cha", "km": "លតឆា"}}, {"title": {"en": "Num Pang (Cambodian Baguette Sandwich)", "km": "នំបុ័ងសាច់"}, "text": {"en": "A crusty baguette with pâté, pickles, meat and chilli.", "km": "នំបុ័ងស្រួយ ជាមួយប៉ាតេ ជ្រក់ សាច់ និងម្ទេស។"}, "id": "num-pang", "body": {"en": "Num pang is a crusty baguette split open and filled with pâté, cured or grilled meat, pickled green papaya and carrot, cucumber, herbs and chilli sauce. Bread arrived in Cambodia during the colonial period, and Khmer bakers and street vendors made it their own with local fillings and pickles. Today it is an everyday breakfast and an easy snack to eat on the go at any time of day.", "km": "នំបុ័ងសាច់ គឺជានំបុ័ងស្រួយ ដែលគេពុះចំកណ្ដាល ហើយញាត់ប៉ាតេ សាច់ក្រកៀម ឬសាច់អាំង ជ្រក់ល្ហុង និងការ៉ុត ត្រសក់ ជីរ និងទឹកម្ទេស។ នំបុ័ងបានមកដល់កម្ពុជាក្នុងសម័យអាណានិគម ហើយអ្នកដុតនំ និងអ្នកលក់តាមផ្លូវខ្មែរ បានកែច្នៃវាជាបែបខ្មែរ ជាមួយគ្រឿងញាត់ និងជ្រក់ក្នុងស្រុក។ សព្វថ្ងៃនេះ វាជាអាហារពេលព្រឹកប្រចាំថ្ងៃ និងជាអាហារសម្រន់ងាយស្រួលញ៉ាំតាមផ្លូវ នៅគ្រប់ពេលវេលា។"}, "how": {"en": "Ingredients:\n- 2 fresh baguettes\n- 4 tbsp pork liver pâté\n- 150 g grilled pork, ham or Khmer sausage, sliced\n- Pickled green papaya and carrot\n- Cucumber, cut into sticks\n- Coriander and spring onions\n- Chilli sauce and a little soy sauce or Maggi seasoning\n\nSteps:\n1. Warm the baguettes on a grill or in the oven until the crust is crisp.\n2. Split them lengthwise without cutting all the way through.\n3. Spread a generous layer of pâté inside.\n4. Add the sliced meat, then the pickles and cucumber.\n5. Top with herbs, a drizzle of soy sauce and chilli sauce to taste.\n6. Press closed and eat while the bread is still warm.", "km": "គ្រឿងផ្សំ៖\n- នំបុ័ងស្រស់ ២ ដើម\n- ប៉ាតេថ្លើមជ្រូក ៤ ស្លាបព្រាបាយ\n- សាច់ជ្រូកអាំង សាច់ក្រកៀម ឬសាច់ក្រកខ្មែរ ១៥០ ក្រាម ហាន់\n- ជ្រក់ល្ហុង និងការ៉ុត\n- ត្រសក់ កាត់ជាចម្រៀក\n- វ៉ាន់ស៊ុយ និងស្លឹកខ្ទឹម\n- ទឹកម្ទេស និងទឹកស៊ីអ៊ីវ ឬម៉ាហ្គីបន្តិច\n\nរបៀបធ្វើ៖\n១. កម្ដៅនំបុ័ងលើចង្ក្រានអាំង ឬក្នុងឡ រហូតដល់សំបកស្រួយ។\n២. ពុះនំបុ័ងតាមបណ្ដោយ ដោយមិនកាត់ដាច់ទាំងស្រុង។\n៣. លាបប៉ាតេឱ្យបានច្រើនខាងក្នុង។\n៤. ដាក់សាច់ហាន់ រួចដាក់ជ្រក់ និងត្រសក់។\n៥. ដាក់ជីរ ទឹកស៊ីអ៊ីវបន្តិច និងទឹកម្ទេសតាមចិត្ត។\n៦. សង្កត់ឱ្យជិត ហើយញ៉ាំពេលនំបុ័ងនៅក្ដៅ។"}, "where": {"en": "Num pang carts and small stalls are on street corners, outside schools and in markets in every Cambodian town, usually from early morning until late at night.", "km": "រទេះ និងតូបលក់នំបុ័ងសាច់តូចៗ មាននៅតាមកែងផ្លូវ មុខសាលារៀន និងក្នុងផ្សារ នៅគ្រប់ទីក្រុងក្នុងប្រទេសកម្ពុជា ជាធម្មតាចាប់ពីព្រលឹមរហូតដល់យប់ជ្រៅ។"}, "tip": {"en": "Tell the vendor how spicy you want it, and ask for it toasted if the bread is not warm.", "km": "សូមប្រាប់អ្នកលក់ថាអ្នកចង់ហឹរប៉ុណ្ណា ហើយប្រសិនបើនំបុ័ងមិនក្ដៅ សូមសុំឱ្យគេអាំងបន្តិច។"}, "dish": {"en": "baguette", "km": "នំបុ័ង"}}, {"title": {"en": "Fried Chive Cakes (Num Kachay)", "km": "នំកាច់ឆាយ"}, "text": {"en": "Pan-fried chive cakes, crispy outside, dipped in sweet chilli fish sauce.", "km": "នំកាច់ឆាយចៀន ស្រួយខាងក្រៅ ជ្រលក់ទឹកត្រីផ្អែមហឹរ។"}, "id": "fried-chive-cakes", "body": {"en": "Num kachay are chewy rice-flour cakes packed with chopped garlic chives, pan-fried on a wide griddle until golden and crispy on the outside and soft inside. They are served with a sweet, sour and spicy fish sauce dip. Cambodians enjoy them as an afternoon snack from street carts and market stalls.", "km": "នំកូឆាយ គឺជានំស្វិតធ្វើពីម្សៅអង្ករ ញាត់គូឆាយហាន់ច្រើន ចៀនលើខ្ទះរាបធំ រហូតដល់លឿងស្រួយខាងក្រៅ និងទន់ខាងក្នុង។ គេញ៉ាំវាជាមួយទឹកត្រីផ្អែម ជូរ និងហឹរ។ ប្រជាជនខ្មែរចូលចិត្តញ៉ាំវាជាអាហារសម្រន់ពេលរសៀល ពីរទេះលក់តាមផ្លូវ និងតូបក្នុងផ្សារ។"}, "how": {"en": "Ingredients:\n- 200 g rice flour\n- 50 g tapioca starch\n- 300 ml water\n- 1 tsp salt\n- 2 large bunches of garlic chives, chopped\n- Vegetable oil for frying\n- Dip: 3 tbsp fish sauce, 2 tbsp sugar, juice of 1 lime, garlic and chilli\n\nSteps:\n1. Mix the rice flour, tapioca starch, salt and water into a smooth batter.\n2. Cook the batter in a pan over low heat, stirring, until it becomes a thick, sticky dough; let it cool slightly.\n3. Knead in the chopped chives.\n4. Shape into small flat cakes and steam for about 10 minutes until translucent.\n5. Pan-fry the cakes in a little oil until golden and crisp on both sides.\n6. Mix the dip ingredients with a splash of water and serve with the hot cakes.", "km": "គ្រឿងផ្សំ៖\n- ម្សៅអង្ករ ២០០ ក្រាម\n- ម្សៅមី ៥០ ក្រាម\n- ទឹក ៣០០ មីលីលីត្រ\n- អំបិល ១ ស្លាបព្រាកាហ្វេ\n- គូឆាយ ២ ចង់ធំ ហាន់ល្អិត\n- ប្រេងឆា សម្រាប់ចៀន\n- ទឹកជ្រលក់៖ ទឹកត្រី ៣ ស្លាបព្រាបាយ ស្ករ ២ ស្លាបព្រាបាយ ទឹកក្រូចឆ្មា ១ ផ្លែ ខ្ទឹមស និងម្ទេស\n\nរបៀបធ្វើ៖\n១. លាយម្សៅអង្ករ ម្សៅមី អំបិល និងទឹក ឱ្យសព្វម៉ដ្ឋ។\n២. ដាំល្បាយម្សៅលើភ្លើងតិចៗ ដោយកូរជាប់ រហូតដល់ក្លាយជាម្សៅខាប់ស្អិត រួចទុកឱ្យត្រជាក់បន្តិច។\n៣. ដាក់គូឆាយ ហើយច្របាច់ឱ្យសព្វ។\n៤. ពូតជានំរាងសំប៉ែតតូចៗ ហើយចំហុយប្រហែល ១០ នាទី រហូតដល់ថ្លា។\n៥. ចៀននំជាមួយប្រេងបន្តិច រហូតដល់លឿងស្រួយទាំងសងខាង។\n៦. លាយគ្រឿងទឹកជ្រលក់ជាមួយទឹកបន្តិច ហើយញ៉ាំជាមួយនំក្ដៅៗ។"}, "where": {"en": "Look for the wide, flat griddles of num kachay vendors at markets, near schools and along busy streets in the afternoon, especially in Phnom Penh, Siem Reap and Battambang.", "km": "សូមស្វែងរកខ្ទះរាបធំៗរបស់អ្នកលក់នំកូឆាយ នៅតាមផ្សារ ជិតសាលារៀន និងតាមផ្លូវមមាញឹកពេលរសៀល ជាពិសេសនៅភ្នំពេញ សៀមរាប និងបាត់ដំបង។"}, "tip": {"en": "Eat them straight from the griddle while they are still crisp, and spoon the dipping sauce generously over the top.", "km": "សូមញ៉ាំភ្លាមៗពេលទើបតែចៀនរួច ខណៈនៅស្រួយ ហើយចាក់ទឹកជ្រលក់ពីលើឱ្យបានច្រើន។"}, "dish": {"en": "chive cake", "km": "នំកូឆាយ"}}, {"title": {"en": "Grilled Squid (Muthang)", "km": "មឹកអាំង"}, "text": {"en": "Squid grilled over charcoal at the seaside, served with green Kampot pepper sauce.", "km": "មឹកអាំងលើធ្យូង នៅមាត់សមុទ្រ ញ៉ាំជាមួយទឹកម្រេចខ្ចីកំពត។"}, "id": "grilled-squid", "body": {"en": "Fresh squid from the Cambodian sea is skewered and grilled over charcoal right on the beach, then served with a bright dipping sauce of green Kampot peppercorns, lime, garlic and chilli. Seafood grilled by the sea is a long-loved tradition along Cambodia's coast. Cambodians enjoy it as an afternoon or evening snack on weekend trips to the seaside.", "km": "មឹកស្រស់ពីសមុទ្រកម្ពុជា ត្រូវបានគេចាក់ដោតជាចង្កាក់ ហើយអាំងលើភ្លើងធ្យូងនៅលើឆ្នេរផ្ទាល់ រួចញ៉ាំជាមួយទឹកជ្រលក់ធ្វើពីម្រេចខ្ចីកំពត ក្រូចឆ្មា ខ្ទឹមស និងម្ទេស។ គ្រឿងសមុទ្រអាំងនៅមាត់សមុទ្រ គឺជាប្រពៃណីដែលគេស្រលាញ់ជាយូរមកហើយនៅតាមឆ្នេរសមុទ្រកម្ពុជា។ ប្រជាជនខ្មែរចូលចិត្តញ៉ាំវាជាអាហារសម្រន់ពេលរសៀល ឬពេលល្ងាច ក្នុងដំណើរកម្សាន្តទៅមាត់សមុទ្រនៅចុងសប្ដាហ៍។"}, "how": {"en": "Ingredients:\n- 4 medium fresh squid, cleaned\n- 2 cloves garlic and 1 tbsp oyster sauce\n- 1 tbsp fish sauce and 1 tsp sugar\n- 2 sprigs fresh green Kampot pepper\n- Juice of 2 limes\n- 1 tsp salt and 2 fresh chillies\n- Bamboo skewers\n\nSteps:\n1. Score the squid lightly and thread onto skewers.\n2. Brush with a mixture of crushed garlic, oyster sauce, fish sauce and sugar.\n3. Grill over hot charcoal for 2 to 3 minutes per side until just opaque; do not overcook or it becomes tough.\n4. For the sauce, pound the green peppercorns, a little garlic, chilli and salt.\n5. Stir in the lime juice.\n6. Cut the squid into rings and serve with the pepper sauce.", "km": "គ្រឿងផ្សំ៖\n- មឹកស្រស់ទំហំមធ្យម ៤ ក្បាល សម្អាតរួច\n- ខ្ទឹមស ២ កំពឹស និងប្រេងខ្យង ១ ស្លាបព្រាបាយ\n- ទឹកត្រី ១ ស្លាបព្រាបាយ និងស្ករ ១ ស្លាបព្រាកាហ្វេ\n- ម្រេចខ្ចីកំពត ២ ចង្កោម\n- ទឹកក្រូចឆ្មា ២ ផ្លែ\n- អំបិល ១ ស្លាបព្រាកាហ្វេ និងម្ទេសស្រស់ ២ គ្រាប់\n- ចង្កាក់ឫស្សី\n\nរបៀបធ្វើ៖\n១. ឆូតមឹកស្រាលៗ ហើយចាក់ដោតនឹងចង្កាក់។\n២. លាបល្បាយខ្ទឹមសបុក ប្រេងខ្យង ទឹកត្រី និងស្ករ។\n៣. អាំងលើភ្លើងធ្យូងក្ដៅ ម្ខាង ២ ទៅ ៣ នាទី រហូតដល់ទើបតែឆ្អិន។ កុំអាំងយូរពេក ព្រោះវានឹងស្វិត។\n៤. សម្រាប់ទឹកជ្រលក់ បុកម្រេចខ្ចី ខ្ទឹមសបន្តិច ម្ទេស និងអំបិល។\n៥. ដាក់ទឹកក្រូចឆ្មា ហើយកូរឱ្យសព្វ។\n៦. កាត់មឹកជាកង់ ហើយញ៉ាំជាមួយទឹកម្រេច។"}, "where": {"en": "The best grilled squid is sold by vendors on the beaches of Kep, Kampot and Sihanoukville, and at the famous crab market in Kep, where you can also try Kep crab with Kampot pepper.", "km": "មឹកអាំងឆ្ងាញ់បំផុតមានលក់ដោយអ្នកលក់នៅលើឆ្នេរកែប កំពត និងព្រះសីហនុ ព្រមទាំងនៅផ្សារក្ដាមដ៏ល្បីនៅកែប ដែលអ្នកក៏អាចភ្លក់ក្ដាមកែបឆាម្រេចកំពតផងដែរ។"}, "tip": {"en": "Choose squid that looks glossy and fresh and ask the vendor to grill it in front of you.", "km": "សូមជ្រើសរើសមឹកដែលមើលទៅភ្លឺរលោង និងស្រស់ ហើយសុំឱ្យអ្នកលក់អាំងនៅមុខអ្នក។"}, "dish": {"en": "squid", "km": "មឹក"}}], "foodSweet": [{"title": {"en": "Num Ansom Chek (Sticky Rice Cake with Banana)", "km": "នំអន្សមចេក"}, "text": {"en": "Sticky rice and banana wrapped in banana leaves, made for Pchum Ben and New Year.", "km": "បាយដំណើប និងចេក រុំក្នុងស្លឹកចេក ធ្វើសម្រាប់បុណ្យភ្ជុំបិណ្ឌ និងចូលឆ្នាំ។"}, "id": "num-ansom-chek", "body": {"en": "Num ansom chek is a log of sticky rice soaked in coconut milk, wrapped around a ripe banana and sometimes black-eyed beans, then rolled in banana leaves and boiled or steamed until soft. It is one of the oldest Khmer sweets and carries deep meaning in our culture. Families make it together for Pchum Ben and Khmer New Year, to offer to monks and ancestors and to share with relatives.", "km": "នំអន្សមចេក គឺជាបាយដំណើបត្រាំខ្ទិះដូង រុំជុំវិញចេកទុំ ហើយពេលខ្លះដាក់សណ្ដែកទាប រួចរុំក្នុងស្លឹកចេក ហើយស្ងោរ ឬចំហុយរហូតដល់ទន់។ វាជានំខ្មែរមួយក្នុងចំណោមនំចាស់ជាងគេ ហើយមានអត្ថន័យជ្រាលជ្រៅក្នុងវប្បធម៌របស់យើង។ គ្រួសារខ្មែរតែងជួបជុំគ្នាធ្វើនំនេះសម្រាប់បុណ្យភ្ជុំបិណ្ឌ និងបុណ្យចូលឆ្នាំខ្មែរ ដើម្បីប្រគេនព្រះសង្ឃ ឧទ្ទិសដល់ដូនតា និងចែករំលែកជាមួយសាច់ញាតិ។"}, "how": {"en": "Ingredients:\n- 500 g sticky rice, soaked for 4 hours\n- 250 ml coconut milk\n- 1 tsp salt and 2 tbsp sugar\n- 50 g black-eyed beans, soaked (optional)\n- 6 ripe num-va bananas, peeled and halved lengthwise\n- Banana leaves, softened over a flame\n- Kitchen string\n\nSteps:\n1. Drain the sticky rice and mix with the beans.\n2. Stir-cook the rice with coconut milk, salt and sugar over low heat until the liquid is absorbed and the rice is half cooked.\n3. Lay a banana leaf flat, spread a layer of rice and place a banana in the centre.\n4. Cover the banana with more rice and roll tightly into a log.\n5. Fold in the ends and tie firmly with string.\n6. Boil or steam the rolls for about 1 to 1.5 hours.\n7. Leave to cool before unwrapping and slicing.", "km": "គ្រឿងផ្សំ៖\n- អង្ករដំណើប ៥០០ ក្រាម ត្រាំ ៤ ម៉ោង\n- ខ្ទិះដូង ២៥០ មីលីលីត្រ\n- អំបិល ១ ស្លាបព្រាកាហ្វេ និងស្ករ ២ ស្លាបព្រាបាយ\n- សណ្ដែកទាប ៥០ ក្រាម ត្រាំ (តាមចិត្ត)\n- ចេកណាំវ៉ាទុំ ៦ ផ្លែ បកសំបក ហើយពុះជាពីរតាមបណ្ដោយ\n- ស្លឹកចេក អាំងលើភ្លើងឱ្យទន់\n- ខ្សែចង\n\nរបៀបធ្វើ៖\n១. ច្រោះអង្ករដំណើបឱ្យស្ងួត ហើយលាយជាមួយសណ្ដែក។\n២. កូរអង្ករជាមួយខ្ទិះដូង អំបិល និងស្ករ លើភ្លើងតិចៗ រហូតដល់ស្រូបទឹកអស់ ហើយឆ្អិនពាក់កណ្ដាល។\n៣. ក្រាលស្លឹកចេក រួចរាលអង្ករមួយស្រទាប់ ហើយដាក់ចេកនៅកណ្ដាល។\n៤. គ្របចេកដោយអង្ករបន្ថែម ហើយរុំឱ្យណែនជារាងដើម។\n៥. បត់ចុងទាំងសងខាង ហើយចងឱ្យណែនដោយខ្សែ។\n៦. ស្ងោរ ឬចំហុយប្រហែល ១ ម៉ោង ទៅ ១ ម៉ោងកន្លះ។\n៧. ទុកឱ្យត្រជាក់ មុនពេលស្រាយ និងកាត់ជាកង់។"}, "where": {"en": "Num ansom chek is sold year-round at markets and roadside sweet stalls across Cambodia, and in the days before Pchum Ben and Khmer New Year you will see piles of fresh rolls everywhere.", "km": "នំអន្សមចេកមានលក់ពេញមួយឆ្នាំ នៅតាមផ្សារ និងតូបលក់បង្អែមតាមផ្លូវទូទាំងប្រទេសកម្ពុជា ហើយនៅប៉ុន្មានថ្ងៃមុនបុណ្យភ្ជុំបិណ្ឌ និងបុណ្យចូលឆ្នាំខ្មែរ អ្នកនឹងឃើញនំថ្មីៗគរជាច្រើននៅគ្រប់ទីកន្លែង។"}, "tip": {"en": "Try it grilled: many vendors toast the slices over charcoal, which gives the sticky rice a lovely crisp edge.", "km": "សូមសាកញ៉ាំនំដែលអាំង៖ អ្នកលក់ជាច្រើនអាំងនំលើភ្លើងធ្យូង ដែលធ្វើឱ្យបាយដំណើបមានគែមស្រួយឆ្ងាញ់។"}, "dish": {"en": "ansom", "km": "នំអន្សម"}}, {"title": {"en": "Num Ansom Chrouk (Sticky Rice Cake with Pork & Mung Bean)", "km": "នំអន្សមជ្រូក"}, "text": {"en": "Sticky rice filled with pork and mung bean, wrapped and boiled for hours.", "km": "បាយដំណើបដាក់សាច់ជ្រូក និងសណ្ដែកបាយ រុំ ហើយស្ងោររាប់ម៉ោង។"}, "id": "num-ansom-chrouk", "body": {"en": "Num ansom chrouk is the savoury partner of the banana version: sticky rice wrapped around a filling of mung bean paste and seasoned pork belly, tightly bound in banana leaves and boiled for several hours. Like num ansom chek, it is a traditional offering with deep cultural meaning. Families make it together for Pchum Ben and Khmer New Year, offering it at the pagoda and sharing it with relatives.", "km": "នំអន្សមជ្រូក គឺជានំអន្សមរសជាតិប្រៃ ដែលគេយកបាយដំណើបរុំជុំវិញសណ្ដែកបាយបុក និងសាច់ជ្រូកបីជាន់ប្រឡាក់គ្រឿង រួចរុំឱ្យណែនក្នុងស្លឹកចេក ហើយស្ងោររាប់ម៉ោង។ ដូចនំអន្សមចេកដែរ វាជានំប្រគេនតាមប្រពៃណី ដែលមានអត្ថន័យជ្រាលជ្រៅក្នុងវប្បធម៌។ គ្រួសារខ្មែរជួបជុំគ្នាធ្វើនំនេះសម្រាប់បុណ្យភ្ជុំបិណ្ឌ និងបុណ្យចូលឆ្នាំខ្មែរ ដើម្បីប្រគេននៅវត្ត និងចែករំលែកជាមួយសាច់ញាតិ។"}, "how": {"en": "Ingredients:\n- 1 kg sticky rice, soaked overnight\n- 300 g split mung beans, soaked\n- 500 g pork belly, cut into long strips\n- 1 tbsp salt, plus extra for the rice\n- 1 tsp ground black pepper and 1 tbsp sugar\n- 2 tbsp coconut milk (optional)\n- Banana leaves and kitchen string\n\nSteps:\n1. Season the pork with salt, pepper and sugar and leave for 1 hour.\n2. Steam the mung beans until soft and mash into a paste with a little salt.\n3. Drain the sticky rice and mix with salt and coconut milk.\n4. Lay banana leaves flat, spread a layer of rice, then a layer of mung bean paste.\n5. Place a strip of pork in the centre, cover with more mung bean and rice, and roll tightly into a log.\n6. Tie firmly with string at regular intervals.\n7. Boil in plenty of water for 4 to 6 hours, topping up with hot water, then cool before slicing.", "km": "គ្រឿងផ្សំ៖\n- អង្ករដំណើប ១ គីឡូក្រាម ត្រាំមួយយប់\n- សណ្ដែកបាយបក ៣០០ ក្រាម ត្រាំ\n- សាច់ជ្រូកបីជាន់ ៥០០ ក្រាម កាត់ជាបន្ទះវែងៗ\n- អំបិល ១ ស្លាបព្រាបាយ និងអំបិលបន្ថែមសម្រាប់អង្ករ\n- ម្រេចខ្មៅបុក ១ ស្លាបព្រាកាហ្វេ និងស្ករ ១ ស្លាបព្រាបាយ\n- ខ្ទិះដូង ២ ស្លាបព្រាបាយ (តាមចិត្ត)\n- ស្លឹកចេក និងខ្សែចង\n\nរបៀបធ្វើ៖\n១. ប្រឡាក់សាច់ជ្រូកជាមួយអំបិល ម្រេច និងស្ករ ហើយទុក ១ ម៉ោង។\n២. ចំហុយសណ្ដែកបាយរហូតដល់ទន់ ហើយបុកឱ្យម៉ដ្ឋជាមួយអំបិលបន្តិច។\n៣. ច្រោះអង្ករដំណើបឱ្យស្ងួត ហើយលាយជាមួយអំបិល និងខ្ទិះដូង។\n៤. ក្រាលស្លឹកចេក រាលអង្ករមួយស្រទាប់ រួចរាលសណ្ដែកបាយមួយស្រទាប់។\n៥. ដាក់សាច់ជ្រូកនៅកណ្ដាល គ្របដោយសណ្ដែក និងអង្ករបន្ថែម ហើយរុំឱ្យណែនជារាងដើម។\n៦. ចងឱ្យណែនដោយខ្សែ ជាចន្លោះៗស្មើគ្នា។\n៧. ស្ងោរក្នុងទឹកច្រើន ៤ ទៅ ៦ ម៉ោង ដោយបន្ថែមទឹកក្ដៅជាប្រចាំ រួចទុកឱ្យត្រជាក់ មុនពេលកាត់។"}, "where": {"en": "Num ansom chrouk is sold at markets throughout Cambodia, often by the slice or as whole rolls, and is most plentiful before Pchum Ben and Khmer New Year, when families also give it as gifts.", "km": "នំអន្សមជ្រូកមានលក់នៅតាមផ្សារទូទាំងប្រទេសកម្ពុជា ជាញឹកញាប់លក់ជាកង់ ឬទាំងដើម ហើយមានច្រើនបំផុតមុនបុណ្យភ្ជុំបិណ្ឌ និងបុណ្យចូលឆ្នាំខ្មែរ ដែលគ្រួសារខ្មែរក៏យកវាជូនគ្នាជាអំណោយផងដែរ។"}, "tip": {"en": "Slice it into rounds and enjoy it with a little pickled vegetable or a sprinkle of salt and pepper; it is also delicious pan-fried the next day.", "km": "សូមកាត់ជាកង់ ហើយញ៉ាំជាមួយជ្រក់បន្តិច ឬអំបិលម្រេច។ វាក៏ឆ្ងាញ់ណាស់ពេលយកមកចៀននៅថ្ងៃបន្ទាប់។"}, "dish": {"en": "ansom", "km": "អន្សមជ្រូក"}}, {"title": {"en": "Num Kom", "km": "នំគម"}, "text": {"en": "A pyramid-shaped sticky rice cake with coconut and palm sugar, made for weddings and New Year.", "km": "នំរាងពីរ៉ាមីត ធ្វើពីម្សៅដំណើប ដាក់ដូង និងស្ករត្នោត ធ្វើសម្រាប់ពិធីរៀបការ និងចូលឆ្នាំ។"}, "id": "num-kom", "body": {"en": "Num kom is a small pyramid-shaped cake of soft glutinous rice dough filled with grated coconut, palm sugar and toasted sesame, wrapped in a banana leaf and steamed. Its neat pyramid shape is said to represent harmony and good fortune, and it is one of the classic traditional Khmer sweets. Families make num kom for weddings, Khmer New Year and Pchum Ben, and to offer to monks at the pagoda.", "km": "នំគម គឺជានំតូចរាងពីរ៉ាមីត ធ្វើពីម្សៅដំណើបទន់ ញាត់ដូងកោស ស្ករត្នោត និងល្ងលីង រុំក្នុងស្លឹកចេក ហើយចំហុយ។ គេនិយាយថា រាងពីរ៉ាមីតដ៏ស្អាតរបស់វាតំណាងឱ្យភាពសុខដុម និងសំណាងល្អ ហើយវាជានំខ្មែរប្រពៃណីមួយដ៏ល្បី។ គ្រួសារខ្មែរធ្វើនំគមសម្រាប់ពិធីរៀបការ បុណ្យចូលឆ្នាំខ្មែរ និងបុណ្យភ្ជុំបិណ្ឌ ព្រមទាំងយកទៅប្រគេនព្រះសង្ឃនៅវត្ត។"}, "how": {"en": "Ingredients:\n- 300 g glutinous rice flour\n- About 200 ml warm water\n- A pinch of salt\n- 200 g freshly grated coconut\n- 100 g palm sugar\n- 2 tbsp toasted sesame seeds\n- Banana leaves, cut into squares and lightly oiled\n\nSteps:\n1. Cook the grated coconut with palm sugar over low heat until sticky, then stir in the sesame and let it cool.\n2. Mix the rice flour, salt and warm water into a soft, smooth dough.\n3. Roll the filling into small balls.\n4. Flatten a piece of dough, place a ball of filling in the centre and seal it into a ball.\n5. Fold a banana leaf into a cone, place the ball inside and fold the top to form a neat pyramid.\n6. Steam for about 15 to 20 minutes until the dough is cooked through.", "km": "គ្រឿងផ្សំ៖\n- ម្សៅដំណើប ៣០០ ក្រាម\n- ទឹកក្ដៅឧណ្ហៗ ប្រហែល ២០០ មីលីលីត្រ\n- អំបិលបន្តិច\n- ដូងកោសស្រស់ ២០០ ក្រាម\n- ស្ករត្នោត ១០០ ក្រាម\n- ល្ងលីង ២ ស្លាបព្រាបាយ\n- ស្លឹកចេក កាត់ជាការ៉េ ហើយលាបប្រេងស្ដើងៗ\n\nរបៀបធ្វើ៖\n១. រំងាស់ដូងកោសជាមួយស្ករត្នោតលើភ្លើងតិចៗ រហូតដល់ស្អិត រួចដាក់ល្ង ហើយទុកឱ្យត្រជាក់។\n២. លាយម្សៅដំណើប អំបិល និងទឹកក្ដៅឧណ្ហៗ ច្របាច់ឱ្យទន់ម៉ដ្ឋ។\n៣. ពូតស្នូលជាគ្រាប់តូចៗ។\n៤. សង្កត់ម្សៅមួយដុំឱ្យរាប ដាក់ស្នូលនៅកណ្ដាល ហើយបិទជាគ្រាប់មូល។\n៥. បត់ស្លឹកចេកជារាងសាជី ដាក់នំចូល ហើយបត់ផ្នែកខាងលើឱ្យចេញជារាងពីរ៉ាមីត។\n៦. ចំហុយប្រហែល ១៥ ទៅ ២០ នាទី រហូតដល់ម្សៅឆ្អិនល្អ។"}, "where": {"en": "Num kom is sold at traditional sweet stalls in local markets throughout Cambodia, and you will find it in abundance around weddings, Khmer New Year and Pchum Ben.", "km": "នំគមមានលក់នៅតូបនំប្រពៃណីក្នុងផ្សារទូទាំងប្រទេសកម្ពុជា ហើយអ្នកនឹងឃើញវាច្រើនណាស់ក្នុងពេលពិធីរៀបការ បុណ្យចូលឆ្នាំខ្មែរ និងបុណ្យភ្ជុំបិណ្ឌ។"}, "tip": {"en": "Num kom is often sold in pairs or small bundles; it is best eaten on the day it is made, while the dough is still soft.", "km": "នំគមច្រើនលក់ជាគូ ឬជាចង្កោមតូចៗ។ វាឆ្ងាញ់បំផុតនៅថ្ងៃដែលទើបធ្វើរួច ខណៈម្សៅនៅទន់។"}, "dish": {"en": "num kom", "km": "នំគម"}}, {"title": {"en": "Num Krok", "km": "នំគ្រក់"}, "text": {"en": "Small coconut rice cakes cooked in a dimpled clay pan, a street snack.", "km": "នំគ្រក់តូចៗ ធ្វើពីម្សៅអង្ករ និងខ្ទិះដូង ចម្អិនក្នុងខ្ទះដីរណ្ដៅ។"}, "id": "num-krok", "body": {"en": "Num krok are small, round rice and coconut cakes cooked in a dimpled clay or cast-iron pan over charcoal, crisp on the bottom and soft and creamy on top. Two halves are often pressed together and topped with spring onions, and the clay pan has been part of Khmer street cooking for generations. Cambodians buy them as a warm snack, mostly in the morning or late afternoon.", "km": "នំគ្រក់ គឺជានំមូលៗតូចៗ ធ្វើពីម្សៅអង្ករ និងខ្ទិះដូង ចម្អិនក្នុងខ្ទះដីឬខ្ទះដែកមានរណ្ដៅ លើភ្លើងធ្យូង ស្រួយនៅបាត និងទន់ខាប់នៅខាងលើ។ គេច្រើនផ្គុំនំពីរចំហៀងបញ្ចូលគ្នា ហើយរោយស្លឹកខ្ទឹមពីលើ ហើយខ្ទះដីរណ្ដៅនេះ បានក្លាយជាផ្នែកមួយនៃការធ្វើម្ហូបតាមផ្លូវរបស់ខ្មែរ តាំងពីច្រើនជំនាន់មកហើយ។ ប្រជាជនខ្មែរទិញវាជាអាហារសម្រន់ក្ដៅៗ ភាគច្រើននៅពេលព្រឹក ឬពេលរសៀល។"}, "how": {"en": "Ingredients:\n- 200 g rice flour\n- 2 tbsp cooked rice\n- 400 ml coconut milk\n- 200 ml water\n- 1 tsp salt and 2 tbsp sugar\n- 2 spring onions, finely sliced\n- Oil for the pan\n\nSteps:\n1. Blend the rice flour, cooked rice, water, half the coconut milk, salt and sugar until very smooth.\n2. Mix the remaining coconut milk with a pinch of salt and the spring onions for the topping.\n3. Heat the dimpled pan over charcoal or gas and brush each hole with oil.\n4. Fill each hole about three-quarters full with batter.\n5. Spoon a little coconut topping on each and cover with a lid.\n6. Cook for 3 to 4 minutes until the bottoms are golden and crisp.\n7. Lift out with a small spoon and press two halves together to serve.", "km": "គ្រឿងផ្សំ៖\n- ម្សៅអង្ករ ២០០ ក្រាម\n- បាយឆ្អិន ២ ស្លាបព្រាបាយ\n- ខ្ទិះដូង ៤០០ មីលីលីត្រ\n- ទឹក ២០០ មីលីលីត្រ\n- អំបិល ១ ស្លាបព្រាកាហ្វេ និងស្ករ ២ ស្លាបព្រាបាយ\n- ស្លឹកខ្ទឹម ២ ដើម ហាន់ល្អិត\n- ប្រេងសម្រាប់លាបខ្ទះ\n\nរបៀបធ្វើ៖\n១. កិនម្សៅអង្ករ បាយ ទឹក ខ្ទិះដូងពាក់កណ្ដាល អំបិល និងស្ករ ឱ្យម៉ដ្ឋល្អ។\n២. លាយខ្ទិះដូងដែលនៅសល់ ជាមួយអំបិលបន្តិច និងស្លឹកខ្ទឹម សម្រាប់ដាក់ពីលើ។\n៣. កម្ដៅខ្ទះរណ្ដៅលើភ្លើងធ្យូង ឬហ្គាស ហើយលាបប្រេងគ្រប់រណ្ដៅ។\n៤. ចាក់ម្សៅចូលរណ្ដៅនីមួយៗ ប្រហែលបីភាគបួន។\n៥. ដាក់ខ្ទិះដូងពីលើបន្តិចៗ ហើយគ្របគម្រប។\n៦. ចម្អិន ៣ ទៅ ៤ នាទី រហូតដល់បាតលឿងស្រួយ។\n៧. ដួសចេញដោយស្លាបព្រាតូច ហើយផ្គុំពីរចំហៀងបញ្ចូលគ្នា។"}, "where": {"en": "Num krok vendors set up their clay pans at markets, on street corners and outside schools in towns across the country, especially in the mornings and late afternoons.", "km": "អ្នកលក់នំគ្រក់ដាក់ខ្ទះដីរបស់ពួកគេ នៅតាមផ្សារ កែងផ្លូវ និងមុខសាលារៀន នៅតាមទីក្រុងទូទាំងប្រទេស ជាពិសេសនៅពេលព្រឹក និងពេលរសៀល។"}, "tip": {"en": "Eat them hot straight from the pan; many vendors serve them with a small dish of sweet fish sauce for dipping.", "km": "សូមញ៉ាំក្ដៅៗភ្លាមពីខ្ទះ។ អ្នកលក់ជាច្រើនឱ្យទឹកត្រីផ្អែមមួយចានតូចសម្រាប់ជ្រលក់។"}, "dish": {"en": "num krok", "km": "នំគ្រក់"}}, {"title": {"en": "Sankhya Lapov (Pumpkin Custard)", "km": "សង់ខ្យាល្ពៅ"}, "text": {"en": "Coconut and palm sugar custard steamed inside a whole pumpkin.", "km": "សង់ខ្យាធ្វើពីខ្ទិះដូង និងស្ករត្នោត ចំហុយក្នុងផ្លែល្ពៅទាំងមូល។"}, "id": "sankhya-lapov", "body": {"en": "Sankhya lapov is a whole small pumpkin, hollowed out and filled with a smooth custard of eggs, coconut milk and palm sugar, then steamed until set and served in thick slices. The golden pumpkin and creamy custard make it one of the most beautiful Khmer desserts. It is a centrepiece at Khmer New Year and family celebrations, and it is also sold by the slice in markets all year round.", "km": "សង់ខ្យាល្ពៅ គឺជាផ្លែល្ពៅតូចទាំងមូល ដែលគេកោះយកពោះចេញ ហើយចាក់សង់ខ្យាម៉ដ្ឋធ្វើពីស៊ុត ខ្ទិះដូង និងស្ករត្នោត រួចចំហុយរហូតដល់ខាប់ ហើយកាត់ជាចម្រៀកក្រាស់ៗ។ ល្ពៅពណ៌មាស និងសង់ខ្យាទន់ខាប់ ធ្វើឱ្យវាក្លាយជាបង្អែមខ្មែរមួយដ៏ស្រស់ស្អាតបំផុត។ វាជាបង្អែមសំខាន់នៅលើតុបុណ្យចូលឆ្នាំខ្មែរ និងការជួបជុំគ្រួសារ ហើយក៏មានលក់ជាចម្រៀកនៅតាមផ្សារពេញមួយឆ្នាំផងដែរ។"}, "how": {"en": "Ingredients:\n- 1 small kabocha-type pumpkin (about 1 kg)\n- 5 eggs (duck eggs are traditional)\n- 200 ml thick coconut milk\n- 120 g palm sugar, shaved\n- A pinch of salt\n- 1 pandan leaf (optional)\n\nSteps:\n1. Cut a lid from the top of the pumpkin and scoop out the seeds, keeping the walls thick.\n2. Rub the inside with a little salt and rinse.\n3. Whisk the eggs, palm sugar, coconut milk and salt until the sugar dissolves completely, then strain.\n4. Pour the custard into the pumpkin, adding the pandan leaf if you like.\n5. Steam over medium heat for about 45 to 60 minutes until a skewer inserted into the custard comes out clean.\n6. Let it cool completely, then cut into wedges to serve.", "km": "គ្រឿងផ្សំ៖\n- ល្ពៅតូច ១ ផ្លែ (ប្រហែល ១ គីឡូក្រាម)\n- ស៊ុត ៥ គ្រាប់ (តាមប្រពៃណីប្រើស៊ុតទា)\n- ខ្ទិះដូងខាប់ ២០០ មីលីលីត្រ\n- ស្ករត្នោត ១២០ ក្រាម កោសជាចំណិតស្ដើង\n- អំបិលបន្តិច\n- ស្លឹកតើយ ១ សន្លឹក (តាមចិត្ត)\n\nរបៀបធ្វើ៖\n១. កាត់គម្របពីខាងលើផ្លែល្ពៅ ហើយកោះយកគ្រាប់ចេញ ដោយទុកសាច់ឱ្យក្រាស់។\n២. ជូតខាងក្នុងដោយអំបិលបន្តិច ហើយលាងទឹក។\n៣. វាយស៊ុត ស្ករត្នោត ខ្ទិះដូង និងអំបិល រហូតដល់ស្កររលាយអស់ រួចច្រោះ។\n៤. ចាក់សង់ខ្យាចូលក្នុងល្ពៅ ហើយដាក់ស្លឹកតើយតាមចិត្ត។\n៥. ចំហុយលើភ្លើងមធ្យមប្រហែល ៤៥ ទៅ ៦០ នាទី រហូតដល់ចាក់ចង្កាក់ចូលក្នុងសង់ខ្យា ហើយដកចេញស្អាត។\n៦. ទុកឱ្យត្រជាក់ទាំងស្រុង រួចកាត់ជាចម្រៀកដើម្បីញ៉ាំ។"}, "where": {"en": "Sankhya lapov is sold by the slice at dessert stalls in markets across Cambodia, and Khmer restaurants in Phnom Penh and Siem Reap often have it on their dessert menus.", "km": "សង់ខ្យាល្ពៅមានលក់ជាចម្រៀក នៅតូបបង្អែមក្នុងផ្សារទូទាំងប្រទេសកម្ពុជា ហើយភោជនីយដ្ឋានខ្មែរនៅភ្នំពេញ និងសៀមរាប ក៏ច្រើនមានវានៅក្នុងបញ្ជីបង្អែមដែរ។"}, "tip": {"en": "It is best served cool; eat the soft pumpkin flesh together with the custard for the full flavour.", "km": "វាឆ្ងាញ់បំផុតពេលត្រជាក់។ សូមញ៉ាំសាច់ល្ពៅទន់ជាមួយសង់ខ្យាព្រមគ្នា ដើម្បីបានរសជាតិពេញលេញ។"}, "dish": {"en": "pumpkin custard", "km": "សង់ខ្យាល្ពៅ"}}, {"title": {"en": "Num Chang", "km": "នំចាំង"}, "text": {"en": "A traditional sweet made from rice and palm sugar.", "km": "នំប្រពៃណីធ្វើពីអង្ករ និងស្ករត្នោត។"}, "id": "num-chang", "body": {"en": "Num chang is a traditional Khmer sweet made from rice and palm sugar: thin rounds of dried rice are fried until puffed and crunchy, then drizzled with warm palm sugar syrup that sets into a sweet, caramel-like glaze. It shows how Khmer cooks have long made use of the two great products of the countryside, rice from the paddies and sugar from the sugar palm. Cambodians enjoy it as a snack with tea and as a treat to bring home from trips to the provinces.", "km": "នំចាំង គឺជានំខ្មែរប្រពៃណីធ្វើពីអង្ករ និងស្ករត្នោត៖ គេយកបាយហាលស្ងួតជាបន្ទះមូលស្ដើងៗ ចៀនរហូតដល់រីក និងស្រួយ រួចស្រោចទឹកស្ករត្នោតក្ដៅៗពីលើ ដែលក្លាយជាស្រទាប់ស្ករផ្អែមដូចស្ករខាប់។ វាបង្ហាញពីរបៀបដែលអ្នកធ្វើម្ហូបខ្មែរបានប្រើប្រាស់ផលិតផលធំៗពីរនៃជនបទ គឺអង្ករពីវាលស្រែ និងស្ករពីដើមត្នោត តាំងពីយូរយារណាស់មកហើយ។ ប្រជាជនខ្មែរចូលចិត្តញ៉ាំវាជាអាហារសម្រន់ជាមួយតែ និងជាវត្ថុអនុស្សាវរីយ៍យកមកផ្ទះ ពេលធ្វើដំណើរទៅតាមខេត្ត។"}, "how": {"en": "Ingredients:\n- 500 g cooked rice (jasmine or sticky rice)\n- A pinch of salt\n- 200 g palm sugar\n- 3 tbsp water\n- 1 tbsp toasted sesame seeds (optional)\n- Oil for deep-frying\n\nSteps:\n1. Mix the warm cooked rice with salt and press it into thin, even rounds.\n2. Dry the rounds in the sun for one to two days until completely hard.\n3. Deep-fry the dried rounds in hot oil for a few seconds until they puff and turn light golden, then drain.\n4. Melt the palm sugar with the water over low heat and simmer until it becomes a thick syrup.\n5. Drizzle the syrup over the crispy rice rounds and sprinkle with sesame.\n6. Leave to cool until the sugar sets, then store in an airtight container.", "km": "គ្រឿងផ្សំ៖\n- បាយឆ្អិន ៥០០ ក្រាម (អង្ករម្លិះ ឬអង្ករដំណើប)\n- អំបិលបន្តិច\n- ស្ករត្នោត ២០០ ក្រាម\n- ទឹក ៣ ស្លាបព្រាបាយ\n- ល្ងលីង ១ ស្លាបព្រាបាយ (តាមចិត្ត)\n- ប្រេងសម្រាប់ចៀន\n\nរបៀបធ្វើ៖\n១. លាយបាយក្ដៅជាមួយអំបិល ហើយសង្កត់ជាបន្ទះមូលស្ដើងៗស្មើគ្នា។\n២. ហាលបន្ទះបាយនៅថ្ងៃ មួយទៅពីរថ្ងៃ រហូតដល់ស្ងួតរឹងទាំងស្រុង។\n៣. ចៀនបន្ទះបាយស្ងួតក្នុងប្រេងក្ដៅ ពីរបីវិនាទី រហូតដល់រីក និងលឿងស្រាល រួចស្រង់ឱ្យស្រក់ប្រេង។\n៤. រំលាយស្ករត្នោតជាមួយទឹកលើភ្លើងតិចៗ ហើយដាំរហូតដល់ក្លាយជាទឹកស្ករខាប់។\n៥. ស្រោចទឹកស្ករពីលើបន្ទះបាយស្រួយ ហើយរោយល្ង។\n៦. ទុកឱ្យត្រជាក់រហូតដល់ស្ករកក រួចទុកក្នុងប្រអប់បិទជិត។"}, "where": {"en": "Num chang is sold at local markets and at roadside stalls in rice-growing and palm sugar provinces such as Kampong Speu, Takeo and Siem Reap, often packed in bags as a souvenir snack.", "km": "នំចាំងមានលក់នៅតាមផ្សារក្នុងស្រុក និងតូបតាមដងផ្លូវ នៅខេត្តដែលដាំស្រូវ និងធ្វើស្ករត្នោត ដូចជា កំពង់ស្ពឺ តាកែវ និងសៀមរាប ហើយគេច្រើនខ្ចប់ក្នុងថង់ ជាអាហារសម្រន់សម្រាប់ធ្វើជាអនុស្សាវរីយ៍។"}, "tip": {"en": "Buy it from a stall where you can see it being made fresh, and enjoy it with a cup of hot tea.", "km": "សូមទិញពីតូបដែលអ្នកអាចមើលឃើញគេធ្វើស្រស់ៗ ហើយញ៉ាំជាមួយតែក្ដៅមួយពែង។"}, "dish": {"en": "num chang", "km": "នំចាំង"}}, {"title": {"en": "Chek Chien (Fried Bananas)", "km": "ចេកចៀន"}, "text": {"en": "Bananas dipped in batter and fried until crisp, sold at roadside stalls.", "km": "ចេកជ្រលក់ម្សៅ ហើយចៀនរហូតស្រួយ លក់តាមតូបតាមផ្លូវ។"}, "id": "chek-chien", "body": {"en": "Chek chien is ripe num-va bananas, flattened, dipped in a light batter of rice flour, coconut and sesame, and deep-fried until golden and crisp. It is one of the simplest and most loved Khmer snacks, made with the small, sweet bananas that grow in gardens all over the country. Cambodians buy it warm from roadside stalls as an afternoon snack, often on the way home from school or work.", "km": "ចេកចៀន គឺជាចេកណាំវ៉ាទុំ ដែលគេសង្កត់ឱ្យរាប ជ្រលក់ម្សៅស្ដើងៗធ្វើពីម្សៅអង្ករ ដូង និងល្ង រួចចៀនរហូតដល់លឿងស្រួយ។ វាជាអាហារសម្រន់ខ្មែរមួយដែលសាមញ្ញ និងពេញនិយមបំផុត ដោយប្រើចេកតូចៗផ្អែម ដែលដុះនៅតាមចម្ការទូទាំងប្រទេស។ ប្រជាជនខ្មែរទិញវាក្ដៅៗពីតូបតាមផ្លូវ ជាអាហារសម្រន់ពេលរសៀល ជាញឹកញាប់ពេលធ្វើដំណើរត្រឡប់ពីសាលារៀន ឬពីកន្លែងធ្វើការ។"}, "how": {"en": "Ingredients:\n- 8 ripe num-va bananas, peeled\n- 100 g rice flour\n- 2 tbsp tapioca starch\n- 3 tbsp sugar and a pinch of salt\n- 100 ml coconut milk\n- 3 tbsp grated coconut and 1 tbsp sesame seeds\n- Oil for deep-frying\n\nSteps:\n1. Press each banana gently between two pieces of banana leaf or plastic to flatten it.\n2. Mix the rice flour, tapioca starch, sugar, salt and coconut milk into a smooth batter.\n3. Stir in the grated coconut and sesame.\n4. Heat the oil in a deep pan over medium heat.\n5. Dip each banana into the batter and fry until golden and crisp, turning once.\n6. Drain on a rack and serve warm.", "km": "គ្រឿងផ្សំ៖\n- ចេកណាំវ៉ាទុំ ៨ ផ្លែ បកសំបក\n- ម្សៅអង្ករ ១០០ ក្រាម\n- ម្សៅមី ២ ស្លាបព្រាបាយ\n- ស្ករ ៣ ស្លាបព្រាបាយ និងអំបិលបន្តិច\n- ខ្ទិះដូង ១០០ មីលីលីត្រ\n- ដូងកោស ៣ ស្លាបព្រាបាយ និងល្ង ១ ស្លាបព្រាបាយ\n- ប្រេងសម្រាប់ចៀន\n\nរបៀបធ្វើ៖\n១. សង្កត់ចេកម្ដងមួយផ្លែៗថ្នមៗ ចន្លោះស្លឹកចេក ឬថង់ប្លាស្ទិកពីរ ឱ្យរាប។\n២. លាយម្សៅអង្ករ ម្សៅមី ស្ករ អំបិល និងខ្ទិះដូង ឱ្យម៉ដ្ឋ។\n៣. ដាក់ដូងកោស និងល្ង ហើយកូរឱ្យសព្វ។\n៤. កម្ដៅប្រេងក្នុងខ្ទះជ្រៅ លើភ្លើងមធ្យម។\n៥. ជ្រលក់ចេកក្នុងម្សៅ ហើយចៀនរហូតដល់លឿងស្រួយ ដោយត្រឡប់ម្ដង។\n៦. ស្រង់ដាក់លើកន្ត្រងឱ្យស្រក់ប្រេង ហើយញ៉ាំក្ដៅៗ។"}, "where": {"en": "Chek chien is sold at roadside stalls and markets all over Cambodia, usually from late morning to early evening, often next to vendors frying sweet potatoes and taro.", "km": "ចេកចៀនមានលក់នៅតាមតូបតាមផ្លូវ និងផ្សារទូទាំងប្រទេសកម្ពុជា ជាធម្មតាចាប់ពីព្រឹកត្រង់រហូតដល់ល្ងាច ហើយច្រើនលក់ជាមួយដំឡូងជ្វា និងត្រាវចៀន។"}, "tip": {"en": "Buy them fresh from the wok while they are still crisp; they soften quickly once cool.", "km": "សូមទិញពេលទើបតែចៀនចេញពីខ្ទះថ្មីៗ ខណៈនៅស្រួយ ព្រោះវាទន់លឿនណាស់ពេលត្រជាក់។"}, "dish": {"en": "fried banana", "km": "ចេកចៀន"}}, {"title": {"en": "Borbor Thnot (Palm Sugar Porridge)", "km": "បបរស្ករត្នោត"}, "text": {"en": "Sweet rice porridge with palm sugar and coconut milk.", "km": "បបរផ្អែមជាមួយស្ករត្នោត និងខ្ទិះដូង។"}, "id": "borbor-thnot", "body": {"en": "Borbor skor thnot is a warm, comforting sweet porridge of rice simmered until soft and creamy, sweetened with palm sugar and finished with salted coconut milk. Palm sugar from the tall sugar palms of the Cambodian countryside gives it a deep, caramel flavour. Cambodians enjoy it as a light dessert or afternoon snack, and it is also cooked at home on cool mornings and for people who are feeling unwell.", "km": "បបរស្ករត្នោត គឺជាបបរផ្អែមក្ដៅៗ ដែលគេដាំអង្កររហូតដល់ទន់ខាប់ ដាក់ស្ករត្នោតឱ្យផ្អែម ហើយស្រោចខ្ទិះដូងប្រៃបន្តិចពីលើ។ ស្ករត្នោតពីដើមត្នោតខ្ពស់ៗនៅតាមជនបទកម្ពុជា ផ្ដល់រសជាតិផ្អែមឈ្ងុយដូចស្ករខាប់។ ប្រជាជនខ្មែរញ៉ាំវាជាបង្អែមស្រាល ឬអាហារសម្រន់ពេលរសៀល ហើយគេក៏ដាំវានៅផ្ទះនៅពេលព្រឹកត្រជាក់ និងសម្រាប់អ្នកដែលមិនសូវស្រួលខ្លួនផងដែរ។"}, "how": {"en": "Ingredients:\n- 150 g rice or sticky rice, rinsed\n- 1.2 litres water\n- 150 g palm sugar\n- A pinch of salt\n- 200 ml coconut milk\n- 1 pandan leaf, knotted (optional)\n\nSteps:\n1. Bring the rice and water to a boil with the pandan leaf.\n2. Lower the heat and simmer, stirring often, for about 30 to 40 minutes until the grains break down and the porridge is thick.\n3. Add the palm sugar and stir until fully dissolved.\n4. Warm the coconut milk with a pinch of salt in a separate pot, without boiling.\n5. Ladle the porridge into bowls and pour over a spoonful of salted coconut milk.\n6. Serve warm.", "km": "គ្រឿងផ្សំ៖\n- អង្ករ ឬអង្ករដំណើប ១៥០ ក្រាម លាងស្អាត\n- ទឹក ១.២ លីត្រ\n- ស្ករត្នោត ១៥០ ក្រាម\n- អំបិលបន្តិច\n- ខ្ទិះដូង ២០០ មីលីលីត្រ\n- ស្លឹកតើយ ១ សន្លឹក ចងជាថ្នាំង (តាមចិត្ត)\n\nរបៀបធ្វើ៖\n១. ដាំអង្ករ និងទឹកជាមួយស្លឹកតើយ ឱ្យពុះ។\n២. បន្ថយភ្លើង ហើយដាំតិចៗ ដោយកូរញឹកញាប់ ប្រហែល ៣០ ទៅ ៤០ នាទី រហូតដល់គ្រាប់អង្ករបែក និងបបរខាប់។\n៣. ដាក់ស្ករត្នោត ហើយកូររហូតដល់រលាយអស់។\n៤. កម្ដៅខ្ទិះដូងជាមួយអំបិលបន្តិច ក្នុងឆ្នាំងមួយផ្សេង ដោយមិនឱ្យពុះ។\n៥. ដួសបបរដាក់ចាន ហើយស្រោចខ្ទិះដូងប្រៃមួ function getJSON(x){return fetch(x).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function cleanCap(t){t=String(t||'').replace(/\r/g,'');var lines=t.split('\n').map(function(l){return l.trim()});while(lines.length&&/^(#[^\s#]+\s*)+$/.test(lines[lines.length-1]))lines.pop();t=lines.join('\n').replace(/(\s#[^\s#]+)+\s*$/,'').replace(/\n{3,}/g,'\n\n').trim();return t}
function capTitle(t){t=cleanCap(t).split('\n')[0].replace(/#[^\s#]+/g,'').trim();var m=t.match(/^(.{12,90}?[.!?។])(\s|$)/);t=m?m[1]:t;if(t.length>90)t=t.slice(0,87).replace(/\s+\S*$/,'')+'…';return t}
function fetchMeta(u){u=url(u);var enc=encodeURIComponent(u);
  var mic=function(){return getJSON('https://api.microlink.io/?url='+enc).then(function(j){if(!j||j.status!=='success')throw new Error((j&&j.message)||'failed');var d=j.data||{};return {title:d.title||'',text:d.description||'',image:(d.image&&d.image.url)||'',date:d.date||'',link:d.url||u}})};
  if(/tiktok\.com/i.test(u))return resolveTT(u).then(function(r){return {title:capTitle(r.title),text:cleanCap(r.title),image:r.thumb,link:r.link,video:true}});
  if(/youtu\.?be/i.test(u))return getJSON('https://noembed.com/embed?url='+enc).then(function(j){if(j.error)throw new Error(j.error);var b={title:j.title||'',text:'',image:j.thumbnail_url||linkCover(u),link:u,video:true};return mic().then(function(x){b.text=x.text&&!/^enjoy the videos/i.test(x.text)?x.text:'';return b}).catch(function(){return b})});
  return mic().then(function(x){if(/facebook\.com|fb\.watch/i.test(u)){x.video=/video|watch|reel|fb\.watch|\/v\/|share\/(v|r)\//i.test(u);if(/^(facebook|log in|log into|error)/i.test(x.title)&&!x.text)throw new Error('private');x.title=x.title.replace(/\s*\|\s*Facebook$/i,'')}return x})}

  go.onclick=function(){var u=m.querySelector('[data-af]').value.trim();if(!/^(https?:\/\/)?[\w.-]+\.[a-z]{2,}/i.test(u)){say('Paste a full link first, for example https://www.facebook.com/…',true);return}
    go.disabled=true;say('Reading the link…');
    fetchMeta(u).then(function(x){var filled=[];
      if(setV('title',capTitle(x.title)||x.title))filled.push('name');
      var cap=cleanCap(x.text);if(cap){if(setV('text',cap)||setV('sum',cap.length>220?capTitle(cap):cap))filled.push('caption');if(cap.length>220&&m.querySelector('[data-k="body"]'))setV('body',cap)}

      var dt=m.querySelector('[data-k="date"]');if(dt&&x.date)dt.value=String(x.date).slice(0,10);
      var fin=function(){go.disabled=false;say(filled.length?'Filled in: '+filled.join(', ')+'. Please check the text, add the Khmer or English version, then tap '+(m.querySelector('[data-ok]')?m.querySelector('[data-ok]').textContent:'Add')+'.':'We could not read details from this link. Please fill in the form by hand.',!filled.length)};
      if(x.image&&m.querySelector('[data-pv="img"]')){say('Saving the picture…');keepCover(x.image).then(function(im){m._setImg('img',im);filled.push('picture');fin()})}else fin()})
    .catch(function(er){go.disabled=false;say(String(er&&er.message)==='private'?'Facebook did not share the details of this post (it may be private or need a login). Please fill in the form by hand or upload the picture.':'We could not read this link. Check that it is public, or fill in the form by hand.',true)})}}

function factL(ic,k,v,href){return '<div class="fact"><span class="fi">'+I(ic)+'</span><div><b>'+esc(k)+'</b><span>'+(href?'<a href="'+esc(href)+'"'+(/^https?:/.test(href)?' target="_blank" rel="noopener"':'')+'>'+esc(v)+'</a>':esc(v))+'</span></div></div>'}
function contactFacts(p){var km=lang==='km',h='';
  if(tr(p.dishes))h+=fact('bowl',km?'ម្ហូបពិសេស':'Signature dishes',tr(p.dishes));
  if(tr(p.hours))h+=fact('clock',km?'ម៉ោងបើក':'Opening hours',tr(p.hours));
  if(p.price)h+=fact('money',km?'តម្លៃ':'Price',p.price);
  if(p.stars)h+=fact('star',km?'ផ្កាយ':'Hotel class',p.stars+(km?' ផ្កាយ':' stars'));
  if(tr(p.address))h+=fact('address',km?'អាសយដ្ឋាន':'Address',tr(p.address));
  if(p.phone)h+=factL('phone',km?'ទូរស័ព្ទ':'Phone',p.phone,'tel:'+String(p.phone).replace(/[^\d+]/g,''));
  if(p.website)h+=factL('globe',km?'គេហទំព័រ':'Website',String(p.website).replace(/^https?:\/\//,'').replace(/\/$/,''),url(p.website));
  if(p.facebook)h+=factL('facebook','Facebook',String(p.facebook).replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''),url(p.facebook));
  if(p.telegram)h+=factL('telegram','Telegram',p.telegram,linkOf('telegram',p.telegram));
  if(p.email)h+=factL('mail',km?'អ៊ីមែល':'Email',p.email,'mailto:'+p.email);
  return h}

var tPause=0,tTimer=null;
function tStep(row){return row.querySelector('.tile')?row.querySelector('.tile').getBoundingClientRect().width+6:120}
function tMove(row,d){var max=row.scrollWidth-row.clientWidth;if(max<=4)return;var x=row.scrollLeft+d*tStep(row);if(d>0&&row.scrollLeft>=max-4)x=0;else if(d<0&&row.scrollLeft<=4)x=max;row.scrollTo({left:x,behavior:'smooth'})}
function tBar(row){var b=row.parentNode.querySelector('.tbar i');if(!b)return;var w=row.scrollWidth,c=row.clientWidth;if(w<=c+4){b.parentNode.style.visibility='hidden';return}b.parentNode.style.visibility='';b.style.width=(c/w*100)+'%';b.style.left=(row.scrollLeft/w*100)+'%'}
function initTiles(){
  clearInterval(tTimer);
  var rows=app.querySelectorAll('.tiles.row');if(!rows.length)return;
  rows.forEach(function(row){tBar(row);row.addEventListener('scroll',function(){tBar(row)},{passive:true});
    ['touchstart','pointerdown','wheel'].forEach(function(ev){row.addEventListener(ev,function(){tPause=Date.now()+8000},{passive:true})})});
  if(editing||admin||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  tTimer=setInterval(function(){if(Date.now()<tPause||document.hidden)return;app.querySelectorAll('.tiles.row').forEach(function(row){var r=row.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)tMove(row,1)})},3000);
}

    if(!c.emergency)c.emergency=JSON.parse(JSON.stringify(EMBED.emergency||[]));if(!c.cities)c.cities=[]}
  if((c.rev||0)<8){c.ui=Object.assign({},c.ui||{},{tiles:'classic',icons:'original'})}

function publish(){
  clearTimeout(pubTimer);
  if(pubBusy){pubTimer=setTimeout(publish,800);return}

function quickVideo(done){

  pickVideo(function(file){
    var ov=document.createElement('div');ov.className='modal';ov.style.zIndex=95;ov.innerHTML='<div class="sheet" style="max-width:420px"><div class="bd"><b>Uploading video…</b><div class="vbar"><div class="vfill"></div><span class="vtxt">0%</span></div><small style="color:var(--muted)">Keep this page open until it finishes.</small></div></div>';document.body.appendChild(ov);
    var fill=ov.querySelector('.vfill'),tx=ov.querySelector('.vtxt');
    uploadVideo(file,function(p){fill.style.width=p+'%';tx.textContent=p+'%'}).then(function(r){ov.remove();toast('Video uploaded');done(r)})
    .catch(function(err){ov.remove();modal('Video not uploaded','<p style="margin:0">'+esc(String(err))+'</p><div style="display:flex;justify-content:flex-end"><button class="btn" data-close>OK</button></div>')})})}
function getObj(list,id){if(list==='path')return id.split('.').reduce(function(o,k){return o==null?o:o[k]},S);return (LIST(list)||[]).find(function(x){return x.id===id})}
function quickMedia(list,id,kind){
  var o=getObj(list,id);
  if(!o&&list==='path'){o={id:uid()};setObj(id,o)}
  if(!o)return;
  if(kind==='photo')pickImage(1600,function(u){o.img=u;changed();toast('Photo changed')});
  else if(kind==='video')addVideoForm(o,function(it){if(it.v){o.video=it.v;o.videoPoster=it.p||'';if(o.link&&embedOf(o.link))o.link=''}else{delete o.video;delete o.videoPoster;o.link=it.l;if(it.p)o.img=it.p;if(it.t&&!tr(o.title))o.title=it.t}changed()});
  else if(kind==='novideo'){delete o.video;delete o.videoPoster;if(o.link&&embedOf(o.link))o.link='';changed();toast('Video removed. The photo shows instead.')}
  else if(kind==='nophoto'){o.img='';changed();toast('Photo removed')}
  else if(kind==='online')onlinePicker('photo',o.q||(o.title&&o.title.en?o.title.en+' Cambodia':'Cambodia'),function(r){o.img=r.img;setCredit(r.img,r);changed();toast('Photo changed')});
  else if(kind==='onlinevideo')onlinePicker('video',o.q||(o.title&&o.title.en?o.title.en:'Cambodia'),function(r){o.video=r.src;o.videoPoster=r.poster;setCredit(r.src,r);changed();toast('Video added')});
}

/* Small wrapper around Firebase Realtime Database, shared by the website chat and the agent inbox */
const TS={__ts:1};
const INC=n=>({__inc:n});
const ms=v=>typeof v==='number'?v:(v&&v.toMillis?v.toMillis():Date.now());
async function makeDB(cfg,name){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [app,au,d]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);
  if(!cfg||!cfg.apiKey)throw new Error('no config');
  const a=app.initializeApp(cfg,name);
  const db=d.getDatabase(a,cfg.databaseURL);
  const R=p=>d.ref(db,p);
  const conv=o=>{if(o===null||typeof o!=='object'||Array.isArray(o))return o;const r={};for(const k in o){const v=o[k];r[k]=v===TS?d.serverTimestamp():(v&&v.__inc)?d.increment(v.__inc):v}return r};
  const list=(s,rev)=>{const out=[];s.forEach(c=>{out.push(Object.assign({id:c.key},c.val()))});return rev?out.reverse():out};
  return {
    auth:au.getAuth(a),A:au,
    get:async p=>{const s=await d.get(R(p));return s.exists()?s.val():null},
    set:(p,v)=>d.set(R(p),conv(v)),
    update:(p,v)=>d.update(R(p),conv(v)),
    push:(p,v)=>d.push(R(p),conv(v)),
    on:(p,cb,err)=>d.onValue(R(p),s=>cb(s.exists()?s.val():null),err||(()=>{})),
    onMsgs:(p,cb,err)=>d.onValue(d.query(R(p),d.orderByKey(),d.limitToLast(300)),s=>cb(list(s)),err||(()=>{})),
    onRecent:(p,field,n,cb,err)=>d.onValue(d.query(R(p),d.orderByChild(field),d.limitToLast(n)),s=>cb(list(s,true)),err||(()=>{})),
    onDisconnect:(p,v)=>d.onDisconnect(R(p)).update(conv(v)),
    onConnected:cb=>d.onValue(R('.info/connected'),s=>cb(!!s.val())),
    remove:p=>d.remove(R(p)),
    findEq:async(p,field,val)=>{const sn=await d.get(d.query(R(p),d.orderByChild(field),d.equalTo(val)));return list(sn)},
    tx:async(p,fn)=>{const r=await d.runTransaction(R(p),fn);return {committed:r.committed,val:r.snapshot.val()}},
    createUser:(e,pw)=>au.createUserWithEmailAndPassword(au.getAuth(a),e,pw)
  };
}

async function clearChat(){const live=chat&&(chat.status==='waiting'||chat.status==='assigned');

  clearedAt=Math.max(Date.now(),...msgs.map(m=>ms(m.ts)||0),...local.map(m=>ms(m.ts)||0))+1;try{localStorage.setItem('thean-chat-cleared',String(clearedAt))}catch(e){}
  local=[];for(const k in FV)delete FV[k];sesLang=null;lastBody='';draw(true)}
async function nextTicket(){const r=await fb.tx('counters/ticket',cur=>(typeof cur==='number'?cur:0)+1);if(!r.committed||typeof r.val!=='number')throw new Error('ticket');return String(r.val).padStart(16,'0')}
const fmtT=t=>{const p=String(t||'').split('-');const b=p[0].replace(/\D/g,'').padStart(16,'0').replace(/(\d{4})(?=\d)/g,'$1 ');return p[1]?b+'-'+p[1]:b};
const kmDig=x=>String(x).replace(/\d/g,d=>'០១២៣៤៥៦៧៨៩'[d]);
function fmtDate(v,lg){const d=new Date(ms(v));const p=n=>String(n).padStart(2,'0');let h=d.getHours(),ap=h<12?'AM':'PM';h=h%12||12;
  if(lg==='km')return kmDig(p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' ម៉ោង '+h+':'+p(d.getMinutes()))+' '+(ap==='AM'?'ព្រឹក':'ល្ងាច');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+' at '+h+':'+p(d.getMinutes())+' '+ap}
async function ticketFlow(base,lg){
  let rec=null;try{rec=await fb.get('tickets/'+base)}catch(e){}
  if(!rec){await typeThen(900,{from:'bot',text:w('tNotFound',lg).split('{t}').join(fmtT(base)),btns:btnLive(lg).concat([{l:w('bMore',lg),a:'more'}])});return}
  const cur=rec.cur||base;
  if(rec.status==='closed'){await touch({followTicket:base,lastMsg:'Asked about closed case '+fmtT(cur),lastFrom:'visitor'});
    await typeThen(1000,{from:'bot',text:w('tClosed',lg).split('{t}').join(fmtT(cur)).split('{d}').join(rec.closedAt?fmtDate(rec.closedAt,lg):'—'),btns:[{l:w('bReopen',lg),a:'reopen:'+base}].concat(btnLive(lg),[{l:w('bMore',lg),a:'more'}])});return}
  await fb.update(CP(),{followTicket:base,ticket:base,ticketCur:cur,ticketStatus:'open',status:'waiting',requestedAt:TS,updatedAt:TS,lastMsg:'Follow-up of ticket '+fmtT(cur),lastFrom:'visitor',unreadAgent:INC(1)});
  await typeThen(900,{from:'bot',text:w('follow',lg).split('{t}').join(fmtT(cur))});await typeThen(1800,{from:'bot',text:w('hold1',lg),btns:[{l:w('bEnd',lg),a:'end'}]})}
async function reopenCase(base){const lg=L();
  try{await ensureChat()}catch(e){offline=true}
  if(offline){local.push({from:'system',text:w('noLive',lg),alt:true,ts:Date.now()});draw(true);return}
  let rec=null;try{rec=await fb.get('tickets/'+base)}catch(e){}
  if(!rec){await typeThen(700,{from:'bot',text:w('tNotFound',lg).split('{t}').join(fmtT(base)),btns:btnLive(lg)});return}
  if(rec.status!=='closed')return ticketFlow(base,lg);
  const n=(rec.reopens||0)+1,cur=base+'-'+n;
  try{await fb.update('tickets/'+base,{status:'open',reopens:n,cur,curChat:user.uid,reopenedAt:TS})}catch(e){await typeThen(700,{from:'bot',text:w('busy',lg),btns:btnLive(lg)});return}
  await fb.update(CP(),{followTicket:base,ticket:base,ticketCur:cur,ticketStatus:'open',status:'waiting',requestedAt:TS,updatedAt:TS,lastMsg:'Reopened case '+fmtT(cur),lastFrom:'visitor',unreadAgent:INC(1)});
  await typeThen(900,{from:'bot',text:w('tReopened',lg).split('{t}').join(fmtT(cur))});await typeThen(1600,{from:'bot',text:w('hold1',lg),btns:[{l:w('bEnd',lg),a:'end'}]})}
const FORMS={contact:['name','phone','email','other'],report:['name','phone','email','ours','orig','details','want','files']};
const REPORT_RE=/(copyright|without (my |our )?permission|stole|stolen|steal|my (own )?(photo|picture|video|content|post)s?|take ?down|remove my|give (me )?credit|ច្បាប់ចម្លង|រក្សាសិទ្ធិ|គ្មានការអនុញ្ញាត|មិនបានអនុញ្ញាត|លួច)/i;
function loadFb(){if(fb)return Promise.resolve(fb);if(!fbP)fbP=makeDB(FB_CONFIG,'thean').then(x=>(fb=x));return fbP}
function authUser(){return loadFb().then(f=>new Promise(res=>{const off=f.A.onAuthStateChanged(f.auth,u=>{off();res(u)})}))}
async function ensureUser(){await loadFb();if(user&&user.isAnonymous)return user;let u=await authUser();if(!u||!u.isAnonymous){const c=await fb.A.signInAnonymously(fb.auth);u=c.user}user=u;return user}
const CP=()=>'chats/'+user.uid, MP=()=>'messages/'+user.uid;
async function ensureChat(lang){
  await ensureUser();
  if(!chat){
    const ex=await fb.get(CP());
    if(!ex){await fb.set(CP(),{visitorUid:user.uid,status:'bot',lang:lang||L(),name:'',contact:'',page:location.hash||'#/',createdAt:TS,updatedAt:TS,lastMsg:'',lastFrom:'',unreadAgent:0,unreadVisitor:0,ua:navigator.userAgent.slice(0,160)})}
    else chat=ex;
    try{localStorage.setItem(STARTED,'1')}catch(e){}
    try{const s=await fb.get('settings/public');if(s&&s.waitMin)waitMin=+s.waitMin||10;if(s&&s.autoMin)autoMin=+s.autoMin||30}catch(e){}
    listen();
    await new Promise(r=>{const t=setInterval(()=>{if(chat){clearInterval(t);r()}},40)});
  }
  return chat;
}
let msgsLoaded=false;
function listen(){
  if(unsub.length)return;
  unsub.push(fb.on(CP(),v=>{chat=v;if(chat){liveMode=chat.status==='waiting'||chat.status==='assigned';if(open&&chat.unreadVisitor)fb.update(CP(),{unreadVisitor:0}).catch(()=>{});checkTimeout()}draw()}));
  unsub.push(fb.onMsgs(MP(),list=>{
    const known=new Set(msgs.map(m=>m.id));msgs=list;
    const fresh=list.filter(m=>!known.has(m.id)&&(m.from==='agent'||(m.from==='system'&&m.join)));
    if(msgsLoaded&&fresh.length&&!open){unread+=fresh.length;peek=fresh[fresh.length-1];beep()}
    msgsLoaded=true;draw(true);
  }));
}
async function say(m){
  if(!m.btns)delete m.btns; /* push a message from this visitor's browser */
  if(offline||!fb||!user||!chat){local.push(Object.assign({ts:Date.now(),id:'l'+Math.random()},m));draw(true);return}
  await fb.push(MP(),Object.assign({ts:TS},m));
}

let toBusy=false;
async function checkTimeout(){
  if(chat&&chat.status==='assigned'&&chat.updatedAt&&!toBusy&&Date.now()-ms(chat.updatedAt)>=autoMin*60000){
    toBusy=true;
    try{const r=await fb.tx(CP()+'/status',cur=>cur===null?null:(cur==='assigned'?'bot':undefined));
      if(r.committed&&r.val==='bot'){const lg=L();await say({from:'bot',text:w('autoEnd',lg).split('{min}').join(lg==='km'?String(autoMin).replace(/\d/g,d=>'០១២៣៤៥៦៧៨៩'[d]):autoMin),auto:true});await touch({lastMsg:'Closed automatically after '+autoMin+' min without messages',lastFrom:'system'})}}catch(e){}
    toBusy=false;return}
  if(!chat||chat.status!=='waiting'||!chat.requestedAt||toBusy)return;
  if(Date.now()-ms(chat.requestedAt)<waitMin*60000)return;
  toBusy=true;
  try{const r=await fb.tx(CP()+'/status',cur=>cur===null?null:(cur==='waiting'?'bot':undefined));
    if(r.committed&&r.val==='bot'){const lg=L();await say({from:'bot',text:w('busy',lg),btns:btnLive(lg)});await touch({lastMsg:'No agent answered in time',lastFrom:'bot'})}}catch(e){}
  toBusy=false;
}

async function option(key,label){

async function send(text){
  text=String(text||'').trim().slice(0,1500);if(!text)return;
  const ta=root.querySelector('.tc-foot textarea');if(ta){ta.value='';ta.style.height=''}
  try{await ensureChat()}catch(e){offline=true}
  setLg(detectLang(text));
  await say({from:'visitor',text});
  const live=chat&&(chat.status==='waiting'||chat.status==='assigned');
  if(!offline){const up={lastMsg:text.slice(0,120),lastFrom:'visitor',page:location.hash||'#/'};if(live)up.unreadAgent=INC(1);if(chat&&chat.status==='closed')up.status='bot';await touch(up)}
  if(live)return;
  const tm=text.match(/(?:^|[^\d])((?:\d[ ]?){15}\d)(?![\d])/);
  if(tm&&!offline){return ticketFlow(tm[1].replace(/\D/g,''),L())}

  botTyping=true;draw(true);
  setTimeout(async()=>{botTyping=false;const lg=hasKm(text)?'km':L();const r=bot(text);
    await say({from:'bot',text:r.text,links:(r.links||[]).map(x=>({l:x[0],h:x[1]})),btns:r.caps?undefined:r.live?btnLive(lg):(r.more?btnLive(lg).concat(w('opts',lg).map(o=>({l:o[1],a:'opt:'+o[0]}))):undefined)});
    if(r.caps)await capsMsg(lg);
    await touch({lastMsg:r.text.slice(0,120),lastFrom:'bot'});
  },650+Math.min(900,text.length*12));
}
async function act(a,label){
  if(a.indexOf('lang:')!==0)setLg(detectLang(label));
  if(a.indexOf('lang:')===0)return pickLang(a.slice(5));
  if(a==='live')return goLive();
  if(a==='call'){if(window.TheanCall)window.TheanCall.start();return}
  if(a==='end')return endLive();
  if(a==='more')return more(label);
  if(a.indexOf('reopen:')===0){await say({from:'visitor',text:label});return reopenCase(a.slice(7))}
  if(a.indexOf('opt:')===0)return option(a.slice(4),label);
}
