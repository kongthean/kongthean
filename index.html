ិមិត្តរូបនៃឯកភាព និងនិរន្តរភាពនៃព្រះរាជាណាចក្រកម្ពុជា។"}, "how": {"en": "Religious ceremonies are held at the Royal Palace, with monks chanting blessings for the King's long life and good health. Portraits of the King and national and royal flags decorate streets and public buildings. Many people also make merit at pagodas on the King's behalf.", "km": "ពិធីបុណ្យសាសនា ត្រូវបានប្រារព្ធនៅព្រះបរមរាជវាំង ដោយមានព្រះសង្ឃសូត្រមន្តថ្វាយព្រះពរ សូមឱ្យព្រះមហាក្សត្រមានព្រះជន្មាយុយឺនយូរ និងព្រះកាយពលមាំមួន។ ព្រះរូបព្រះមហាក្សត្រ ទង់ជាតិ និងទង់ព្រះមហាក្សត្រ ត្រូវបានតុបតែងតាមផ្លូវ និងអគារសាធារណៈ។ ប្រជាជនជាច្រើនក៏ធ្វើបុណ្យនៅវត្ត ដើម្បីថ្វាយព្រះរាជកុសលផងដែរ។"}, "where": {"en": "The area around the Royal Palace and the riverside in Phnom Penh is decorated for the occasion. It is a public holiday, and most people spend it quietly with family.", "km": "តំបន់ជុំវិញព្រះបរមរាជវាំង និងមាត់ទន្លេក្នុងរាជធានីភ្នំពេញ ត្រូវបានតុបតែងសម្រាប់ឱកាសនេះ។ នេះជាថ្ងៃឈប់សម្រាកសាធារណៈ ហើយប្រជាជនភាគច្រើនសម្រាកនៅជាមួយគ្រួសារ។"}, "tip": {"en": "The Royal Palace may close to visitors during royal ceremonies, so check opening times before you go.", "km": "ព្រះបរមរាជវាំងអាចបិទមិនឱ្យភ្ញៀវចូលទស្សនា ក្នុងអំឡុងព្រះរាជពិធី ដូច្នេះសូមពិនិត្យម៉ោងបើកមុនពេលទៅ។"}}, {"title": {"en": "Queen Mother Norodom Monineath's Birthday", "km": "ព្រះរាជពិធីបុណ្យចម្រើនព្រះជន្ម សម្ដេចព្រះមហាក្សត្រី នរោត្តម មុនិនាថ សីហនុ"}, "text": {"en": "18 June", "km": "១៨ មិថុនា"}, "id": "queen-mother-norodom-monineath-s-birthda", "body": {"en": "Her Majesty Queen Mother Norodom Monineath Sihanouk was born on 18 June 1936. As the wife of the late King Father Norodom Sihanouk and mother of King Norodom Sihamoni, she is deeply respected by Cambodians, and her birthday is celebrated as a royal and national occasion.", "km": "សម្ដេចព្រះមហាក្សត្រី នរោត្តម មុនិនាថ សីហនុ ព្រះវររាជមាតាជាតិខ្មែរ ព្រះរាជសម្ភពនៅថ្ងៃទី ១៨ ខែមិថុនា ឆ្នាំ ១៩៣៦។ ក្នុងនាមជាព្រះអគ្គមហេសីនៃព្រះករុណា ព្រះបាទ នរោត្តម សីហនុ ព្រះវររាជបិតាជាតិ និងជាព្រះវររាជមាតានៃព្រះករុណា ព្រះបាទ នរោត្តម សីហមុនី ព្រះអង្គទទួលបានការគោរពយ៉ាងជ្រាលជ្រៅពីប្រជាជនខ្មែរ ហើយព្រះរាជពិធីបុណ្យចម្រើនព្រះជន្មរបស់ព្រះអង្គ ត្រូវបានប្រារព្ធជាឱកាសរាជ និងជាតិ។"}, "how": {"en": "Buddhist ceremonies are held at the Royal Palace, where monks offer blessings for the Queen Mother's long life and good health. Royal portraits and flags are displayed in public places, and many Cambodians make merit at their local pagoda in her honour.", "km": "ពិធីបុណ្យព្រះពុទ្ធសាសនា ត្រូវបានប្រារព្ធនៅព្រះបរមរាជវាំង ដែលព្រះសង្ឃសូត្រមន្តថ្វាយព្រះពរ សូមឱ្យសម្ដេចព្រះមហាក្សត្រីមានព្រះជន្មាយុយឺនយូរ និងព្រះកាយពលមាំមួន។ ព្រះរូប និងទង់នានា ត្រូវបានតាំងបង្ហាញនៅទីសាធារណៈ ហើយប្រជាជនខ្មែរជាច្រើនធ្វើបុណ្យនៅវត្តក្នុងភូមិ ដើម្បីថ្វាយព្រះរាជកុសលដល់ព្រះអង្គ។"}, "where": {"en": "Celebrations centre on the Royal Palace in Phnom Penh. It is a public holiday across the country.", "km": "ការប្រារព្ធផ្ដោតសំខាន់នៅព្រះបរមរាជវាំង ក្នុងរាជធានីភ្នំពេញ។ នេះជាថ្ងៃឈប់សម្រាកសាធារណៈទូទាំងប្រទេស។"}, "tip": {"en": "Government offices and banks close for the day, so plan any errands or visa matters around it.", "km": "ការិយាល័យរដ្ឋ និងធនាគារបិទនៅថ្ងៃនេះ ដូច្នេះសូមរៀបចំកិច្ចការ ឬបញ្ហាទិដ្ឋាការរបស់អ្នកឱ្យបានមុន ឬក្រោយ។"}}, {"title": {"en": "Constitution Day", "km": "ទិវាប្រកាសរដ្ឋធម្មនុញ្ញ"}, "text": {"en": "24 September", "km": "២៤ កញ្ញា"}, "id": "constitution-day", "body": {"en": "On 24 September 1993, the Constitution of the Kingdom of Cambodia was promulgated, restoring the constitutional monarchy, and King Norodom Sihanouk returned to the throne. Constitution Day marks the foundation of the modern Kingdom, built on the principles of liberal multi-party democracy, human rights and the rule of law.", "km": "នៅថ្ងៃទី ២៤ ខែកញ្ញា ឆ្នាំ ១៩៩៣ រដ្ឋធម្មនុញ្ញនៃព្រះរាជាណាចក្រកម្ពុជា ត្រូវបានប្រកាសឱ្យប្រើ ដោយស្ដាររបបរាជានិយមអាស្រ័យរដ្ឋធម្មនុញ្ញឡើងវិញ ហើយព្រះករុណា ព្រះបាទ នរោត្តម សីហនុ បានគ្រងរាជសម្បត្តិឡើងវិញ។ ទិវាប្រកាសរដ្ឋធម្មនុញ្ញ សម្គាល់គ្រឹះនៃព្រះរាជាណាចក្រសម័យទំនើប ដែលកសាងលើគោលការណ៍ប្រជាធិបតេយ្យសេរីពហុបក្ស សិទ្ធិមនុស្ស និងនីតិរដ្ឋ។"}, "how": {"en": "Official ceremonies are held by the government and national institutions, and national flags are flown across the country. For most Cambodians it is a calm day off, often spent with family, and some years it falls close to Pchum Ben.", "km": "រាជរដ្ឋាភិបាល និងស្ថាប័នជាតិ រៀបចំពិធីផ្លូវការ ហើយទង់ជាតិត្រូវបានលើកនៅទូទាំងប្រទេស។ សម្រាប់ប្រជាជនខ្មែរភាគច្រើន នេះជាថ្ងៃសម្រាកដ៏ស្ងប់ស្ងាត់ ដែលច្រើនតែចំណាយពេលជាមួយគ្រួសារ ហើយក្នុងឆ្នាំខ្លះ វាត្រូវនឹងពេលជិតបុណ្យភ្ជុំបិណ្ឌ។"}, "where": {"en": "There is no large public festival; the day is marked with official ceremonies and flags, mainly in Phnom Penh. It is a public holiday nationwide.", "km": "មិនមានពិធីបុណ្យសាធារណៈធំដុំទេ។ ទិវានេះត្រូវបានប្រារព្ធដោយពិធីផ្លូវការ និងការលើកទង់ជាតិ ជាពិសេសនៅរាជធានីភ្នំពេញ។ នេះជាថ្ងៃឈប់សម្រាកសាធារណៈទូទាំងប្រទេស។"}, "tip": {"en": "Banks and government offices close, but most tourist sites, shops and restaurants stay open as usual.", "km": "ធនាគារ និងការិយាល័យរដ្ឋបិទ ប៉ុន្តែរមណីយដ្ឋានទេសចរណ៍ ហាង និងភោជនីយដ្ឋានភាគច្រើន នៅតែបើកដូចធម្មតា។"}}, {"title": {"en": "King Father Norodom Sihanouk Commemoration Day", "km": "ទិវាប្រារព្ធពិធីគោរពព្រះវិញ្ញាណក្ខន្ធ ព្រះវររាជបិតា នរោត្តម សីហនុ"}, "text": {"en": "15 October", "km": "១៥ តុលា"}, "id": "king-father-norodom-sihanouk-commemorati", "body": {"en": "King Father Norodom Sihanouk passed away on 15 October 2012. He led Cambodia to independence in 1953 and remains one of the most important figures in our modern history. This day honours his memory and his lifelong service to the nation, and Cambodians still lovingly call him the King Father.", "km": "ព្រះករុណា ព្រះបាទ នរោត្តម សីហនុ ព្រះវររាជបិតាជាតិខ្មែរ បានយាងសោយទិវង្គត នៅថ្ងៃទី ១៥ ខែតុលា ឆ្នាំ ២០១២។ ព្រះអង្គបានដឹកនាំកម្ពុជាឆ្ពោះទៅរកឯករាជ្យនៅឆ្នាំ ១៩៥៣ ហើយនៅតែជាឥស្សរជនដ៏សំខាន់បំផុតមួយរូបក្នុងប្រវត្តិសាស្ត្រសម័យទំនើបរបស់យើង។ ទិវានេះ គោរពរំលឹកដល់ព្រះអង្គ និងព្រះរាជកិច្ចដែលព្រះអង្គបានបំពេញពេញមួយព្រះជន្ម ដើម្បីប្រទេសជាតិ ហើយប្រជាជនខ្មែរនៅតែហៅព្រះអង្គដោយក្ដីស្រឡាញ់ថា ព្រះវររាជបិតា។"}, "how": {"en": "Memorial ceremonies are held at the Royal Palace, with monks chanting and offerings dedicated to the King Father. People bring flowers, candles and incense to his statue near the Independence Monument, and many families make merit at pagodas in his memory.", "km": "ពិធីរំលឹកវិញ្ញាណក្ខន្ធ ត្រូវបានប្រារព្ធនៅព្រះបរមរាជវាំង ដោយមានព្រះសង្ឃសូត្រមន្ត និងការថ្វាយទេយ្យវត្ថុឧទ្ទិសដល់ព្រះវររាជបិតា។ ប្រជាជននាំផ្កា ទៀន និងធូប ទៅគោរពព្រះបរមរូបរបស់ព្រះអង្គ ក្បែរវិមានឯករាជ្យ ហើយគ្រួសារជាច្រើនធ្វើបុណ្យនៅវត្ត ដើម្បីឧទ្ទិសព្រះរាជកុសលដល់ព្រះអង្គ។"}, "where": {"en": "The King Father's statue beside the Independence Monument in Phnom Penh is where people gather to pay their respects. It is a public holiday.", "km": "ព្រះបរមរូបព្រះវររាជបិតា ក្បែរវិមានឯករាជ្យក្នុងរាជធានីភ្នំពេញ ជាកន្លែងដែលប្រជាជនជួបជុំគ្នាដើម្បីថ្វាយការគោរព។ នេះជាថ្ងៃឈប់សម្រាកសាធារណៈ។"}, "tip": {"en": "This is a day of remembrance, so if you visit the memorial, dress respectfully and behave quietly.", "km": "នេះជាថ្ងៃនៃការរំលឹក ដូច្នេះប្រសិនបើអ្នកទៅទស្សនាទីរំលឹក សូមស្លៀកពាក់គួរសម និងរក្សាភាពស្ងប់ស្ងាត់។"}}, {"title": {"en": "King Norodom Sihamoni's Coronation Day", "km": "ព្រះរាជពិធីគ្រងព្រះបរមរាជសម្បត្តិ ព្រះមហាក្សត្រ នរោត្តម សីហមុនី"}, "text": {"en": "29 October", "km": "២៩ តុលា"}, "id": "king-norodom-sihamoni-s-coronation-day", "body": {"en": "King Norodom Sihamoni was crowned on 29 October 2004, after his father, King Norodom Sihanouk, abdicated and the Royal Council of the Throne chose him as the new King. Coronation Day celebrates his accession and the continuity of the Cambodian monarchy.", "km": "ព្រះករុណា ព្រះបាទសម្ដេចព្រះបរមនាថ នរោត្តម សីហមុនី បានគ្រងព្រះបរមរាជសម្បត្តិ នៅថ្ងៃទី ២៩ ខែតុលា ឆ្នាំ ២០០៤ ក្រោយពេលព្រះវររាជបិតា ព្រះបាទ នរោត្តម សីហនុ ដាក់រាជសម្បត្តិ ហើយក្រុមប្រឹក្សារាជសម្បត្តិបានជ្រើសតាំងព្រះអង្គជាព្រះមហាក្សត្រថ្មី។ ទិវានេះ អបអរការឡើងគ្រងរាជ្យរបស់ព្រះអង្គ និងនិរន្តរភាពនៃរាជបល្ល័ង្កកម្ពុជា។"}, "how": {"en": "Royal and religious ceremonies are held at the Royal Palace, and the streets of Phnom Penh are decorated with royal portraits, flags and lights. Many people make merit at the pagoda to wish the King good health and a long reign.", "km": "ព្រះរាជពិធី និងពិធីសាសនា ត្រូវបានប្រារព្ធនៅព្រះបរមរាជវាំង ហើយផ្លូវនានាក្នុងរាជធានីភ្នំពេញ ត្រូវបានតុបតែងដោយព្រះរូប ទង់ និងភ្លើងពណ៌។ ប្រជាជនជាច្រើនធ្វើបុណ្យនៅវត្ត ដើម្បីថ្វាយព្រះពរ សូមឱ្យព្រះមហាក្សត្រមានព្រះកាយពលមាំមួន និងគង់រាជ្យបានយូរអង្វែង។"}, "where": {"en": "The Royal Palace area and riverside in Phnom Penh are the focus of the decorations. It is a public holiday.", "km": "តំបន់ព្រះបរមរាជវាំង និងមាត់ទន្លេក្នុងរាជធានីភ្នំពេញ ជាចំណុចសំខាន់នៃការតុបតែង។ នេះជាថ្ងៃឈប់សម្រាកសាធារណៈ។"}, "tip": {"en": "Expect some road closures near the Royal Palace during ceremonies, and check whether the palace is open to visitors that day.", "km": "សូមរំពឹងថាផ្លូវមួយចំនួនក្បែរព្រះបរមរាជវាំងនឹងត្រូវបិទ ក្នុងពេលព្រះរាជពិធី ហើយសូមពិនិត្យមើលថា តើព្រះបរមរាជវាំងបើកឱ្យភ្ញៀវចូលទស្សនាឬទេនៅថ្ងៃនោះ។"}}, {"title": {"en": "Independence Day", "km": "ទិវាបុណ្យឯករាជ្យជាតិ"}, "text": {"en": "9 November", "km": "៩ វិច្ឆិកា"}, "id": "independence-day", "body": {"en": "On 9 November 1953, Cambodia gained full independence from France, following a campaign led by King Norodom Sihanouk. The day honours the nation's sovereignty and the people who worked for it, and the lotus-shaped Independence Monument in Phnom Penh stands as its symbol.", "km": "នៅថ្ងៃទី ៩ ខែវិច្ឆិកា ឆ្នាំ ១៩៥៣ កម្ពុជាទទួលបានឯករាជ្យពេញលេញពីប្រទេសបារាំង ក្រោយបេសកកម្មដឹកនាំដោយព្រះករុណា ព្រះបាទ នរោត្តម សីហនុ។ ទិវានេះគោរពដល់អធិបតេយ្យភាពជាតិ និងអស់អ្នកដែលបានតស៊ូដើម្បីវា ហើយវិមានឯករាជ្យរាងផ្កាឈូកនៅរាជធានីភ្នំពេញ គឺជានិមិត្តរូបរបស់ទិវានេះ។"}, "how": {"en": "The King presides over a ceremony at the Independence Monument in the morning and lights the victory flame, attended by national leaders, monks and the armed forces. National flags fly across the country, and the monument is illuminated at night.", "km": "ព្រះមហាក្សត្រ ទ្រង់យាងជាអធិបតីក្នុងពិធីនៅវិមានឯករាជ្យ នៅពេលព្រឹក និងទ្រង់អុជភ្លើងជ័យ ដោយមានការចូលរួមពីថ្នាក់ដឹកនាំជាតិ ព្រះសង្ឃ និងកងកម្លាំងប្រដាប់អាវុធ។ ទង់ជាតិត្រូវបានលើកនៅទូទាំងប្រទេស ហើយវិមានត្រូវបានបំភ្លឺភ្លើងនៅពេលយប់។"}, "where": {"en": "Independence Monument on Norodom Boulevard in Phnom Penh is the centre of the day. It is a public holiday across the country.", "km": "វិមានឯករាជ្យ នៅលើមហាវិថីព្រះនរោត្តម ក្នុងរាជធានីភ្នំពេញ ជាចំណុចកណ្ដាលនៃទិវានេះ។ នេះជាថ្ងៃឈប់សម្រាកសាធារណៈទូទាំងប្រទេស។"}, "tip": {"en": "Roads around the monument close for the morning ceremony; come back in the evening to see it lit up.", "km": "ផ្លូវជុំវិញវិមានត្រូវបានបិទក្នុងពេលពិធីនៅពេលព្រឹក។ សូមត្រឡប់មកវិញនៅពេលល្ងាច ដើម្បីទស្សនាវិមានដែលបំភ្លឺភ្លើង។"}}, {"title": {"en": "Peace Day", "km": "ទិវាសន្តិភាពនៅកម្ពុជា"}, "text": {"en": "29 December", "km": "២៩ ធ្នូ"}, "id": "peace-day", "body": {"en": "Peace Day in Cambodia, on 29 December, marks the end of decades of civil war, when the last Khmer Rouge forces were integrated into society in 1998 under the government's win-win policy. For the first time in many years, the whole country was at peace, opening the way for rebuilding and development.", "km": "ទិវាសន្តិភាពនៅកម្ពុជា នៅថ្ងៃទី ២៩ ខែធ្នូ សម្គាល់ការបញ្ចប់សង្គ្រាមស៊ីវិលរាប់សិបឆ្នាំ នៅពេលដែលកងកម្លាំងខ្មែរក្រហមចុងក្រោយ ត្រូវបានធ្វើសមាហរណកម្មចូលក្នុងសង្គមវិញ នៅឆ្នាំ ១៩៩៨ តាមរយៈនយោបាយឈ្នះ-ឈ្នះរបស់រាជរដ្ឋាភិបាល។ ជាលើកដំបូងក្នុងរយៈពេលជាច្រើនឆ្នាំ ប្រទេសទាំងមូលមានសន្តិភាព ដែលបើកផ្លូវដល់ការកសាង និងអភិវឌ្ឍន៍ឡើងវិញ។"}, "how": {"en": "The day is marked by official ceremonies and gatherings led by the government, with speeches on the value of peace and national unity. For most families it is a public holiday to rest and spend time together at the end of the year.", "km": "ទិវានេះត្រូវបានប្រារព្ធដោយពិធីផ្លូវការ និងការជួបជុំ ដឹកនាំដោយរាជរដ្ឋាភិបាល ជាមួយសុន្ទរកថាអំពីតម្លៃនៃសន្តិភាព និងឯកភាពជាតិ។ សម្រាប់គ្រួសារភាគច្រើន នេះជាថ្ងៃឈប់សម្រាកសាធារណៈ ដើម្បីសម្រាក និងចំណាយពេលជាមួយគ្នានៅចុងឆ្នាំ។"}, "where": {"en": "The Win-Win Memorial in Phnom Penh tells the story of how peace was achieved. It is a public holiday nationwide.", "km": "វិមានឈ្នះ-ឈ្នះ នៅរាជធានីភ្នំពេញ រៀបរាប់ពីដំណើររឿងនៃការកសាងសន្តិភាព។ នេះជាថ្ងៃឈប់សម្រាកសាធារណៈទូទាំងប្រទេស។"}, "tip": {"en": "With the year-end holiday season, hotels in Siem Reap and on the coast get busy, so book your stay early.", "km": "ដោយសារជារដូវថ្ងៃឈប់សម្រាកចុងឆ្នាំ សណ្ឋាគារនៅខេត្តសៀមរាប និងតំបន់ឆ្នេរមានភ្ញៀវច្រើន ដូច្នេះសូមកក់កន្លែងស្នាក់នៅឱ្យបានឆាប់។"}}], "classical": [{"title": {"en": "Robam Tep Apsara", "km": "របាំទេពអប្សរ"}, "text": {"en": "The dance of the celestial apsaras carved on the walls of Angkor, created for the Royal Ballet in the 1960s.", "km": "របាំនៃទេពអប្សរ ដែលឆ្លាក់នៅលើជញ្ជាំងអង្គរ បង្កើតឡើងសម្រាប់របាំព្រះរាជទ្រព្យ នៅទសវត្សឆ្នាំ ១៩៦០។"}, "id": "robam-tep-apsara", "body": {"en": "Robam Tep Apsara brings to life the celestial dancers carved by the thousands on the walls of Angkor. It was created for the Royal Ballet in the early 1960s under the guidance of Queen Sisowath Kossamak, and her granddaughter Princess Norodom Buppha Devi became its most celebrated dancer. For us, it has become the best-known image of Cambodian classical dance.", "km": "របាំទេពអប្សរ នាំយកទេពអប្សររាប់ពាន់ ដែលឆ្លាក់នៅលើជញ្ជាំងអង្គរ មកមានជីវិតឡើងវិញ។ របាំនេះត្រូវបានបង្កើតឡើងសម្រាប់របាំព្រះរាជទ្រព្យ នៅដើមទសវត្សឆ្នាំ ១៩៦០ ក្រោមការដឹកនាំរបស់ព្រះមហាក្សត្រិយានី ស៊ីសុវត្ថិ កុសមៈ ហើយព្រះចៅរបស់ព្រះអង្គ គឺសម្ដេចរាជបុត្រី នរោត្តម បុប្ផាទេវី បានក្លាយជាអ្នករបាំដ៏ល្បីល្បាញបំផុត។ សម្រាប់យើង របាំនេះបានក្លាយជារូបភាពដ៏ល្បីបំផុតនៃរបាំបុរាណខ្មែរ។"}, "how": {"en": "The dancers wear fitted silk costumes, golden jewellery and tall crowns with spires modelled on the Angkor carvings, and they are often sewn into their costumes before going on stage. The music is played by a pinpeat ensemble of xylophones, gong circles, oboe and drums. Movements are slow and controlled, with deeply bent knees, a lifted chest and hands that curve backwards into the classical kbach gestures, each of which carries a meaning such as a flower, a fruit or growth. Today it is performed at state ceremonies, cultural events and for visitors.", "km": "អ្នករបាំស្លៀកពាក់សូត្រតឹងខ្លួន ពាក់គ្រឿងអលង្ការមាស និងមកុដខ្ពស់មានកំពូល ដែលយកគំរូតាមចម្លាក់អង្គរ ហើយជាញឹកញាប់ពួកគេត្រូវដេរសម្លៀកបំពាក់ភ្ជាប់នឹងខ្លួន មុនឡើងឆាក។ តន្ត្រីត្រូវបានលេងដោយវង់ភ្លេងពិណពាទ្យ ដែលមានរនាត គងវង់ ស្រឡៃ និងស្គរ។ ចលនាយឺតៗ និងមានការគ្រប់គ្រង ដោយជង្គង់បត់ទាប ទ្រូងងើបឡើង និងដៃកោងទៅក្រោយជាក្បាច់បុរាណ ដែលក្បាច់នីមួយៗមានអត្ថន័យ ដូចជាផ្កា ផ្លែឈើ ឬការលូតលាស់។ សព្វថ្ងៃ របាំនេះត្រូវបានសម្ដែងក្នុងពិធីរដ្ឋ កម្មវិធីវប្បធម៌ និងសម្រាប់ភ្ញៀវទេសចរ។"}, "where": {"en": "In Siem Reap, almost every apsara dinner show includes this dance, and it also features in classical dance programmes in Phnom Penh, often staged around the National Museum and the Royal University of Fine Arts.", "km": "នៅសៀមរាប ស្ទើរតែគ្រប់កម្មវិធីរបាំអប្សរ និងអាហារពេលល្ងាច មានរបាំនេះ ហើយវាក៏មាននៅក្នុងកម្មវិធីរបាំបុរាណនៅភ្នំពេញផងដែរ ដែលជាញឹកញាប់ត្រូវបានរៀបចំនៅជុំវិញសារមន្ទីរជាតិ និងសាកលវិទ្យាល័យភូមិន្ទវិចិត្រសិល្បៈ។"}, "tip": {"en": "Watch the dancers' fingers: the backward bend of the hands takes years of training from early childhood.", "km": "សូមសង្កេតម្រាមដៃរបស់អ្នករបាំ៖ ការពត់ដៃទៅក្រោយ ត្រូវការការហ្វឹកហាត់ច្រើនឆ្នាំ តាំងពីកុមារភាព។"}}, {"title": {"en": "Robam Choun Por", "km": "របាំជូនពរ"}, "text": {"en": "A blessing dance that opens many performances: dancers scatter flower petals to wish guests good health and happiness.", "km": "របាំប្រសិទ្ធិពរ ដែលបើកការសម្ដែងជាច្រើន៖ អ្នករបាំរោយផ្កា ដើម្បីជូនពរភ្ញៀវឱ្យមានសុខភាពល្អ និងសុភមង្គល។"}, "id": "robam-choun-por", "body": {"en": "Robam Choun Por, the blessing dance, belongs to the classical repertoire and is traditionally used to welcome guests and open a programme. Its meaning is simple and warm: the dancers wish everyone present good health, happiness and prosperity.", "km": "របាំជូនពរ ជារបាំក្នុងរបាំបុរាណ ហើយតាមប្រពៃណីត្រូវបានប្រើដើម្បីស្វាគមន៍ភ្ញៀវ និងបើកកម្មវិធី។ អត្ថន័យរបស់វាសាមញ្ញ និងកក់ក្ដៅ៖ អ្នករបាំជូនពរដល់អ្នកដែលមានវត្តមានទាំងអស់ ឱ្យមានសុខភាពល្អ សុភមង្គល និងភាពរុងរឿង។"}, "how": {"en": "A group of female dancers in classical costume and crowns enters carrying small bowls of flower petals. Accompanied by a pinpeat or mahori ensemble and singers, they move in graceful formations, then scatter the petals towards the audience as a blessing. The dance is short and gentle, which makes it a natural opening for festivals, official receptions, weddings and cultural shows.", "km": "អ្នករបាំស្រីមួយក្រុម ស្លៀកពាក់សម្លៀកបំពាក់បុរាណ និងពាក់មកុដ ចូលមកកាន់ពានតូចៗដាក់ផ្កា។ ដោយមានវង់ភ្លេងពិណពាទ្យ ឬមហោរី និងអ្នកច្រៀងអមដំណើរ ពួកគេរាំជាទម្រង់ដ៏ទន់ភ្លន់ រួចរោយផ្កាទៅកាន់ទស្សនិកជន ជាការជូនពរ។ របាំនេះខ្លី និងស្រទន់ ដែលធ្វើឱ្យវាសមស្របសម្រាប់បើកពិធីបុណ្យ ពិធីទទួលភ្ញៀវផ្លូវការ ពិធីរៀបការ និងកម្មវិធីវប្បធម៌។"}, "where": {"en": "You will often see it as the first item of dinner shows in Siem Reap and cultural performances in Phnom Penh, as well as at official ceremonies and large weddings.", "km": "អ្នកនឹងឃើញវាជាញឹកញាប់ ជាលេខដំបូងនៃកម្មវិធីសម្ដែងពេលអាហារល្ងាចនៅសៀមរាប និងការសម្ដែងវប្បធម៌នៅភ្នំពេញ ព្រមទាំងនៅពិធីផ្លូវការ និងពិធីរៀបការធំៗ។"}, "tip": {"en": "If petals land near you, it is a good sign: smile and receive the blessing.", "km": "ប្រសិនបើផ្កាធ្លាក់មកជិតអ្នក នោះជាសញ្ញាល្អ៖ សូមញញឹម ហើយទទួលយកពរជ័យ។"}}, {"title": {"en": "Robam Moni Mekhala", "km": "របាំមណីមេខលា"}, "text": {"en": "The goddess of the waters outwits the giant Ream Eyso with her crystal ball. Their struggle explains thunder and lightning and calls the rain.", "km": "ទេពធីតានៃទឹក បញ្ឆោតយក្សរាមឥសូរ ដោយកែវមណីរបស់នាង។ ការប្រយុទ្ធរបស់ពួកគេ ពន្យល់ពីផ្គរ និងរន្ទះ ហើយហៅភ្លៀងឱ្យធ្លាក់។"}, "id": "robam-moni-mekhala", "body": {"en": "Robam Moni Mekhala tells the story of Moni Mekhala, goddess of the waters, and the giant Ream Eyso, who wants her magic crystal ball. When she flashes the crystal, lightning appears, and when he throws his axe, thunder roars. The dance is closely linked to rain and fertility and has long been performed as part of ceremonies asking for rain.", "km": "របាំមណីមេខលា និទានរឿងនាងមណីមេខលា ទេពធីតានៃទឹក និងយក្សរាមឥសូរ ដែលចង់បានកែវមណីវិសេសរបស់នាង។ ពេលនាងបញ្ចាំងកែវ នោះកើតជាផ្លេកបន្ទោរ ហើយពេលគាត់បោះពូថៅ នោះផ្គរលាន់។ របាំនេះមានទំនាក់ទំនងយ៉ាងជិតស្និទ្ធនឹងភ្លៀង និងភាពសម្បូរសប្បាយ ហើយត្រូវបានសម្ដែងតាំងពីយូរមកហើយ ជាផ្នែកមួយនៃពិធីសុំទឹកភ្លៀង។"}, "how": {"en": "Moni Mekhala wears a classical female costume and holds a small crystal ball, while Ream Eyso wears a giant's mask and carries an axe. A pinpeat ensemble and singers narrate the chase as she teases and escapes him again and again. The battle scenes are lively but stylised, with the drum marking the thunder. It is performed in classical programmes and in ritual performances for rain.", "km": "នាងមណីមេខលា ស្លៀកពាក់សម្លៀកបំពាក់តួស្រីបុរាណ ហើយកាន់កែវមណីតូចមួយ ចំណែករាមឥសូរ ពាក់មុខយក្ស និងកាន់ពូថៅ។ វង់ភ្លេងពិណពាទ្យ និងអ្នកច្រៀង និទានការដេញតាម ខណៈនាងលេងសើច ហើយគេចខ្លួនពីគាត់ម្ដងហើយម្ដងទៀត។ ឈុតប្រយុទ្ធរស់រវើក ប៉ុន្តែមានក្បាច់ច្បាស់លាស់ ដោយស្គរបង្ហាញសំឡេងផ្គរ។ របាំនេះត្រូវបានសម្ដែងក្នុងកម្មវិធីរបាំបុរាណ និងក្នុងពិធីសុំទឹកភ្លៀង។"}, "where": {"en": "It is part of the repertoire of classical dance shows in Phnom Penh and Siem Reap, and it is sometimes performed at ceremonies during the dry season.", "km": "របាំនេះជាផ្នែកមួយនៃកម្មវិធីរបាំបុរាណនៅភ្នំពេញ និងសៀមរាប ហើយពេលខ្លះត្រូវបានសម្ដែងក្នុងពិធីនានា ក្នុងរដូវប្រាំង។"}, "tip": {"en": "Next time you see lightning over the rice fields, remember: Cambodians say it is Moni Mekhala flashing her crystal.", "km": "លើកក្រោយ ពេលអ្នកឃើញផ្លេកបន្ទោរលើវាលស្រែ សូមចាំថា៖ ខ្មែរនិយាយថា នោះគឺនាងមណីមេខលា កំពុងបញ្ចាំងកែវរបស់នាង។"}}, {"title": {"en": "Robam Tep Monorom", "km": "របាំទេពមនោរម្យ"}, "text": {"en": "A graceful duet of celestial couples expressing joy and harmony.", "km": "របាំគូដ៏ទន់ភ្លន់នៃទេវតា បង្ហាញពីសេចក្ដីរីករាយ និងភាពសុខដុម។"}, "id": "robam-tep-monorom", "body": {"en": "Robam Tep Monorom is a classical dance in which pairs of male and female celestial beings dance together. It has no dramatic story; its meaning lies in the joy, harmony and gentle courtship of the heavenly couples.", "km": "របាំទេពមនោរម្យ ជារបាំបុរាណ ដែលទេវតាប្រុស និងស្រីរាំជាគូៗជាមួយគ្នា។ វាមិនមានរឿងរ៉ាវដ៏ស្មុគស្មាញទេ អត្ថន័យរបស់វាស្ថិតនៅលើសេចក្ដីរីករាយ ភាពសុខដុម និងការចែចង់ដ៏ទន់ភ្លន់ របស់គូទេវតា។"}, "how": {"en": "In the classical tradition the male roles are also danced by women, so you will see pairs in two types of costume: the male role with a short jacket, epaulettes and a pointed crown, and the female role with a shoulder sash and crown. Accompanied by a pinpeat ensemble, the couples move in mirror patterns, exchanging glances and kbach gestures. The dance is calm and elegant and is usually part of classical programmes and festive performances.", "km": "នៅក្នុងប្រពៃណីរបាំបុរាណ តួប្រុសក៏ត្រូវបានរាំដោយស្ត្រីដែរ ដូច្នេះអ្នកនឹងឃើញគូដែលស្លៀកពាក់ពីរប្រភេទ៖ តួប្រុសពាក់អាវខ្លី ស្មាង និងមកុដស្រួច ហើយតួស្រីពាក់ស្បៃ និងមកុដ។ ដោយមានវង់ភ្លេងពិណពាទ្យអម គូរបាំរាំឆ្លុះគ្នាទៅវិញទៅមក ដោយផ្លាស់ប្ដូរការក្រឡេកមើល និងក្បាច់ដៃ។ របាំនេះស្ងប់ និងប្រណិត ហើយជាធម្មតាជាផ្នែកមួយនៃកម្មវិធីរបាំបុរាណ និងការសម្ដែងក្នុងពិធីបុណ្យ។"}, "where": {"en": "Look for it in classical dance programmes in Phnom Penh and in the longer dinner shows in Siem Reap.", "km": "សូមស្វែងរកវានៅក្នុងកម្មវិធីរបាំបុរាណនៅភ្នំពេញ និងក្នុងកម្មវិធីសម្ដែងពេលអាហារល្ងាចដែលវែងជាងគេនៅសៀមរាប។"}, "tip": {"en": "Try to spot which dancers play the male roles: look for the pointed crowns and shoulder ornaments.", "km": "សូមព្យាយាមស្វែងរកអ្នករបាំដែលដើរតួប្រុស៖ មើលមកុដស្រួច និងគ្រឿងលម្អលើស្មា។"}}, {"title": {"en": "Robam Preah Thong Neang Neak", "km": "របាំព្រះថោងនាងនាគ"}, "text": {"en": "Tells the founding legend of Cambodia: the prince Preah Thong and the Naga princess Neang Neak.", "km": "និទានរឿងព្រេងកំណើតកម្ពុជា៖ ព្រះថោង និងនាងនាគ។"}, "id": "robam-preah-thong-neang-neak", "body": {"en": "This dance tells the founding legend of Cambodia. The prince Preah Thong arrives by sea and meets Neang Neak, daughter of the Naga king; they fall in love and marry, and the Naga king creates a kingdom for them, which became the land of the Khmer. The legend lives on in Khmer weddings, where the groom holds the end of the bride's sash, just as Preah Thong followed Neang Neak to her father's realm.", "km": "របាំនេះនិទានរឿងព្រេងកំណើតប្រទេសកម្ពុជា។ ព្រះថោងយាងមកតាមសមុទ្រ ហើយជួបនាងនាគ ជាបុត្រីរបស់ស្ដេចនាគ។ ពួកគេស្រឡាញ់គ្នា ហើយរៀបអភិសេក រួចស្ដេចនាគបានបង្កើតនគរមួយសម្រាប់ពួកគេ ដែលក្លាយជាទឹកដីខ្មែរ។ រឿងព្រេងនេះនៅតែរស់នៅក្នុងពិធីរៀបការខ្មែរ ដែលកូនកំលោះកាន់ចុងស្បៃរបស់កូនក្រមុំ ដូចព្រះថោងតាមនាងនាគទៅកាន់នគររបស់បិតានាង។"}, "how": {"en": "Preah Thong appears in the costume of a classical prince, and Neang Neak and her companions wear crowns and ornaments that suggest the naga serpent. A pinpeat ensemble with singers narrates the meeting, the courtship and the journey to the underwater kingdom. The dance is often performed at cultural events and as a meaningful item at weddings.", "km": "ព្រះថោងបង្ហាញខ្លួនក្នុងសម្លៀកបំពាក់ព្រះអង្គម្ចាស់បុរាណ ហើយនាងនាគ និងបរិវាររបស់នាងពាក់មកុដ និងគ្រឿងលម្អដែលរំលឹកដល់នាគ។ វង់ភ្លេងពិណពាទ្យ និងអ្នកច្រៀង និទានការជួបគ្នា ការចែចង់ និងដំណើរទៅកាន់នគរក្រោមទឹក។ របាំនេះត្រូវបានសម្ដែងជាញឹកញាប់ក្នុងកម្មវិធីវប្បធម៌ និងជាលេខដែលមានអត្ថន័យនៅក្នុងពិធីរៀបការ។"}, "where": {"en": "You may see it in classical dance programmes in Phnom Penh and Siem Reap, and if you are invited to a Khmer wedding, watch for the sash ritual that recalls this legend.", "km": "អ្នកអាចឃើញវានៅក្នុងកម្មវិធីរបាំបុរាណនៅភ្នំពេញ និងសៀមរាប ហើយប្រសិនបើអ្នកត្រូវបានអញ្ជើញទៅពិធីរៀបការខ្មែរ សូមសង្កេតមើលពិធីកាន់ស្បៃ ដែលរំលឹកដល់រឿងព្រេងនេះ។"}, "tip": {"en": "Knowing this story makes a Khmer wedding much easier to understand, so share it with your travel companions.", "km": "ការដឹងរឿងនេះ ធ្វើឱ្យងាយយល់ពីពិធីរៀបការខ្មែរ ដូច្នេះសូមចែករំលែកវាជាមួយមិត្តរួមដំណើររបស់អ្នក។"}}, {"title": {"en": "Robam Sovann Maccha", "km": "របាំសុវណ្ណមច្ឆា"}, "text": {"en": "From the Reamker: the golden mermaid princess tries to stop Hanuman's army from building a bridge, then falls in love with him.", "km": "ពីរឿងរាមកេរ្តិ៍៖ នាងសុវណ្ណមច្ឆា ព្យាយាមរារាំងកងទ័ពហនុមាន មិនឱ្យសាងស្ពាន រួចនាងស្រឡាញ់ហនុមាន។"}, "id": "robam-sovann-maccha", "body": {"en": "Robam Sovann Maccha comes from the Reamker, the great Khmer epic. Sovann Maccha, the golden mermaid princess, orders her fish to carry away the stones Hanuman's army is using to build a causeway to the island of Krong Reap. Hanuman catches her, and their confrontation turns into love.", "km": "របាំសុវណ្ណមច្ឆា មកពីរឿងរាមកេរ្តិ៍ ដែលជាវីរកថាខ្មែរដ៏អស្ចារ្យ។ នាងសុវណ្ណមច្ឆា ព្រះនាងមច្ឆាមាស បញ្ជាឱ្យហ្វូងត្រីរបស់នាងលួចយកថ្ម ដែលកងទ័ពហនុមានកំពុងប្រើដើម្បីសាងស្ពានឆ្លងទៅកាន់កោះរបស់ក្រុងរាពណ៍។ ហនុមានចាប់បាននាង ហើយការប្រឈមមុខគ្នារបស់ពួកគេ ប្រែក្លាយជាសេចក្ដីស្នេហា។"}, "how": {"en": "Sovann Maccha wears a shimmering golden costume suggesting fish scales, and Hanuman wears a white monkey mask and moves with quick, playful, acrobatic steps. Her fish attendants dance around her in flowing lines. The pinpeat ensemble shifts from tense rhythms during the chase to softer melodies as the two fall in love. It is a popular scene in classical shows and on festive occasions.", "km": "នាងសុវណ្ណមច្ឆា ស្លៀកពាក់សម្លៀកបំពាក់មាសភ្លឺចែងចាំង ដែលរំលឹកដល់ស្រកាត្រី ហើយហនុមានពាក់មុខស្វាពណ៌ស និងរាំដោយក្បាច់រហ័ស លេងសើច និងប្រកបដោយសិល្បៈកាយសម្ព័ន្ធ។ បរិវារត្រីរបស់នាង រាំជុំវិញនាងជាជួរយ៉ាងរលូន។ វង់ភ្លេងពិណពាទ្យ ផ្លាស់ប្ដូរពីចង្វាក់តានតឹងពេលដេញតាម ទៅជាបទភ្លេងទន់ភ្លន់ ពេលអ្នកទាំងពីរស្រឡាញ់គ្នា។ នេះជាឈុតដ៏ពេញនិយមក្នុងកម្មវិធីរបាំបុរាណ និងក្នុងពិធីបុណ្យនានា។"}, "where": {"en": "It appears regularly in classical dance programmes in Phnom Penh and in dinner shows in Siem Reap.", "km": "របាំនេះលេចឡើងជាប្រចាំក្នុងកម្មវិធីរបាំបុរាណនៅភ្នំពេញ និងកម្មវិធីសម្ដែងពេលអាហារល្ងាចនៅសៀមរាប។"}, "tip": {"en": "At Angkor Wat, look for the Reamker scenes carved in the galleries; it makes the dance even more meaningful.", "km": "នៅប្រាសាទអង្គរវត្ត សូមស្វែងរកឈុតរាមកេរ្តិ៍ ដែលឆ្លាក់នៅតាមថែវ វានឹងធ្វើឱ្យរបាំនេះកាន់តែមានអត្ថន័យ។"}}, {"title": {"en": "Robam Reamker", "km": "របាំរាមកេរ្តិ៍"}, "text": {"en": "Scenes from the Khmer epic Reamker: Preah Ream, Neang Seda and the battle against the giant king Krong Reap.", "km": "ឈុតពីរឿងរាមកេរ្តិ៍៖ ព្រះរាម នាងសីតា និងសង្គ្រាមប្រឆាំងនឹងក្រុងរាពណ៍។"}, "id": "robam-reamker", "body": {"en": "The Reamker is the Khmer epic of Preah Ream, his wife Neang Seda, and the giant king Krong Reap, who carries her away to his island. With the help of Hanuman and the monkey army, Preah Ream rescues her, and the story stands for the victory of good over evil. It has inspired Khmer dance, theatre and carving for centuries, and the masked Lakhon Khol tradition of Wat Svay Andet is recognised by UNESCO as heritage in need of urgent safeguarding.", "km": "រឿងរាមកេរ្តិ៍ ជាវីរកថាខ្មែរ អំពីព្រះរាម ព្រះមហេសីនាងសីតា និងស្ដេចយក្សក្រុងរាពណ៍ ដែលចាប់នាងយកទៅកោះរបស់ខ្លួន។ ដោយមានជំនួយពីហនុមាន និងកងទ័ពស្វា ព្រះរាមបានជួយសង្គ្រោះនាងវិញ ហើយរឿងនេះតំណាងឱ្យជ័យជំនះនៃសេចក្ដីល្អលើសេចក្ដីអាក្រក់។ វាបានបំផុសគំនិតដល់របាំ ល្ខោន និងចម្លាក់ខ្មែរ អស់ជាច្រើនសតវត្សមកហើយ ហើយល្ខោនខោលនៃវត្តស្វាយអណ្ដែត ត្រូវបានទទួលស្គាល់ដោយយូណេស្កូ ជាបេតិកភណ្ឌដែលត្រូវការការការពារជាបន្ទាន់។"}, "how": {"en": "Episodes from the Reamker are performed either in the classical dance style or as Lakhon Khol, where male dancers wear masks for the monkeys and giants. A narrator and singers tell the story while a pinpeat ensemble drives the action, with powerful drumming during battles. Costumes are richly embroidered, and the masks of Hanuman and Krong Reap are among the most recognisable in Khmer art. Full performances can last many hours, so shows usually present one or two episodes.", "km": "វគ្គនានានៃរឿងរាមកេរ្តិ៍ ត្រូវបានសម្ដែងតាមរបៀបរបាំបុរាណ ឬជាល្ខោនខោល ដែលអ្នករបាំប្រុសពាក់មុខសម្រាប់តួស្វា និងយក្ស។ អ្នកនិទាន និងអ្នកច្រៀងនិទានរឿង ខណៈវង់ភ្លេងពិណពាទ្យនាំសកម្មភាព ដោយមានការវាយស្គរយ៉ាងខ្លាំងក្លាពេលប្រយុទ្ធ។ សម្លៀកបំពាក់ប៉ាក់យ៉ាងប្រណិត ហើយមុខហនុមាន និងក្រុងរាពណ៍ ស្ថិតក្នុងចំណោមមុខដែលល្បីបំផុតក្នុងសិល្បៈខ្មែរ។ ការសម្ដែងពេញលេញអាចមានរយៈពេលច្រើនម៉ោង ដូច្នេះការសម្ដែងភាគច្រើនបង្ហាញតែមួយ ឬពីរវគ្គប៉ុណ្ណោះ។"}, "where": {"en": "Short Reamker scenes are part of many classical dance shows in Phnom Penh and Siem Reap. Lakhon Khol is traditionally performed by the village troupe of Wat Svay Andet in Kandal province during Khmer New Year.", "km": "ឈុតខ្លីៗនៃរឿងរាមកេរ្តិ៍ ជាផ្នែកមួយនៃកម្មវិធីរបាំបុរាណជាច្រើននៅភ្នំពេញ និងសៀមរាប។ ល្ខោនខោល ត្រូវបានសម្ដែងតាមប្រពៃណីដោយក្រុមភូមិនៃវត្តស្វាយអណ្ដែត ក្នុងខេត្តកណ្ដាល ក្នុងឱកាសបុណ្យចូលឆ្នាំខ្មែរ។"}, "tip": {"en": "Ask our team for a short summary of the episode before the show; it makes the masked characters much easier to follow.", "km": "សូមសួរក្រុមការងាររបស់យើង ដើម្បីទទួលបានសេចក្ដីសង្ខេបខ្លីនៃវគ្គនោះ មុនការសម្ដែង វានឹងធ្វើឱ្យងាយតាមដានតួអង្គពាក់មុខ។"}}, {"title": {"en": "Robam Buong Suong", "km": "របាំបួងសួង"}, "text": {"en": "A sacred prayer dance offered for peace, rain and prosperity.", "km": "របាំបួងសួងដ៏ពិសិដ្ឋ ដើម្បីសុំសន្តិភាព ភ្លៀង និងភាពរុងរឿង។"}, "id": "robam-buong-suong", "body": {"en": "Robam Buong Suong is a sacred prayer dance in which the dancers act as messengers between people and the spirits and deities. It is offered to ask for peace, timely rain, good harvests and the well-being of the nation. Classical dance in Cambodia has always had this ritual role alongside entertainment.", "km": "របាំបួងសួង ជារបាំបួងសួងដ៏ពិសិដ្ឋ ដែលអ្នករបាំដើរតួជាអ្នកនាំសារ រវាងមនុស្ស និងវិញ្ញាណ ព្រមទាំងទេវតា។ វាត្រូវបានថ្វាយដើម្បីសុំសន្តិភាព ភ្លៀងធ្លាក់ទាន់រដូវ ផលដំណាំល្អ និងសេចក្ដីសុខរបស់ប្រទេសជាតិ។ របាំបុរាណនៅកម្ពុជា តែងតែមានតួនាទីជាពិធីសាសនាបែបនេះ ក្រៅពីការកម្សាន្ត។"}, "how": {"en": "The dancers wear full classical costume and crowns and carry offerings such as flowers and candles. Accompanied by a pinpeat ensemble and sacred songs, they perform slow, solemn movements and salutations. Before the performance, teachers and dancers usually pay respect to the spirits of the dance masters. The dance is performed at important ceremonies, in times of drought, and at temples.", "km": "អ្នករបាំស្លៀកពាក់សម្លៀកបំពាក់បុរាណពេញលេញ និងពាក់មកុដ ហើយកាន់គ្រឿងសក្ការៈ ដូចជាផ្កា និងទៀន។ ដោយមានវង់ភ្លេងពិណពាទ្យ និងបទចម្រៀងពិសិដ្ឋអម ពួកគេធ្វើចលនាយឺតៗ ឧឡារិក និងការថ្វាយបង្គំ។ មុនការសម្ដែង គ្រូ និងអ្នករបាំ ជាធម្មតាគោរពវិញ្ញាណគ្រូរបាំ។ របាំនេះត្រូវបានសម្ដែងក្នុងពិធីសំខាន់ៗ ក្នុងគ្រារាំងស្ងួត និងនៅតាមប្រាសាទ។"}, "where": {"en": "Because it is a ritual dance, it is seen less often than other classical pieces; the best chances are official ceremonies, special events at the Angkor temples and occasional classical programmes in Phnom Penh.", "km": "ដោយសារវាជារបាំពិធី វាត្រូវបានឃើញតិចជាងរបាំបុរាណផ្សេងទៀត ឱកាសល្អបំផុតគឺពិធីផ្លូវការ កម្មវិធីពិសេសនៅប្រាសាទអង្គរ និងកម្មវិធីរបាំបុរាណម្ដងម្កាលនៅភ្នំពេញ។"}, "tip": {"en": "If you watch it at a ceremony, stay quiet and avoid flash photography out of respect.", "km": "ប្រសិនបើអ្នកទស្សនាវាក្នុងពិធីមួយ សូមនៅស្ងៀម និងជៀសវាងការថតរូបប្រើពន្លឺហ្វ្លាស ដើម្បីបង្ហាញការគោរព។"}}], "folk": [{"title": {"en": "Robam Trot", "km": "របាំត្រុដិ"}, "text": {"en": "A New Year dance from the north-west, with a deer, hunters and a peacock, performed to chase away the bad luck of the old year.", "km": "របាំចូលឆ្នាំពីភាគពាយ័ព្យ មានសត្វក្ដាន់ ព្រាន និងក្ងោក សម្ដែងដើម្បីបណ្ដេញសំណាងអាក្រក់នៃឆ្នាំចាស់។"}, "id": "robam-trot", "body": {"en": "Robam Trot is a New Year dance from north-western Cambodia, especially the Siem Reap and Battambang areas. Troupes of villagers perform the hunt of a deer by masked hunters, joined by characters such as a peacock and giants, to drive away the bad luck of the old year and welcome the new one. Along the way they collect donations, which are often given to the local pagoda.", "km": "របាំត្រុដិ ជារបាំចូលឆ្នាំពីភាគពាយ័ព្យនៃប្រទេសកម្ពុជា ជាពិសេសតំបន់សៀមរាប និងបាត់ដំបង។ ក្រុមអ្នកភូមិសម្ដែងការបរបាញ់សត្វក្ដាន់ ដោយព្រានពាក់មុខ រួមជាមួយតួអង្គដូចជាក្ងោក និងយក្ស ដើម្បីបណ្ដេញសំណាងអាក្រក់នៃឆ្នាំចាស់ ហើយស្វាគមន៍ឆ្នាំថ្មី។ តាមផ្លូវ ពួកគេប្រមូលបច្ច័យ ដែលជាញឹកញាប់ត្រូវបានប្រគេនដល់វត្តក្នុងតំបន់។"}, "how": {"en": "The dancers carry a deer figure with antlers, wear masks and simple costumes, and move from house to house in a lively procession. The music comes from drums, a two-stringed tro fiddle, wooden clappers and singers, with call-and-response songs. The dance is mainly performed during the Khmer New Year period in April.", "km": "អ្នករបាំកាន់រូបសត្វក្ដាន់មានស្នែង ពាក់មុខ និងសម្លៀកបំពាក់សាមញ្ញ ហើយដើរពីផ្ទះមួយទៅផ្ទះមួយ ជាក្បួនដង្ហែដ៏រស់រវើក។ តន្ត្រីមកពីស្គរ ទ្រ ក្រាប់ និងអ្នកច្រៀង ជាមួយបទចម្រៀងឆ្លើយឆ្លង។ របាំនេះត្រូវបានសម្ដែងជាចម្បង ក្នុងរដូវបុណ្យចូលឆ្នាំខ្មែរ នៅខែមេសា។"}, "where": {"en": "The best place to see it is in villages and towns around Siem Reap and Battambang during Khmer New Year, and at New Year events at the Angkor temples.", "km": "កន្លែងល្អបំផុតដើម្បីទស្សនា គឺនៅតាមភូមិ និងទីប្រជុំជនជុំវិញសៀមរាប និងបាត់ដំបង ក្នុងបុណ្យចូលឆ្នាំខ្មែរ និងនៅកម្មវិធីចូលឆ្នាំនៅប្រាសាទអង្គរ។"}, "tip": {"en": "Keep a few small riel notes ready: troupes are happy to receive a small donation.", "km": "សូមរៀបចំលុយរៀលតូចៗខ្លះ៖ ក្រុមរបាំរីករាយទទួលបច្ច័យបន្តិចបន្តួច។"}}, {"title": {"en": "Robam Nesat", "km": "របាំនេសាទ"}, "text": {"en": "A playful fishing dance: young men and women catch fish with bamboo traps.", "km": "របាំនេសាទដ៏រីករាយ៖ យុវជន និងយុវនារីចាប់ត្រីដោយឧបករណ៍ឫស្សី។"}, "id": "robam-nesat", "body": {"en": "Robam Nesat, the fishing dance, was choreographed in the 1960s at the Royal University of Fine Arts in Phnom Penh. Inspired by village life along Cambodia's rivers and lakes, it shows young men and women fishing together and, at the same time, gently courting.", "km": "របាំនេសាទ ត្រូវបានរៀបចំក្បាច់នៅទសវត្សឆ្នាំ ១៩៦០ នៅសាកលវិទ្យាល័យភូមិន្ទវិចិត្រសិល្បៈ ក្នុងរាជធានីភ្នំពេញ។ ដោយបំផុសគំនិតពីជីវភាពអ្នកភូមិតាមដងទន្លេ និងបឹងបួររបស់កម្ពុជា វាបង្ហាញពីយុវជន និងយុវនារី ដែលនេសាទជាមួយគ្នា ហើយក្នុងពេលជាមួយគ្នានោះ ចែចង់គ្នាដោយទន់ភ្លន់។"}, "how": {"en": "The women carry woven bamboo baskets and the men use bell-shaped bamboo fish traps, and the dancers wear simple rural clothes with krama scarves. Accompanied by a folk ensemble, the dancers mime scooping and trapping fish, and the young men tease the women by trying to take their catch. The mood is light and humorous, and it is a favourite at cultural shows, school events and festivals.", "km": "ស្ត្រីកាន់ល្អីឫស្សីត្បាញ ហើយបុរសប្រើអង្រុតឫស្សីរាងដូចកណ្ដឹង ហើយអ្នករបាំស្លៀកពាក់សម្លៀកបំពាក់ជនបទសាមញ្ញ ជាមួយក្រមា។ ដោយមានវង់ភ្លេងប្រជាប្រិយអម អ្នករបាំធ្វើកាយវិការដួសត្រី និងអង្រុតត្រី ហើយយុវជនលេងសើចជាមួយយុវនារី ដោយព្យាយាមយកត្រីដែលនាងចាប់បាន។ បរិយាកាសស្រាលៗ និងកំប្លែង ហើយវាជារបាំដែលពេញនិយមក្នុងកម្មវិធីវប្បធម៌ ព្រឹត្តិការណ៍សាលា និងពិធីបុណ្យ។"}, "where": {"en": "It is a regular part of folk dance programmes in Phnom Penh and of dinner shows in Siem Reap.", "km": "វាជាផ្នែកមួយជាប្រចាំនៃកម្មវិធីរបាំប្រជាប្រិយនៅភ្នំពេញ និងកម្មវិធីសម្ដែងពេលអាហារល្ងាចនៅសៀមរាប។"}, "tip": {"en": "After the show, visit a floating village on the Tonle Sap to see these same bamboo traps in real use.", "km": "បន្ទាប់ពីការសម្ដែង សូមទៅទស្សនាភូមិបណ្ដែតទឹកនៅបឹងទន្លេសាប ដើម្បីមើលអង្រុតឫស្សីទាំងនេះ ដែលគេប្រើពិតប្រាកដ។"}}, {"title": {"en": "Robam Kngaok Pailin", "km": "របាំក្ងោកពៃលិន"}, "text": {"en": "The peacock dance of Pailin, with dancers dressed as peacocks courting each other.", "km": "របាំក្ងោកនៃខេត្តប៉ៃលិន ដែលអ្នករបាំស្លៀកពាក់ជាក្ងោក ចែចង់គ្នា។"}, "id": "robam-kngaok-pailin", "body": {"en": "Robam Kngaok Pailin, the peacock dance of Pailin, was created in the 1960s by teachers at the Royal University of Fine Arts, inspired by the Kola community of Pailin province in the far west of Cambodia. It celebrates the beauty of the peacock and shows a pair of birds courting, together with people of the village enjoying them.", "km": "របាំក្ងោកពៃលិន ត្រូវបានបង្កើតឡើងនៅទសវត្សឆ្នាំ ១៩៦០ ដោយសាស្ត្រាចារ្យនៅសាកលវិទ្យាល័យភូមិន្ទវិចិត្រសិល្បៈ ដោយបំផុសគំនិតពីសហគមន៍កុឡា នៃខេត្តប៉ៃលិន នៅភាគខាងលិចបង្អស់នៃប្រទេសកម្ពុជា។ វាអបអរសម្រស់របស់ក្ងោក និងបង្ហាញពីក្ងោកមួយគូកំពុងចែចង់គ្នា រួមជាមួយអ្នកភូមិដែលរីករាយមើលពួកវា។"}, "how": {"en": "Two dancers wear colourful peacock costumes with a crest and a large fan-shaped tail, while other dancers wear the bright clothing of the Kola community. Accompanied by a folk ensemble with drums, the peacocks strut, spread their tails and circle each other. It is performed at Khmer New Year, festivals, pagoda ceremonies and cultural shows.", "km": "អ្នករបាំពីរនាក់ស្លៀកពាក់ជាក្ងោកពណ៌ចម្រុះ មានសក់លើក្បាល និងកន្ទុយធំរាងដូចផ្លិត ចំណែកអ្នករបាំផ្សេងទៀត ស្លៀកពាក់សម្លៀកបំពាក់ពណ៌ភ្លឺរបស់សហគមន៍កុឡា។ ដោយមានវង់ភ្លេងប្រជាប្រិយ និងស្គរអម ក្ងោកដើរបង្អួត លាតកន្ទុយ និងដើរវិលជុំវិញគ្នា។ របាំនេះត្រូវបានសម្ដែងក្នុងបុណ្យចូលឆ្នាំខ្មែរ ពិធីបុណ្យ ពិធីនៅវត្ត និងកម្មវិធីវប្បធម៌។"}, "where": {"en": "It is a popular item in folk dance shows in Phnom Penh and Siem Reap, and in Pailin province itself during local festivals.", "km": "វាជារបាំដ៏ពេញនិយមក្នុងកម្មវិធីរបាំប្រជាប្រិយនៅភ្នំពេញ និងសៀមរាប ហើយនៅខេត្តប៉ៃលិនផ្ទាល់ ក្នុងឱកាសពិធីបុណ្យក្នុងតំបន់។"}, "tip": {"en": "Sit close to the front if you can: the peacock costumes are full of fine handmade detail.", "km": "ប្រសិនបើអាច សូមអង្គុយនៅខាងមុខ៖ សម្លៀកបំពាក់ក្ងោក មានលម្អិតធ្វើដោយដៃយ៉ាងល្អិតល្អន់។"}}, {"title": {"en": "Robam Chhayam", "km": "របាំឈៃយ៉ាំ"}, "text": {"en": "A comic dance with long drums and funny costumes, leading processions at festivals and pagoda ceremonies.", "km": "របាំកំប្លែង មានស្គរដៃវែង និងសម្លៀកបំពាក់គួរឱ្យអស់សំណើច នាំមុខក្បួនដង្ហែនៅពិធីបុណ្យ និងពិធីនៅវត្ត។"}, "id": "robam-chhayam", "body": {"en": "Robam Chhayam is one of the most joyful Khmer folk dances. It is a comic entertainment dance, full of clowning characters, that has long led processions at festivals and pagoda ceremonies. Its purpose is simple: to make people laugh and to bring a festive spirit.", "km": "របាំឈៃយ៉ាំ ជារបាំប្រជាប្រិយខ្មែរដែលសប្បាយរីករាយបំផុតមួយ។ វាជារបាំកម្សាន្តបែបកំប្លែង ពោរពេញដោយតួតុក្កតា ដែលតាំងពីយូរមកហើយ បាននាំមុខក្បួនដង្ហែក្នុងពិធីបុណ្យ និងពិធីនៅវត្ត។ គោលបំណងរបស់វាសាមញ្ញ៖ ធ្វើឱ្យមនុស្សសើច និងនាំមកនូវស្មារតីបុណ្យ។"}, "how": {"en": "The heart of the dance is the long chhayam drum, carried on the shoulder and beaten by hand, together with cymbals and other percussion. Comic characters wear masks, exaggerated make-up and funny costumes, and they dance, joke and play tricks on the crowd, while women dancers move gracefully alongside. You will see it in processions for Kathen and other Buddhist festivals, at Khmer New Year and at village celebrations.", "km": "បេះដូងនៃរបាំនេះ គឺស្គរឈៃយ៉ាំដ៏វែង ដែលគេលីលើស្មា និងវាយដោយដៃ រួមជាមួយឈិង និងឧបករណ៍ភ្លេងគោះផ្សេងទៀត។ តួកំប្លែងពាក់មុខ ផាត់មុខហួសហេតុ និងស្លៀកពាក់សម្លៀកបំពាក់គួរឱ្យអស់សំណើច ហើយពួកគេរាំ និយាយលេងសើច និងលេងសើចជាមួយហ្វូងមនុស្ស ខណៈអ្នករបាំស្រីរាំយ៉ាងទន់ភ្លន់នៅក្បែរ។ អ្នកនឹងឃើញវាក្នុងក្បួនដង្ហែបុណ្យកឋិនទាន និងពិធីបុណ្យព្រះពុទ្ធសាសនាផ្សេងទៀត ក្នុងបុណ្យចូលឆ្នាំខ្មែរ និងក្នុងពិធីអបអរនៅតាមភូមិ។"}, "where": {"en": "Your best chance is a pagoda festival, especially during the Kathen season after the rainy season, or Khmer New Year events. Folk dance programmes in Phnom Penh and Siem Reap also often include it.", "km": "ឱកាសល្អបំផុតរបស់អ្នក គឺពិធីបុណ្យនៅវត្ត ជាពិសេសក្នុងរដូវកឋិនទាន ក្រោយរដូវវស្សា ឬកម្មវិធីបុណ្យចូលឆ្នាំខ្មែរ។ កម្មវិធីរបាំប្រជាប្រិយនៅភ្នំពេញ និងសៀមរាប ក៏តែងតែមានរបាំនេះផងដែរ។"}, "tip": {"en": "If a clown invites you to dance, join in: it is all part of the fun.", "km": "ប្រសិនបើតួកំប្លែងអញ្ជើញអ្នកឱ្យរាំ សូមចូលរួម៖ នោះជាផ្នែកមួយនៃភាពសប្បាយ។"}}, {"title": {"en": "Robam Kpaos / Coconut Shell Dance", "km": "របាំគោះត្រឡោក"}, "text": {"en": "Dancers click coconut shells in rhythm in this cheerful courting dance from the countryside.", "km": "អ្នករបាំគោះត្រឡោកដូងតាមចង្វាក់ ក្នុងរបាំចែចង់ដ៏សប្បាយរីករាយពីជនបទ។"}, "id": "robam-kpaos-coconut-shell-dance", "body": {"en": "The coconut shell dance comes from the countryside of Svay Rieng province, in the Romeas Haek district, and was adapted for the stage at the Royal University of Fine Arts in the 1960s. It is a dance of love and courtship between young men and women, and it was traditionally linked to wedding celebrations.", "km": "របាំគោះត្រឡោក មានដើមកំណើតពីជនបទនៃខេត្តស្វាយរៀង ក្នុងស្រុករមាសហែក ហើយត្រូវបានកែសម្រួលសម្រាប់ឆាកនៅសាកលវិទ្យាល័យភូមិន្ទវិចិត្រសិល្បៈ នៅទសវត្សឆ្នាំ ១៩៦០។ វាជារបាំនៃសេចក្ដីស្នេហា និងការចែចង់ រវាងយុវជន និងយុវនារី ហើយតាមប្រពៃណី វាជាប់ទាក់ទងនឹងពិធីរៀបការ។"}, "how": {"en": "Each dancer holds a pair of polished coconut shells and clicks them together, on their own and with a partner, to mark the rhythm. The dancers wear colourful rural costumes, and the music comes from the traditional wedding ensemble. Couples change formation, tap each other's shells and play at catching and escaping. It is performed at weddings, festivals and cultural shows.", "km": "អ្នករបាំម្នាក់ៗកាន់ត្រឡោកដូងដែលខាត់រលោងមួយគូ ហើយគោះវាចូលគ្នា ទាំងតែម្នាក់ឯង និងជាមួយដៃគូ ដើម្បីបង្កើតចង្វាក់។ អ្នករបាំស្លៀកពាក់សម្លៀកបំពាក់ជនបទពណ៌ចម្រុះ ហើយតន្ត្រីមកពីវង់ភ្លេងការបុរាណ។ គូរបាំផ្លាស់ប្ដូរទម្រង់ គោះត្រឡោកគ្នាទៅវិញទៅមក ហើយលេងចាប់ និងគេចខ្លួន។ របាំនេះត្រូវបានសម្ដែងក្នុងពិធីរៀបការ ពិធីបុណ្យ និងកម្មវិធីវប្បធម៌។"}, "where": {"en": "It features in most folk dance programmes in Phnom Penh and dinner shows in Siem Reap, and in Svay Rieng province at local celebrations.", "km": "វាមាននៅក្នុងកម្មវិធីរបាំប្រជាប្រិយភាគច្រើននៅភ្នំពេញ និងកម្មវិធីសម្ដែងពេលអាហារល្ងាចនៅសៀមរាប ហើយនៅខេត្តស្វាយរៀង ក្នុងពិធីអបអរក្នុងតំបន់។"}, "tip": {"en": "Listen closely: the clicks of the shells are part of the music, not just a prop.", "km": "សូមស្ដាប់ឱ្យជិត៖ សំឡេងគោះត្រឡោក ជាផ្នែកមួយនៃតន្ត្រី មិនមែនគ្រាន់តែជាឧបករណ៍ប្រើប្រាស់នោះទេ។"}}, {"title": {"en": "Robam Chrot Srov (Rice Harvest Dance)", "km": "របាំច្រូតស្រូវ"}, "text": {"en": "Shows planting and harvesting rice with sickles, giving thanks for the harvest.", "km": "បង្ហាញពីការដាំ និងច្រូតស្រូវដោយកណ្ដៀវ ដើម្បីអរគុណចំពោះផលដំណាំ។"}, "id": "robam-chrot-srov", "body": {"en": "Robam Chrot Srov celebrates the rice harvest, the most important moment of the farming year in Cambodia. It shows villagers working together in the fields and giving thanks for a good crop, a reminder of how closely Khmer life is tied to rice.", "km": "របាំច្រូតស្រូវ អបអររដូវច្រូតកាត់ ដែលជាពេលវេលាសំខាន់បំផុតនៃឆ្នាំកសិកម្មនៅកម្ពុជា។ វាបង្ហាញពីអ្នកភូមិ ដែលធ្វើការជាមួយគ្នានៅវាលស្រែ និងអរគុណចំពោះផលស្រូវល្អ ដែលជាការរំលឹកថា ជីវិតខ្មែរជាប់ទាក់ទងយ៉ាងជិតស្និទ្ធនឹងស្រូវ។"}, "how": {"en": "The dancers wear simple farmers' clothes, krama scarves and sometimes straw hats, and they carry sickles and bundles of rice. To lively folk music, they mime planting, cutting, binding and carrying the rice, often with playful moments between young men and women. It is performed at harvest-time celebrations, festivals and cultural shows.", "km": "អ្នករបាំស្លៀកពាក់សម្លៀកបំពាក់កសិករសាមញ្ញ ក្រមា និងពេលខ្លះពាក់មួក ហើយពួកគេកាន់កណ្ដៀវ និងកណ្ដាប់ស្រូវ។ តាមបទភ្លេងប្រជាប្រិយដ៏រស់រវើក ពួកគេធ្វើកាយវិការស្ទូង ច្រូត ចង និងលីស្រូវ ជាញឹកញាប់មានពេលលេងសើចរវាងយុវជន និងយុវនារី។ របាំនេះត្រូវបានសម្ដែងក្នុងពិធីអបអររដូវច្រូតកាត់ ពិធីបុណ្យ និងកម្មវិធីវប្បធម៌។"}, "where": {"en": "You can see it in folk dance programmes in Phnom Penh and Siem Reap, and at rural festivals around harvest time, roughly from November to January.", "km": "អ្នកអាចទស្សនាវាក្នុងកម្មវិធីរបាំប្រជាប្រិយនៅភ្នំពេញ និងសៀមរាប និងក្នុងពិធីបុណ្យនៅជនបទ ក្នុងរដូវច្រូតកាត់ ប្រហែលពីខែវិច្ឆិកា ដល់ខែមករា។"}, "tip": {"en": "Travel in the countryside between November and January to see the real harvest that inspired this dance.", "km": "សូមធ្វើដំណើរទៅជនបទ ចន្លោះខែវិច្ឆិកា ដល់ខែមករា ដើម្បីមើលការច្រូតកាត់ពិតប្រាកដ ដែលបានបំផុសគំនិតរបាំនេះ។"}}, {"title": {"en": "Robam Ploy Suoy", "km": "របាំផ្លយសួយ"}, "text": {"en": "A folk dance performed at village festivals and celebrations.", "km": "របាំប្រជាប្រិយ សម្ដែងនៅពិធីបុណ្យ និងការប្រារព្ធនានាក្នុងភូមិ។"}, "id": "robam-ploy-suoy", "body": {"en": "Robam Ploy Suoy is a folk dance performed at village festivals and community celebrations. Its name links it to the phloy, a traditional wind instrument of bamboo pipes and a gourd, and to the Suoy, one of Cambodia's small indigenous communities. Little has been written about its history, so we prefer to keep its story simple.", "km": "របាំផ្លយសួយ ជារបាំប្រជាប្រិយ ដែលសម្ដែងក្នុងពិធីបុណ្យនៅតាមភូមិ និងពិធីអបអររបស់សហគមន៍។ ឈ្មោះរបស់វាភ្ជាប់ទៅនឹងផ្លយ ដែលជាឧបករណ៍ភ្លេងផ្លុំបុរាណ ធ្វើពីបំពង់ឫស្សី និងឃ្លោក និងជនជាតិសួយ ដែលជាសហគមន៍ជនជាតិដើមតូចមួយរបស់កម្ពុជា។ មានឯកសារតិចតួចណាស់អំពីប្រវត្តិរបស់វា ដូច្នេះយើងសូមរក្សារឿងរ៉ាវរបស់វាឱ្យសាមញ្ញ។"}, "how": {"en": "Dancers wear simple village costumes and move in a group in a relaxed, cheerful style, accompanied by folk instruments and drums. The steps are easy and repetitive, which invites the community to join in. It is danced at festivals, gatherings and celebrations in the village.", "km": "អ្នករបាំស្លៀកពាក់សម្លៀកបំពាក់អ្នកភូមិសាមញ្ញ ហើយរាំជាក្រុម តាមរបៀបធូរស្រាល និងរីករាយ ដោយមានឧបករណ៍ភ្លេងប្រជាប្រិយ និងស្គរអម។ ជំហានងាយស្រួល និងធ្វើឡើងវិញៗ ដែលអញ្ជើញសហគមន៍ឱ្យចូលរួម។ របាំនេះត្រូវបានរាំក្នុងពិធីបុណ្យ ការជួបជុំ និងពិធីអបអរនៅក្នុងភូមិ។"}, "where": {"en": "It is occasionally included in folk dance programmes in Phnom Penh; otherwise it is mostly seen at local festivals in the countryside.", "km": "ពេលខ្លះ វាត្រូវបានដាក់បញ្ចូលក្នុងកម្មវិធីរបាំប្រជាប្រិយនៅភ្នំពេញ បើមិនដូច្នោះទេ វាត្រូវបានឃើញភាគច្រើននៅពិធីបុណ្យក្នុងតំបន់ជនបទ។"}, "tip": {"en": "Ask our team about community-based tours, which are the best way to see village dances in their own setting.", "km": "សូមសួរក្រុមការងាររបស់យើង អំពីដំណើរកម្សាន្តតាមសហគមន៍ ដែលជាវិធីល្អបំផុតដើម្បីទស្សនារបាំភូមិ ក្នុងបរិយាកាសដើមរបស់វា។"}}, {"title": {"en": "Robam Samre", "km": "របាំសំរែ"}, "text": {"en": "A dance of the Samre people, one of Cambodia's indigenous communities.", "km": "របាំរបស់ជនជាតិសំរែ ដែលជាសហគមន៍ជនជាតិដើមមួយរបស់កម្ពុជា។"}, "id": "robam-samre", "body": {"en": "Robam Samre is a dance of the Samre, a small indigenous community whose traditional homeland lies around the forests and hills of the Siem Reap region and the Cardamom area. The dance reflects their close relationship with the forest and with the spirits that protect the land. Written sources on its history are limited, so we keep the description general.", "km": "របាំសំរែ ជារបាំរបស់ជនជាតិសំរែ ដែលជាសហគមន៍ជនជាតិដើមតូចមួយ ដែលទឹកដីប្រពៃណីរបស់ពួកគេស្ថិតនៅជុំវិញព្រៃ និងភ្នំក្នុងតំបន់សៀមរាប និងតំបន់ជួរភ្នំក្រវាញ។ របាំនេះឆ្លុះបញ្ចាំងពីទំនាក់ទំនងយ៉ាងជិតស្និទ្ធរបស់ពួកគេជាមួយព្រៃឈើ និងវិញ្ញាណដែលការពារទឹកដី។ ឯកសារសរសេរអំពីប្រវត្តិរបស់វាមានកំណត់ ដូច្នេះយើងរក្សាការពិពណ៌នាឱ្យនៅជាទូទៅ។"}, "how": {"en": "The dancers wear simple traditional clothing and move in a group with grounded, rhythmic steps, accompanied by drums, gongs and folk instruments. Some versions show daily activities and offerings to the spirits. It is danced at community ceremonies and has also been staged in folk dance programmes to share the culture of Cambodia's indigenous peoples.", "km": "អ្នករបាំស្លៀកពាក់សម្លៀកបំពាក់ប្រពៃណីសាមញ្ញ ហើយរាំជាក្រុម ដោយជំហានជាប់ដី និងមានចង្វាក់ ដោយមានស្គរ គង និងឧបករណ៍ភ្លេងប្រជាប្រិយអម។ កំណែខ្លះបង្ហាញពីសកម្មភាពប្រចាំថ្ងៃ និងការសែនព្រេនដល់វិញ្ញាណ។ របាំនេះត្រូវបានរាំក្នុងពិធីរបស់សហគមន៍ ហើយក៏ត្រូវបានសម្ដែងក្នុងកម្មវិធីរបាំប្រជាប្រិយ ដើម្បីចែករំលែកវប្បធម៌របស់ជនជាតិដើមកម្ពុជាផងដែរ។"}, "where": {"en": "It is rarely performed; your best chances are occasional folk dance programmes in Phnom Penh and Siem Reap, or cultural events organised with indigenous communities.", "km": "របាំនេះកម្រត្រូវបានសម្ដែងណាស់ ឱកាសល្អបំផុតរបស់អ្នក គឺកម្មវិធីរបាំប្រជាប្រិយម្ដងម្កាលនៅភ្នំពេញ និងសៀមរាប ឬព្រឹត្តិការណ៍វប្បធម៌ ដែលរៀបចំជាមួយសហគមន៍ជនជាតិដើម។"}, "tip": {"en": "When visiting indigenous communities, always ask before taking photos.", "km": "ពេលទៅទស្សនាសហគមន៍ជនជាតិដើម សូមសុំការអនុញ្ញាតជានិច្ច មុនពេលថតរូប។"}}], "social": [{"title": {"en": "Ramvong", "km": "រាំវង់"}, "text": {"en": "The slow circle dance everyone joins at weddings and parties, moving gently around a table.", "km": "របាំរាំជារង្វង់យឺតៗ ដែលគ្រប់គ្នាចូលរួមនៅពិធីរៀបការ និងពិធីជប់លៀង។"}, "id": "ramvong", "body": {"en": "Ramvong, literally the circle dance, is the best-loved social dance in Cambodia. It became hugely popular in the mid-20th century, and today no Khmer wedding, party or New Year gathering is complete without it. Its spirit is togetherness: young and old, family and guests all dance in the same circle.", "km": "រាំវង់ ដែលមានន័យថារបាំជារង្វង់ ជារបាំសង្គមដែលគេស្រឡាញ់បំផុតនៅកម្ពុជា។ វាបានក្លាយជាពេញនិយមយ៉ាងខ្លាំង នៅពាក់កណ្ដាលសតវត្សទី ២០ ហើយសព្វថ្ងៃ គ្មានពិធីរៀបការ ពិធីជប់លៀង ឬការជួបជុំបុណ្យចូលឆ្នាំខ្មែរណាមួយ ពេញលេញដោយគ្មានវាទេ។ ស្មារតីរបស់វា គឺភាពរួបរួម៖ ក្មេង និងចាស់ គ្រួសារ និងភ្ញៀវ សុទ្ធតែរាំក្នុងរង្វង់តែមួយ។"}, "how": {"en": "Couples walk slowly in a large circle, usually counter-clockwise around a table, with small steps that follow the beat. The hands move gently through simple gestures inspired by classical dance, without touching your partner. The music is played by a live band or from recordings of well-known ramvong songs. Everyday clothes are fine, though at weddings people dress up.", "km": "គូរបាំដើរយឺតៗជារង្វង់ធំ ជាធម្មតាច្រាសទ្រនិចនាឡិកា ជុំវិញតុមួយ ដោយជំហានតូចៗតាមចង្វាក់។ ដៃធ្វើចលនាថ្នមៗ តាមក្បាច់សាមញ្ញ ដែលបំផុសគំនិតពីរបាំបុរាណ ដោយមិនប៉ះដៃគូ។ តន្ត្រីត្រូវបានលេងដោយក្រុមតន្ត្រីផ្ទាល់ ឬពីការថតនៃបទរាំវង់ដ៏ល្បីៗ។ សម្លៀកបំពាក់ធម្មតាក៏បាន ប៉ុន្តែនៅពិធីរៀបការ មនុស្សតែងស្លៀកពាក់ស្អាត។"}, "where": {"en": "You will see it at weddings, parties and Khmer New Year celebrations all over the country, and some dinner shows invite the audience to join a ramvong at the end.", "km": "អ្នកនឹងឃើញវានៅពិធីរៀបការ ពិធីជប់លៀង និងពិធីអបអរបុណ្យចូលឆ្នាំខ្មែរ នៅទូទាំងប្រទេស ហើយកម្មវិធីសម្ដែងពេលអាហារល្ងាចខ្លះ អញ្ជើញទស្សនិកជនឱ្យចូលរួមរាំវង់នៅចុងបញ្ចប់។"}, "tip": {"en": "Do not worry about the steps: just follow the person in front of you and move your hands softly.", "km": "កុំបារម្ភអំពីជំហាន៖ គ្រាន់តែដើរតាមអ្នកនៅខាងមុខ ហើយធ្វើចលនាដៃថ្នមៗ។"}}, {"title": {"en": "Ram Kbach", "km": "រាំក្បាច់"}, "text": {"en": "A graceful social dance using the hand gestures of classical dance.", "km": "របាំសង្គមដ៏ទន់ភ្លន់ ដែលប្រើក្បាច់ដៃនៃរបាំបុរាណ។"}, "id": "ram-kbach", "body": {"en": "Ram Kbach is a social dance that borrows the graceful hand gestures, or kbach, of Khmer classical dance. It allows ordinary people to share in the elegance of the royal tradition, and it is especially loved by older generations at weddings and parties.", "km": "រាំក្បាច់ ជារបាំសង្គម ដែលខ្ចីក្បាច់ដៃដ៏ទន់ភ្លន់ នៃរបាំបុរាណខ្មែរ។ វាអនុញ្ញាតឱ្យប្រជាជនសាមញ្ញ ចូលរួមក្នុងភាពប្រណិតនៃប្រពៃណីរាជវាំង ហើយវាពេញនិយមជាពិសេសចំពោះមនុស្សជំនាន់ចាស់ នៅពិធីរៀបការ និងពិធីជប់លៀង។"}, "how": {"en": "Dancers move slowly in a circle or in couples, stepping gently while their hands form classical shapes such as the flower and the leaf. The tempo is calm, and the songs are often melodious classics of Khmer popular music. No special costume is needed, and it is danced at weddings, parties and New Year gatherings.", "km": "អ្នករបាំរាំយឺតៗជារង្វង់ ឬជាគូ ដោយបោះជំហានថ្នមៗ ខណៈដៃរបស់ពួកគេធ្វើក្បាច់បុរាណ ដូចជាក្បាច់ផ្កា និងក្បាច់ស្លឹក។ ចង្វាក់ស្ងប់ ហើយបទចម្រៀងជាញឹកញាប់ ជាបទបុរាណដ៏ពីរោះ នៃតន្ត្រីប្រជាប្រិយខ្មែរ។ មិនត្រូវការសម្លៀកបំពាក់ពិសេសទេ ហើយវាត្រូវបានរាំនៅពិធីរៀបការ ពិធីជប់លៀង និងការជួបជុំបុណ្យចូលឆ្នាំ។"}, "where": {"en": "Weddings and family celebrations are the best places to see it, along with Khmer New Year parties.", "km": "ពិធីរៀបការ និងពិធីអបអរក្នុងគ្រួសារ គឺជាកន្លែងល្អបំផុតដើម្បីទស្សនាវា រួមជាមួយពិធីជប់លៀងបុណ្យចូលឆ្នាំខ្មែរ។"}, "tip": {"en": "Ask a Cambodian friend to teach you one simple hand gesture; it is a lovely way to connect.", "km": "សូមឱ្យមិត្តខ្មែរម្នាក់ បង្រៀនអ្នកនូវក្បាច់ដៃសាមញ្ញមួយ នោះជាមធ្យោបាយដ៏ល្អក្នុងការភ្ជាប់ទំនាក់ទំនង។"}}, {"title": {"en": "Saravan", "km": "សារ៉ាវ៉ាន់"}, "text": {"en": "A lively dance with swaying steps, danced in a circle or in lines.", "km": "របាំរស់រវើក មានជំហានយោល រាំជារង្វង់ ឬជាជួរ។"}, "id": "saravan", "body": {"en": "Saravan is a lively social dance that has been part of Khmer celebrations for generations. Its swaying rhythm lifts the mood of any party, and it usually follows the slower ramvong to get everyone moving a little faster.", "km": "សារ៉ាវ៉ាន់ ជារបាំសង្គមដ៏រស់រវើក ដែលជាផ្នែកមួយនៃពិធីអបអររបស់ខ្មែរ អស់ជាច្រើនជំនាន់មកហើយ។ ចង្វាក់យោលរបស់វា លើកស្ទួយបរិយាកាសនៃពិធីជប់លៀងណាមួយ ហើយជាធម្មតាវាបន្តពីរាំវង់ដែលយឺតជាង ដើម្បីឱ្យគ្រប់គ្នារាំលឿនជាងមុនបន្តិច។"}, "how": {"en": "Dancers move in a circle or in lines, swaying their hips and shoulders and stepping in time with a bouncy beat, while the hands make light, flowing gestures. The music is played by a band with drums, keyboard and other instruments, or from popular recordings. It is danced at weddings, parties and Khmer New Year celebrations.", "km": "អ្នករបាំរាំជារង្វង់ ឬជាជួរ ដោយយោលត្រគាក និងស្មា ហើយបោះជំហានតាមចង្វាក់លោតៗ ខណៈដៃធ្វើក្បាច់ស្រាលៗ និងរលូន។ តន្ត្រីត្រូវបានលេងដោយក្រុមតន្ត្រី ដែលមានស្គរ ក្ដារចុច និងឧបករណ៍ផ្សេងទៀត ឬពីការថតដ៏ពេញនិយម។ វាត្រូវបានរាំនៅពិធីរៀបការ ពិធីជប់លៀង និងពិធីអបអរបុណ្យចូលឆ្នាំខ្មែរ។"}, "where": {"en": "Any Khmer wedding reception, local party or New Year street celebration is a good place to see, and join, a saravan.", "km": "ពិធីទទួលភ្ញៀវរៀបការខ្មែរ ពិធីជប់លៀងក្នុងតំបន់ ឬពិធីអបអរបុណ្យចូលឆ្នាំតាមដងផ្លូវណាមួយ គឺជាកន្លែងល្អដើម្បីទស្សនា និងចូលរួមរាំសារ៉ាវ៉ាន់។"}, "tip": {"en": "Relax your shoulders and let the rhythm lead you; nobody expects visitors to be perfect.", "km": "សូមបន្ធូរស្មា ហើយឱ្យចង្វាក់នាំអ្នក គ្មាននរណារំពឹងថាភ្ញៀវនឹងរាំបានល្អឥតខ្ចោះនោះទេ។"}}, {"title": {"en": "Madison", "km": "ម៉ាឌីសុង"}, "text": {"en": "A line dance loved at Khmer weddings since the 1960s.", "km": "របាំជាជួរ ដែលពេញនិយមនៅពិធីរៀបការខ្មែរ តាំងពីទសវត្សឆ្នាំ ១៩៦០។"}, "id": "madison", "body": {"en": "The Madison is a line dance that arrived in Cambodia in the 1960s, the golden era of Khmer popular music, and it has been a favourite at Khmer weddings ever since. It is a good example of how Cambodians made a modern dance their own.", "km": "ម៉ាឌីសុង ជារបាំជាជួរ ដែលបានមកដល់កម្ពុជានៅទសវត្សឆ្នាំ ១៩៦០ ដែលជាយុគមាសនៃតន្ត្រីប្រជាប្រិយខ្មែរ ហើយវាបានក្លាយជារបាំដែលពេញនិយមនៅពិធីរៀបការខ្មែរ តាំងពីពេលនោះមក។ វាជាឧទាហរណ៍ដ៏ល្អ អំពីរបៀបដែលខ្មែរបានធ្វើឱ្យរបាំសម័យថ្មីមួយ ក្លាយជារបស់ខ្លួន។"}, "how": {"en": "Everyone stands side by side in rows facing the same direction and repeats a short pattern of steps forward, backward and to the side, with claps and turns. Because the pattern is easy, the whole room can dance together within a few minutes. It is played by wedding bands and DJs, usually later in the evening, and at parties and New Year events.", "km": "គ្រប់គ្នាឈរទន្ទឹមគ្នាជាជួរ បែរមុខទៅទិសដៅតែមួយ ហើយធ្វើលំនាំជំហានខ្លីមួយឡើងវិញ ទៅមុខ ថយក្រោយ និងទៅចំហៀង ដោយមានការទះដៃ និងការបង្វិលខ្លួន។ ដោយសារលំនាំងាយស្រួល មនុស្សទាំងបន្ទប់អាចរាំជាមួយគ្នាបាន ក្នុងរយៈពេលតែប៉ុន្មាននាទីប៉ុណ្ណោះ។ វាត្រូវបានលេងដោយក្រុមតន្ត្រីរៀបការ និងឌីជេ ជាធម្មតានៅពេលយប់ជ្រៅបន្តិច និងនៅពិធីជប់លៀង និងកម្មវិធីបុណ្យចូលឆ្នាំ។"}, "where": {"en": "Wedding receptions are the classic place to see it, along with parties and New Year celebrations across the country.", "km": "ពិធីទទួលភ្ញៀវរៀបការ ជាកន្លែងប្រពៃណីដើម្បីទស្សនាវា រួមជាមួយពិធីជប់លៀង និងពិធីអបអរបុណ្យចូលឆ្នាំ នៅទូទាំងប្រទេស។"}, "tip": {"en": "Watch one round from the edge before joining; the pattern repeats, so you will pick it up quickly.", "km": "សូមមើលមួយជុំពីក្បែរ មុនពេលចូលរួម លំនាំនេះធ្វើឡើងវិញៗ ដូច្នេះអ្នកនឹងរៀនបានយ៉ាងឆាប់រហ័ស។"}}, {"title": {"en": "Kontrem", "km": "កន្ទ្រឹម"}, "text": {"en": "A fast, cheerful dance to a strong drum rhythm, popular at parties and New Year.", "km": "របាំលឿន និងសប្បាយ តាមចង្វាក់ស្គរ ពេញនិយមនៅពិធីជប់លៀង និងចូលឆ្នាំ។"}, "id": "kontrem", "body": {"en": "Kontrem is a fast, cheerful dance and music style from the north-west of Cambodia, in provinces such as Oddar Meanchey, Banteay Meanchey and Siem Reap. Its strong drum rhythm and humorous, often teasing songs make it a favourite for letting loose at parties.", "km": "កន្ទ្រឹម ជារបាំ និងរបៀបតន្ត្រីដ៏លឿន និងសប្បាយ ពីភាគពាយ័ព្យនៃប្រទេសកម្ពុជា ក្នុងខេត្តដូចជាឧត្តរមានជ័យ បន្ទាយមានជ័យ និងសៀមរាប។ ចង្វាក់ស្គរដ៏ខ្លាំង និងបទចម្រៀងកំប្លែង ដែលជាញឹកញាប់លេងសើច ធ្វើឱ្យវាក្លាយជារបាំដែលពេញនិយម សម្រាប់ការរាំសប្បាយនៅពិធីជប់លៀង។"}, "how": {"en": "Traditional kontrem is played on drums, a two-stringed tro fiddle and wooden clappers, while modern bands add keyboards and electric guitars. Dancers bounce and step quickly, often in a circle, with free and playful hand movements. There is no special costume, and it is danced at parties, weddings and especially Khmer New Year.", "km": "កន្ទ្រឹមបុរាណ ត្រូវបានលេងដោយស្គរ ទ្រ និងក្រាប់ ខណៈក្រុមតន្ត្រីសម័យថ្មី បន្ថែមក្ដារចុច និងហ្គីតាអគ្គិសនី។ អ្នករបាំលោត និងបោះជំហានលឿនៗ ជាញឹកញាប់ជារង្វង់ ដោយមានចលនាដៃសេរី និងលេងសើច។ មិនមានសម្លៀកបំពាក់ពិសេសទេ ហើយវាត្រូវបានរាំនៅពិធីជប់លៀង ពិធីរៀបការ និងជាពិសេសបុណ្យចូលឆ្នាំខ្មែរ។"}, "where": {"en": "Khmer New Year celebrations, especially in Siem Reap and the north-western provinces, and lively wedding parties are the best places to hear and dance kontrem.", "km": "ពិធីអបអរបុណ្យចូលឆ្នាំខ្មែរ ជាពិសេសនៅសៀមរាប និងខេត្តភាគពាយ័ព្យ និងពិធីជប់លៀងរៀបការដ៏រស់រវើក គឺជាកន្លែងល្អបំផុតដើម្បីស្ដាប់ និងរាំកន្ទ្រឹម។"}, "tip": {"en": "Kontrem usually comes late in the evening, so save some energy for it.", "km": "កន្ទ្រឹម ជាធម្មតាមកដល់នៅពេលយប់ជ្រៅ ដូច្នេះសូមទុកកម្លាំងខ្លះសម្រាប់វា។"}}], "foodMain": [{"title": {"en": "Amok Trey (Steamed Fish Amok)", "km": "អាម៉ុកត្រី"}, "text": {"en": "Fish steamed with kroeung, coconut milk and egg in a banana-leaf cup.", "km": "ត្រីចំហុយជាមួយគ្រឿង ខ្ទិះដូង និងស៊ុត ក្នុងកន្ទោងស្លឹកចេក។"}, "id": "amok-trey", "body": {"en": "Amok trey is freshwater fish gently steamed in a fragrant curry custard of kroeung, coconut milk and egg, traditionally set in a cup folded from banana leaves. It has been part of Khmer cooking for generations and is often called our national dish. Families prepare it for special meals, holidays and when guests come to visit.", "km": "អាម៉ុកត្រី គឺជាត្រីទឹកសាបចំហុយយឺតៗ ក្នុងល្បាយគ្រឿង ខ្ទិះដូង និងស៊ុតដែលមានក្លិនឈ្ងុយ ហើយតាមប្រពៃណីគេដាក់ក្នុងកន្ទោងស្លឹកចេក។ ម្ហូបនេះជាផ្នែកមួយនៃការធ្វើម្ហូបខ្មែរតាំងពីច្រើនជំនាន់មកហើយ ហើយគេច្រើនហៅថាជាម្ហូបជាតិរបស់យើង។ គ្រួសារខ្មែរតែងធ្វើវាសម្រាប់អាហារពិសេស ថ្ងៃបុណ្យ និងពេលមានភ្ញៀវមកលេង។"}, "how": {"en": "Ingredients:\n- 500 g firm white fish fillet (snakehead or catfish), sliced\n- 3 tbsp yellow kroeung (lemongrass, galangal, turmeric, kaffir lime zest, garlic, shallot)\n- 400 ml coconut milk\n- 1 egg\n- 1 tbsp fish sauce and 1 tsp palm sugar\n- 1 tsp prahok (optional)\n- A handful of noni leaves (slek ngor) or spinach\n- Banana leaves, thick coconut cream and kaffir lime leaves for garnish\n\nSteps:\n1. Pound the kroeung ingredients into a smooth paste.\n2. Mix the kroeung with coconut milk, egg, fish sauce, palm sugar and prahok until smooth.\n3. Add the fish slices and stir gently to coat.\n4. Fold banana leaves into small cups and line the bottom with noni leaves.\n5. Spoon the fish mixture into the cups.\n6. Steam for 20 to 25 minutes until just set.\n7. Top with a spoon of coconut cream and thin strips of kaffir lime leaf and red chilli, then serve with rice.", "km": "គ្រឿងផ្សំ៖\n- សាច់ត្រីស ៥០០ ក្រាម (ត្រីរ៉ស់ ឬត្រីអណ្ដែង) ហាន់ជាបន្ទះ\n- គ្រឿងលឿង ៣ ស្លាបព្រាបាយ (ស្លឹកគ្រៃ រំដេង រមៀត ស្បែកក្រូចសើច ខ្ទឹមស ខ្ទឹមក្រហម)\n- ខ្ទិះដូង ៤០០ មីលីលីត្រ\n- ស៊ុត ១ គ្រាប់\n- ទឹកត្រី ១ ស្លាបព្រាបាយ និងស្ករត្នោត ១ ស្លាបព្រាកាហ្វេ\n- ប្រហុក ១ ស្លាបព្រាកាហ្វេ (តាមចិត្ត)\n- ស្លឹកញ័រមួយក្ដាប់ ឬស្ពៃខៀវ\n- ស្លឹកចេក ខ្ទិះដូងខាប់ និងស្លឹកក្រូចសើចសម្រាប់លម្អ\n\nរបៀបធ្វើ៖\n១. បុកគ្រឿងទាំងអស់ឱ្យម៉ដ្ឋល្អ។\n២. លាយគ្រឿងជាមួយខ្ទិះដូង ស៊ុត ទឹកត្រី ស្ករត្នោត និងប្រហុក ឱ្យសព្វ។\n៣. ដាក់សាច់ត្រីចូល ហើយកូរថ្នមៗឱ្យជាប់គ្រឿង។\n៤. ធ្វើកន្ទោងពីស្លឹកចេក ហើយក្រាលស្លឹកញ័រនៅបាត។\n៥. ដួសល្បាយត្រីដាក់ក្នុងកន្ទោង។\n៦. ចំហុយប្រហែល ២០ ទៅ ២៥ នាទី រហូតដល់ខាប់។\n៧. ដាក់ខ្ទិះដូងខាប់ពីលើ រួចរោយស្លឹកក្រូចសើចហាន់ស្ដើងៗ និងម្ទេសក្រហម ហើយញ៉ាំជាមួយបាយ។"}, "where": {"en": "You will find amok on almost every Khmer restaurant menu in Siem Reap, Phnom Penh and Battambang, and cooking classes across the country teach it step by step. Home-style versions are also sold at local markets, especially around holidays.", "km": "អ្នកអាចរកឃើញអាម៉ុកស្ទើរតែគ្រប់ភោជនីយដ្ឋានខ្មែរ នៅសៀមរាប ភ្នំពេញ និងបាត់ដំបង ហើយថ្នាក់រៀនធ្វើម្ហូបនៅទូទាំងប្រទេស ក៏បង្រៀនធ្វើម្ហូបនេះម្ដងមួយជំហានៗដែរ។ អាម៉ុកបែបធ្វើនៅផ្ទះក៏មានលក់នៅតាមផ្សារក្នុងស្រុកផងដែរ ជាពិសេសពេលថ្ងៃបុណ្យ។"}, "tip": {"en": "Look for amok that is steamed until it sets like a soft custard; a soupy amok is a quicker, simplified version.", "km": "សូមជ្រើសរើសអាម៉ុកដែលចំហុយរហូតខាប់ទន់ដូចសង់ខ្យា ព្រោះអាម៉ុករាវ គឺជាកំណែធ្វើរហ័ស និងសាមញ្ញជាង។"}, "dish": {"en": "amok", "km": "អាម៉ុក"}}, {"title": {"en": "Samlor Korko", "km": "សម្លកកូរ"}, "text": {"en": "The 'stirring soup': green kroeung, prahok, roasted rice and many vegetables. A true Khmer comfort dish.", "km": "សម្លកកូរ៖ គ្រឿងខៀវ ប្រហុក អង្ករលីង និងបន្លែជាច្រើន។ ជាម្ហូបខ្មែរពិតប្រាកដ។"}, "id": "samlor-korko", "body": {"en": "Samlor korko, the 'stirring soup', is one of the oldest dishes in Khmer cooking, a hearty soup of green kroeung, prahok and toasted ground rice packed with vegetables from the garden and the forest. Its name comes from the constant stirring needed while it cooks. Cambodians eat it with rice at everyday family meals, and it is a favourite during Khmer New Year and Pchum Ben.", "km": "សម្លកកូរ គឺជាម្ហូបមួយក្នុងចំណោមម្ហូបខ្មែរចាស់ជាងគេ ជាសម្លឆ្ងាញ់ធ្វើពីគ្រឿងខៀវ ប្រហុក និងអង្ករលីងបុក ដាក់បន្លែជាច្រើនពីចម្ការ និងព្រៃ។ ឈ្មោះរបស់វាមកពីការកូរជាប់ជានិច្ចពេលកំពុងស្ល។ ប្រជាជនខ្មែរញ៉ាំសម្លនេះជាមួយបាយក្នុងអាហារគ្រួសារប្រចាំថ្ងៃ ហើយវាក៏ជាម្ហូបពេញនិយមនៅពេលចូលឆ្នាំខ្មែរ និងបុណ្យភ្ជុំបិណ្ឌផងដែរ។"}, "how": {"en": "Ingredients:\n- 300 g pork, chicken or catfish, cut into pieces\n- 3 tbsp green kroeung (lemongrass, galangal, fresh turmeric, kaffir lime leaves, garlic)\n- 1 tbsp prahok\n- 2 tbsp uncooked rice, dry-roasted and ground\n- Green papaya, pumpkin and long eggplant, cut into chunks\n- Long beans, morning glory and moringa or bitter leaves\n- 1 tbsp fish sauce and 1 tsp palm sugar\n- 1 litre water\n\nSteps:\n1. Pound the green kroeung into a fine paste.\n2. Fry the kroeung and prahok in a little oil until fragrant.\n3. Add the meat or fish and stir until it changes colour.\n4. Pour in the water and bring to a boil.\n5. Add the hardest vegetables first (papaya, pumpkin, eggplant), then the beans and leafy greens.\n6. Stir in the roasted rice powder, stirring constantly so the soup thickens without sticking.\n7. Season with fish sauce and palm sugar and serve hot with rice.", "km": "គ្រឿងផ្សំ៖\n- សាច់ជ្រូក សាច់មាន់ ឬត្រីអណ្ដែង ៣០០ ក្រាម កាត់ជាដុំ\n- គ្រឿងខៀវ ៣ ស្លាបព្រាបាយ (ស្លឹកគ្រៃ រំដេង រមៀតស្រស់ ស្លឹកក្រូចសើច ខ្ទឹមស)\n- ប្រហុក ១ ស្លាបព្រាបាយ\n- អង្ករ ២ ស្លាបព្រាបាយ លីងហើយបុកឱ្យម៉ដ្ឋ\n- ល្ហុងខ្ចី ល្ពៅ និងត្រប់វែង កាត់ជាដុំ\n- សណ្ដែកកួរ ត្រកួន និងស្លឹកម្រុំ ឬស្លឹកម្រះ\n- ទឹកត្រី ១ ស្លាបព្រាបាយ និងស្ករត្នោត ១ ស្លាបព្រាកាហ្វេ\n- ទឹក ១ លីត្រ\n\nរបៀបធ្វើ៖\n១. បុកគ្រឿងខៀវឱ្យម៉ដ្ឋ។\n២. ឆាគ្រឿង និងប្រហុកជាមួយប្រេងបន្តិច រហូតដល់មានក្លិនឈ្ងុយ។\n៣. ដាក់សាច់ ឬត្រីចូល ហើយឆារហូតដល់ប្ដូរពណ៌។\n៤. ចាក់ទឹកចូល ហើយដាំឱ្យពុះ។\n៥. ដាក់បន្លែរឹងមុន (ល្ហុង ល្ពៅ ត្រប់) បន្ទាប់មកសណ្ដែកកួរ និងបន្លែស្លឹក។\n៦. ដាក់អង្ករលីងបុក ហើយកូរជាប់ជានិច្ច ដើម្បីឱ្យសម្លខាប់ និងមិនជាប់ឆ្នាំង។\n៧. ប្រសទឹកត្រី និងស្ករត្នោត ហើយញ៉ាំក្ដៅៗជាមួយបាយ។"}, "where": {"en": "Samlor korko is best tasted in Khmer family-style eateries and at rice-and-curry stalls in local markets, where pots of the day's soups are lined up for you to choose from. Restaurants serving traditional Khmer food in Siem Reap and Phnom Penh often include it too.", "km": "សម្លកកូរឆ្ងាញ់បំផុតនៅតាមហាងបាយបែបគ្រួសារខ្មែរ និងតូបលក់បាយម្ហូបនៅក្នុងផ្សារ ដែលគេរៀបឆ្នាំងសម្លប្រចាំថ្ងៃឱ្យអ្នកជ្រើសរើស។ ភោជនីយដ្ឋានម្ហូបខ្មែរប្រពៃណីនៅសៀមរាប និងភ្នំពេញ ក៏តែងមានម្ហូបនេះដែរ។"}, "tip": {"en": "Every family makes korko a little differently, so try it in more than one place; it tastes best with plain steamed rice.", "km": "គ្រួសារនីមួយៗធ្វើសម្លកកូរខុសគ្នាបន្តិចៗ ដូច្នេះសាកញ៉ាំនៅកន្លែងច្រើនផ្សេងគ្នា។ វាឆ្ងាញ់បំផុតជាមួយបាយសធម្មតា។"}, "dish": {"en": "korko", "km": "កកូរ"}}, {"title": {"en": "Samlor Khmer (Num Banh Chok)", "km": "នំបញ្ចុកសម្លខ្មែរ"}, "text": {"en": "Fresh rice noodles with green fish curry and plenty of herbs, a favourite breakfast.", "km": "នំបញ្ចុកស្រស់ ជាមួយសម្លប្រហើរត្រី និងបន្លែស្រស់ ជាអាហារពេលព្រឹកដែលគេចូលចិត្ត។"}, "id": "samlor-khmer", "body": {"en": "Num banh chok is fresh, hand-pressed rice noodles topped with a light green fish curry, samlor Khmer, made from yellow kroeung and river fish, then piled high with fresh herbs and vegetables. It is one of the most loved Khmer dishes and is often called 'Khmer noodles'. Cambodians eat it mostly for breakfast, and it is also served at weddings, ceremonies and offered at the pagoda.", "km": "នំបញ្ចុក គឺជានំបញ្ចុកស្រស់ធ្វើពីអង្ករ ចាក់ជាមួយសម្លប្រហើរត្រី ឬសម្លខ្មែរ ដែលធ្វើពីគ្រឿងលឿង និងត្រីទន្លេ ហើយដាក់ជីរ និងបន្លែស្រស់ជាច្រើន។ វាជាម្ហូបខ្មែរដែលគេស្រលាញ់បំផុតមួយ ហើយគេច្រើនហៅថា នំបញ្ចុកខ្មែរ។ ប្រជាជនខ្មែរភាគច្រើនញ៉ាំវាពេលព្រឹក ហើយគេក៏ធ្វើវាសម្រាប់ពិធីរៀបការ ពិធីបុណ្យ និងយកទៅប្រគេនព្រះសង្ឃនៅវត្តផងដែរ។"}, "how": {"en": "Ingredients:\n- 500 g fresh rice noodles (num banh chok)\n- 400 g freshwater fish (snakehead or mudfish), boiled and flaked\n- 3 tbsp yellow kroeung (lemongrass, galangal, turmeric, garlic, shallot, kaffir lime zest)\n- 1 tbsp prahok\n- 400 ml coconut milk\n- 1 litre water and 1 tbsp fish sauce\n- Cucumber, long beans, banana blossom and bean sprouts, finely sliced\n- Holy basil, mint and water lily stems\n\nSteps:\n1. Boil the fish in water, keep the broth, then flake the flesh off the bones.\n2. Pound the fish with the kroeung and prahok into a coarse paste.\n3. Simmer the paste in the fish broth and coconut milk for about 15 minutes.\n4. Season with fish sauce and a little palm sugar.\n5. Place a handful of noodles in a bowl and top with the sliced vegetables and herbs.\n6. Ladle the hot green curry over the noodles and serve.", "km": "គ្រឿងផ្សំ៖\n- នំបញ្ចុកស្រស់ ៥០០ ក្រាម\n- ត្រីទឹកសាប (ត្រីរ៉ស់ ឬត្រីផ្ទក់) ៤០០ ក្រាម ស្ងោរហើយរាវយកសាច់\n- គ្រឿងលឿង ៣ ស្លាបព្រាបាយ (ស្លឹកគ្រៃ រំដេង រមៀត ខ្ទឹមស ខ្ទឹមក្រហម ស្បែកក្រូចសើច)\n- ប្រហុក ១ ស្លាបព្រាបាយ\n- ខ្ទិះដូង ៤០០ មីលីលីត្រ\n- ទឹក ១ លីត្រ និងទឹកត្រី ១ ស្លាបព្រាបាយ\n- ត្រសក់ សណ្ដែកកួរ ត្រយូងចេក និងសណ្ដែកបណ្ដុះ ហាន់ល្អិតៗ\n- ជីរនាងវង ជីរអង្កាម និងព្រលិត\n\nរបៀបធ្វើ៖\n១. ស្ងោរត្រីក្នុងទឹក ទុកទឹកស៊ុប រួចរាវយកសាច់ត្រីចេញពីឆ្អឹង។\n២. បុកសាច់ត្រីជាមួយគ្រឿង និងប្រហុក ឱ្យម៉ដ្ឋល្មម។\n៣. ដាំល្បាយនោះក្នុងទឹកស៊ុបត្រី និងខ្ទិះដូង ប្រហែល ១៥ នាទី។\n៤. ប្រសទឹកត្រី និងស្ករត្នោតបន្តិច។\n៥. ដាក់នំបញ្ចុកមួយក្ដាប់ក្នុងចាន ហើយដាក់បន្លែ និងជីរពីលើ។\n៦. ចាក់សម្លក្ដៅៗពីលើនំបញ្ចុក ហើយញ៉ាំ។"}, "where": {"en": "Look for num banh chok sellers in the early morning at markets and on street corners all over the country; Siem Reap is especially famous for it, with whole rows of stalls near the temples and in town. Many vendors still carry their pots and baskets on a shoulder pole.", "km": "សូមស្វែងរកអ្នកលក់នំបញ្ចុកនៅពេលព្រឹកព្រលឹម នៅតាមផ្សារ និងកែងផ្លូវទូទាំងប្រទេស។ ខេត្តសៀមរាបល្បីជាពិសេសខាងនំបញ្ចុក ដោយមានតូបលក់ជាជួរៗ នៅជិតប្រាសាទ និងក្នុងទីក្រុង។ អ្នកលក់ជាច្រើននៅតែលីឆ្នាំង និងល្អីដោយដងរែកដដែល។"}, "tip": {"en": "Go early, as most stalls sell out by mid-morning, and add as many fresh herbs as you like from the basket on the table.", "km": "សូមទៅឱ្យបានព្រឹក ព្រោះតូបភាគច្រើនលក់អស់មុនថ្ងៃត្រង់ ហើយអាចដាក់ជីរស្រស់ពីកន្ត្រកលើតុតាមចិត្ត។"}, "dish": {"en": "num banh chok", "km": "នំបញ្ចុក"}}, {"title": {"en": "Curry Saraman (Beef Saraman Curry)", "km": "សម្លការីសាច់គោសារ៉ាម៉ាន់"}, "text": {"en": "A rich beef curry with roasted spices, peanuts and coconut milk, cooked for celebrations.", "km": "ការីសាច់គោខាប់ ជាមួយគ្រឿងទេសលីង សណ្ដែកដី និងខ្ទិះដូង ធ្វើសម្រាប់ពិធីបុណ្យ។"}, "id": "curry-saraman", "body": {"en": "Curry saraman is a rich, slow-cooked beef curry made with a kroeung of dry-roasted spices such as star anise, cardamom, cinnamon and cumin, along with coconut milk and roasted peanuts. Its warm spices reflect old trade routes that brought dried spices to the Khmer kitchen, and it is one of the most elaborate dishes in our cuisine. Because it takes time and care, Cambodians cook it for weddings, festivals and family celebrations.", "km": "ការីសារ៉ាម៉ាន់ គឺជាការីសាច់គោខាប់ ដាំយូរ ធ្វើពីគ្រឿងទេសលីង ដូចជា ផ្កាចាន់ក្រស្នា ក្រវាញ ស្វាយទេស និងម្ទេសដំណើប រួមជាមួយខ្ទិះដូង និងសណ្ដែកដីលីង។ គ្រឿងទេសក្ដៅៗរបស់វាឆ្លុះបញ្ចាំងពីផ្លូវពាណិជ្ជកម្មពីបុរាណ ដែលបាននាំគ្រឿងទេសស្ងួតមកកាន់ផ្ទះបាយខ្មែរ ហើយវាជាម្ហូបមួយដែលល្អិតល្អន់បំផុតក្នុងម្ហូបខ្មែរ។ ដោយសារវាត្រូវការពេលវេលា និងការយកចិត្តទុកដាក់ ប្រជាជនខ្មែរធ្វើវាសម្រាប់ពិធីរៀបការ ពិធីបុណ្យ និងការជួបជុំគ្រួសារ។"}, "how": {"en": "Ingredients:\n- 600 g beef chuck or brisket, cut into large cubes\n- 3 tbsp saraman kroeung (lemongrass, galangal, garlic, shallot, dried chilli)\n- 1 tbsp roasted spices: star anise, cardamom, cinnamon, cumin and coriander seed, ground\n- 800 ml coconut milk\n- 100 g roasted peanuts\n- 2 potatoes and 1 onion, cut into chunks\n- 2 tbsp fish sauce, 1 tbsp palm sugar and 1 tbsp tamarind juice\n\nSteps:\n1. Dry-roast the whole spices until fragrant, then grind them and mix with the pounded kroeung.\n2. Fry the paste in the thick top layer of the coconut milk until the oil separates.\n3. Add the beef and stir until well coated.\n4. Pour in the remaining coconut milk with a little water and simmer gently for about 1.5 to 2 hours until the beef is tender.\n5. Add the potatoes, onion and peanuts and cook until soft.\n6. Season with fish sauce, palm sugar and tamarind for a balance of salty, sweet and sour, then serve with rice or bread.", "km": "គ្រឿងផ្សំ៖\n- សាច់គោភ្លៅ ឬសាច់ទ្រូង ៦០០ ក្រាម កាត់ជាដុំធំៗ\n- គ្រឿងសារ៉ាម៉ាន់ ៣ ស្លាបព្រាបាយ (ស្លឹកគ្រៃ រំដេង ខ្ទឹមស ខ្ទឹមក្រហម ម្ទេសក្រៀម)\n- គ្រឿងទេសលីង ១ ស្លាបព្រាបាយ៖ ផ្កាចាន់ក្រស្នា ក្រវាញ ស្វាយទេស ម្ទេសដំណើប និងគ្រាប់វ៉ាន់ស៊ុយ បុកម៉ដ្ឋ\n- ខ្ទិះដូង ៨០០ មីលីលីត្រ\n- សណ្ដែកដីលីង ១០០ ក្រាម\n- ដំឡូងបារាំង ២ មើម និងខ្ទឹមបារាំង ១ មើម កាត់ជាដុំ\n- ទឹកត្រី ២ ស្លាបព្រាបាយ ស្ករត្នោត ១ ស្លាបព្រាបាយ និងទឹកអម្ពិល ១ ស្លាបព្រាបាយ\n\nរបៀបធ្វើ៖\n១. លីងគ្រឿងទេសទាំងគ្រាប់រហូតដល់ឈ្ងុយ រួចបុកឱ្យម៉ដ្ឋ ហើយលាយជាមួយគ្រឿងដែលបុករួច។\n២. ឆាគ្រឿងក្នុងខ្ទិះដូងខាប់ រហូតដល់ចេញប្រេង។\n៣. ដាក់សាច់គោចូល ហើយឆាឱ្យជាប់គ្រឿងសព្វ។\n៤. ចាក់ខ្ទិះដូងដែលនៅសល់ និងទឹកបន្តិច ហើយដាំភ្លើងតិចៗប្រហែល ១ ម៉ោងកន្លះ ទៅ ២ ម៉ោង រហូតដល់សាច់ទន់។\n៥. ដាក់ដំឡូង ខ្ទឹមបារាំង និងសណ្ដែកដី ហើយដាំរហូតដល់ទន់។\n៦. ប្រសទឹកត្រី ស្ករត្នោត និងទឹកអម្ពិល ឱ្យមានរសជាតិប្រៃ ផ្អែម និងជូរល្មម រួចញ៉ាំជាមួយបាយ ឬនំបុ័ង។"}, "where": {"en": "Curry saraman is served in restaurants specialising in traditional Khmer cuisine in Phnom Penh and Siem Reap, and you may be offered it at weddings and village celebrations. It is less common at everyday street stalls because it takes so long to cook.", "km": "ការីសារ៉ាម៉ាន់មានលក់នៅភោជនីយដ្ឋានដែលមានជំនាញខាងម្ហូបខ្មែរប្រពៃណីនៅភ្នំពេញ និងសៀមរាប ហើយអ្នកក៏អាចត្រូវបានគេជូនញ៉ាំនៅពិធីរៀបការ និងពិធីបុណ្យក្នុងភូមិផងដែរ។ វាមិនសូវមានលក់នៅតូបតាមផ្លូវប្រចាំថ្ងៃទេ ព្រោះវាត្រូវការពេលវេលាយូរក្នុងការចម្អិន។"}, "tip": {"en": "Saraman is rich rather than very spicy; enjoy it with steamed rice or a crusty baguette to soak up the sauce.", "km": "សារ៉ាម៉ាន់មានរសជាតិខាប់ឆ្ងាញ់ ជាជាងហឹរខ្លាំង។ សូមញ៉ាំវាជាមួយបាយ ឬនំបុ័ងស្រួយ ដើម្បីជ្រលក់ទឹកសម្ល។"}, "dish": {"en": "saraman", "km": "សារ៉ាម៉ាន់"}}, {"title": {"en": "Samlor Machu Siem Reap", "km": "សម្លម្ជូរសៀមរាប"}, "text": {"en": "A Siem Reap-style sour soup with fish, tamarind and fresh vegetables.", "km": "សម្លម្ជូររបៀបសៀមរាប ជាមួយត្រី អម្ពិល និងបន្លែស្រស់។"}, "id": "samlor-machu-siem-reap", "body": {"en": "Samlor machu is the Khmer family of sour soups, and the Siem Reap style is cooked with fish from the Tonle Sap lake, a light kroeung of lemongrass and garlic, and tamarind for a clean, refreshing sourness. Vegetables from the lake and surrounding fields, such as water lily stems, lotus root or morning glory, give it a fresh crunch. In Siem Reap it is a daily home dish, eaten with rice at lunch and dinner, especially in the hot season.", "km": "សម្លម្ជូរ គឺជាក្រុមសម្លជូររបស់ខ្មែរ ហើយសម្លម្ជូររបៀបសៀមរាប ធ្វើពីត្រីបឹងទន្លេសាប គ្រឿងស្រាលៗពីស្លឹកគ្រៃ និងខ្ទឹមស និងអម្ពិល ដែលផ្ដល់រសជាតិជូរស្រស់ស្រាយ។ បន្លែពីបឹង និងវាលស្រែជុំវិញ ដូចជា ព្រលិត ក្រអៅឈូក ឬត្រកួន ធ្វើឱ្យសម្លមានរសជាតិស្រស់ និងស្រួយ។ នៅសៀមរាប វាជាម្ហូបប្រចាំថ្ងៃក្នុងផ្ទះ ដែលគេញ៉ាំជាមួយបាយពេលថ្ងៃត្រង់ និងពេលល្ងាច ជាពិសេសនៅរដូវក្ដៅ។"}, "how": {"en": "Ingredients:\n- 500 g freshwater fish (snakehead or catfish), cut into steaks\n- 2 stalks lemongrass and 3 cloves garlic, pounded\n- 2 tbsp tamarind pulp, soaked in warm water\n- Water lily stems or lotus root, sliced\n- Morning glory or other leafy greens\n- 2 tbsp fish sauce and 1 tsp palm sugar\n- 1.2 litres water\n- Rice paddy herb (ma-om) and sawtooth coriander to finish\n\nSteps:\n1. Fry the pounded lemongrass and garlic in a little oil until fragrant.\n2. Add the water and bring to a boil.\n3. Strain the tamarind water into the pot and season with fish sauce and palm sugar.\n4. Add the fish and simmer gently for about 8 minutes without stirring too much.\n5. Add the vegetables and cook for 2 to 3 minutes so they stay crisp.\n6. Turn off the heat, add the fresh herbs and serve with rice.", "km": "គ្រឿងផ្សំ៖\n- ត្រីទឹកសាប (ត្រីរ៉ស់ ឬត្រីអណ្ដែង) ៥០០ ក្រាម កាត់ជាកង់\n- ស្លឹកគ្រៃ ២ ដើម និងខ្ទឹមស ៣ កំពឹស បុក\n- សាច់អម្ពិល ២ ស្លាបព្រាបាយ ត្រាំក្នុងទឹកក្ដៅឧណ្ហៗ\n- ព្រលិត ឬក្រអៅឈូក ហាន់ជាកង់\n- ត្រកួន ឬបន្លែស្លឹកផ្សេងទៀត\n- ទឹកត្រី ២ ស្លាបព្រាបាយ និងស្ករត្នោត ១ ស្លាបព្រាកាហ្វេ\n- ទឹក ១.២ លីត្រ\n- ម្អម និងជីរបន្លា សម្រាប់ដាក់ចុងក្រោយ\n\nរបៀបធ្វើ៖\n១. ឆាស្លឹកគ្រៃ និងខ្ទឹមសដែលបុករួច ជាមួយប្រេងបន្តិច រហូតដល់ឈ្ងុយ។\n២. ចាក់ទឹកចូល ហើយដាំឱ្យពុះ។\n៣. ច្រោះទឹកអម្ពិលដាក់ក្នុងឆ្នាំង ហើយប្រសទឹកត្រី និងស្ករត្នោត។\n៤. ដាក់ត្រីចូល ហើយដាំភ្លើងតិចៗប្រហែល ៨ នាទី ដោយមិនកូរច្រើនពេក។\n៥. ដាក់បន្លែ ហើយដាំ ២ ទៅ ៣ នាទី ដើម្បីឱ្យបន្លែនៅស្រួយ។\n៦. បិទភ្លើង ដាក់ជីរស្រស់ ហើយញ៉ាំជាមួយបាយ។"}, "where": {"en": "The best place to try it is Siem Reap province, at family-run Khmer eateries, rice-and-curry stalls in the local markets and in the floating and stilt villages around the Tonle Sap.", "km": "កន្លែងល្អបំផុតដើម្បីភ្លក់ម្ហូបនេះ គឺខេត្តសៀមរាប នៅតាមហាងបាយខ្មែរបែបគ្រួសារ តូបលក់បាយម្ហូបក្នុងផ្សារ និងនៅភូមិបណ្ដែតទឹក ឬភូមិផ្ទះឈើខ្ពស់ៗជុំវិញបឹងទន្លេសាប។"}, "tip": {"en": "Ask for it with fish from the lake, and pair it with a salty dish such as grilled fish or a small bowl of teuk kroeung for a classic Khmer meal.", "km": "សូមកុម្ម៉ង់ជាមួយត្រីបឹង ហើយញ៉ាំជាមួយម្ហូបប្រៃ ដូចជា ត្រីអាំង ឬទឹកគ្រឿងមួយចានតូច ដើម្បីបានអាហារខ្មែរពេញលេញ។"}, "dish": {"en": "machu", "km": "ម្ជូរ"}}, {"title": {"en": "Samlor Machu Youn", "km": "សម្លម្ជូរយួន"}, "text": {"en": "Sour soup with tamarind, pineapple, tomato, fish and fresh herbs.", "km": "សម្លម្ជូរ ជាមួយអម្ពិល ម្នាស់ ប៉េងប៉ោះ ត្រី និងជីរស្រស់។"}, "id": "samlor-machu-youn", "body": {"en": "This bright sour soup is cooked with tamarind, pineapple and tomato, which give it a sweet-and-sour flavour, together with fish, bean sprouts and plenty of fresh herbs, finished with crispy fried garlic. It is one of the most popular sour soups in Cambodian homes and is quick and simple to make. Families eat it with rice at lunch or dinner, often alongside a fried or grilled dish.", "km": "សម្លម្ជូរដ៏ស្រស់នេះ ធ្វើពីអម្ពិល ម្នាស់ និងប៉េងប៉ោះ ដែលផ្ដល់រសជាតិជូរផ្អែម រួមជាមួយត្រី សណ្ដែកបណ្ដុះ និងជីរស្រស់ជាច្រើន ហើយរោយខ្ទឹមសចៀនស្រួយពីលើ។ វាជាសម្លម្ជូរមួយដែលពេញនិយមបំផុតក្នុងផ្ទះខ្មែរ ហើយងាយស្រួល និងរហ័សក្នុងការធ្វើ។ គ្រួសារខ្មែរញ៉ាំវាជាមួយបាយពេលថ្ងៃត្រង់ ឬពេលល្ងាច ជារឿយៗជាមួយម្ហូបចៀន ឬអាំង។"}, "how": {"en": "Ingredients:\n- 500 g catfish or snakehead, cut into steaks\n- 2 tbsp tamarind pulp, soaked in warm water\n- 1 cup fresh pineapple, cut into chunks\n- 2 tomatoes, cut into wedges\n- 1 cup bean sprouts and 1 stalk taro stem (optional), sliced\n- 2 tbsp fish sauce and 1 tbsp sugar\n- 1.2 litres water\n- Rice paddy herb (ma-om), sawtooth coriander and fried garlic to finish\n\nSteps:\n1. Bring the water to a boil and strain in the tamarind water.\n2. Add the pineapple and simmer for 3 minutes to release its sweetness.\n3. Add the fish and cook gently for about 6 to 8 minutes.\n4. Add the tomato and taro stem, then season with fish sauce and sugar until sweet, sour and salty are balanced.\n5. Add the bean sprouts and turn off the heat.\n6. Top with the fresh herbs and fried garlic and serve with rice.", "km": "គ្រឿងផ្សំ៖\n- ត្រីអណ្ដែង ឬត្រីរ៉ស់ ៥០០ ក្រាម កាត់ជាកង់\n- សាច់អម្ពិល ២ ស្លាបព្រាបាយ ត្រាំក្នុងទឹកក្ដៅឧណ្ហៗ\n- ម្នាស់ស្រស់ ១ កែវ កាត់ជាដុំ\n- ប៉េងប៉ោះ ២ ផ្លែ ចិតជាចម្រៀក\n- សណ្ដែកបណ្ដុះ ១ កែវ និងដើមត្រាវ ១ ដើម (តាមចិត្ត) ហាន់\n- ទឹកត្រី ២ ស្លាបព្រាបាយ និងស្ករស ១ ស្លាបព្រាបាយ\n- ទឹក ១.២ លីត្រ\n- ម្អម ជីរបន្លា និងខ្ទឹមសចៀន សម្រាប់ដាក់ចុងក្រោយ\n\nរបៀបធ្វើ៖\n១. ដាំទឹកឱ្យពុះ ហើយច្រោះទឹកអម្ពិលដាក់ចូល។\n២. ដាក់ម្នាស់ ហើយដាំ ៣ នាទី ដើម្បីឱ្យចេញរសផ្អែម។\n៣. ដាក់ត្រីចូល ហើយដាំភ្លើងតិចៗប្រហែល ៦ ទៅ ៨ នាទី។\n៤. ដាក់ប៉េងប៉ោះ និងដើមត្រាវ រួចប្រសទឹកត្រី និងស្ករ ឱ្យមានរសជាតិផ្អែម ជូរ និងប្រៃល្មម។\n៥. ដាក់សណ្ដែកបណ្ដុះ ហើយបិទភ្លើង។\n៦. ដាក់ជីរស្រស់ និងខ្ទឹមសចៀនពីលើ ហើយញ៉ាំជាមួយបាយ។"}, "where": {"en": "You can order this sour soup at most Khmer family restaurants and rice-and-curry stalls throughout Cambodia, from Phnom Penh to the provinces along the Mekong and Tonle Sap.", "km": "អ្នកអាចកុម្ម៉ង់សម្លម្ជូរនេះ នៅភោជនីយដ្ឋានខ្មែរបែបគ្រួសារ និងតូបលក់បាយម្ហូបភាគច្រើនទូទាំងប្រទេសកម្ពុជា ចាប់ពីភ្នំពេញ រហូតដល់ខេត្តនានាតាមដងទន្លេមេគង្គ និងទន្លេសាប។"}, "tip": {"en": "It is usually ordered to share in the middle of the table; ask for fresh chilli on the side if you like it spicy.", "km": "ជាធម្មតា គេកុម្ម៉ង់សម្លនេះដាក់កណ្ដាលតុដើម្បីញ៉ាំរួមគ្នា។ ប្រសិនបើចូលចិត្តហឹរ សូមសុំម្ទេសស្រស់ដាក់ចំហៀង។"}, "dish": {"en": "sour soup", "km": "សម្លម្ជូរ"}}, {"title": {"en": "Pleah Sach Ko (Beef Salad)", "km": "ភ្លាសាច់គោ"}, "text": {"en": "Thin beef 'cooked' in lime juice, with herbs, shallots and a prahok dressing.", "km": "សាច់គោស្ដើងៗ ភ្លាដោយទឹកក្រូចឆ្មា ជាមួយជីរ ខ្ទឹមក្រហម និងទឹកប្រហុក។"}, "id": "pleah-sach-ko", "body": {"en": "Pleah sach ko is a traditional Khmer beef salad in which thin slices of beef are 'cooked' in lime juice, then tossed with herbs, shallots, lemongrass and a dressing made with prahok. The word pleah means to cure meat or fish with lime, a technique Khmer cooks have used for centuries. It is a favourite dish for parties, weddings and gatherings, often enjoyed with drinks among friends.", "km": "ភ្លាសាច់គោ គឺជាញាំសាច់គោបែបខ្មែរប្រពៃណី ដែលគេយកសាច់គោហាន់ស្ដើងៗមកភ្លាជាមួយទឹកក្រូចឆ្មា រួចច្របល់ជាមួយជីរ ខ្ទឹមក្រហម ស្លឹកគ្រៃ និងទឹកជ្រលក់ធ្វើពីប្រហុក។ ពាក្យ ភ្លា មានន័យថា ធ្វើឱ្យសាច់ ឬត្រីឆ្អិនដោយទឹកក្រូចឆ្មា ដែលជាបច្ចេកទេសខ្មែរយើងប្រើតាំងពីរាប់សតវត្សមកហើយ។ វាជាម្ហូបពេញនិយមសម្រាប់ពិធីជប់លៀង ពិធីរៀបការ និងការជួបជុំ ហើយគេច្រើនញ៉ាំវាជាមួយភេសជ្ជៈជាមួយមិត្តភក្តិ។"}, "how": {"en": "Ingredients:\n- 300 g tender beef (sirloin), sliced very thin\n- Juice of 4 limes\n- 1 tbsp prahok, cooked, and 1 tbsp fish sauce\n- 1 tsp palm sugar\n- 2 stalks lemongrass, finely sliced\n- 3 shallots and 2 cloves garlic, sliced\n- Banana blossom, cucumber and long beans, sliced\n- Mint, holy basil, roasted peanuts and red chilli\n\nSteps:\n1. Soak the sliced banana blossom in water with a little lime so it stays pale.\n2. Toss the beef with the lime juice and leave for about 10 minutes until it turns opaque, then squeeze out the excess juice.\n3. Mix the prahok, fish sauce, palm sugar and a little of the lime juice into a dressing.\n4. Combine the beef with lemongrass, shallots, garlic and the vegetables.\n5. Pour over the dressing and toss well.\n6. Top with herbs, crushed peanuts and chilli and serve right away.", "km": "គ្រឿងផ្សំ៖\n- សាច់គោទន់ (សាច់ស្នាក់) ៣០០ ក្រាម ហាន់ស្ដើងៗ\n- ទឹកក្រូចឆ្មា ៤ ផ្លែ\n- ប្រហុកឆ្អិន ១ ស្លាបព្រាបាយ និងទឹកត្រី ១ ស្លាបព្រាបាយ\n- ស្ករត្នោត ១ ស្លាបព្រាកាហ្វេ\n- ស្លឹកគ្រៃ ២ ដើម ហាន់ល្អិត\n- ខ្ទឹមក្រហម ៣ មើម និងខ្ទឹមស ២ កំពឹស ហាន់\n- ត្រយូងចេក ត្រសក់ និងសណ្ដែកកួរ ហាន់\n- ជីរអង្កាម ជីរនាងវង សណ្ដែកដីលីង និងម្ទេសក្រហម\n\nរបៀបធ្វើ៖\n១. ត្រាំត្រយូងចេកដែលហាន់រួច ក្នុងទឹកលាយក្រូចឆ្មាបន្តិច ដើម្បីកុំឱ្យខ្មៅ។\n២. ច្របល់សាច់គោជាមួយទឹកក្រូចឆ្មា ហើយទុកប្រហែល ១០ នាទី រហូតដល់សាច់ប្ដូរពណ៌ រួចច្របាច់ទឹកចេញ។\n៣. លាយប្រហុក ទឹកត្រី ស្ករត្នោត និងទឹកក្រូចឆ្មាបន្តិច ធ្វើជាទឹកជ្រលក់។\n៤. ច្របល់សាច់គោជាមួយស្លឹកគ្រៃ ខ្ទឹមក្រហម ខ្ទឹមស និងបន្លែ។\n៥. ចាក់ទឹកជ្រលក់ពីលើ ហើយច្របល់ឱ្យសព្វ។\n៦. ដាក់ជីរ សណ្ដែកដីបុក និងម្ទេសពីលើ ហើយញ៉ាំភ្លាម។"}, "where": {"en": "Pleah sach ko is served at Khmer beer gardens and family restaurants across Phnom Penh, Siem Reap and Battambang, and it is a standard dish at wedding banquets in the provinces.", "km": "ភ្លាសាច់គោមានលក់នៅតាមហាងស្រាបៀរខ្មែរ និងភោជនីយដ្ឋានបែបគ្រួសារនៅភ្នំពេញ សៀមរាប និងបាត់ដំបង ហ
