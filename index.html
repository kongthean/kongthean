ីត្រើយសមុទ្រ បានរៀបអភិសេកជាមួយនាងនាគ ជាបុត្រីស្ដេចនាគ។ ស្ដេចនាគបានស្រូបទឹកដែលលិចដីទាំងអស់ ហើយប្រគល់ដីនោះជាជំនូនអាពាហ៍ពិពាហ៍៖ គឺនគរកម្ពុជា។\n\nប្រវត្តិសាស្ត្រក៏និទានស្រដៀងគ្នា។ ចាប់ពីសតវត្សទី១ នគរហ្វូណនដែលរកស៊ីពាណិជ្ជកម្ម បានរីកចម្រើននៅតាមទន្លេមេគង្គ។ នៅសតវត្សទី៦ និងទី៧ នគរចេនឡាបានសាងប្រាសាទឥដ្ឋនៅសំបូរព្រៃគុក។ បន្ទាប់មក នៅឆ្នាំ ៨០២ ព្រះបាទជ័យវរ្ម័នទី២ បានប្រកាសឯករាជ្យ និងឡើងគ្រងរាជ្យជាចក្រពត្តិ នៅលើភ្នំគូលែនដ៏ពិសិដ្ឋ។ ពិធីនោះ ត្រូវបានចាត់ទុកថាជាកំណើតនៃអាណាចក្រខ្មែរ ដែលគ្រងរាជ្យពីអង្គរ អស់រយៈពេលជាង ៦០០ ឆ្នាំ។"}, "best": {"en": "Any time; Phnom Kulen is greenest in the rainy season", "km": "គ្រប់ពេល។ ភ្នំគូលែនខៀវស្រងាត់បំផុតនៅរដូវវស្សា"}, "getting": {"en": "Follow the story at the National Museum (Phnom Penh), Sambor Prei Kuk (Kampong Thom) and Phnom Kulen (Siem Reap).", "km": "តាមដានរឿងនេះ នៅសារមន្ទីរជាតិ (ភ្នំពេញ) សំបូរព្រៃគុក (កំពង់ធំ) និងភ្នំគូលែន (សៀមរាប)។"}, "tip": {"en": "At a Khmer wedding, the groom holds the bride's scarf as they walk: it recalls Preah Thong holding Neang Neak's tail as she led him to the Naga kingdom.", "km": "នៅក្នុងពិធីរៀបការខ្មែរ កូនកំលោះកាន់ស្បៃកូនក្រមុំ ពេលដើរ៖ វារំលឹកដល់ព្រះថោងតោងកន្ទុយនាងនាគ ពេលនាងនាំព្រះអង្គចូលទៅនគរនាគ។"}, "art": "temple", "built": {"en": "Legend & history · 1st–9th century", "km": "រឿងព្រេង និងប្រវត្តិ · សតវត្សទី១–៩"}, "img": "", "featured": false, "mapq": "Phnom Kulen National Park", "link": "", "q": "Sambor Prei Kuk", "story": true}, {"id": "building-angkor-wat", "cat": "temple", "title": {"en": "How Angkor Wat Was Built", "km": "របៀបកសាងប្រាសាទអង្គរវត្ត"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "Millions of sandstone blocks, carried by canal and fitted without mortar, in about 30 years.", "km": "ថ្មភក់រាប់លានដុំ ដឹកតាមប្រឡាយ ហើយតម្រៀបដោយគ្មានបាយអ ក្នុងរយៈពេលប្រហែល ៣០ ឆ្នាំ។"}, "body": {"en": "King Suryavarman II began Angkor Wat in the early 12th century, and it took around three decades to complete. The sandstone was cut at quarries near Phnom Kulen, about 40 km away, and floated on rafts along a network of canals. Inside, a core of laterite supports the carved sandstone skin.\n\nThe blocks were fitted together without mortar, and you can still see small holes in many stones, used for pegs when lifting them into place. Thousands of workers, artisans and elephants shaped a temple that is a model of the universe: the central tower is Mount Meru, home of the gods, and the moat is the cosmic ocean.", "km": "ព្រះបាទសូរ្យវរ្ម័នទី២ បានចាប់ផ្ដើមកសាងប្រាសាទអង្គរវត្ត នៅដើមសតវត្សទី១២ ហើយចំណាយពេលប្រហែលបីទសវត្ស ទើបរួចរាល់។ ថ្មភក់ត្រូវបានកាប់នៅកន្លែងយកថ្ម ក្បែរភ្នំគូលែន ចម្ងាយប្រហែល ៤០ គីឡូម៉ែត្រ ហើយបណ្ដែតលើក្បូនតាមបណ្ដាញប្រឡាយ។ នៅខាងក្នុង ស្នូលថ្មបាយក្រៀមទ្រទ្រង់ថ្មភក់ដែលឆ្លាក់នៅខាងក្រៅ។\n\nដុំថ្មត្រូវបានតម្រៀបចូលគ្នាដោយគ្មានបាយអ ហើយអ្នកនៅតែអាចឃើញរន្ធតូចៗលើថ្មជាច្រើន ដែលប្រើសម្រាប់ដោតឈើ ពេលលើកវាដាក់។ កម្មករ សិប្បករ និងដំរីរាប់ពាន់ បានកសាងប្រាសាទ ដែលជាគំរូនៃសកលលោក៖ ប្រាង្គកណ្ដាលគឺភ្នំព្រះសុមេរុ ជាលំនៅនៃទេវតា ហើយគូទឹកគឺមហាសមុទ្រ។"}, "best": {"en": "Sunrise, November to February", "km": "ពេលថ្ងៃរះ ខែវិច្ឆិកា ដល់ខែកុម្ភៈ"}, "getting": {"en": "About 6 km north of Siem Reap town. An Angkor Pass is required.", "km": "ប្រហែល ៦ គីឡូម៉ែត្រ ខាងជើងក្រុងសៀមរាប។ ត្រូវមានសំបុត្រអង្គរ។"}, "tip": {"en": "Look for the small round holes in the stones of the outer walls: they show how the blocks were lifted.", "km": "រកមើលរន្ធមូលតូចៗ លើថ្មនៃជញ្ជាំងខាងក្រៅ៖ វាបង្ហាញពីរបៀបលើកដុំថ្ម។"}, "art": "temple", "built": {"en": "Early 12th century · Suryavarman II", "km": "ដើមសតវត្សទី១២ · ព្រះបាទសូរ្យវរ្ម័នទី២"}, "img": "", "featured": false, "mapq": "Angkor Wat", "link": "", "q": "Angkor Wat aerial", "story": true}, {"id": "angkor-wat", "cat": "temple", "title": {"en": "Angkor Wat", "km": "ប្រាសាទអង្គរវត្ត"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "The soul and identity of the Khmer nation, and the largest religious monument in the world.", "km": "ព្រលឹង និងអត្តសញ្ញាណនៃជាតិខ្មែរ និងជាវិមានសាសនាធំជាងគេបំផុតលើពិភពលោក។"}, "body": {"en": "Built in the early 12th century under King Suryavarman II, Angkor Wat was first dedicated to Vishnu and later became a Buddhist temple. Its five lotus-bud towers appear on Cambodia's flag.\n\nWalk the outer gallery to see the bas-reliefs, including the Churning of the Ocean of Milk, then climb to the upper level for views across the moat.", "km": "ប្រាសាទអង្គរវត្ត ត្រូវបានកសាងឡើងនៅដើមសតវត្សទី១២ ក្នុងរជ្ជកាលព្រះបាទសូរ្យវរ្ម័នទី២។ ដំបូងឡើយ ប្រាសាទនេះឧទ្ទិសដល់ព្រះវិស្ណុ ហើយក្រោយមកក្លាយជាប្រាសាទព្រះពុទ្ធសាសនា។ ប្រាង្គទាំងប្រាំរាងផ្កាឈូករបស់វា មាននៅលើទង់ជាតិកម្ពុជា។\n\nដើរតាមថែវខាងក្រៅ ដើម្បីមើលចម្លាក់លៀន រួមទាំងរឿងកូរសមុទ្រទឹកដោះ បន្ទាប់មកឡើងទៅជាន់ខាងលើ ដើម្បីមើលទេសភាពជុំវិញ។"}, "best": {"en": "Sunrise, November to February", "km": "ពេលថ្ងៃរះ ខែវិច្ឆិកា ដល់ខែកុម្ភៈ"}, "getting": {"en": "About 6 km north of Siem Reap town by tuk-tuk or bicycle. An Angkor Pass is required.", "km": "ប្រហែល ៦ គីឡូម៉ែត្រ ខាងជើងក្រុងសៀមរាប ដោយរ៉ឺម៉ក ឬកង់។ ត្រូវមានសំបុត្រអង្គរ។"}, "tip": {"en": "After sunrise, most people go for breakfast. Stay inside, the galleries are almost empty until about 8 am.", "km": "ក្រោយថ្ងៃរះ មនុស្សភាគច្រើនទៅញ៉ាំអាហារពេលព្រឹក។ ចូរនៅខាងក្នុង ព្រោះថែវស្ទើរតែគ្មានមនុស្សរហូតដល់ម៉ោង ៨ ព្រឹក។"}, "art": "temple", "built": {"en": "Early 12th century · Suryavarman II", "km": "ដើមសតវត្សទី១២ · ព្រះបាទសូរ្យវរ្ម័នទី២"}, "img": "", "featured": true, "mapq": "Angkor Wat, Cambodia", "link": "", "q": "Angkor Wat"}, {"id": "bayon", "cat": "temple", "title": {"en": "Bayon Temple", "km": "ប្រាសាទបាយ័ន"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "A smile that has endured for a thousand years. Over 200 calm stone faces look out from its towers.", "km": "ស្នាមញញឹមដែលគង់វង្សអស់រាប់ពាន់ឆ្នាំ។ មុខថ្មដ៏ស្ងប់ស្ងាត់ជាង ២០០ សម្លឹងចេញពីប្រាង្គរបស់វា។"}, "body": {"en": "The Bayon stands at the exact centre of Angkor Thom, the royal city built by King Jayavarman VII in the late 12th century. Its towers carry giant faces that many believe show the king himself as a compassionate bodhisattva.\n\nThe outer walls are carved with scenes of daily Khmer life: markets, fishing, cock fights and naval battles on the Tonle Sap.", "km": "ប្រាសាទបាយ័ន ស្ថិតនៅចំកណ្ដាលអង្គរធំ ដែលជារាជធានីកសាងដោយព្រះបាទជ័យវរ្ម័នទី៧ នៅចុងសតវត្សទី១២។ ប្រាង្គរបស់វាមានមុខធំៗ ដែលមនុស្សជាច្រើនជឿថា ជាព្រះរូបរបស់ព្រះមហាក្សត្រផ្ទាល់ ក្នុងនាមជាព្រះពោធិសត្វដ៏មេត្តា។\n\nជញ្ជាំងខាងក្រៅ មានចម្លាក់ពីជីវភាពប្រចាំថ្ងៃរបស់ខ្មែរ៖ ផ្សារ ការនេសាទ ការជល់មាន់ និងសង្គ្រាមទ័ពជើងទឹកនៅទន្លេសាប។"}, "best": {"en": "Early morning or late afternoon for soft light on the faces", "km": "ពេលព្រឹកព្រលឹម ឬរសៀល ដើម្បីពន្លឺទន់លើមុខថ្ម"}, "getting": {"en": "In the centre of Angkor Thom, about 1.5 km north of Angkor Wat. Enter through the South Gate.", "km": "នៅចំកណ្ដាលអង្គរធំ ប្រហែល ១,៥ គីឡូម៉ែត្រ ខាងជើងអង្គរវត្ត។ ចូលតាមទ្វារខាងត្បូង។"}, "tip": {"en": "Stop at the South Gate bridge first: the rows of gods and demons holding the naga are worth the photo.", "km": "ឈប់នៅស្ពានទ្វារខាងត្បូងជាមុនសិន៖ ជួរទេវតា និងអសុរកាន់នាគ សមនឹងថតរូប។"}, "art": "temple", "built": {"en": "Late 12th century · Jayavarman VII", "km": "ចុងសតវត្សទី១២ · ព្រះបាទជ័យវរ្ម័នទី៧"}, "img": "", "featured": true, "mapq": "Bayon Temple, Cambodia", "link": "", "q": "Bayon faces"}, {"id": "ta-prohm", "cat": "temple", "title": {"en": "Ta Prohm Temple", "km": "ប្រាសាទតាព្រហ្ម"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "One of the most captivating temples at Angkor, where giant tree roots and stone grow together.", "km": "ប្រាសាទដ៏គួរឱ្យចាប់អារម្មណ៍បំផុតមួយនៅអង្គរ ដែលឫសឈើយក្ស និងថ្មរួមរស់ជាមួយគ្នា។"}, "body": {"en": "Ta Prohm was founded in 1186 by Jayavarman VII as a Buddhist monastery dedicated to his mother. Unlike most of Angkor, it was left largely as it was found, with silk-cotton and strangler fig trees growing through the walls.\n\nThe result is one of the most photographed places in Cambodia, a reminder of how nature slowly takes back what people build.", "km": "ប្រាសាទតាព្រហ្ម ត្រូវបានកសាងឡើងនៅឆ្នាំ ១១៨៦ ដោយព្រះបាទជ័យវរ្ម័នទី៧ ជាវត្តព្រះពុទ្ធសាសនា ឧទ្ទិសដល់ព្រះមាតារបស់ព្រះអង្គ។ ខុសពីប្រាសាទភាគច្រើននៅអង្គរ វាត្រូវបានទុកស្ទើរតែដូចពេលរកឃើញ ដោយមានដើមសំពង់ និងដើមជ្រៃដុះកាត់ជញ្ជាំង។\n\nលទ្ធផលគឺជាកន្លែងមួយដែលគេថតរូបច្រើនបំផុតនៅកម្ពុជា ជាការរំលឹកថាធម្មជាតិបន្តិចម្ដងៗ យកមកវិញនូវអ្វីដែលមនុស្សបានសាងសង់។"}, "best": {"en": "Opening time (7:30 am) before the tour groups", "km": "ម៉ោងបើក (៧:៣០ ព្រឹក) មុនក្រុមទេសចរ"}, "getting": {"en": "About 1 km east of Angkor Thom on the Small Circuit.", "km": "ប្រហែល ១ គីឡូម៉ែត្រ ខាងកើតអង្គរធំ តាមផ្លូវរង្វង់តូច។"}, "tip": {"en": "Enter from the east (back) gate and walk west. You meet the famous trees with fewer people around.", "km": "ចូលតាមទ្វារខាងកើត (ខាងក្រោយ) ហើយដើរទៅខាងលិច។ អ្នកនឹងឃើញដើមឈើល្បីៗ ដោយមានមនុស្សតិច។"}, "art": "temple", "built": {"en": "1186 · Jayavarman VII", "km": "ឆ្នាំ ១១៨៦ · ព្រះបាទជ័យវរ្ម័នទី៧"}, "img": "", "featured": true, "mapq": "Ta Prohm Temple, Cambodia", "link": "", "q": "Ta Prohm tree"}, {"id": "banteay-srei", "cat": "temple", "title": {"en": "Banteay Srei Temple", "km": "ប្រាសាទបន្ទាយស្រី"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "Known as the Jewel of Khmer Art for the fine detail of its pink sandstone carvings.", "km": "ល្បីថាជាត្បូងនៃសិល្បៈខ្មែរ ដោយសារចម្លាក់ដ៏ល្អិតល្អន់លើថ្មភក់ពណ៌ផ្កាឈូក។"}, "body": {"en": "Consecrated in 967, Banteay Srei was built not by a king but by the Brahmin scholar Yajnavaraha. It is small, but every surface is carved: lintels with scenes from the Reamker, delicate devatas and floral patterns that still look sharp after a thousand years.\n\nThe red sandstone glows in late afternoon sun.", "km": "ប្រាសាទបន្ទាយស្រី ត្រូវបានសម្ពោធនៅឆ្នាំ ៩៦៧ មិនមែនដោយព្រះមហាក្សត្រទេ គឺដោយព្រាហ្មណ៍អ្នកប្រាជ្ញឈ្មោះ យជ្ញវរាហៈ។ វាតូច ប៉ុន្តែគ្រប់ផ្ទៃត្រូវបានឆ្លាក់៖ ផ្ដែរមានរឿងរាមកេរ្តិ៍ ទេវតាដ៏ស្រស់ស្អាត និងក្បាច់ផ្កា ដែលនៅតែច្បាស់ ក្រោយរាប់ពាន់ឆ្នាំ។\n\nថ្មភក់ក្រហមភ្លឺចែងចាំង នៅពេលថ្ងៃរសៀល។"}, "best": {"en": "Late afternoon, or right at opening time", "km": "ពេលរសៀល ឬម៉ោងបើកដំបូង"}, "getting": {"en": "About 35 km northeast of Siem Reap, around 45 minutes by car or tuk-tuk. Included in the Angkor Pass.", "km": "ប្រហែល ៣៥ គីឡូម៉ែត្រ ឦសានក្រុងសៀមរាប ប្រហែល ៤៥ នាទី ដោយរថយន្ត ឬរ៉ឺម៉ក។ រួមក្នុងសំបុត្រអង្គរ។"}, "tip": {"en": "Combine it with Phnom Kulen or the Landmine Museum on the same road.", "km": "ផ្សំជាមួយភ្នំគូលែន ឬសារមន្ទីរមីន នៅលើផ្លូវតែមួយ។"}, "art": "temple", "built": {"en": "967 · Yajnavaraha", "km": "ឆ្នាំ ៩៦៧ · យជ្ញវរាហៈ"}, "img": "", "featured": true, "mapq": "Banteay Srei Temple, Cambodia", "link": "", "q": "Banteay Srei"}, {"id": "preah-vihear", "cat": "temple", "title": {"en": "Preah Vihear Temple", "km": "ប្រាសាទព្រះវិហារ"}, "region": {"en": "Preah Vihear", "km": "ព្រះវិហារ"}, "sum": {"en": "A temple on a cliff edge of the Dangrek Mountains, with views across the northern plains.", "km": "ប្រាសាទនៅលើមាត់ច្រាំងភ្នំដងរែក ដែលអាចមើលឃើញវាលទំនាបភាគខាងជើង។"}, "body": {"en": "Built mainly in the 11th and 12th centuries and dedicated to Shiva, Preah Vihear climbs the mountain in a series of gopuras for about 800 metres. It became a UNESCO World Heritage Site in 2008.\n\nThe last terrace ends at a cliff more than 500 metres above the plain. On a clear morning you can see for many kilometres.", "km": "ប្រាសាទព្រះវិហារ ត្រូវបានកសាងភាគច្រើននៅសតវត្សទី១១ និងទី១២ ឧទ្ទិសដល់ព្រះឥសូរ។ វាឡើងតាមភ្នំ តាមរយៈគោបុរៈជាបន្តបន្ទាប់ ប្រវែងប្រហែល ៨០០ ម៉ែត្រ។ វាបានក្លាយជាបេតិកភណ្ឌពិភពលោក UNESCO នៅឆ្នាំ ២០០៨។\n\nរាបចុងក្រោយ បញ្ចប់នៅមាត់ច្រាំងថ្មខ្ពស់ជាង ៥០០ ម៉ែត្រពីវាលទំនាប។ នៅព្រឹកមេឃស្រឡះ អ្នកអាចមើលឃើញឆ្ងាយរាប់គីឡូម៉ែត្រ។"}, "best": {"en": "Early morning, dry season", "km": "ពេលព្រឹកព្រលឹម រដូវប្រាំង"}, "getting": {"en": "A long day trip from Siem Reap, or stay overnight in Sra Em town at the foot of the mountain. Local 4x4 rides go up the steep road.", "km": "ដំណើរមួយថ្ងៃពេញពីសៀមរាប ឬស្នាក់នៅមួយយប់នៅក្រុងស្រអែម ជើងភ្នំ។ រថយន្ត 4x4 ក្នុងស្រុកដឹកឡើងផ្លូវចោត។"}, "tip": {"en": "Bring a jacket for the early morning wind at the top.", "km": "យកអាវរងារទៅផង សម្រាប់ខ្យល់ពេលព្រឹកនៅលើកំពូល។"}, "art": "temple", "built": {"en": "11th–12th century", "km": "សតវត្សទី១១–១២"}, "img": "", "featured": false, "mapq": "Preah Vihear Temple, Cambodia", "link": "", "q": "Prasat Preah Vihear"}, {"id": "koh-ker", "cat": "temple", "title": {"en": "Koh Ker", "km": "កោះកេរ្តិ៍"}, "region": {"en": "Preah Vihear", "km": "ព្រះវិហារ"}, "sum": {"en": "A jungle capital with a seven-tiered pyramid, far from the crowds.", "km": "រាជធានីក្នុងព្រៃ ដែលមានប្រាសាទរាងពីរ៉ាមីតប្រាំពីរថ្នាក់ ឆ្ងាយពីហ្វូងមនុស្ស។"}, "body": {"en": "For a short time in the 10th century, King Jayavarman IV ruled the empire from Koh Ker instead of Angkor. The site's main temple, Prasat Thom, is a 36-metre stepped pyramid unlike anything else in Cambodia.\n\nKoh Ker was added to the UNESCO World Heritage List in 2023.", "km": "ក្នុងរយៈពេលខ្លីមួយនៅសតវត្សទី១០ ព្រះបាទជ័យវរ្ម័នទី៤ បានគ្រប់គ្រងអាណាចក្រពីកោះកេរ្តិ៍ ជំនួសអង្គរ។ ប្រាសាទធំ ជាពីរ៉ាមីតមានថ្នាក់កម្ពស់ ៣៦ ម៉ែត្រ ដែលមិនដូចប្រាសាទណាផ្សេងទៀតនៅកម្ពុជាទេ។\n\nកោះកេរ្តិ៍ ត្រូវបានចុះក្នុងបញ្ជីបេតិកភណ្ឌពិភពលោក UNESCO នៅឆ្នាំ ២០២៣។"}, "best": {"en": "Dry season, morning", "km": "រដូវប្រាំង ពេលព្រឹក"}, "getting": {"en": "About 2.5 hours by car from Siem Reap. Often combined with Beng Mealea on the way.", "km": "ប្រហែល ២ ម៉ោងកន្លះ ដោយរថយន្តពីសៀមរាប។ ជារឿយៗផ្សំជាមួយប្រាសាទបឹងមាលា តាមផ្លូវ។"}, "tip": {"en": "Stay on marked paths; this area was cleared of landmines but the forest edges are not for wandering.", "km": "ដើរតែលើផ្លូវដែលមានសញ្ញា។ តំបន់នេះត្រូវបានបោសសម្អាតមីនហើយ ប៉ុន្តែគែមព្រៃមិនមែនសម្រាប់ដើរលេងទេ។"}, "art": "temple", "built": {"en": "10th century · Jayavarman IV", "km": "សតវត្សទី១០ · ព្រះបាទជ័យវរ្ម័នទី៤"}, "img": "", "featured": false, "mapq": "Koh Ker, Cambodia", "link": "", "q": "Prasat Thom Koh Ker"}, {"id": "sambor-prei-kuk", "cat": "temple", "title": {"en": "Sambor Prei Kuk", "km": "សំបូរព្រៃគុក"}, "region": {"en": "Kampong Thom", "km": "កំពង់ធំ"}, "sum": {"en": "Brick towers in the forest, older than Angkor itself.", "km": "ប្រាង្គឥដ្ឋក្នុងព្រៃ ដែលចាស់ជាងអង្គរទៅទៀត។"}, "body": {"en": "Sambor Prei Kuk was Ishanapura, capital of the Chenla kingdom in the 7th century, centuries before Angkor. More than a hundred brick temples stand under the trees, some wrapped in roots, some carved with flying palaces.\n\nIt became a UNESCO World Heritage Site in 2017. Local families run homestays and bicycle rentals near the entrance.", "km": "សំបូរព្រៃគុក គឺជាឦសានបុរៈ រាជធានីនៃអាណាចក្រចេនឡា នៅសតវត្សទី៧ រាប់រយឆ្នាំមុនអង្គរ។ ប្រាសាទឥដ្ឋជាងមួយរយ ឈរនៅក្រោមដើមឈើ ខ្លះត្រូវឫសឈើរុំព័ទ្ធ ខ្លះមានចម្លាក់វិមានហោះ។\n\nវាបានក្លាយជាបេតិកភណ្ឌពិភពលោក UNESCO នៅឆ្នាំ ២០១៧។ គ្រួសារក្នុងតំបន់ ផ្ដល់សេវាស្នាក់នៅតាមផ្ទះ និងជួលកង់ នៅជិតច្រកចូល។"}, "best": {"en": "Morning, any season", "km": "ពេលព្រឹក គ្រប់រដូវ"}, "getting": {"en": "About 30 km north of Kampong Thom town, an easy stop between Phnom Penh and Siem Reap.", "km": "ប្រហែល ៣០ គីឡូម៉ែត្រ ខាងជើងក្រុងកំពង់ធំ ជាកន្លែងឈប់ងាយស្រួល រវាងភ្នំពេញ និងសៀមរាប។"}, "tip": {"en": "Rent a bicycle at the entrance. The three temple groups are spread out in the shade.", "km": "ជួលកង់នៅច្រកចូល។ ក្រុមប្រាសាទទាំងបី នៅរាយប៉ាយក្នុងម្លប់ឈើ។"}, "art": "temple", "built": {"en": "7th century · Chenla kingdom", "km": "សតវត្សទី៧ · អាណាចក្រចេនឡា"}, "img": "", "featured": false, "mapq": "Sambor Prei Kuk, Cambodia", "link": "", "q": "Sambor Prei Kuk"}, {"id": "kampot", "cat": "destination", "title": {"en": "Kampot & Bokor", "km": "កំពត និងបូកគោ"}, "region": {"en": "Kampot", "km": "កំពត"}, "sum": {"en": "A slow riverside town, pepper farms and a cool mountain plateau above the clouds.", "km": "ក្រុងមាត់ទន្លេដ៏ស្ងប់ស្ងាត់ ចម្ការម្រេច និងខ្ពង់រាបភ្នំត្រជាក់លើពពក។"}, "body": {"en": "Kampot is where our team goes to slow down. Old shophouses line the Praek Tuek Chhu river, and sunset boat trips drift past fishing boats heading out.\n\nKampot pepper is grown on family farms outside town and carries protected geographical status. Up the road, Bokor Mountain in Preah Monivong National Park rises above 1,000 metres, with an old French hill station, waterfalls and cool air.", "km": "កំពត គឺជាកន្លែងដែលក្រុមយើងទៅដើម្បីសម្រាក។ ផ្ទះល្វែងចាស់ៗ តម្រៀបតាមមាត់ទន្លេព្រែកទឹកឈូ ហើយទូកពេលថ្ងៃលិច ធ្វើដំណើរកាត់ទូកនេសាទដែលចេញទៅសមុទ្រ។\n\nម្រេចកំពត ដាំនៅចម្ការគ្រួសារក្រៅក្រុង ហើយមានស្ថានភាពភូមិសាស្ត្រការពារ។ ឡើងទៅលើ ភ្នំបូកគោក្នុងឧទ្យានជាតិព្រះមុនីវង្ស ខ្ពស់ជាង ១០០០ ម៉ែត្រ មានអគារចាស់សម័យបារាំង ទឹកធ្លាក់ និងខ្យល់ត្រជាក់។"}, "best": {"en": "November to April; pepper harvest is roughly February to May", "km": "ខែវិច្ឆិកា ដល់ខែមេសា។ ការប្រមូលផលម្រេច ប្រហែលខែកុម្ភៈ ដល់ឧសភា"}, "getting": {"en": "About 3 hours by road from Phnom Penh. Rent a scooter or tuk-tuk for Bokor and the farms.", "km": "ប្រហែល ៣ ម៉ោង តាមផ្លូវគោកពីភ្នំពេញ។ ជួលម៉ូតូ ឬរ៉ឺម៉ក ដើម្បីទៅបូកគោ និងចម្ការ។"}, "tip": {"en": "Go up Bokor early: by midday clouds often roll in and hide the view.", "km": "ឡើងបូកគោឱ្យបានព្រឹក៖ ដល់ថ្ងៃត្រង់ ពពកច្រើនតែមកបាំងទេសភាព។"}, "art": "river", "built": {"en": "", "km": ""}, "img": "", "featured": true, "mapq": "Kampot, Cambodia", "link": "", "q": "Kampot river"}, {"id": "kep", "cat": "destination", "title": {"en": "Kep", "km": "កែប"}, "region": {"en": "Kep", "km": "កែប"}, "sum": {"en": "Fresh crab by the sea, quiet forest trails and a short boat ride to Rabbit Island.", "km": "ក្ដាមស្រស់មាត់សមុទ្រ ផ្លូវដើរក្នុងព្រៃស្ងប់ស្ងាត់ និងការជិះទូកខ្លីទៅកោះទន្សាយ។"}, "body": {"en": "Kep was a seaside escape in the 1960s, and you can still see modernist villas in the trees. Today people come for the crab market, where crabs are pulled from bamboo traps in the sea and cooked with fresh Kampot green pepper.\n\nKep National Park has an easy walking loop with sea views, and boats leave for Koh Tonsay (Rabbit Island) in the morning.", "km": "កែប ធ្លាប់ជាកន្លែងកម្សាន្តមាត់សមុទ្រនៅទសវត្សរ៍ ១៩៦០ ហើយអ្នកនៅតែអាចឃើញវីឡាបែបទំនើបក្នុងចំណោមដើមឈើ។ សព្វថ្ងៃ មនុស្សមកផ្សារក្ដាម ដែលក្ដាមត្រូវបានដកចេញពីលបឫស្សីក្នុងសមុទ្រ ហើយឆាជាមួយម្រេចខ្ចីកំពត។\n\nឧទ្យានជាតិកែប មានផ្លូវដើរងាយស្រួល មើលឃើញសមុទ្រ ហើយទូកចេញទៅកោះទន្សាយនៅពេលព្រឹក។"}, "best": {"en": "November to May", "km": "ខែវិច្ឆិកា ដល់ខែឧសភា"}, "getting": {"en": "About 30 minutes from Kampot, or 3.5 hours from Phnom Penh.", "km": "ប្រហែល ៣០ នាទីពីកំពត ឬ ៣ ម៉ោងកន្លះពីភ្នំពេញ។"}, "tip": {"en": "Order crab with green pepper at the market stalls and eat at sunset over the water.", "km": "កុម្ម៉ង់ក្ដាមឆាម្រេចខ្ចី នៅតូបផ្សារ ហើយញ៉ាំពេលថ្ងៃលិចលើទឹក។"}, "art": "sea", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Kep, Cambodia", "link": "", "q": "Kep Cambodia"}, {"id": "koh-rong", "cat": "destination", "title": {"en": "Koh Rong & Koh Rong Samloem", "km": "កោះរ៉ុង និងកោះរ៉ុងសន្លឹម"}, "region": {"en": "Preah Sihanouk", "km": "ព្រះសីហនុ"}, "sum": {"en": "White sand, clear water and glowing plankton at night.", "km": "ខ្សាច់ស ទឹកថ្លា និងផ្លង់តុងភ្លឺនៅពេលយប់។"}, "body": {"en": "Cambodia's best-known islands sit off the coast of Sihanouk Province. Koh Rong has long beaches and jungle trails; its smaller sister, Koh Rong Samloem, is quieter, with Saracen Bay and Lazy Beach.\n\nOn dark nights, swim off the beach and watch the bioluminescent plankton light up around your hands.", "km": "កោះល្បីៗបំផុតរបស់កម្ពុជា ស្ថិតនៅក្បែរឆ្នេរខេត្តព្រះសីហនុ។ កោះរ៉ុង មានឆ្នេរវែងៗ និងផ្លូវដើរក្នុងព្រៃ។ កោះរ៉ុងសន្លឹមដែលតូចជាង ស្ងប់ស្ងាត់ជាង មានឆ្នេរសារ៉ាសេន និងឆ្នេរឡាស៊ី។\n\nនៅយប់ងងឹត ហែលទឹកពីឆ្នេរ ហើយមើលផ្លង់តុងភ្លឺ នៅជុំវិញដៃរបស់អ្នក។"}, "best": {"en": "November to April, calm seas", "km": "ខែវិច្ឆិកា ដល់ខែមេសា សមុទ្រស្ងប់"}, "getting": {"en": "Speed ferry from Sihanoukville, around 45 to 60 minutes.", "km": "ទូកល្បឿនលឿនពីក្រុងព្រះសីហនុ ប្រហែល ៤៥ ទៅ ៦០ នាទី។"}, "tip": {"en": "Bring cash. ATMs on the islands are few and not always working.", "km": "យកលុយសុទ្ធទៅផង។ ម៉ាស៊ីន ATM នៅលើកោះមានតិច ហើយមិនតែងតែដំណើរការទេ។"}, "art": "sea", "built": {"en": "", "km": ""}, "img": "", "featured": true, "mapq": "Koh Rong & Koh Rong Samloem, Cambodia", "link": "", "q": "Koh Rong beach"}, {"id": "mondulkiri", "cat": "destination", "title": {"en": "Mondulkiri", "km": "មណ្ឌលគិរី"}, "region": {"en": "Mondulkiri", "km": "មណ្ឌលគិរី"}, "sum": {"en": "Rolling green hills, waterfalls and cool air in the eastern highlands.", "km": "ភ្នំពណ៌បៃតងរលកៗ ទឹកធ្លាក់ និងខ្យល់ត្រជាក់ នៅតំបន់ខ្ពង់រាបភាគខាងកើត។"}, "body": {"en": "Mondulkiri feels like a different country: grassy hills, pine trees and morning fog. It is home to the Bunong people, whose villages and coffee farms surround the provincial town of Sen Monorom.\n\nBou Sra waterfall is one of the biggest in Cambodia, and the Sea Forest viewpoint looks over waves of green hills to the horizon.", "km": "មណ្ឌលគិរី មានអារម្មណ៍ដូចជាប្រទេសផ្សេង៖ ភ្នំស្មៅ ដើមស្រល់ និងអ័ព្ទពេលព្រឹក។ វាជាលំនៅរបស់ជនជាតិព្នង ដែលភូមិ និងចម្ការកាហ្វេរបស់ពួកគេ នៅជុំវិញក្រុងសែនមនោរម្យ។\n\nទឹកធ្លាក់ប៊ូស្រា ជាទឹកធ្លាក់ធំជាងគេមួយនៅកម្ពុជា ហើយកន្លែងមើលទេសភាពសមុទ្រព្រៃឈើ មើលឃើញភ្នំពណ៌បៃតងរលកៗ ដល់ជើងមេឃ។"}, "best": {"en": "November to March for clear, cool days", "km": "ខែវិច្ឆិកា ដល់ខែមីនា សម្រាប់ថ្ងៃត្រជាក់ មេឃស្រឡះ"}, "getting": {"en": "About 5 to 6 hours by road from Phnom Penh.", "km": "ប្រហែល ៥ ទៅ ៦ ម៉ោង តាមផ្លូវគោកពីភ្នំពេញ។"}, "tip": {"en": "Pack a warm layer. Nights in Sen Monorom can be surprisingly cold.", "km": "យកអាវកក់ក្ដៅទៅផង។ យប់នៅសែនមនោរម្យ អាចត្រជាក់ខ្លាំង។"}, "art": "hills", "built": {"en": "", "km": ""}, "img": "", "featured": true, "mapq": "Mondulkiri, Cambodia", "link": "", "q": "Mondulkiri"}, {"id": "ratanakiri", "cat": "destination", "title": {"en": "Yeak Laom Lake", "km": "បឹងយក្សឡោម"}, "region": {"en": "Ratanakiri", "km": "រតនគិរី"}, "sum": {"en": "A perfectly round crater lake with clear blue water, surrounded by forest.", "km": "បឹងរណ្ដៅភ្នំភ្លើងរាងមូល មានទឹកពណ៌ខៀវថ្លា ហ៊ុំព័ទ្ធដោយព្រៃ។"}, "body": {"en": "Ratanakiri is the land of red earth roads, waterfalls and highland communities. Its jewel is Yeak Laom, a volcanic crater lake near Banlung town, managed by the local Tampuan community.\n\nWooden piers let you swim in the calm, deep water, and a walking trail circles the whole lake.", "km": "រតនគិរី ជាដែនដីនៃផ្លូវដីក្រហម ទឹកធ្លាក់ និងសហគមន៍តំបន់ខ្ពង់រាប។ ត្បូងរបស់វាគឺបឹងយក្សឡោម ជាបឹងរណ្ដៅភ្នំភ្លើងក្បែរក្រុងបានលុង ដែលគ្រប់គ្រងដោយសហគមន៍ជនជាតិទំពួន។\n\nផែឈើអនុញ្ញាតឱ្យអ្នកហែលទឹកក្នុងទឹកជ្រៅស្ងប់ ហើយមានផ្លូវដើរជុំវិញបឹងទាំងមូល។"}, "best": {"en": "November to April", "km": "ខែវិច្ឆិកា ដល់ខែមេសា"}, "getting": {"en": "A long drive from Phnom Penh to Banlung, then about 5 km to the lake.", "km": "ធ្វើដំណើរយូរពីភ្នំពេញទៅក្រុងបានលុង បន្ទាប់មកប្រហែល ៥ គីឡូម៉ែត្រទៅបឹង។"}, "tip": {"en": "Go early morning when mist lies on the water and the lake is all yours.", "km": "ទៅពេលព្រឹកព្រលឹម ពេលអ័ព្ទនៅលើទឹក ហើយបឹងគឺជារបស់អ្នកតែម្នាក់។"}, "art": "river", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Yeak Laom Lake, Ratanakiri", "link": "", "q": "Yeak Laom lake"}, {"id": "kratie", "cat": "destination", "title": {"en": "Kratié Dolphins", "km": "ផ្សោតក្រចេះ"}, "region": {"en": "Kratié", "km": "ក្រចេះ"}, "sum": {"en": "See the rare Irrawaddy dolphins in the Mekong at Kampi.", "km": "មើលផ្សោតទឹកសាបដ៏កម្រ នៅទន្លេមេគង្គ ត្រង់កំពី។"}, "body": {"en": "A small population of Irrawaddy dolphins lives in deep pools of the Mekong north of Kratié town. At Kampi, local boatmen paddle or motor gently out so you can watch them surface and breathe.\n\nKratié town itself has a beautiful riverside sunset, and Koh Trong island across the water is perfect for a slow bicycle ride.", "km": "ផ្សោតទឹកសាបមួយចំនួនតូច រស់នៅក្នុងអន្លង់ជ្រៅនៃទន្លេមេគង្គ ខាងជើងក្រុងក្រចេះ។ នៅកំពី អ្នកបើកទូកក្នុងតំបន់ ចែវ ឬបើកទូកយឺតៗ ដើម្បីឱ្យអ្នកមើលពួកវាងើបដកដង្ហើម។\n\nក្រុងក្រចេះ មានទេសភាពថ្ងៃលិចមាត់ទន្លេដ៏ស្អាត ហើយកោះទ្រង់ នៅម្ខាងទន្លេ ល្អឥតខ្ចោះសម្រាប់ជិះកង់លេង។"}, "best": {"en": "Dry season (December to May), early morning or late afternoon", "km": "រដូវប្រាំង (ខែធ្នូ ដល់ខែឧសភា) ពេលព្រឹក ឬរសៀល"}, "getting": {"en": "Kampi is about 15 km north of Kratié town by tuk-tuk.", "km": "កំពី ស្ថិតនៅប្រហែល ១៥ គីឡូម៉ែត្រ ខាងជើងក្រុងក្រចេះ ដោយរ៉ឺម៉ក។"}, "tip": {"en": "Keep voices low on the boat. The dolphins come closer when it is quiet.", "km": "និយាយតិចៗនៅលើទូក។ ផ្សោតនឹងមកជិត នៅពេលស្ងាត់។"}, "art": "river", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Kampi dolphin pool, Kratie", "link": "", "q": "Irrawaddy dolphin Kratie"}, {"id": "battambang", "cat": "destination", "title": {"en": "Battambang", "km": "បាត់ដំបង"}, "region": {"en": "Battambang", "km": "បាត់ដំបង"}, "sum": {"en": "Colonial streets, the bamboo train, art schools and a bat cave at sunset.", "km": "ផ្លូវសម័យអាណានិគម រថភ្លើងឫស្សី សាលាសិល្បៈ និងរូងប្រចៀវពេលថ្ងៃលិច។"}, "body": {"en": "Battambang is Cambodia's relaxed second city, known for its well-kept French-era shophouses, young artists and rice fields all around.\n\nAt Phnom Sampeau, millions of bats stream out of a cave at dusk in a long ribbon across the sky. Nearby, the bamboo train (norry) still gives short rides along a track through the fields.", "km": "បាត់ដំបង ជាក្រុងធំទីពីរដ៏ស្ងប់ស្ងាត់របស់កម្ពុជា ល្បីដោយផ្ទះល្វែងសម័យបារាំងដែលថែរក្សាបានល្អ សិល្បករវ័យក្មេង និងវាលស្រែជុំវិញ។\n\nនៅភ្នំសំពៅ ប្រចៀវរាប់លានក្បាល ហោះចេញពីរូងភ្នំនៅពេលល្ងាច ជាខ្សែវែងឆ្លងកាត់មេឃ។ នៅក្បែរនោះ រថភ្លើងឫស្សី (ណូរី) នៅតែដឹកភ្ញៀវ ជិះខ្លីៗតាមផ្លូវកាត់វាលស្រែ។"}, "best": {"en": "November to February", "km": "ខែវិច្ឆិកា ដល់ខែកុម្ភៈ"}, "getting": {"en": "About 5 hours by bus from Phnom Penh, or 3 hours from Siem Reap.", "km": "ប្រហែល ៥ ម៉ោងដោយឡានក្រុងពីភ្នំពេញ ឬ ៣ ម៉ោងពីសៀមរាប។"}, "tip": {"en": "Be at the foot of Phnom Sampeau by 5:30 pm for the bats.", "km": "ត្រូវនៅជើងភ្នំសំពៅ មុនម៉ោង ៥:៣០ ល្ងាច ដើម្បីមើលប្រចៀវ។"}, "art": "hills", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Battambang, Cambodia", "link": "", "q": "Battambang"}, {"id": "phnom-kulen", "cat": "destination", "title": {"en": "Phnom Kulen", "km": "ភ្នំគូលែន"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "The sacred mountain where the Khmer Empire was born, with a riverbed carved with lingas.", "km": "ភ្នំពិសិដ្ឋ ដែលអាណាចក្រខ្មែរបានកកើត មានបាតទន្លេឆ្លាក់លិង្គ។"}, "body": {"en": "In 802, Jayavarman II declared himself universal monarch on Phnom Kulen, the moment usually taken as the start of the Khmer Empire. Today it is a national park and a place of pilgrimage for Cambodians.\n\nNear the top, the river runs over a bed carved with hundreds of lingas, known as the River of a Thousand Lingas, before tumbling down the Kulen waterfall, where families picnic and swim.", "km": "នៅឆ្នាំ ៨០២ ព្រះបាទជ័យវរ្ម័នទី២ បានប្រកាសខ្លួនជាចក្រពត្តិ នៅលើភ្នំគូលែន ដែលជាពេលវេលាគេចាត់ទុកថាជាការចាប់ផ្ដើមនៃអាណាចក្រខ្មែរ។ សព្វថ្ងៃ វាជាឧទ្យានជាតិ និងជាទីសក្ការបូជារបស់ប្រជាជនខ្មែរ។\n\nនៅទន្លេលិង្គមួយពាន់ ទឹកហូរកាត់លើថ្មពិសិដ្ឋ មុននឹងធ្លាក់ចុះតាមទឹកធ្លាក់គូលែន ដែលគ្រួសារនានាមកញ៉ាំអាហារ និងហែលទឹក។"}, "best": {"en": "Late rainy season (August to November) for the fullest waterfall", "km": "ចុងរដូវវស្សា (ខែសីហា ដល់ខែវិច្ឆិកា) សម្រាប់ទឹកធ្លាក់ពេញបំផុត"}, "getting": {"en": "About 50 km northeast of Siem Reap, around 1.5 hours. Separate entry ticket, not part of the Angkor Pass.", "km": "ប្រហែល ៥០ គីឡូម៉ែត្រ ឦសានក្រុងសៀមរាប ប្រហែល ១ ម៉ោងកន្លះ។ មានសំបុត្រចូលដាច់ដោយឡែក មិនរួមក្នុងសំបុត្រអង្គរទេ។"}, "tip": {"en": "Visit the reclining Buddha at Preah Ang Thom first, then cool off at the waterfall.", "km": "ទៅថ្វាយបង្គំព្រះពុទ្ធរូបផ្ទំ នៅព្រះអង្គធំជាមុនសិន បន្ទាប់មកទៅលេងទឹកធ្លាក់។"}, "art": "hills", "built": {"en": "", "km": ""}, "img": "", "featured": true, "mapq": "Phnom Kulen, Cambodia", "link": "", "q": "Phnom Kulen waterfall"}, {"id": "tonle-sap", "cat": "destination", "title": {"en": "Tonle Sap Floating Villages", "km": "ភូមិបណ្ដែតទឹកទន្លេសាប"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "Life on the water at Southeast Asia’s largest freshwater lake.", "km": "ជីវិតលើទឹក នៅបឹងទឹកសាបធំជាងគេនៅអាស៊ីអាគ្នេយ៍។"}, "body": {"en": "Every rainy season the Mekong pushes water backwards up the Tonle Sap river, and the lake swells to several times its dry-season size. Whole villages live with this rhythm: houses on tall stilts, floating schools, and fishing boats instead of motorbikes.\n\nKampong Phluk and Kampong Khl  {"en": "Takeo · Kandal", "km": "តាកែវ · កណ្ដាល"}, "sum": {"en": "Hand-woven silk, from mulberry leaves to finished sampot.", "km": "សូត្រត្បាញដោយដៃ ចាប់ពីស្លឹកមន រហូតដល់សំពត់ស្រេច។"}, "body": {"en": "Khmer silk is famous for hol, a technique where threads are tie-dyed before weaving so patterns appear as the fabric grows. A single traditional sampot can take weeks on a wooden loom.\n\nKoh Dach, an island just outside Phnom Penh, and villages in Takeo are good places to watch weavers at work under their stilt houses.", "km": "សូត្រខ្មែរ ល្បីដោយសំពត់ហូល ជាបច្ចេកទេសចងជ្រលក់ពណ៌សរសៃមុនត្បាញ ដើម្បីឱ្យក្បាច់លេចឡើងពេលក្រណាត់កាន់តែវែង។ សំពត់ប្រពៃណីមួយ អាចចំណាយពេលរាប់សប្ដាហ៍លើកីត្បាញឈើ។\n\nកោះដាច់ ជាកោះនៅក្បែរភ្នំពេញ និងភូមិនានានៅតាកែវ ជាកន្លែងល្អដើម្បីមើលអ្នកត្បាញធ្វើការ នៅក្រោមផ្ទះឈើរបស់ពួកគេ។"}, "best": {"en": "Any time, weekday mornings", "km": "គ្រប់ពេល ពេលព្រឹកថ្ងៃធ្វើការ"}, "getting": {"en": "Koh Dach is about 30 minutes from central Phnom Penh by tuk-tuk and short ferry.", "km": "កោះដាច់ ប្រហែល ៣០ នាទីពីកណ្ដាលក្រុងភ្នំពេញ ដោយរ៉ឺម៉ក និងសាឡាងខ្លី។"}, "tip": {"en": "Buy directly from the weaver. It is the best souvenir and the money stays in the village.", "km": "ទិញផ្ទាល់ពីអ្នកត្បាញ។ វាជាវត្ថុអនុស្សាវរីយ៍ល្អបំផុត ហើយលុយនៅក្នុងភូមិ។"}, "art": "culture", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Koh Dach silk island", "link": "", "q": "Cambodia silk weaving loom"}, {"id": "amok", "cat": "culture", "title": {"en": "Fish Amok & Khmer Food", "km": "អាម៉ុកត្រី និងម្ហូបខ្មែរ"}, "region": {"en": "Everywhere", "km": "គ្រប់ទីកន្លែង"}, "sum": {"en": "Creamy curry steamed in banana leaf, and the flavours that make Khmer food unique.", "km": "ការីខាប់ចំហុយក្នុងស្លឹកចេក និងរសជាតិដែលធ្វើឱ្យម្ហូបខ្មែរមានលក្ខណៈពិសេស។"}, "body": {"en": "Amok trey is fish steamed with kroeung (a paste of lemongrass, galangal, turmeric and kaffir lime), coconut milk and egg until it sets like a soft custard. It is often served in a banana-leaf cup.\n\nAlso try num banh chok (rice noodles with green fish curry) for breakfast, lok lak, and prahok, the fermented fish paste that gives many dishes their deep flavour.", "km": "អាម៉ុកត្រី គឺត្រីចំហុយជាមួយគ្រឿង (ស្លឹកគ្រៃ រំដេង រមៀត និងស្លឹកក្រូចសើច) ខ្ទិះដូង និងស៊ុត រហូតដល់ខាប់ទន់។ ជារឿយៗ គេដាក់ក្នុងកន្ទោងស្លឹកចេក។\n\nសាកល្បងនំបញ្ចុកសម្លខ្មែរ ពេលព្រឹក ឡុកឡាក់ និងប្រហុក ដែលផ្ដល់រសជាតិជ្រៅដល់ម្ហូបជាច្រើន។"}, "best": {"en": "Any time; num banh chok in the morning", "km": "គ្រប់ពេល។ នំបញ្ចុកពេលព្រឹក"}, "getting": {"en": "Markets and family restaurants in every town.", "km": "ផ្សារ និងភោជនីយដ្ឋានគ្រួសារ នៅគ្រប់ក្រុង។"}, "tip": {"en": "Eat where the locals queue at breakfast time.", "km": "ញ៉ាំកន្លែងដែលអ្នកស្រុកតម្រង់ជួរ ពេលព្រឹក។"}, "art": "culture", "built": {"en": "", "km": ""}, "img": "", "featured": false, "mapq": "Khmer restaurant", "link": "", "q": "Fish amok"}, {"id": "phnom-bakheng", "cat": "temple", "title": {"en": "Phnom Bakheng", "km": "ប្រាសាទភ្នំបាខែង"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "A temple-mountain on a hill, famous for sunset over Angkor.", "km": "ប្រាសាទភ្នំនៅលើទួល ល្បីល្បាញសម្រាប់ទិដ្ឋភាពថ្ងៃលិចលើអង្គរ។"}, "body": {"en": "Built around the year 900 by King Yasovarman I, Phnom Bakheng was the centre of the first capital at Angkor. From the top you can see the towers of Angkor Wat rising out of the forest.", "km": "ប្រាសាទភ្នំបាខែង កសាងឡើងប្រហែលឆ្នាំ ៩០០ ដោយព្រះបាទយសោវរ្ម័នទី១ ហើយជាចំណុចកណ្ដាលនៃរាជធានីដំបូងនៅអង្គរ។ ពីលើកំពូល អ្នកអាចមើលឃើញប្រាង្គអង្គរវត្ត លេចចេញពីព្រៃ។"}, "best": {"en": "Sunset (arrive early, visitor numbers are limited)", "km": "ពេលថ្ងៃលិច (មកដល់មុន ព្រោះកំណត់ចំនួនភ្ញៀវ)"}, "getting": {"en": "Between Angkor Wat and the South Gate of Angkor Thom; a 15-minute walk up the hill.", "km": "នៅចន្លោះអង្គរវត្ត និងទ្វារខាងត្បូងអង្គរធំ។ ដើរឡើងភ្នំប្រហែល ១៥ នាទី។"}, "tip": {"en": "Come for the late-afternoon light instead of the exact sunset: fewer people, same view.", "km": "មករសៀលបន្តិច ជំនួសឱ្យពេលថ្ងៃលិចពិតៗ៖ មនុស្សតិច ទេសភាពដូចគ្នា។"}, "art": "temple", "built": {"en": "About 900 · Yasovarman I", "km": "ប្រហែលឆ្នាំ ៩០០ · ព្រះបាទយសោវរ្ម័នទី១"}, "img": "", "featured": false, "mapq": "Phnom Bakheng, Cambodia", "link": "", "q": "Phnom Bakheng"}, {"id": "angkor-thom", "cat": "temple", "title": {"en": "Angkor Thom South Gate", "km": "ទ្វារខាងត្បូងអង្គរធំ"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "The giant face gate and the bridge of gods and demons.", "km": "ទ្វារមុខធំ និងស្ពានទេវតា និងអសុរ។"}, "body": {"en": "Angkor Thom was the walled royal city of King Jayavarman VII. Its South Gate is crowned with four great faces, and the bridge in front is lined with 54 gods and 54 demons pulling a giant naga, the story of the Churning of the Ocean of Milk.", "km": "អង្គរធំ ជារាជធានីមានកំពែងព័ទ្ធជុំវិញរបស់ព្រះបាទជ័យវរ្ម័នទី៧។ ទ្វារខាងត្បូងមានមុខធំបួន ហើយស្ពានខាងមុខមានទេវតា ៥៤ និងអសុរ ៥៤ ទាញនាគយក្ស ជារឿងកូរសមុទ្រទឹកដោះ។"}, "best": {"en": "Sunrise or late afternoon, November to February", "km": "ពេលថ្ងៃរះ ឬរសៀល ខែវិច្ឆិកា ដល់ខែកុម្ភៈ"}, "getting": {"en": "About 2 km north of Angkor Wat, on the way to the Bayon.", "km": "ប្រហែល ២ គីឡូម៉ែត្រ ខាងជើងអង្គរវត្ត តាមផ្លូវទៅប្រាសាទបាយ័ន។"}, "tip": {"en": "Ride through the gate by tuk-tuk, then walk back across the bridge for the best photos.", "km": "ជិះរ៉ឺម៉កឆ្លងទ្វារ រួចដើរត្រឡប់មកលើស្ពានវិញ ដើម្បីថតរូបស្អាតបំផុត។"}, "art": "temple", "built": {"en": "Late 12th century · Jayavarman VII", "km": "ចុងសតវត្សទី១២ · ព្រះបាទជ័យវរ្ម័នទី៧"}, "img": "", "featured": false, "mapq": "Angkor Thom South Gate, Cambodia", "link": "", "q": "Angkor Thom south gate"}, {"id": "preah-khan", "cat": "temple", "title": {"en": "Preah Khan", "km": "ប្រាសាទព្រះខ័ន"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "Long corridors, carved doorways and trees growing on the walls.", "km": "ច្រករបៀងវែងៗ ទ្វារចម្លាក់ និងដើមឈើដុះលើជញ្ជាំង។"}, "body": {"en": "Preah Khan, the 'Sacred Sword', was built in 1191 by Jayavarman VII in honour of his father. It was once a city and Buddhist university, and is quieter than Ta Prohm with the same jungle atmosphere.", "km": "ប្រាសាទព្រះខ័ន កសាងឡើងនៅឆ្នាំ ១១៩១ ដោយព្រះបាទជ័យវរ្ម័នទី៧ ឧទ្ទិសដល់ព្រះបិតា។ ធ្លាប់ជាទីក្រុង និងសាកលវិទ្យាល័យពុទ្ធសាសនា ហើយស្ងាត់ជាងប្រាសាទតាព្រហ្ម ប៉ុន្តែមានបរិយាកាសព្រៃដូចគ្នា។"}, "best": {"en": "Morning, when the light comes through the doorways", "km": "ពេលព្រឹក ពេលពន្លឺចាំងតាមទ្វារ"}, "getting": {"en": "On the Grand Circuit, about 3 km north-east of Angkor Thom.", "km": "នៅលើផ្លូវរង្វង់ធំ ប្រហែល ៣ គីឡូម៉ែត្រ ឦសានអង្គរធំ។"}, "tip": {"en": "Enter from the west and walk straight through to the east gate: a perfect line of doorways.", "km": "ចូលពីខាងលិច ហើយដើរត្រង់ទៅទ្វារខាងកើត៖ ជួរទ្វារត្រង់ស្អាតណាស់។"}, "art": "temple", "built": {"en": "1191 · Jayavarman VII", "km": "ឆ្នាំ ១១៩១ · ព្រះបាទជ័យវរ្ម័នទី៧"}, "img": "", "featured": false, "mapq": "Preah Khan, Cambodia", "link": "", "q": "Preah Khan Angkor"}, {"id": "neak-pean", "cat": "temple", "title": {"en": "Neak Pean", "km": "ប្រាសាទនាគព័ន្ធ"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "A small island shrine in the middle of a sacred pool.", "km": "ប្រាសាទតូចលើកោះ នៅកណ្ដាលស្រះដ៏ពិសិដ្ឋ។"}, "body": {"en": "Neak Pean, 'the entwined serpents', is a round shrine on an island surrounded by four pools. Pilgrims once came to bathe here for healing. Today a long wooden walkway crosses the Jayatataka baray to reach it.", "km": "ប្រាសាទនាគព័ន្ធ មានន័យថា «នាគរុំព័ទ្ធ» ជាប្រាសាទរាងមូលលើកោះ ព័ទ្ធជុំវិញដោយស្រះបួន។ ពីដើម អ្នកធម្មយាត្រាមកងូតទឹកនៅទីនេះ ដើម្បីព្យាបាលជំងឺ។ សព្វថ្ងៃ មានស្ពានឈើវែងឆ្លងកាត់បារាយណ៍ជ័យតដាក ដើម្បីទៅដល់។"}, "best": {"en": "Rainy season, when the baray is full of water", "km": "រដូវវស្សា ពេលបារាយណ៍ពេញទឹក"}, "getting": {"en": "East of Preah Khan on the Grand Circuit.", "km": "ខាងកើតប្រាសាទព្រះខ័ន លើផ្លូវរង្វង់ធំ។"}, "tip": {"en": "The walkway over the water is the highlight; go slowly and look at the reflections.", "km": "ស្ពានលើទឹក គឺជាចំណុចពិសេស។ ដើរយឺតៗ ហើយមើលស្រមោលលើទឹក។"}, "art": "temple", "built": {"en": "Late 12th century · Jayavarman VII", "km": "ចុងសតវត្សទី១២ · ព្រះបាទជ័យវរ្ម័នទី៧"}, "img": "", "featured": false, "mapq": "Neak Pean, Cambodia", "link": "", "q": "Neak Pean"}, {"id": "beng-mealea", "cat": "temple", "title": {"en": "Beng Mealea", "km": "ប្រាសាទបឹងមាលា"}, "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "sum": {"en": "A collapsed jungle temple you explore on wooden walkways.", "km": "ប្រាសាទក្នុងព្រៃដែលបាក់បែក ដែលអ្នកដើរមើលតាមស្ពានឈើ។"}, "body": {"en": "Beng Mealea has almost the same plan as Angkor Wat but was left to the forest. Fallen blocks, moss and roots make it feel like a lost city. Wooden walkways lead over the rubble into the inner courtyards.", "km": "ប្រាសាទបឹងមាលា មានប្លង់ស្ទើរដូចអង្គរវត្ត ប៉ុន្តែត្រូវបានទុកចោលក្នុងព្រៃ។ ថ្មដួលរលំ ស្លែ និងឫសឈើ ធ្វើឱ្យវាដូចជាទីក្រុងដែលបាត់បង់។ ស្ពានឈើនាំអ្នកឆ្លងគំនរថ្ម ចូលទៅទីធ្លាខាងក្នុង។"}, "best": {"en": "Early morning, before day-trip groups arrive", "km": "ពេលព្រឹកព្រលឹម មុនក្រុមទេសចរមកដល់"}, "getting": {"en": "About 70 km east of Siem Reap (1.5 hours by car). Separate ticket.", "km": "ប្រហែល ៧០ គីឡូម៉ែត្រ ខាងកើតក្រុងសៀមរាប (១ ម៉ោងកន្លះតាមរថយន្ត)។ សំបុត្រដាច់ដោយឡែក។"}, "tip": {"en": "Combine it with Phnom Kulen or Koh Ker for a full day out.", "km": "ផ្សំជាមួយភ្នំគូលែន ឬកោះកេរ សម្រាប់ដំណើរមួយថ្ងៃពេញ។"}, "art": "temple", "built": {"en": "Early 12th century", "km": "ដើមសតវត្សទី១២"}, "img": "", "featured": false, "mapq": "Beng Mealea, Cambodia", "link": "", "q": "Beng Mealea"}, {"id": "banteay-chhmar", "cat": "temple", "title": {"en": "Banteay Chhmar", "km": "ប្រាសាទបន្ទាយឆ្មារ"}, "region": {"en": "Banteay Meanchey", "km": "បន្ទាយមានជ័យ"}, "sum": {"en": "Huge, remote and wonderfully quiet, with rare bas-reliefs.", "km": "ធំ ដាច់ស្រយាល និងស្ងប់ស្ងាត់ មានចម្លាក់លៀនដ៏កម្រ។"}, "body": {"en": "Banteay Chhmar is one of the largest temples of the Angkor period, far in the north-west. Its walls show the many-armed Avalokiteshvara and battle scenes. A community-based tourism project offers homestays and local guid ់ប្រាណ ភោជនីយដ្ឋាន និងបារ។ ក្រុមការងាររៀបចំដំណើរទៅទឹកធ្លាក់ប៊ូស្រា និងទីជម្រកដំរីក្នុងព្រៃជុំវិញ។"}, "address": {"en": "National Road 7, Sen Monorom, Mondulkiri", "km": "ផ្លូវជាតិលេខ ៧ ក្រុងសែនមនោរម្យ ខេត្តមណ្ឌលគិរី"}, "phone": "+855 77 980 980", "website": "https://www.mayurahillresort.com/", "facebook": "", "hours": {"en": "Open 24 hours", "km": "បើក ២៤ ម៉ោង"}, "price": "$$", "mapq": "Mayura Hill Resort Sen Monorom", "cat": "hotel", "img": "", "art": "river", "loc": "city"}], "festivals": [{"id": "f5", "when": {"en": "February full moon", "km": "ពេញបូណ៌មីខែមាឃ"}, "title": {"en": "Meak Bochea", "km": "ពិធីបុណ្យមាឃបូជា"}, "q": "Meak Bochea", "text": {"en": "Buddhists gather at pagodas in the evening and walk three times around the vihara with candles, incense and lotus flowers, remembering the Buddha's teaching to 1,250 monks.", "km": "ពុទ្ធបរិស័ទជួបជុំគ្នានៅវត្តពេលល្ងាច ហើយដើរវង់ព្រះវិហារបីជុំ ជាមួយទៀន ធូប និងផ្កាឈូក ដើម្បីរំលឹកដល់ការសម្ដែងធម៌របស់ព្រះពុទ្ធ ដល់ព្រះសង្ឃ ១២៥០ អង្គ។"}, "body": {"en": "Meak Bochea is held on the full moon of the month of Meak. It remembers the day when 1,250 enlightened monks came to see the Buddha without being called, and he gave them a teaching that sums up the heart of Buddhism: avoid evil, do good and purify the mind.\n\nFor Cambodian Buddhists it is a day to renew their faith and practise the core of the teaching.", "km": "ពិធីបុណ្យមាឃបូជា ប្រារព្ធនៅថ្ងៃពេញបូណ៌មីខែមាឃ។ បុណ្យនេះរំលឹកដល់ថ្ងៃដែលព្រះអរហន្ត ១២៥០ អង្គ បាននិមន្តមកគាល់ព្រះពុទ្ធដោយមិនបាននិមន្ត ហើយព្រះអង្គបានសម្ដែងធម៌ ដែលជាខ្លឹមសារនៃព្រះពុទ្ធសាសនា គឺការមិនធ្វើអំពើអាក្រក់ ការធ្វើអំពើល្អ និងការធ្វើចិត្តឱ្យបរិសុទ្ធ។\n\nសម្រាប់ពុទ្ធបរិស័ទខ្មែរ នេះជាថ្ងៃដើម្បីពង្រឹងសទ្ធា និងប្រតិបត្តិតាមខ្លឹមសារនៃព្រះធម៌។"}, "how": {"en": "Families bring food to the monks in the morning, and many people keep the precepts and listen to sermons at the pagoda. In the evening, Buddhists gather and walk three times around the vihara with candles, incense and lotus flowers. Some elders stay overnight at the pagoda to meditate.", "km": "គ្រួសារនានាប្រគេនចង្ហាន់ដល់ព្រះសង្ឃនៅពេលព្រឹក ហើយមនុស្សជាច្រើនសមាទានសីល និងស្ដាប់ធម៌ទេសនានៅវត្ត។ នៅពេលល្ងាច ពុទ្ធបរិស័ទជួបជុំគ្នា ហើយដើរវង់ព្រះវិហារបីជុំ ជាមួយទៀន ធូប និងផ្កាឈូក។ ចាស់ទុំខ្លះស្នាក់នៅវត្តពេញមួយយប់ ដើម្បីធ្វើសមាធិ។"}, "where": {"en": "Any local pagoda is the best place to join the evening candle procession. Oudong, north of Phnom Penh, often hosts large ceremonies.", "km": "វត្តណាមួយក្នុងតំបន់ ជាកន្លែងល្អបំផុត ដើម្បីចូលរួមដង្ហែទៀននៅពេលល្ងាច។ ឧដុង្គ នៅខាងជើងភ្នំពេញ តែងតែជាកន្លែងប្រារព្ធពិធីធំៗ។"}, "tip": {"en": "Visitors are welcome to join the procession; dress modestly, hold your candle carefully and follow the local people.", "km": "ភ្ញៀវអាចចូលរួមក្នុងក្បួនដង្ហែបាន។ សូមស្លៀកពាក់សមរម្យ កាន់ទៀនដោយប្រុងប្រយ័ត្ន និងដើរតាមប្រជាជនក្នុងតំបន់។"}}, {"id": "f1", "when": {"en": "Mid-April", "km": "ពាក់កណ្ដាលខែមេសា"}, "title": {"en": "Khmer New Year (Chaul Chnam Thmey)", "km": "ពិធីបុណ្យចូលឆ្នាំថ្មី"}, "text": {"en": "Three days of family visits, pagoda offerings, water splashing and traditional games like bos angkunh and chol chhoung. Cities empty out as everyone heads home to their province.", "km": "បីថ្ងៃនៃការជួបជុំគ្រួសារ ការធ្វើបុណ្យនៅវត្ត ការបាញ់ទឹក និងល្បែងប្រជាប្រិយ ដូចជាបោះអង្គុញ និងចោលឈូង។ ទីក្រុងនានាស្ងាត់ ព្រោះមនុស្សគ្រប់គ្នាត្រឡប់ទៅស្រុកកំណើត។"}, "q": "Khmer New Year Angkor", "body": {"en": "Khmer New Year, Chaul Chnam Thmey, marks the end of the harvest and the start of the new year in the traditional Khmer calendar, just before the rains return. It falls in mid-April, when the sun enters the sign of Aries, and each year a new guardian angel, a tevoda, is welcomed to watch over the land.\n\nThe three days are Maha Sangkran, the day the new angel arrives, Virak Vanabat, a day of giving, and Virak Loeung Sak, when the new year truly begins.", "km": "ចូលឆ្នាំខ្មែរ ឬបុណ្យចូលឆ្នាំថ្មី សម្គាល់ការបញ្ចប់រដូវច្រូតកាត់ និងការចាប់ផ្ដើមឆ្នាំថ្មីតាមប្រតិទិនខ្មែរបុរាណ មុនពេលរដូវភ្លៀងវិលត្រឡប់មកវិញ។ បុណ្យនេះត្រូវនឹងពាក់កណ្ដាលខែមេសា នៅពេលព្រះអាទិត្យចូលរាសីមេស ហើយជារៀងរាល់ឆ្នាំ ប្រជាជនទទួលទេវតាឆ្នាំថ្មីមួយអង្គ មកថែរក្សាទឹកដី។\n\nបីថ្ងៃនៃបុណ្យនេះ គឺថ្ងៃមហាសង្ក្រាន្ត ជាថ្ងៃទទួលទេវតាថ្មី ថ្ងៃវារៈវ័នបត ជាថ្ងៃធ្វើទាន និងថ្ងៃវារៈឡើងស័ក ជាថ្ងៃចាប់ផ្ដើមឆ្នាំថ្មីពិតប្រាកដ។"}, "how": {"en": "Families clean and decorate their homes and set up an offering table with fruit, flowers, candles and incense to welcome the new angel. We go to the pagoda to bring food to the monks, build sand mountains, phnom khsach, in the temple grounds, and listen to blessings. On the last day, Buddha statues are bathed with scented water, and younger people gently wash the hands and feet of parents and elders to ask for their blessing. In between there is plenty of fun: water and powder splashing, and traditional games such as bos angkunh, chol chhoung and tug of war.", "km": "គ្រួសារនានាសម្អាត និងតុបតែងផ្ទះ ហើយរៀបចំតុគ្រឿងសក្ការៈ មានផ្លែឈើ ផ្កា ទៀន និងធូប ដើម្បីទទួលទេវតាឆ្នាំថ្មី។ យើងទៅវត្តប្រគេនចង្ហាន់ដល់ព្រះសង្ឃ ពូនភ្នំខ្សាច់នៅក្នុងទីធ្លាវត្ត និងស្ដាប់ព្រះសង្ឃសូត្រឱ្យពរ។ នៅថ្ងៃចុងក្រោយ គេស្រង់ព្រះពុទ្ធរូបដោយទឹកអប់ ហើយកូនចៅស្រង់ទឹកលាងដៃជើងឪពុកម្ដាយ និងចាស់ទុំ ដើម្បីសុំសេចក្ដីសុខ និងពរជ័យ។ ក្នុងចន្លោះនោះ មានការសប្បាយរីករាយជាច្រើន ដូចជាការបាញ់ទឹក លាបម្សៅ និងល្បែងប្រជាប្រិយ ដូចជាបោះអង្គុញ ចោលឈូង និងទាញព្រ័ត្រ។"}, "where": {"en": "Village pagodas anywhere in the country give the most authentic experience. In Siem Reap, the Angkor Sankranta festival brings games, music and performances to the Angkor area during the holiday.", "km": "វត្តអារាមតាមភូមិនានានៅទូទាំងប្រទេស ផ្ដល់បទពិសោធន៍ដ៏ពិតប្រាកដបំផុត។ នៅខេត្តសៀមរាប ពិធីអង្គរសង្ក្រាន្ត នាំមកនូវល្បែងប្រជាប្រិយ តន្ត្រី និងការសម្ដែងនានា នៅតំបន់អង្គរ ក្នុងអំឡុងថ្ងៃបុណ្យ។"}, "tip": {"en": "Expect to get wet, so keep your phone and passport in a waterproof bag, and book transport early because buses and taxis fill up as people travel home.", "km": "ត្រៀមខ្លួនឱ្យទទឹកទឹក ដូច្នេះគួរដាក់ទូរសព្ទ និងលិខិតឆ្លងដែនក្នុងថង់ការពារទឹក ហើយកក់មធ្យោបាយធ្វើដំណើរឱ្យបានមុន ព្រោះឡានក្រុង និងតាក់ស៊ីពេញអស់ ពេលមនុស្សនាំគ្នាត្រឡប់ទៅស្រុកកំណើត។"}}, {"id": "f2", "when": {"en": "May", "km": "ខែឧសភា"}, "title": {"en": "Visak Bochea", "km": "ពិធីបុណ្យវិសាខបូជា"}, "text": {"en": "The holiest Buddhist day of the year marks the birth, enlightenment and passing of the Buddha. Families bring food to the monks in the morning and join candle-lit processions around the pagoda in the evening.", "km": "ថ្ងៃដ៏សំខាន់បំផុតនៃព្រះពុទ្ធសាសនា រំលឹកដល់ការប្រសូត ការត្រាស់ដឹង និងការបរិនិព្វានរបស់ព្រះពុទ្ធ។ គ្រួសារនានាប្រគេនចង្ហាន់ដល់ព្រះសង្ឃពេលព្រឹក ហើយចូលរួមដង្ហែទៀនជុំវិញព្រះវិហារពេលល្ងាច។"}, "q": "Visak Bochea Cambodia pagoda", "body": {"en": "Visak Bochea falls on the full moon of the month of Pisak and is the most important day in the Buddhist year. It remembers three events in the life of the Buddha: his birth, his enlightenment and his passing into nirvana, which tradition says all took place on this same full-moon day.\n\nFor Cambodians, where Theravada Buddhism is the state religion, it is a day of reflection, merit-making and gratitude.", "km": "ពិធីបុណ្យវិសាខបូជា ត្រូវនឹងថ្ងៃពេញបូណ៌មីខែពិសាខ ហើយជាថ្ងៃដ៏សំខាន់បំផុតក្នុងឆ្នាំនៃព្រះពុទ្ធសាសនា។ បុណ្យនេះរំលឹកដល់ព្រឹត្តិការណ៍បីក្នុងព្រះជន្មរបស់ព្រះពុទ្ធ គឺការប្រសូត ការត្រាស់ដឹង និងការចូលបរិនិព្វាន ដែលតាមជំនឿ បានកើតឡើងនៅថ្ងៃពេញបូណ៌មីដូចគ្នា។\n\nសម្រាប់ប្រជាជនខ្មែរ ដែលព្រះពុទ្ធសាសនាថេរវាទជាសាសនារបស់រដ្ឋ នេះជាថ្ងៃនៃការពិចារណា ការធ្វើបុណ្យ និងការដឹងគុណ។"}, "how": {"en": "In the morning, families dress in white or neat clothes and bring food and offerings to the monks at their local pagoda. Many people observe the precepts for the day, listen to sermons and meditate. In the evening, people walk three times around the vihara holding candles, incense and lotus flowers, a quiet and beautiful procession. Some also release birds or fish as an act of compassion.", "km": "នៅពេលព្រឹក គ្រួសារនានាស្លៀកពាក់ពណ៌ស ឬសម្លៀកបំពាក់សមរម្យ ហើយនាំចង្ហាន់ និងទេយ្យវត្ថុទៅប្រគេនព្រះសង្ឃនៅវត្តក្នុងភូមិ។ មនុស្សជាច្រើនសមាទានសីល ស្ដាប់ធម៌ទេសនា និងធ្វើសមាធិ។ នៅពេលល្ងាច ពុទ្ធបរិស័ទកាន់ទៀន ធូប និងផ្កាឈូក ដើរវង់ព្រះវិហារបីជុំ ជាក្បួនដង្ហែដ៏ស្ងប់ស្ងាត់ និងស្រស់ស្អាត។ អ្នកខ្លះក៏លែងសត្វស្លាប ឬត្រី ជាការបង្ហាញសេចក្ដីមេត្តាករុណាផងដែរ។"}, "where": {"en": "Any pagoda is welcoming on this night, from the city temples of Phnom Penh to small village wats. Oudong, the former royal capital north of Phnom Penh, is known for its large gatherings of monks and lay people.", "km": "វត្តណាមួយក៏ស្វាគមន៍ពុទ្ធបរិស័ទនៅយប់នេះដែរ ចាប់ពីវត្តក្នុងទីក្រុងភ្នំពេញ រហូតដល់វត្តតូចៗតាមភូមិ។ ឧដុង្គ ដែលជាអតីតរាជធានីនៅខាងជើងភ្នំពេញ ល្បីល្បាញដោយការជួបជុំគ្នាយ៉ាងច្រើនកុះករ របស់ព្រះសង្ឃ និងពុទ្ធបរិស័ទ។"}, "tip": {"en": "Wear clothes that cover your shoulders and knees, take off your shoes before entering the vihara, and walk the candle procession quietly behind the local people.", "km": "សូមស្លៀកពាក់គ្របស្មា និងជង្គង់ ដោះស្បែកជើងមុនចូលព្រះវិហារ ហើយដើរក្នុងក្បួនដង្ហែទៀនដោយស្ងៀមស្ងាត់ នៅពីក្រោយប្រជាជនក្នុងតំបន់។"}}, {"id": "f8", "when": {"en": "May", "km": "ខែឧសភា"}, "title": {"en": "Royal Ploughing Ceremony (Bon Chroat Preah Nongkoal)", "km": "ព្រះរាជពិធីច្រត់ព្រះនង្គ័ល"}, "q": "Royal Ploughing Ceremony Cambodia", "text": {"en": "This royal ceremony opens the rice-planting season. After the ceremonial ploughing, the royal oxen are offered trays of rice, corn, beans, sesame, grass, water and wine. What they choose to eat is read as a forecast for the coming harvest.", "km": "ព្រះរាជពិធីនេះ បើករដូវដាំដុះស្រូវ។ ក្រោយពិធីភ្ជួរ គោឧសភរាជត្រូវបានគេជូនថាសស្រូវ ពោត សណ្ដែក ល្ង ស្មៅ ទឹក និងស្រា។ អ្វីដែលគោជ្រើសរើសបរិភោគ ត្រូវបានគេយកមកទស្សន៍ទាយផលដំណាំនាពេលខាងមុខ។"}, "body": {"en": "The Royal Ploughing Ceremony, Preah Reach Pithi Chroat Preah Nongkoal, is an ancient royal rite that marks the start of the rice-growing season. It is held in the month of Pisak, when the first rains arrive, to bring good fortune to farmers across the kingdom.\n\nThe ceremony expresses the deep bond between the monarchy, the land and the rice farmers who feed the nation.", "km": "ព្រះរាជពិធីច្រត់ព្រះនង្គ័ល ជាព្រះរាជពិធីបុរាណ ដែលសម្គាល់ការចាប់ផ្ដើមរដូវដាំដុះស្រូវ។ ព្រះរាជពិធីនេះប្រារព្ធឡើងក្នុងខែពិសាខ នៅពេលភ្លៀងដំបូងមកដល់ ដើម្បីនាំមកនូវសិរីសួស្ដីដល់កសិករទូទាំងព្រះរាជាណាចក្រ។\n\nព្រះរាជពិធីនេះ បង្ហាញពីចំណងដ៏ជ្រាលជ្រៅ រវាងរាជបល្ល័ង្ក ទឹកដី និងកសិករស្រូវ ដែលចិញ្ចឹមជាតិ។"}, "how": {"en": "The King presides over the ceremony. A man chosen to play the role of Sdech Meak guides the royal oxen and plough around the field, while a woman as Preah Mehsey follows and scatters rice seed. The oxen are then led to seven golden trays holding rice, corn, beans, sesame, grass, water and wine. Royal astrologers read what the oxen eat as a forecast: rice or corn promises a good harvest, while choosing wine is taken as a warning. Farmers often collect the scattered seed afterwards, believing it brings luck to their own fields.", "km": "ព្រះមហាក្សត្រ ទ្រង់យាងជាអធិបតីក្នុងព្រះរាជពិធី។ បុរសម្នាក់ដែលត្រូវបានជ្រើសរើសឱ្យដើរតួជាស្ដេចមាឃ បររទេះគោឧសភរាជ និងនង្គ័លជុំវិញវាល ហើយស្ត្រីម្នាក់ក្នុងតួជាព្រះមេហ្សី ដើរតាមក្រោយ និងព្រួសគ្រាប់ពូជស្រូវ។ បន្ទាប់មក គោឧសភរាជត្រូវបានដឹកទៅកាន់ថាសមាសទាំងប្រាំពីរ ដែលមានស្រូវ ពោត សណ្ដែក ល្ង ស្មៅ ទឹក និងស្រា។ ហោរាហ្លួងទស្សន៍ទាយតាមអ្វីដែលគោបរិភោគ៖ ស្រូវ ឬពោត ជាសញ្ញានៃផលដំណាំល្អ ចំណែកការជ្រើសរើសស្រា ត្រូវបានចាត់ទុកជាការព្រមាន។ ក្រោយពិធី កសិករច្រើនតែប្រមូលគ្រាប់ពូជដែលបានព្រួស ដោយជឿថា វានាំសំណាងល្អដល់ស្រែរបស់ខ្លួន។"}, "where": {"en": "The ceremony has traditionally been held at Veal Preah Meru, the royal field beside the National Museum in Phnom Penh, and in some years it takes place in a province. Check the local news for the year's location.", "km": "ព្រះរាជពិធីនេះ ជាប្រពៃណីប្រារព្ធឡើងនៅវាលព្រះមេរុ ក្បែរសារមន្ទីរជាតិ ក្នុងរាជធានីភ្នំពេញ ហើយក្នុងឆ្នាំខ្លះ ប្រារព្ធនៅតាមខេត្ត។ សូមតាមដានព័ត៌មានក្នុងស្រុក ដើម្បីដឹងពីទីតាំងប្រចាំឆ្នាំ។"}, "tip": {"en": "Arrive early in the morning, as the ceremony starts soon after sunrise and security areas fill quickly; dress respectfully for a royal event.", "km": "សូមមកដល់ពីព្រឹកព្រលឹម ព្រោះព្រះរាជពិធីចាប់ផ្ដើមភ្លាមៗក្រោយថ្ងៃរះ ហើយតំបន់សន្តិសុខឆាប់ពេញមនុស្ស។ សូមស្លៀកពាក់គួរសមសម្រាប់ព្រះរាជពិធី។"}}, {"id": "f3", "when": {"en": "September – October", "km": "ខែកញ្ញា – តុលា"}, "title": {"en": "Pchum Ben", "km": "ពិធីបុណ្យភ្ជុំបិណ្ឌ"}, "text": {"en": "Fifteen days when Cambodians honour their ancestors. Before dawn, families bring rice balls and food to the pagodas so the spirits of the dead are fed. The final days are a national holiday.", "km": "ដប់ប្រាំថ្ងៃ ដែលប្រជាជនខ្មែរឧទ្ទិសដល់ដូនតា។ មុនថ្ងៃរះ គ្រួសារនាំបាយបិណ្ឌ និងម្ហូបទៅវត្ត ដើម្បីឧទ្ទិសដល់វិញ្ញាណក្ខន្ធអ្នកស្លាប់។ ថ្ងៃចុងក្រោយ ជាថ្ងៃឈប់សម្រាកជាតិ។"}, "q": "Pchum Ben pagoda", "body": {"en": "Pchum Ben is one of the most important religious festivals in Cambodia, a time to remember and care for the spirits of our ancestors. It lasts fifteen days in the month of Photrobot: the first fourteen days are Kan Ben, when families take turns bringing offerings to the pagoda, and the fifteenth day is Pchum Ben, which means gathering of rice-ball offerings.\n\nKhmer belief holds that during this period the gates of the spirit world open, and the dead return looking for food and merit from their living relatives.", "km": "ពិធីបុណ្យភ្ជុំបិណ្ឌ ជាបុណ្យសាសនាដ៏សំខាន់បំផុតមួយនៅកម្ពុជា ជាពេលវេលាដើម្បីនឹករលឹក និងឧទ្ទិសកុសលដល់វិញ្ញាណក្ខន្ធដូនតា។ បុណ្យនេះមានរយៈពេលដប់ប្រាំថ្ងៃក្នុងខែភទ្របទ៖ ដប់បួនថ្ងៃដំបូង ជាថ្ងៃកាន់បិណ្ឌ ដែលគ្រួសារនានាវេនគ្នានាំភត្តាហារទៅវត្ត ហើយថ្ងៃទីដប់ប្រាំ ជាថ្ងៃភ្ជុំបិណ្ឌ ដែលមានន័យថា ការប្រមូលផ្ដុំបាយបិណ្ឌ។\n\nតាមជំនឿខ្មែរ ក្នុងអំឡុងពេលនេះ ទ្វារនរកបើក ហើយវិញ្ញាណក្ខន្ធអ្នកស្លាប់ត្រឡប់មកស្វែងរកអាហារ និងកុសលពីញាតិមិត្តដែលនៅរស់។"}, "how": {"en": "Before dawn, people go to the pagoda and toss small balls of sticky rice, bay ben, around the vihara for wandering spirits, while monks chant. Later in the morning, families offer food to the monks and dedicate the merit to their ancestors. Many families try to visit several pagodas during the festival, and children dress up and help carry the food. It is also a time for the whole family to come home, share meals and make cakes such as num ansom.", "km": "មុនថ្ងៃរះ ប្រជាជនទៅវត្ត ហើយបោះបាយបិណ្ឌ ដែលជាដុំបាយដំណើបតូចៗ ជុំវិញព្រះវិហារ ដើម្បីឧទ្ទិសដល់វិញ្ញាណក្ខន្ធ ខណៈព្រះសង្ឃសូត្រមន្ត។ នៅពេលព្រឹកបន្ទាប់មក គ្រួសារនានាប្រគេនចង្ហាន់ដល់ព្រះសង្ឃ ហើយឧទ្ទិសកុសលដល់ដូនតា។ គ្រួសារជាច្រើនព្យាយាមទៅវត្តច្រើនកន្លែងក្នុងអំឡុងបុណ្យ ហើយកូនក្មេងស្លៀកពាក់ស្អាត ជួយកាន់ចំណីអាហារ។ នេះក៏ជាពេលដែលគ្រួសារទាំងមូលត្រឡប់មកផ្ទះវិញ ជួបជុំបរិភោគអាហារជាមួយគ្នា និងធ្វើនំ ដូចជានំអន្សម។"}, "where": {"en": "The heart of Pchum Ben is in the pagodas, especially in the provinces where families return home. Come early in the morning, before sunrise, to see the bay ben offerings at any local wat.", "km": "បេះដូងនៃបុណ្យភ្ជុំបិណ្ឌ គឺនៅតាមវត្តអារាម ជាពិសេសនៅតាមខេត្ត ដែលគ្រួសារនានាត្រឡប់ទៅស្រុកកំណើត។ សូមមកពីព្រលឹម មុនថ្ងៃរះ ដើម្បីទស្សនាការបោះបាយបិណ្ឌ នៅវត្តណាមួយក្នុងតំបន់។"}, "tip": {"en": "The last days are a public holiday, so many shops and offices close and roads out of Phnom Penh are very busy; dress modestly and ask before taking photos at the pagoda.", "km": "ថ្ងៃចុងក្រោយ ជាថ្ងៃឈប់សម្រាកសាធារណៈ ដូច្នេះហាង និងការិយាល័យជាច្រើនបិទ ហើយផ្លូវចេញពីភ្នំពេញមានការកកស្ទះខ្លាំង។ សូមស្លៀកពាក់សមរម្យ និងសុំការអនុញ្ញាតមុនថតរូបនៅក្នុងវត្ត។"}}, {"id": "f6", "when": {"en": "October – November", "km": "ខែតុលា – វិច្ឆិកា"}, "title": {"en": "Kathen Ceremony", "km": "ពិធីបុណ្យកឋិនទាន"}, "q": "Kathina ceremony Cambodia", "text": {"en": "After the rainy-season retreat, villages march to the pagoda with music and dancing to offer new robes and gifts to the monks. Each pagoda can receive Kathen only once a year.", "km": "ក្រោយការចូលព្រះវស្សា ភូមិនានាហែក្បួនទៅវត្ត ជាមួយភ្លេង និងរបាំ ដើម្បីប្រគេនស្បង់ចីវរថ្មី និងទេយ្យវត្ថុដល់ព្រះសង្ឃ។ វត្តនីមួយៗ អាចទទួលកឋិនបានតែម្ដងក្នុងមួយឆ្នាំ។"}, "body": {"en": "Kathen is the season of offering robes to monks after the three-month rainy-season retreat, Preah Vassa. It runs for twenty-nine days, from the first day of the waning moon of Assoch to the full moon of Kadeuk.\n\nThe offering of new robes is a great act of merit, and because each pagoda may receive Kathen only once a year, the community works together to prepare it.", "km": "ពិធីបុណ្យកឋិនទាន ជារដូវនៃការប្រគេនស្បង់ចីវរដល់ព្រះសង្ឃ ក្រោយការគង់ចាំព្រះវស្សារយៈពេលបីខែ។ បុណ្យនេះមានរយៈពេលម្ភៃប្រាំបួនថ្ងៃ ចាប់ពីថ្ងៃ១រោច ខែអស្សុជ ដល់ថ្ងៃពេញបូណ៌មីខែកត្ដិក។\n\nការប្រគេនស្បង់ចីវរថ្មី ជាកុសលដ៏ធំ ហើយដោយសារវត្តនីមួយៗអាចទទួលកឋិនបានតែម្ដងក្នុងមួយឆ្នាំ សហគមន៍ទាំងមូលរួមគ្នារៀបចំពិធីនេះ។"}, "how": {"en": "A family or group of villagers acts as host, collecting robes, household items and money for the pagoda. On the evening before, there is often music, chanting and a celebration at the host's home or the pagoda. The next morning, the procession sets off with traditional music and dancing, carrying the robes and gifts, and circles the vihara before presenting them to the monks. The monks then formally accept the Kathen robe and bless the community.", "km": "គ្រួសារមួយ ឬក្រុមអ្នកភូមិ ធ្វើជាម្ចាស់កឋិន ដោយប្រមូលស្បង់ចីវរ គ្រឿងប្រើប្រាស់ និងថវិកាសម្រាប់វត្ត។ នៅល្ងាចមុនថ្ងៃបុណ្យ ច្រើនតែមានភ្លេង ការសូត្រមន្ត និងការប្រារព្ធនៅផ្ទះម្ចាស់កឋិន ឬនៅវត្ត។ ព្រឹកបន្ទាប់ ក្បួនដង្ហែចេញដំណើរជាមួយភ្លេងប្រពៃណី និងរបាំ ដោយកាន់ស្បង់ចីវរ និងទេយ្យវត្ថុ ហើយដើរវង់ព្រះវិហារ មុនប្រគេនដល់ព្រះសង្ឃ។ បន្ទាប់មក ព្រះសង្ឃទទួលកឋិនជាផ្លូវការ និងសូត្រមន្តឱ្យពរដល់សហគមន៍។"}, "where": {"en": "Kathen processions can be seen at pagodas all over Cambodia throughout the season, most often on weekends. Ask a local guide or your guesthouse which wat nearby is holding its ceremony.", "km": "ក្បួនដង្ហែកឋិន អាចទស្សនាបាននៅវត្តនានាទូទាំងប្រទេសកម្ពុជា ពេញមួយរដូវ ភាគច្រើននៅថ្ងៃចុងសប្ដាហ៍។ សូមសួរមគ្គុទ្ទេសក៍ក្នុងតំបន់ ឬផ្ទះសំណាក់របស់អ្នក ថាវត្តណានៅក្បែរនោះកំពុងរៀបចំពិធី។"}, "tip": {"en": "If a procession blocks the road, be patient and enjoy the music; visitors are usually welcome to watch and even make a small offering.", "km": "ប្រសិនបើក្បួនដង្ហែបិទផ្លូវ សូមអត់ធ្មត់ ហើយរីករាយជាមួយតន្ត្រី។ ជាធម្មតា ភ្ញៀវត្រូវបានស្វាគមន៍ឱ្យទស្សនា និងអាចចូលរួមបរិច្ចាគបន្តិចបន្តួចផងដែរ។"}}, {"id": "f4", "when": {"en": "November full moon", "km": "ពេញបូណ៌មីខែកត្ដិក"}, "title": {"en": "Water Festival (Bon Om Touk)", "km": "ពិធីបុណ្យអុំទូក"}, "text": {"en": "Long boats with dozens of paddlers race on the Tonle Sap river in front of the Royal Palace in Phnom Penh, celebrating the river changing direction. Nights bring illuminated floats and the salute to the moon, Sampeah Preah Khae, with ambok (flattened rice).", "km": "ទូកងដែលមានអ្នកចែវរាប់សិបនាក់ ប្រណាំងគ្នានៅលើទន្លេសាប មុខព្រះបរមរាជវាំងនៅភ្នំពេញ ដើម្បីអបអរការប្ដូរទិសដៅហូររបស់ទន្លេ។ ពេលយប់មានបណ្ដែតប្រទីប និងពិធីសំពះព្រះខែ អកអំបុក។"}, "q": "Bon Om Touk boat race", "body": {"en": "Bon Om Touk, the Water Festival, is held over three days around the full moon of the month of Kadeuk. It celebrates the time when the Tonle Sap river reverses its flow and begins to drain from the great lake back into the Mekong, bringing fish and fertile soil to the land.\n\nThe boat races recall the strength of the Khmer naval fleets of the past, and the festival is also a time to give thanks to the moon and the waters for a good harvest.", "km": "ពិធីបុណ្យអុំទូក បណ្ដែតប្រទីប សំពះព្រះខែ និងអកអំបុក ប្រារព្ធឡើងរយៈពេលបីថ្ងៃ នៅជុំវិញថ្ងៃពេញបូណ៌មីខែកត្ដិក។ បុណ្យនេះអបអរពេលវេលាដែលទន្លេសាបប្ដូរទិសហូរ ហើយទឹកចាប់ផ្ដើមស្រកពីបឹងទន្លេសាប ហូរចូលទន្លេមេគង្គវិញ ដោយនាំមកនូវត្រី និងដីល្បាប់មានជីជាតិ។\n\nការប្រណាំងទូករំលឹកដល់កម្លាំងនៃកងទ័ពជើងទឹកខ្មែរកាលពីអតីតកាល ហើយបុណ្យនេះក៏ជាពេលដើម្បីដឹងគុណព្រះខែ និងទឹក ចំពោះផលដំណាំដ៏ល្អផងដែរ។"}, "how": {"en": "By day, long wooden boats from pagodas and provinces across the country race in pairs, with dozens of paddlers rowing to the beat of the boat leader. At night, illuminated floats glide along the river and fireworks light up the sky. On the full-moon night, families perform Sampeah Preah Khae, saluting the moon with offerings, and then eat ak ambok, flattened rice mixed with banana and coconut. Riverside streets fill with food stalls, music and crowds from every province.", "km": "ពេលថ្ងៃ ទូកងដែលមកពីវត្ត និងខេត្តនានាទូទាំងប្រទេស ប្រណាំងគ្នាម្ដងមួយគូ ដោយមានអ្នកចែវរាប់សិបនាក់ ចែវតាមចង្វាក់របស់មេទូក។ ពេលយប់ មានបណ្ដែតប្រទីបពណ៌ចម្រុះលើទន្លេ និងកាំជ្រួចបំភ្លឺមេឃ។ នៅយប់ពេញបូណ៌មី គ្រួសារនានាធ្វើពិធីសំពះព្រះខែ ដោយរៀបចំគ្រឿងសក្ការៈ ហើយបន្ទាប់មកអកអំបុក លាយជាមួយចេក និងដូង។ ផ្លូវមាត់ទន្លេពោរពេញដោយតូបលក់ម្ហូប តន្ត្រី និងភ្ញៀវមកពីគ្រប់ខេត្ត។"}, "where": {"en": "The main races take place on the Tonle Sap river in front of the Royal Palace in Phnom Penh, and Sisowath Quay is the best place to watch. Boat races are also held in Siem Reap and in other riverside provinces.", "km": "ការប្រណាំងទូកសំខាន់ ធ្វើឡើងនៅលើទន្លេសាប មុខព្រះបរមរាជវាំងក្នុងរាជធានីភ្នំពេញ ហើយមាត់ទន្លេស៊ីសុវត្ថិ ជាកន្លែងល្អបំផុតសម្រាប់ទស្សនា។ ការប្រណាំងទូកក៏ធ្វើឡើងនៅខេត្តសៀមរាប និងខេត្តផ្សេងៗដែលនៅជាប់មាត់ទន្លេផងដែរ។"}, "tip": {"en": "Crowds along the riverside are very large, so arrive early, agree on a meeting point with your group, and keep valuables close.", "km": "ហ្វូងមនុស្សនៅមាត់ទន្លេច្រើនកុះករ ដូច្នេះសូមមកដល់ឱ្យបានឆាប់ កំណត់កន្លែងជួបគ្នាជាមួយក្រុម និងរក្សាទ្រព្យសម្បត្តិឱ្យជិតខ្លួន។"}}, {"id": "f7", "when": {"en": "9 November", "km": "ថ្ងៃទី ៩ ខែវិច្ឆិកា"}, "title": {"en": "Independence Day", "km": "ទិវាបុណ្យឯករាជ្យជាតិ"}, "q": "Independence Monument Phnom Penh", "text": {"en": "Cambodia celebrates independence from France (1953) with a ceremony at the Independence Monument in Phnom Penh, a lotus-shaped tower lit up at night.", "km": "កម្ពុជាប្រារព្ធទិវាឯករាជ្យពីបារាំង (ឆ្នាំ ១៩៥៣) ដោយមានពិធីនៅវិមានឯករាជ្យក្នុងភ្នំពេញ ដែលជាប្រាង្គរាងផ្កាឈូក បំភ្លឺភ្លើងពេលយប់។"}, "body": {"en": "On 9 November 1953, Cambodia gained full independence from France, after a campaign led by King Norodom Sihanouk. Independence Day honours this achievement and all those who worked for a free and sovereign nation.\n\nThe Independence Monument in Phnom Penh, a lotus-shaped tower built in the style of Angkor, stands as the national symbol of this day.", "km": "នៅថ្ងៃទី ៩ ខែវិច្ឆិកា ឆ្នាំ ១៩៥៣ កម្ពុជាទទួលបានឯករាជ្យពេញលេញពីប្រទេសបារាំង ក្រោយបេសកកម្មដឹកនាំដោយព្រះករុណា ព្រះបាទ នរោត្តម សីហនុ។ ទិវាបុណ្យឯករាជ្យជាតិ គោរពដល់សមិទ្ធផលនេះ និងអស់អ្នកដែលបានតស៊ូដើម្បីជាតិមួយដែលមានសេរីភាព និងអធិបតេយ្យភាព។\n\nវិមានឯករាជ្យនៅរាជធានីភ្នំពេញ ដែលជាប្រាង្គរាងផ្កាឈូកតាមរចនាបថអង្គរ គឺជានិមិត្តរូបជាតិនៃទិវានេះ។"}, "how": {"en": "The main ceremony is held in the morning at the Independence Monument, where the King lights the victory flame in the presence of senior leaders, monks and members of the armed forces. Flags fly across the country, and the monument and nearby boulevards are lit up at night. For most families it is a quiet public holiday, often falling close to the Water Festival.", "km": "ពិធីសំខាន់ ធ្វើឡើងនៅពេលព្រឹក នៅវិមានឯករាជ្យ ដែលព្រះមហាក្សត្រទ្រង់អុជភ្លើងជ័យ ក្នុងវត្តមានថ្នាក់ដឹកនាំជាន់ខ្ពស់ ព្រះសង្ឃ និងកងកម្លាំងប្រដាប់អាវុធ។ ទង់ជាតិត្រូវបានលើកនៅទូទាំងប្រទេស ហើយវិមាន និងមហាវិថីក្បែរនោះ ត្រូវបានបំភ្លឺភ្លើងនៅពេលយប់។ សម្រាប់គ្រួសារភាគច្រើន នេះជាថ្ងៃឈប់សម្រាកសាធារណៈដ៏ស្ងប់ស្ងាត់ ដែលច្រើនតែជិតនឹងពិធីបុណ្យអុំទូក។"}, "where": {"en": "Independence Monument on Norodom Boulevard in Phnom Penh is the focus of the day, and it is especially beautiful when lit up in the evening. It is a public holiday nationwide.", "km": "វិមានឯករាជ្យ នៅលើមហាវិថីព្រះនរោត្តម ក្នុងរាជធានីភ្នំពេញ ជាចំណុចកណ្ដាលនៃទិវានេះ ហើយមានភាពស្រស់ស្អាតជាពិសេស នៅពេលបំភ្លឺភ្លើងនាពេលល្ងាច។ នេះជាថ្ងៃឈប់សម្រាកសាធារណៈទូទាំងប្រទេស។"}, "tip": {"en": "Roads around the monument are closed during the morning ceremony, so plan to visit later in the day or in the evening.", "km": "ផ្លូវជុំវិញវិមាន ត្រូវបានបិទក្នុងពេលពិធីនៅពេលព្រឹក ដូច្នេះសូមគ្រោងទៅទស្សនានៅពេលក្រោយ ឬនៅពេលល្ងាច។"}}, {"id": "f9", "when": {"en": "After the harvest, December – February", "km": "ក្រោយរដូវច្រូតកាត់ ខែធ្នូ – កុម្ភៈ"}, "title": {"en": "Khmer Kite Festival (Khleng Ek)", "km": "ពិធីបុណ្យបង្ហោះខ្លែងអេក"}, "q": "Khleng ek kite Cambodia", "text": {"en": "When the rice is in, families fly the khleng ek, a kite fitted with a bow that hums in the wind. Its song is a thank-you for the harvest and a prayer for good rain in the year ahead.", "km": "ក្រោយការប្រមូលផលស្រូវ គ្រួសារនានាបង្ហោះខ្លែងអេក ដែលមានធ្នូបន្លឺសំឡេងនៅពេលត្រូវខ្យល់។ សំឡេងរបស់វា ជាការអរគុណចំពោះផលដំណាំ និងជាការបួងសួងសុំភ្លៀងល្អនៅឆ្នាំខាងមុខ។"}, "body": {"en": "The khleng ek is a traditional Khmer kite fitted with a bow, ek, made of a thin strip of bamboo or rattan and a taut string that hums when the wind blows. Flying it is an old custom of the dry season after the rice harvest, when the winds are strong and the fields are empty.\n\nIn Khmer belief, the song of the kite thanks the spirits for the harvest and calls for good rain and good fortune in the year to come.", "km": "ខ្លែងអេក ជាខ្លែងប្រពៃណីខ្មែរ ដែលមានភ្ជាប់អេក ធ្វើពីបន្ទះឫស្សី ឬផ្ដៅស្ដើង និងខ្សែតឹង ដែលបន្លឺសំឡេងនៅពេលត្រូវខ្យល់។ ការបង្ហោះខ្លែងអេក ជាទំនៀមទម្លាប់ចាស់ក្នុងរដូវប្រាំង ក្រោយរដូវច្រូតកាត់ នៅពេលខ្យល់បក់ខ្លាំង និងវាលស្រែទំនេរ។\n\nតាមជំនឿខ្មែរ សំឡេងខ្លែងជាការថ្លែងអំណរគុណដល់អារក្សអ្នកតា ចំពោះផលដំណាំ និងជាការបួងសួងសុំទឹកភ្លៀងល្អ និងសំណាងល្អសម្រាប់ឆ្នាំខាងមុខ។"}, "how": {"en": "Villagers build their kites by hand from bamboo and paper or cloth, and the skill of making a good ek is passed down in families. In the late afternoon and evening, people fly the kites over the open rice fields, and some leave them up through the night so the humming carries across the village. Neighbours compare kites and gather to enjoy the sound together, and local kite contests are sometimes organised.", "km": "អ្នកភូមិធ្វើខ្លែងដោយដៃ ពីឫស្សី និងក្រដាស ឬក្រណាត់ ហើយជំនាញធ្វើអេកឱ្យល្អ ត្រូវបានបន្តពីជំនាន់មួយទៅជំនាន់មួយក្នុងគ្រួសារ។ នៅពេលរសៀល និងពេលល្ងាច ប្រជាជនបង្ហោះខ្លែងលើវាលស្រែទំនេរ ហើយអ្នកខ្លះទុកខ្លែងនៅលើមេឃពេញមួយយប់ ដើម្បីឱ្យសំឡេងបន្លឺពាសពេញភូមិ។ អ្នកជិតខាងប្រៀបធៀបខ្លែងគ្នា និងជួបជុំគ្នាស្ដាប់សំឡេងខ្លែង ហើយពេលខ្លះ ក៏មានការប្រកួតបង្ហោះខ្លែងនៅតាមមូលដ្ឋានផងដែរ។"}, "where": {"en": "The best place is the countryside, where open rice fields stretch out after the harvest; on a drive through the provinces in the dry season you will often hear the kites before you see them.", "km": "កន្លែងល្អបំផុត គឺនៅជនបទ ដែលវាលស្រែទំនេរលាតសន្ធឹងក្រោយរដូវច្រូតកាត់។ ពេលធ្វើដំណើរកាត់តាមខេត្តនានាក្នុងរដូវប្រាំង អ្នកនឹងឮសំឡេងខ្លែង មុនពេលអ្នកឃើញវា។"}, "tip": {"en": "Stay in the countryside until evening to hear the kites at their best, and ask before walking onto someone's rice field.", "km": "សូមស្នាក់នៅជនបទរហូតដល់ពេលល្ងាច ដើម្បីស្ដាប់សំឡេងខ្លែងដ៏ពីរោះបំផុត ហើយសូមសុំការអនុញ្ញាតមុនដើរចូលស្រែរបស់គេ។"}}], "tips": [{"id": "t1", "icon": "sun", "title": {"en": "Best time to visit", "km": "ពេលល្អបំផុតក្នុងការទស្សនា"}, "text": {"en": "November to February is cool and dry, the most comfortable time for temples and travel. March to May is very hot. June to October is the green season, with short heavy rain most afternoons, fewer visitors and lush rice fields.", "km": "ខែវិច្ឆិកា ដល់ខែកុម្ភៈ ត្រជាក់ និងស្ងួត ជាពេលស្រួលបំផុតសម្រាប់ទស្សនាប្រាសាទ និងធ្វើដំណើរ។ ខែមីនា ដល់ខែឧសភា ក្ដៅខ្លាំង។ ខែមិថុនា ដល់ខែតុលា ជារដូវបៃតង មានភ្លៀងខ្លាំងខ្លីៗស្ទើររាល់រសៀល ភ្ញៀវតិច ហើយវាលស្រែខៀវស្រងាត់។"}}, {"id": "t2", "icon": "globe", "title": {"en": "Visa", "km": "ទិដ្ឋាការ"}, "text": {"en": "Many nationalities can get a tourist e-visa online before travelling, and visas on arrival are available at the main airports and border crossings. Rules and fees change, so always check the official government e-visa website before you go, and use only official sites.", "km": "ពលរដ្ឋជាច្រើនប្រទេស អាចស្នើសុំទិដ្ឋាការទេសចរណ៍អេឡិចត្រូនិកតាមអនឡាញ មុនពេលធ្វើដំណើរ ហើយក៏អាចទទួលទិដ្ឋាការនៅពេលមកដល់ នៅព្រលានយន្តហោះ និងច្រកព្រំដែនធំៗ។ ច្បាប់ និងថ្លៃសេវាអាចផ្លាស់ប្ដូរ ដូច្នេះត្រូវពិនិត្យគេហទំព័រផ្លូវការរបស់រដ្ឋាភិបាលជានិច្ច។"}}, {"id": "t3", "icon": "donate", "title": {"en": "Money", "km": "លុយកាក់"}, "text": {"en": "Cambodia uses two currencies side by side: US dollars and Khmer riel. Prices are often in dollars, and small change comes back in riel. Carry clean, untorn dollar notes, as damaged ones are often refused. ATMs are easy to find in towns; KHQR payments work at many shops.", "km": "កម្ពុជាប្រើរូបិយប័ណ្ណពីរ៖ ដុល្លារអាមេរិក និងប្រាក់រៀល។ តម្លៃច្រើនតែជាដុល្លារ ហើយលុយអាប់ជាប្រាក់រៀល។ យកក្រដាសប្រាក់ដុល្លារស្អាតមិនរហែក ព្រោះក្រដាសខូចច្រើនតែមិនទទួល។ ម៉ាស៊ីន ATM មានច្រើននៅតាមក្រុង ហើយការទូទាត់ KHQR អាចប្រើនៅហាងជាច្រើន។"}}, {"id": "t4", "icon": "temple", "title": {"en": "Temple manners", "km": "សុជីវធម៌នៅប្រាសាទ"}, "text": {"en": "Cover your shoulders and knees at Angkor and in pagodas; you may be refused entry to the upper level of Angkor Wat without it. Take off shoes before entering a pagoda hall, don't point your feet at Buddha images, and women should not touch monks or hand things to them directly.", "km": "គ្របស្មា និងជង្គង់ នៅអង្គរ និងនៅវត្ត។ បើមិនដូច្នោះ អ្នកអាចត្រូវបានហាមមិនឱ្យឡើងជាន់ខាងលើនៃអង្គរវត្ត។ ដោះស្បែកជើងមុនចូលព្រះវិហារ កុំចង្អុលជើងទៅព្រះពុទ្ធរូប ហើយស្ត្រីមិនគួរប៉ះព្រះសង្ឃ ឬហុចរបស់ទៅលោកដោយផ្ទាល់ទេ។"}}, {"id": "t5", "icon": "calendar", "title": {"en": "Angkor Pass", "km": "សំបុត្រអង្គរ"}, "text": {"en": "You need an Angkor Pass for Angkor Wat and the main temples. Passes come as 1-day, 3-day and 7-day tickets with your photo printed on them. Buy only at the official ticket centre in Siem Reap or the official online site, and keep it with you: it is checked at every temple.", "km": "អ្នកត្រូវមានសំបុត្រអង្គរ ដើម្បីចូលអង្គរវត្ត និងប្រាសាទសំខាន់ៗ។ មានសំបុត្រ ១ ថ្ងៃ ៣ ថ្ងៃ និង ៧ ថ្ងៃ ដែលបោះពុម្ពរូបថតរបស់អ្នក។ ទិញតែនៅមជ្ឈមណ្ឌលលក់សំបុត្រផ្លូវការនៅសៀមរាប ឬគេហទំព័រផ្លូវការប៉ុណ្ណោះ ហើយរក្សាវាជាមួយខ្លួន ព្រោះគេពិនិត្យនៅគ្រប់ប្រាសាទ។"}}, {"id": "t6", "icon": "car", "title": {"en": "Getting around", "km": "ការធ្វើដំណើរ"}, "text": {"en": "In towns, use tuk-tuks or ride-hailing apps such as PassApp and Grab so the price is fixed before you go. Between cities, comfortable buses and minivans run daily; for remote provinces, hiring a car with a driver is easiest.", "km": "នៅក្នុងក្រុង ប្រើរ៉ឺម៉ក ឬកម្មវិធីហៅរថយន្ត ដូចជា PassApp និង Grab ដើម្បីដឹងតម្លៃមុនចេញដំណើរ។ រវាងខេត្ត មានឡានក្រុង និងឡានតូចស្រួលជិះជារៀងរាល់ថ្ងៃ។ សម្រាប់ខេត្តដាច់ស្រយាល ការជួលរថយន្តជាមួយអ្នកបើកបរ ងាយស្រួលជាងគេ។"}}, {"id": "t7", "icon": "info", "title": {"en": "Staying safe & healthy", "km": "សុវត្ថិភាព និងសុខភាព"}, "text": {"en": "Drink bottled or filtered water, use mosquito repellent, especially at dusk, and wear a hat in the midday sun. In remote countryside near old battlefields, stay on paths that are clearly used; unexploded landmines still exist in some rural areas.", "km": "ផឹកទឹកដប ឬទឹកចម្រោះ ប្រើថ្នាំការពារមូស ជាពិសេសពេលល្ងាច ហើយពាក់មួកពេលថ្ងៃត្រង់។ នៅតំបន់ជនបទដាច់ស្រយាល ក្បែរអតីតសមរភូមិ ដើរតែលើផ្លូវដែលគេប្រើច្បាស់លាស់ ព្រោះនៅមានមីនមិនទាន់ផ្ទុះនៅតំបន់ជនបទមួយចំនួន។"}}, {"id": "t8", "icon": "chat", "title": {"en": "Khmer words that open doors", "km": "ពាក្យខ្មែរដែលបើកទ្វារ"}, "text": {"en": "Hello: sues-dey (សួស្ដី)\nThank you: or-kun (អរគុណ)\nHow much?: thlai ponmaan? (ថ្លៃប៉ុន្មាន?)\nDelicious: chnganh (ឆ្ងាញ់)\nGoodbye: lea suen hai (លាសិនហើយ)\n\nA smile and a sampeah (palms together, a small bow) go a long way.", "km": "ជាមួយភ្ញៀវបរទេស អ្នកអាចបង្រៀនពាក្យទាំងនេះ៖\nសួស្ដី — Hello\nអរគុណ — Thank you\nថ្លៃប៉ុន្មាន? — How much?\nឆ្ងាញ់ — Delicious\nលាសិនហើយ — Goodbye\n\nស្នាមញញឹម និងការសំពះ ជួយបានច្រើន។"}}], "stays": [{"id": "s1", "art": "temple", "img": "", "region": {"en": "Siem Reap", "km": "សៀមរាប"}, "title": {"en": "Siem Reap: Old Market, riverside or Wat Bo", "km": "សៀមរាប៖ ផ្សារចាស់ មាត់ស្ទឹង ឬវត្តបូព៌"}, "text": {"en": "Stay near the Old Market and Pub Street if you want restaurants and nightlife at your door. The riverside and the Wat Bo area across the river are calmer, with garden boutique hotels, and still a short tuk-tuk ride to everything. Most hotels can arrange your temple tuk-tuk for the day.", "km": "ស្នាក់នៅក្បែរផ្សារចាស់ និងផ្លូវ Pub Street ប្រសិនបើអ្នកចង់បានភោជនីយដ្ឋាន និងជីវិតពេលយប់នៅជិតខ្លួន។ មាត់ស្ទឹង និងតំបន់វត្តបូព៌ ស្ងប់ស្ងាត់ជាង មានសណ្ឋាគារតូចៗមានសួនច្បារ ហើយនៅតែជិះរ៉ឺម៉កខ្លីៗទៅគ្រប់កន្លែង។ សណ្ឋាគារភាគច្រើនអាចរៀបចំរ៉ឺម៉កទៅប្រាសាទពេញមួយថ្ងៃ។"}, "q": "Siem Reap river"}, {"id": "s2", "art": "river", "img": "", "region": {"en": "Phnom Penh", "km": "ភ្នំពេញ"}, "title": {"en": "Phnom Penh: Riverside or BKK1", "km": "ភ្នំពេញ៖ មាត់ទន្លេ ឬបឹងកេងកង១"}, "text": {"en": "The riverside near the Royal Palace and National Museum is perfect for a first visit: you can walk to the sights and watch the sunset over the river. BKK1 is leafy and quieter, full of cafés and good restaurants.", "km": "មាត់ទន្លេក្បែរព្រះបរមរាជវាំង និងសារមន្ទីរជាតិ ល្អឥតខ្ចោះសម្រាប់ការមកលើកដំបូង៖ អ្នកអាចដើរទៅកន្លែងទេសចរណ៍ និងមើលថ្ងៃលិចលើទន្លេ។ បឹងកេងកង១ មានដើមឈើច្រើន ស្ងប់ស្ងាត់ជាង ពោរពេញដោយហាងកាហ្វេ និងភោជនីយដ្ឋានល្អៗ។"}, "q": "Phnom Penh skyline"}, {"id": "s3", "art": "river", "img": "", "region": {"en": "Kampot", "km": "កំពត"}, "title": {"en": "Kampot: on the river", "km": "កំពត៖ មាត់ទន្លេ"}, "text": {"en": "Skip the town centre and pick a bungalow on the river a few kilometres upstream. You wake up to the water, kayak before breakfast and still reach town in ten minutes.", "km": "កុំស្នាក់កណ្ដាលក្រុង ជ្រើសរើសបឹងហ្គាឡូមាត់ទន្លេ ពីរបីគីឡូម៉ែត្រខាងលើ។ អ្នកភ្ញាក់ឡើងឃើញទឹក ជិះកាយ៉ាក់មុនអាហារពេលព្រឹក ហើយនៅតែទៅដល់ក្រុងក្នុងរយៈពេលដប់នាទី។"}, "q": "Kampot river"}, {"id": "s4", "art": "sea", "img": "", "region": {"en": "Kep", "km": "កែប"}, "title": {"en": "Kep: hillside villas", "km": "កែប៖ វីឡាលើភ្នំ"}, "text": {"en": "Kep's best stays sit on the green slopes of the national park, with sea views and pools. It's quiet at night, so plan dinner at the crab market before dark.", "km": "កន្លែងស្នាក់នៅល្អៗនៅកែប ស្ថិតលើជម្រាលភ្នំបៃតងនៃឧទ្យានជាតិ មានទេសភាពសមុទ្រ និងអាងហែលទឹក។ ពេលយប់ស្ងាត់ ដូច្នេះរៀបចំអាហារពេលល្ងាចនៅផ្សារក្ដាម មុនងងឹត។"}, "q": "Kep beach"}, {"id": "s5", "art": "sea", "img": "", "region": {"en": "Preah Sihanouk", "km": "ព្រះសីហនុ"}, "title": {"en": "Koh Rong islands: beach bungalows", "km": "កោះរ៉ុង៖ បឹងហ្គាឡូមាត់ឆ្នេរ"}, "text": {"en": "For calm water and stars, stay on Koh Rong Samloem at Saracen Bay or Lazy Beach. For more choice of food and a livelier feel, Koh Rong's main village is busier. Many places run on generators, so check power hours.", "km": "សម្រាប់ទឹកស្ងប់ និងផ្កាយ ស្នាក់នៅកោះរ៉ុងសន្លឹម ត្រង់ឆ្នេរសារ៉ាសេន ឬឆ្នេរឡាស៊ី។ សម្រាប់ជម្រើសម្ហូបច្រើន និងបរិយាកាសរស់រវើក ភូមិសំខាន់នៃកោះរ៉ុង មានមនុស្សច្រើនជាង។ កន្លែងជាច្រើនប្រើម៉ាស៊ីនភ្លើង ដូច្នេះសូមពិនិត្យម៉ោងមានភ្លើង។"}, "q": "Koh Rong Samloem"}], "hotels": [], "social": [], "news": [{"id": "n1", "date": "2026-10-02", "img": "", "link": "", "title": {"en": "Welcome to our new website", "km": "សូមស្វាគមន៍មកកាន់គេហទំព័រថ្មីរបស់យើង"}, "text": {"en": "Cambodia Insight is now Thean. Here you'll find our destination guides, temple stories, travel tips and videos, in English and Khmer.", "km": "Cambodia Insight ឥឡូវក្លាយជា Thean ហើយ។ នៅទីនេះ អ្នកនឹងឃើញមគ្គុទ្ទេសក៍គោលដៅ រឿងរ៉ាវប្រាសាទ គន្លឹះធ្វើដំណើរ និងវីដេអូ ជាភាសាអង់គ្លេស និងខ្មែរ។"}}], "videos": [{"id": "v1", "img": "", "link": "youtube.com/@theancambodia", "title": {"en": "Our YouTube channel", "km": "ឆានែល YouTube របស់យើង"}, "text": {"en": "Full travel films from across Cambodia.", "km": "វីដេអូដំណើរកម្សាន្តពេញលេញ ពីទូទាំងកម្ពុជា។"}, "q": "Cambodia countryside"}, {"id": "v2", "img": "", "link": "facebook.com/fb.thean", "title": {"en": "Reels on Facebook", "km": "Reels នៅលើ Facebook"}, "text": {"en": "Short clips from the road, posted every week.", "km": "វីដេអូខ្លីៗពីដំណើរ ចុះផ្សាយរៀងរាល់សប្ដាហ៍។"}, "q": "Angkor Wat"}, {"id": "vc1", "q": "Angkor Wat", "auto": "video", "img": "", "video": "", "videoPoster": "", "link": "", "title": {"en": "The story of Angkor", "km": "រឿងរ៉ាវនៃអង្គរ"}, "text": {"en": "How the Khmer Empire was born and how Angkor Wat was built.", "km": "របៀបដែលអាណាចក្រខ្មែរកើតឡើង និងរបៀបកសាងប្រាសាទអង្គរវត្ត។"}, "story": "building-angkor-wat"}, {"id": "vc2", "q": "Apsara dance", "auto": "video", "img": "", "video": "", "videoPoster": "", "link": "", "title": {"en": "Apsara dance", "km": "របាំអប្សរា"}, "text": {"en": "The graceful hands of the Royal Ballet.", "km": "ដៃដ៏ស្រស់ស្អាតនៃរបាំព្រះរាជទ្រព្យ។"}}, {"id": "vc3", "q": "Tonle Sap", "auto": "video", "img": "", "video": "", "videoPoster" សហគមន៍។"}}, {"title": {"en": "Buy local", "km": "ទិញផលិតផលក្នុងស្រុក"}, "text": {"en": "Eat at family restaurants, buy silk from weavers and book community-run tours. It is the simplest way to make sure your money stays in Cambodia.", "km": "ញ៉ាំនៅភោជនីយដ្ឋានគ្រួសារ ទិញសូត្រពីអ្នកត្បាញ ហើយកក់ដំណើរកម្សាន្តដែលគ្រប់គ្រងដោយសហគមន៍។ វាជាវិធីងាយបំផុត ដើម្បីធានាថាលុយរបស់អ្នក នៅតែក្នុងប្រទេសកម្ពុជា។"}}]}, "about": {"photo": "", "bio": {"en": "Thean is a Cambodian travel team of creators, guides and storytellers. We share scenic routes, travel spots and peaceful places so that locals and visitors can see a quieter side of Cambodia.\n\nThis site started as Cambodia Insight. It is now our home on the web: guides to the places we love, the history behind the temples, and practical tips for your own trip. Our agents answer your messages every day.", "km": "Thean គឺជាក្រុមការងារធ្វើដំណើរកម្ពុជា ដែលមានអ្នកបង្កើតមាតិកា មគ្គុទ្ទេសក៍ និងអ្នកនិទានរឿង។ យើងចែករំលែកផ្លូវទេសភាព កន្លែងទេសចរណ៍ និងទីកន្លែងស្ងប់ស្ងាត់ ដើម្បីឱ្យអ្នកស្រុក និងភ្ញៀវទេសចរ បានឃើញកម្ពុជាម្យ៉ាងទៀតដ៏ស្ងប់ស្ងាត់។\n\nគេហទំព័រនេះ ចាប់ផ្ដើមជា Cambodia Insight។ ឥឡូវវាជាផ្ទះរបស់យើងនៅលើអ៊ីនធឺណិត៖ មគ្គុទ្ទេសក៍កន្លែងដែលយើងស្រឡាញ់ ប្រវត្តិនៅពីក្រោយប្រាសាទ និងគន្លឹះជាក់ស្ដែងសម្រាប់ដំណើររបស់អ្នក។ ភ្នាក់ងាររបស់យើងឆ្លើយសាររបស់អ្នករៀងរាល់ថ្ងៃ។"}, "does": [{"icon": "hills", "title": {"en": "Scenic routes", "km": "ផ្លូវទេសភាព"}, "text": {"en": "Road trips and the views most people drive past.", "km": "ដំណើរតាមផ្លូវគោក និងទេសភាពដែលមនុស្សភាគច្រើនបើកកាត់។"}}, {"icon": "temple", "title": {"en": "Temples & history", "km": "ប្រាសាទ និងប្រវត្តិសាស្ត្រ"}, "text": {"en": "The stories behind the stones, told simply.", "km": "រឿងរ៉ាវនៅពីក្រោយថ្ម និទានយ៉ាងសាមញ្ញ។"}}, {"icon": "bed", "title": {"en": "Places to stay", "km": "កន្លែងស្នាក់នៅ"}, "text": {"en": "Honest notes on where to sleep and eat.", "km": "កំណត់ចំណាំស្មោះត្រង់ អំពីកន្លែងស្នាក់នៅ និងញ៉ាំ។"}}, {"icon": "lotus", "title": {"en": "Peaceful places", "km": "ទីកន្លែងស្ងប់ស្ងាត់"}, "text": {"en": "Quiet corners to slow down and breathe.", "km": "ជ្រុងស្ងប់ស្ងាត់ សម្រាប់សម្រាក និងដកដង្ហើម។"}}], "collab": [{"en": "Hotel and resort features with photos and short videos", "km": "ការផ្សព្វផ្សាយសណ្ឋាគារ និងរីសត ជាមួយរូបថត និងវីដេអូខ្លីៗ"}, {"en": "Tour and destination promotion for provinces and communities", "km": "ការផ្សព្វផ្សាយដំណើរកម្សាន្ត និងគោលដៅ សម្រាប់ខេត្ត និងសហគមន៍"}, {"en": "Travel content in Khmer and English for your brand", "km": "មាតិកាធ្វើដំណើរជាភាសាខ្មែរ និងអង់គ្លេស សម្រាប់ម៉ាករបស់អ្នក"}]}, "links": {"facebook": "facebook.com/fb.thean", "messenger": "m.me/fb.thean", "telegram": "t.me/tg_thean", "tiktok": "tiktok.com/@tt.thean", "youtube": "youtube.com/@theancambodia", "instagram": "instagram.com/ig.thean", "email": "info@kongthean.com", "phone": "", "address": "", "website": "kongthean.com"}, "chatGreet": {"en": "Hi! Ask us about routes, places to stay or working together. Our team will reply as soon as possible.", "km": "សួស្ដី! សួរយើងអំពីផ្លូវធ្វើដំណើរ កន្លែងស្នាក់នៅ ឬការសហការ។ ក្រុមការងាររបស់យើងនឹងឆ្លើយតបឱ្យបានឆាប់។"}, "links4": {"instagram": "instagram.com/ig.thean", "tiktok": "tiktok.com/@tt.thean", "youtube": "youtube.com/@theancambodia", "telegram": "t.me/tg_thean"}, "c2": {"national": [{"title": {"en": "Victory over Genocide Day", "km": "ទិវាជ័យជម្នះលើរបបប្រល័យពូជសាសន៍"}, "text": {"en": "7 January", "km": "៧ មករា"}, "id": "victory-over-genocide-day", "body": {"en": "On 7 January 1979, the Khmer Rouge regime was driven from Phnom Penh, ending nearly four years of a rule under which an estimated 1.7 million or more people died from execution, starvation, forced labour and disease. Victory over Genocide Day remembers the victims and marks the day Cambodians began to rebuild their families and their country.", "km": "នៅថ្ងៃទី ៧ ខែមករា ឆ្នាំ ១៩៧៩ របបខ្មែរក្រហមត្រូវបានផ្ដួលរំលំចេញពីរាជធានីភ្នំពេញ ដែលបញ្ចប់ការគ្រប់គ្រងជិតបួនឆ្នាំ ដែលក្នុងនោះ មនុស្សប្រមាណជាង ១,៧ លាននាក់ បានស្លាប់ដោយសារការសម្លាប់ ភាពអត់ឃ្លាន ការបង្ខំឱ្យធ្វើការ និងជំងឺ។ ទិវាជ័យជម្នះលើរបបប្រល័យពូជសាសន៍ រំលឹកដល់ជនរងគ្រោះ និងសម្គាល់ថ្ងៃដែលប្រជាជនកម្ពុជាចាប់ផ្ដើមកសាងគ្រួសារ និងប្រទេសជាតិឡើងវិញ។"}, "how": {"en": "Official ceremonies and gatherings are held in Phnom Penh and in the provinces. Many families make merit at the pagoda and dedicate it to relatives who died during the regime. It is a day of remembrance as well as celebration of survival.", "km": "ពិធីផ្លូវការ និងការជួបជុំនានា ត្រូវបានរៀបចំឡើងនៅរាជធានីភ្នំពេញ និងតាមខេត្ត។ គ្រួសារជាច្រើនធ្វើបុណ្យនៅវត្ត ហើយឧទ្ទិសកុសលដល់សាច់ញាតិដែលបានស្លាប់ក្នុងរបបនោះ។ នេះជាថ្ងៃនៃការរំលឹក ហើយក៏ជាការអបអរការរស់រានមានជីវិតផងដែរ។"}, "where": {"en": "It is a public holiday across Cambodia. Visitors who want to understand this history can visit the Tuol Sleng Genocide Museum and the Choeung Ek memorial in Phnom Penh.", "km": "នេះជាថ្ងៃឈប់សម្រាកសាធារណៈទូទាំងប្រទេសកម្ពុជា។ ភ្ញៀវដែលចង់ស្វែងយល់ពីប្រវត្តិសាស្ត្រនេះ អាចទៅទស្សនាសារមន្ទីរឧក្រិដ្ឋកម្មប្រល័យពូជសាសន៍ទួលស្លែង និងវិមានរំលឹកវិញ្ញាណក្ខន្ធជើងឯក នៅរាជធានីភ្នំពេញ។"}, "tip": {"en": "Government offices and banks close; at memorial sites, dress modestly and keep your voice low out of respect for the victims.", "km": "ការិយាល័យរដ្ឋ និងធនាគារបិទ។ នៅតាមទីតាំងរំលឹកវិញ្ញាណក្ខន្ធ សូមស្លៀកពាក់សមរម្យ និងនិយាយតិចៗ ដើម្បីគោរពដល់ជនរងគ្រោះ។"}}, {"title": {"en": "King Norodom Sihamoni's Birthday", "km": "ព្រះរាជពិធីបុណ្យចម្រើនព្រះជន្ម ព្រះមហាក្សត្រ នរោត្តម សីហមុនី"}, "text": {"en": "14 May", "km": "១៤ ឧសភា"}, "id": "king-norodom-sihamoni-s-birthday", "body": {"en": "His Majesty King Norodom Sihamoni was born on 14 May 1953, the son of King Norodom Sihanouk and Queen Norodom Monineath. The nation celebrates his birthday to honour the King as the symbol of unity and continuity of the Kingdom of Cambodia.", "km": "ព្រះករុណា ព្រះបាទសម្ដេចព្រះបរមនាថ នរោត្តម សីហមុនី ព្រះរាជសម្ភព នៅថ្ងៃទី ១៤ ខែឧសភា ឆ្នាំ ១៩៥៣ ជាព្រះរាជបុត្រនៃព្រះករុណា ព្រះបាទ នរោត្តម សីហនុ និងសម្ដេចព្រះមហាក្សត្រី នរោត្តម មុនិនាថ សីហនុ។ ប្រជាជាតិប្រារព្ធព្រះរាជពិធីបុណ្យចម្រើនព្រះជន្មនេះ ដើម្បីគោរពព្រះមហាក្សត្រ ដែលជាន
